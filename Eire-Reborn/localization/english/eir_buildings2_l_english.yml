l_english:

 # ---------- regular buildings ----------
 building_eir_dun_01:0 "Dún"
 building_eir_dun_01_desc:0 "A hill-fort in the old Irish style: a ring of banks, a timber hall and a stout gate."
 building_eir_booley_pastures_01:0 "Booley Pastures"
 building_eir_booley_pastures_01_desc:0 "Summer pastures in the hills, where the herds go with the first good weather."
 building_eir_fosterage_hall_01:0 "Fosterage Hall"
 building_eir_fosterage_hall_01_desc:0 "A long hall where the sons of the vassals are raised beside the lord's own children."
 building_eir_bruidhean_01:0 "Bruidhean"
 building_eir_bruidhean_01_desc:0 "A hostel of open doors, where any traveller must be fed and sheltered by ancient law."
 building_eir_aonach_01:0 "Aonach Fair Ground"
 building_eir_aonach_01_desc:0 "A fair ground where the clans meet to trade, wrestle and quarrel."
 building_eir_goibniu_smithy_01:0 "Smithy of Goibniu"
 building_eir_goibniu_smithy_01_desc:0 "A forge that claims descent from the divine smith, and makes bronze and iron to match."
 building_eir_irish_stables_01:0 "Hobby Stables"
 building_eir_irish_stables_01_desc:0 "Small, quick Irish horses bred for the hills and the bog."
 building_eir_holy_well_01:0 "Holy Well Shrine"
 building_eir_holy_well_01_desc:0 "A spring said to heal the sick, now ringed with offerings of rags and ribbons."
 building_eir_monastic_school_01:0 "Monastic School"
 building_eir_monastic_school_01_desc:0 "Students from Britain and the Continent come to read, copy and argue."
 building_eir_hermitage_01:0 "Hermitage"
 building_eir_hermitage_01_desc:0 "A beehive cell on a lonely rock, where a holy man prays and the locals bring him food."
 building_eir_pilgrim_hospice_01:0 "Pilgrim Hospice"
 building_eir_pilgrim_hospice_01_desc:0 "A guest house at a holy place, where pilgrims rest and pay what they can."
 building_eir_ogham_stones_01:0 "Ogham Pillar Field"
 building_eir_ogham_stones_01_desc:0 "Standing stones cut with notches that name the dead and the lands they held."

 # ---------- duchy capital buildings ----------
 building_eir_rightech_01:0 "Ríghteach"
 building_eir_rightech_01_desc:0 "The great hall of a king, with room for a thousand guests and every poet in the province."
 building_eir_munster_seat_01:0 "Seat of the Eóganachta"
 building_eir_munster_seat_01_desc:0 "The ancient seat of the kings of Munster, on a limestone rock above the plain."
 building_eir_meath_court_01:0 "Court of the Ard Rí"
 building_eir_meath_court_01_desc:0 "The court that judges the quarrels of the kings, in the heart of Ireland."
 building_eir_ulster_fortress_01:0 "Fortress of the Ulaid"
 building_eir_ulster_fortress_01_desc:0 "A great earthwork in the north, with a hall where the Red Branch is remembered."
 building_eir_connacht_seat_01:0 "Seat of Cruachan"
 building_eir_connacht_seat_01_desc:0 "The royal seat of Connacht, with its ring of banks and its tales of Medb."
 building_eir_leinster_dun_01:0 "Dún of Leinster"
 building_eir_leinster_dun_01_desc:0 "The rich eastern kingdom's hill-fort, with a view of the whole plain."
 building_eir_albany_stone_01:0 "Crowning Stone of Alba"
 building_eir_albany_stone_01_desc:0 "A sacred stone on which the kings of the Gael are inaugurated."
 building_eir_isles_galley_yard_01:0 "Galley Yard of the Isles"
 building_eir_isles_galley_yard_01_desc:0 "Where the sixty-oared galleys of the Isles are built."
 building_eir_gwynedd_stronghold_01:0 "Stronghold of Snowdonia"
 building_eir_gwynedd_stronghold_01_desc:0 "A mountain stronghold from which the princes of Gwynedd defy all comers."
 building_eir_cornwall_stannary_01:0 "Stannary Hall"
 building_eir_cornwall_stannary_01_desc:0 "The hall where the tinners of Cornwall meet to set the price of tin."

 # ---------- special buildings ----------
 building_eir_hall_of_tara_01:0 "Hall of Tara"
 building_eir_hall_of_tara_01_desc:0 "The royal hall of the High Kings, rebuilt on the Hill of Tara."
 building_eir_armagh_cathedral_01:0 "Cathedral of Armagh"
 building_eir_armagh_cathedral_01_desc:0 "The primatial church of Ireland, with its famous library and bell shrine."
 building_eir_rathcroghan_01:0 "Royal Site of Rathcroghan"
 building_eir_rathcroghan_01_desc:0 "A vast complex of mounds and ditches, the ritual capital of Connacht."
 building_eir_slemish_shrine_01:0 "Patrick's Hill"
 building_eir_slemish_shrine_01_desc:0 "The mountain where the slave-boy Patrick herded sheep and heard his call."
 building_eir_uisneach_fires_01:0 "Fires of Uisneach"
 building_eir_uisneach_fires_01_desc:0 "The navel of Ireland, where the first Beltane fire was lit."
 building_eir_kildare_flame_01:0 "Fire of Brigid"
 building_eir_kildare_flame_01_desc:0 "A perpetual flame tended by nuns, in honour of the saint and the goddess."
 building_eir_emly_monastery_01:0 "Monastery of Ailbe"
 building_eir_emly_monastery_01_desc:0 "A great Munster monastery with a fine school and a famous bell."
 building_eir_kincora_01:0 "Palace of Kincora"
 building_eir_kincora_01_desc:0 "The hall of Brian Boru, where a new High King once feasted his captains."
 building_eir_black_pool_quays_01:0 "Black Pool Quays"
 building_eir_black_pool_quays_01_desc:0 "The great Norse-Gael harbour on the Liffey, now in Irish hands."
 building_eir_waterford_harbour_01:0 "Harbour of Waterford"
 building_eir_waterford_harbour_01_desc:0 "A Norse harbour that now flies Irish colours and trades with Bristol and Bordeaux."
 building_eir_cork_quays_01:0 "Quays of Cork"
 building_eir_cork_quays_01_desc:0 "Quays built by Norse merchants beside the monastery of Saint Finbarr."
 building_eir_limerick_longphort_01:0 "Longphort of Limerick"
 building_eir_limerick_longphort_01_desc:0 "A Norse river-fortress that commands the Shannon."
 building_eir_derry_oakgrove_01:0 "Oakgrove of Colmcille"
 building_eir_derry_oakgrove_01_desc:0 "The saint's oak-wood monastery, the cradle of the Columban church."
 building_eir_downpatrick_01:0 "Grave of the Three Saints"
 building_eir_downpatrick_01_desc:0 "Where Patrick, Brigid and Colmcille are said to lie together."
 building_eir_bangor_school_01:0 "School of Bangor"
 building_eir_bangor_school_01_desc:0 "A monastery whose scholars once taught half of Europe to read."
 building_eir_trim_school_01:0 "Church of Trim"
 building_eir_trim_school_01_desc:0 "A monastic church beside the Boyne, with a school of renown."
 building_eir_kilkenny_monastery_01:0 "Monastery of Canice"
 building_eir_kilkenny_monastery_01_desc:0 "A major monastic centre of Ossory, with a round tower and a famous scriptorium."
 building_eir_tuam_cross_01:0 "High Cross of Tuam"
 building_eir_tuam_cross_01_desc:0 "A carved cross with scenes of kings and saints, raised by the kings of Connacht."
 building_eir_ferns_seat_01:0 "Royal Seat of Ferns"
 building_eir_ferns_seat_01_desc:0 "The seat of the kings of Leinster, above the Slaney valley."
