l_english:
 eir.0970.t:0 "Sit Beneath the Oak"
 eir.0970.desc:0 "#bold You spent the night beneath the oak, and it spoke.#!\n\nThe oak was older than the church and older than the monastery's saint. You came at dusk with a rug and a skin of mead, and by midnight you were no longer sure which century it was. The thing that spoke was either your own voice or the tree's, and either way it knew your father's name."
 eir.0970.a:0 "Write down every word at dawn."
 eir.0970.b:0 "Share the vision only with the chief poet."
 eir.0970.c:0 "Say nothing, and have the oak fenced off."
 eir.0971.t:0 "Call the Hunt"
 eir.0971.desc:0 "#bold The horn has been blown, and the wardens have answered.#!\n\nThey came out of the woods at dusk, men you had never seen, in cloaks the colour of bark. They gave their names as places. They have promised that no army will cross a forest of yours unless it is allowed to, and the foresters would like to know who gives permission."
 eir.0971.a:0 "Give the wardens a hall of their own."
 eir.0971.b:0 "Make them swear to your law before the next hunt."
 eir.0971.c:0 "Send them home and call it a drill."
 eir.0972.t:0 "Ride the Circuit"
 eir.0972.desc:0 "#bold You rode the whole circuit of the realm, and one stop went badly.#!\n\nForty halls in forty nights, and you slept in the beds of men you would rather have hanged. Everyone was fed, everyone was heard, and everyone was told the same thing in a slightly different voice. In the north a chief served the first course cold and the second one on the floor."
 eir.0972.a:0 "Punish the cold supper."
 eir.0972.b:0 "Pretend you did not notice."
 eir.0972.c:0 "Return the insult with a gift."
 eir.0973.t:0 "Pronounce a Judgement"
 eir.0973.desc:0 "#bold The judgement stands, and no one is satisfied.#!\n\nIt took four days. The cattle were counted twice, the genealogies once and the brehon's patience not at all. When it was done the old man bowed to you, and both families went home with exactly half of what they wanted and a longer list of insults than they came with."
 eir.0973.a:0 "Invite both families to the same feast."
 eir.0973.b:0 "Have the judgement carved in stone."
 eir.0973.c:0 "Quietly add a tax to pay for the court."
 eir.0974.t:0 "Send Out the Poets"
 eir.0974.desc:0 "#bold The poets are out, and they are all singing the same verse.#!\n\nA poet in the Rhineland has been heard to mumble that his grandmother's lullaby is Irish. A merchant in Bordeaux has paid a penny for a song of which he does not know the language. A very small bishop has demanded to know whether the song is heresy. It is not."
 eir.0974.a:0 "Send a second troupe, with gifts for the bishop."
 eir.0974.b:0 "Commission a longer poem and let it travel."
 eir.0974.c:0 "Ask them to sing a little quieter abroad."
 eir.0975.t:0 "Swear the Vow on the Hill"
 eir.0975.desc:0 "#bold The vow is sworn, and the hill is full.#!\n\nNine thousand men stood on a hill that holds six, and not one of them sat. They swore it loud, in three dialects, and a boy at the back swore it so high that the horses turned round. The oath is in the book now. The next man to break it will be hung from the oldest tree on the hill."
 eir.0975.a:0 "Hold a feast on the hill that night."
 eir.0975.b:0 "Have the oath written in three languages."
 eir.0975.c:0 "Say that oaths are for farmers."
 eir.0976.t:0 "Send a Monk Overseas"
 eir.0976.desc:0 "#bold The monk is back, and the story has several versions.#!\n\nHe left on St Brendan's day in a boat the size of a bath. He came back eleven months later, thinner, with a bone in a silk bag and a tale of an island that was a whale. The bone could be a saint's, and the whale might also be a saint's. The monks have set about arguing."
 eir.0976.a:0 "Enshrine the bone at once, whoever it belonged to."
 eir.0976.b:0 "Send the bone to the bishop and wait."
 eir.0976.c:0 "Keep it in your own chapel, and say nothing."
 eir.0977.t:0 "Name the Ransom"
 eir.0977.desc:0 "#bold The ransom was named and the city paid.#!\n\nThe weighing took all day. Their silver was put on one side of the scales and your sword on the other, and when they were short you added the sword. A few of your captains found it funny. The priests of the city did not, and said so loudly, in public, with their backs to the gate."
 eir.0977.a:0 "Take every coin, and the priests' plate."
 eir.0977.b:0 "Leave them the church plate, as a courtesy."
 eir.0977.c:0 "Cut the ransom in half and call it a gift."
 eir.0978.t:0 "Write to the Galatians"
 eir.0978.desc:0 "#bold The Galatians wrote back.#!\n\nTheir reply came in Greek, in the hand of a priest who had clearly been told to be polite. It said that the writer did not understand the letter, that he did however understand its tone, and that he and his neighbours had a memory they called 'the old tongue' that nobody had spoken in a generation. He enclosed a river-stone."
 eir.0978.a:0 "Reply in Gaelic and see what comes of it."
 eir.0978.b:0 "Send an envoy with a gospel book in two tongues."
 eir.0978.c:0 "File the letter and move on."
 eir.0979.t:0 "Open the Salt Roads"
 eir.0979.desc:0 "#bold The salt roads are open and the tolls are being counted.#!\n\nThe toll-keepers have been recruited from the families that robbed the roads last year. It seems to be working. The first caravan carried salt, the second silver, and the third a small crate of Irish butter and a very large dog. The dog was not charged."
 eir.0979.a:0 "Invest the first season's tolls in new quays."
 eir.0979.b:0 "Fill the treasury and ask no questions."
 eir.0979.c:0 "Lower the tolls for a year, to win the merchants."
 eir.0980.t:0 "Take the Hero's Portion"
 eir.0980.desc:0 "#bold You took the hero's portion, and someone disputed it.#!\n\nThe best cut of the boar is the champion's portion, and every man in the hall knew it. A young knight with a short temper put his knife in the dish, and you put yours on his hand. The silence went on until the harper broke a string. Then the knight laughed, then you did, and then he drew."
 eir.0980.a:0 "Fight him, and mean it."
 eir.0980.b:0 "Give him the cut and a place in your retinue."
 eir.0980.c:0 "Have him thrown out."
 eir.0981.t:0 "Raise the Fianna Camp"
 eir.0981.desc:0 "#bold The camp has wintered and the young men have come home.#!\n\nSixty boys went into the forest in autumn. Fifty-eight came back in spring, taller, thinner, and in the habit of looking at the horizon before they sat down. Two had to be talked out of marrying a bear. The fathers are delighted. The mothers have lodged complaints."
 eir.0981.a:0 "Give each of them a sword and a grant of land."
 eir.0981.b:0 "Keep the best in your own household."
 eir.0981.c:0 "Send them home and call the winter a loss."
 eir.0982.t:0 "Set Out on the Quest"
 eir.0982.desc:0 "#bold The quest is over, and nobody agrees how it ended.#!\n\nYou rode for a summer and a half. You were lost twice and fed once. On the last day you found a chapel with no door and a small plain cup on the altar, or a cup-shaped hole where something had been. The two versions have already been written down by two monks who were not there."
 eir.0982.a:0 "Take the cup and carry it home."
 eir.0982.b:0 "Leave it where it is, and say that you found it."
 eir.0982.c:0 "Tell the court the cup was a trick."
 eir.0983.t:0 "Take a Geis"
 eir.0983.desc:0 "#bold The geis is sworn, and the omens have started.#!\n\nYou swore never to refuse a guest, never to cross the Boyne at night, and never to eat the meat of a certain bird. Within a month a crow had spoken to your steward and a river had changed its mind. The omens are very specific and very unhelpful."
 eir.0983.a:0 "Keep the geis, however it costs."
 eir.0983.b:0 "Hedge the geis with a loophole."
 eir.0983.c:0 "Break it on purpose, to see."
 eir.0984.t:0 "Wear the Heavy Crown"
 eir.0984.desc:0 "#bold The crown is on your head and the court has noticed.#!\n\nIt has gone through the court like a draught. The old men say it is too heavy and that it makes you stoop. The young men say it makes them stoop. Your heir stood in the doorway for a full minute, staring, before leaving without a word. Nobody has asked him what he thought."
 eir.0984.a:0 "Make a public speech about duty."
 eir.0984.b:0 "Lay the crown aside for a week and let them talk."
 eir.0984.c:0 "Give the heir a smaller crown of his own."
