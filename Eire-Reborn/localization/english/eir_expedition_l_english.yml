 # ---------- the war ----------
 eir_expedition_cb:0 "Expedition"
 eir_expedition_cb_desc:0 "A people crossing the sea to take a new land."
 EIR_EXPEDITION_CB_NAME:0 "Expedition against [DEFENDER.GetShortUIName]"
 EIR_EXPEDITION_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Expedition to [TITLE.GetBaseName]"
 EIR_EXPEDITION_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 eir_expedition_cb_victory_desc:0 "The expedition takes the duchy. Most of its counties take the sponsor's culture and faith and lose 5 development; the rest keep their ways and rise in unrest."
 eir_expedition_cb_defeat_desc:0 "The expedition is destroyed or turned back, and the sponsor's gold is lost."
 eir_expedition_cb_invalidated_desc:0 "The [war.GetName] has ended: the defender no longer holds the land."
 eir.1300.t:0 "The Ships Leave"
 eir.1300.desc:0 "#bold The Ships Leave#!\n\nThe tide turns at dawn and the ships go out, one after another, past the harbour mouth. The priests bless the sails; the poets compose a farewell; the leader stands at the stern and does not look back.\n\nIn the hall, nobody speaks for a time. Then somebody says what everyone is thinking: that it may be years before a ship comes home."
 eir.1300.a:0 "Say a prayer for them."
 eir.1300.b:0 "Watch until the last sail is gone."
 eir.1301.t:0 "The Expedition Has Won"
 eir.1301.desc:0 "#bold The Expedition Has Won#!\n\nThe ships have come home with news. The leader holds a duchy overseas. The gods are spoken of in the old way there now, the tongue of the island is heard in the market, and the people of the land who were not changed are quiet and watchful.\n\nThe leader has sent a delegation to ask what is owed to the sponsor."
 eir.1301.a:0 "Ask for nothing but their prayers."
 eir.1301.b:0 "Ask for a share of the first year's taxes."
 eir.1301.c:0 "Ask only for an alliance of the two peoples."
 eir.1302.t:0 "The Expedition Is Lost"
 eir.1302.desc:0 "#bold The Expedition Is Lost#!\n\nA single ship has come back, with a boy at the helm and a story that nobody wants to hear. The landing was met, the host was beaten and the leader did not come off the beach. The sails are in the sea."
 eir.1302.a:0 "Mourn them as heroes."
 eir.1302.b:0 "Pay for masses for the fallen."
 eir.1303.t:0 "No Landing Found"
 eir.1303.desc:0 "#bold No Landing Found#!\n\nThe ships have been to the coast and come back: every shore they could reach was held by friends, by kinsmen or by strong lords. The gold has been returned. The captains are embarrassed and the poets are pretending not to be disappointed."
 eir.1303.a:0 "Put the gold away for next time."
