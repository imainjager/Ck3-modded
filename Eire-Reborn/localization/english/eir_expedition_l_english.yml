l_english:

 # ---------- the decision ----------
 eir_sponsor_expedition_decision:0 "Sponsor an Expedition"
 eir_sponsor_expedition_decision_desc:0 "The old stories say that the Gaels once sailed to Ireland from the far side of the world, and that the Britons were driven west across the sea from lands that were theirs. The ships are still in the harbour. Pay for a host and a leader, give them the sea and a blessing, and let them settle somewhere that will speak your tongue and pray in your way."
 eir_sponsor_expedition_decision_tooltip:0 "Pay 1,000, 3,000 or 5,000 gold (a host of 1,000, 5,000 or 10,000 men). A courtier of yours, or an adventurer, lands in a random duchy in Europe and fights for it. If the expedition wins, the duchy takes your culture and faith in about two counties out of three, loses 5 development, and the counties that keep their old culture rise in massive unrest."
 eir_sponsor_expedition_decision_confirm:0 "Send the ships"
 EIR_EXPEDITION_NEXT_STEP:0 "Choose the expedition"
 eir_expedition_celt_tt:0 "You are a ruler of a Gaelic or Brythonic culture"
 eir_exp_host_name:0 "The Expedition"
 eir_exp_small_courtier:0 "A small company led by one of your courtiers (1000 gold)"
 eir_exp_small_courtier_desc:0 "A small company 1000 men, for 1000 gold. Send one of your own courtiers to lead it."
 eir_exp_small_courtier_valid_tt:0 "You have at least 1000 gold and an adult courtier who is not a ruler"
