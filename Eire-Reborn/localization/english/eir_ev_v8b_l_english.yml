l_english:
 eir.0440.t:0 "The Dubliners' Offer"
 eir.0440.desc:0 "#bold [eir_norse.GetShortUIName] offers an alliance against your common enemy, with silver and ships as the dowry.#!\n\nHe is the king of a harbour town on a river, and he has a longship for every cow you have. His envoy speaks fluent Irish and uses the proverbs correctly, which is more unsettling than if he had not. The terms are simple: the Norse-Gael will help you against the king next door, and you will not ask him to be a Christian.\n\nThe bishops are listening at the door."
 eir.0440.v1:0 "#bold [eir_norse.GetShortUIName] offers an alliance against your common enemy, with silver and ships as the dowry.#!\n\nThe envoy speaks fluent Irish and uses the proverbs correctly. He also wears a hammer around his neck and does not tuck it away, which a pious man cannot help but notice. The bishops are listening at the door, and you are quite sure they have noticed too."
 eir.0440.a:0 "Accept the pact and share the harbour dues."
 eir.0440.b:0 "Accept, but only if he is baptised at the font."
 eir.0440.c:0 "Ask for his son as a foster-child instead."
 eir.0440.d:0 "Refuse, and tell the bishops you did."
 eir.0440.e:0 "Take the silver and promise nothing."
 eir.0441.t:0 "The Slave Market at the Strand"
 eir.0441.desc:0 "#bold Norse merchants have set up a market for captives on your coast, and half the buyers are Irish.#!\n\nThe merchants say the trade is old and honourable. The monks say it is an abomination. The kings buy slaves when they need hands for a harvest. The people being sold are mostly Irish, taken from the next county over, the Britons of the west, a few Saxons. They do not look very different from you."
 eir.0441.a:0 "Buy as many captives as you can, and set them free."
 eir.0441.b:0 "Raid the market and take the captives for yourself."
 eir.0441.c:0 "Tax the market and look the other way."
 eir.0441.d:0 "Forbid the sale of baptised Christians, and hang the first offender."
 eir.0442.t:0 "A Norse-Gael Bride"
 eir.0442.desc:0 "#bold A great Norse-Gaelic family offers a daughter to your house.#!\n\nShe is called Gormlaith by her Irish mother and Gunnhild by her Norse father, and she answers to both. Her family holds a fortified harbour and sixty ships. They want a king who will not burn their houses. You want a navy. It could be a very good match.\n\nThe bishop sniffs and says the girl has probably never been properly baptised."
 eir.0442.a:0 "Accept the match, and the dowry in ships."
 eir.0442.b:0 "Offer the match to your heir."
 eir.0442.c:0 "Insist that she and her household be baptised first."
 eir.0442.d:0 "Decline, politely."
 eir.0443.t:0 "A Longphort on the Border"
 eir.0443.desc:0 "#bold The Norse have built a fortified camp on a river-bend at the edge of your land.#!\n\nThey did it in a month, with stakes and turf and the stones of a ruined church. There are a hundred ships drawn up on the mud, and a market is already forming under the walls. The local farmers sell them butter and cattle at an excellent price. The local lord, who is you, has not been consulted."
 eir.0443.a:0 "Burn it before the walls are finished."
 eir.0443.b:0 "Tax the camp's market and let it grow."
 eir.0443.c:0 "Send a spy to learn their numbers and their weakness."
 eir.0443.d:0 "Offer the jarl the camp as a gift, if he swears to protect your coast."
 eir.0444.t:0 "The Exchange of Hostages"
 eir.0444.desc:0 "#bold A Norse king proposes that each of you give the other a child to raise.#!\n\nIt is how the Irish keep peace, and how the Norse keep peace, and for once the two peoples agree. A child of yours would go north to be raised in a hall full of axes and old songs. A child of his would come here, to be raised in a hall full of poets and ale. They would return in ten years, speaking each other's language."
 eir.0444.a:0 "Send your own child."
 eir.0444.b:0 "Send a nephew, and keep your own close."
 eir.0444.c:0 "Take his child, and send none."
 eir.0444.d:0 "Refuse. An Irishman is not raised by pagans."
 eir.0445.t:0 "The Apostle to the Norse"
 eir.0445.desc:0 "#bold A monk from your best monastery wants to go and convert the pagans of the harbour town.#!\n\nHe is not a young man, and he is not a fool. He has spent three years learning the Norse tongue from a captive, and he says that its poetry is almost as good as Irish. He asks for a bell, a boat and a bishop's blessing. He does not ask for protection, which worries your steward."
 eir.0445.a:0 "Send him with a bell, a boat and an escort."
 eir.0445.b:0 "Go with him yourself, for the first mile."
 eir.0445.c:0 "Fund him, but only if he reports what the Norse are planning."
 eir.0445.d:0 "Refuse. The Norse will eat him alive."
 eir.0446.t:0 "Thor's Hammer on the Church Door"
 eir.0446.desc:0 "#bold A Norse hammer has been nailed to the door of a church, and the church has nailed a cross to the Norse hall.#!\n\nNobody knows who started it. Both sides say the other did. A fight broke out at the market, a farmer's son was cut, and a pagan's boat was set adrift. The bishop wants blood. The Norse jarl wants an apology. You would like to eat your dinner."
 eir.0446.a:0 "Hold a joint hearing before a brehon and the jarl's law-speaker."
 eir.0446.b:0 "Side with the Church, and fine the Norse."
 eir.0446.c:0 "Side with the Norse, and fine the Church."
 eir.0446.d:0 "Remove both from your land for a season."
 eir.0447.t:0 "The Norse Smith's Secret"
 eir.0447.desc:0 "#bold A Norse smith in the harbour town can weld iron the way no Irish smith can, and he is for sale.#!\n\nHe has been banished by his own jarl for losing a bet. He has a pattern-welding technique that makes a sword spine flex and an edge stay sharp through a week of battle. He wants a forge, a wife and a guarantee that nobody will ask him to convert."
 eir.0447.a:0 "Buy his contract and set him up in your finest forge."
 eir.0447.b:0 "Steal his method and send him home."
 eir.0447.c:0 "Let one of your own smiths apprentice with him."
 eir.0447.d:0 "Refuse. A heathen smith is not welcome in a Christian hall."
 eir.0448.t:0 "Wolfhounds for the Jarl"
 eir.0448.desc:0 "#bold A Norse jarl wants a pair of Irish wolfhounds, and will pay a ship's worth for them.#!\n\nThe Irish hound is taller than a pony and braver than most knights. The Norse think them magical. You have a litter of eight in the kennels, and three of them are the sort of animals poets compose odes to. The jarl's steward is polite and extremely persistent."
 eir.0448.a:0 "Sell the two best for a king's price."
 eir.0448.b:0 "Give him a pair as a gift, to be remembered."
 eir.0448.c:0 "Refuse. They belong to the Gael."
 eir.0448.d:0 "Sell him dogs that look fine and hunt badly."
 eir.0449.t:0 "The Raiders' Hoard"
 eir.0449.desc:0 "#bold A farmer ploughing a stony field has turned up a pot of silver.#!\n\nIt is Norse silver, hacksilver and coins and a half-finished brooch, buried by raiders who never came back for it. The farmer knows what it is. He has also heard that the law gives a finder's share. He is waiting at your gate with his cap in his hands and the pot behind his back."
 eir.0449.a:0 "Honour the law: he gets a third, and the rest is yours."
 eir.0449.b:0 "Take it all and send him away."
 eir.0449.c:0 "Give it to the monastery and take nothing."
 eir.0449.d:0 "Melt it down and make a cup for the high table."
 eir.0450.t:0 "The Sea-Wolf's Son"
 eir.0450.desc:0 "#bold A young man of mixed blood has come to your court, and he is asking for a place in your warband.#!\n\nHis father was a Norse captain and his mother an Irish abbess's niece, which is a family story nobody has ever told in a straight line. He is tall and quiet, and he sits beside the smiths because he finds their conversation restful. He says he fights with both hands and prays with neither."
 eir.0450.a:0 "Give him a place among your household guard."
 eir.0450.b:0 "Test his courage in a single combat."
 eir.0450.c:0 "Send him to the monastery to be educated."
 eir.0450.d:0 "Send him away. His loyalty is divided."
 eir.0451.t:0 "The Dark Foreigners and the Fair Foreigners"
 eir.0451.desc:0 "#bold Two Norse kings are fighting each other over the harbour of a river-mouth, and each has asked for your help.#!\n\nThe poets call them the Dubh Gaill and the Finn Gaill, the dark and the fair foreigners, and nobody remembers which is which. They hold different bays, speak different dialects and hate each other with the energy of long acquaintance. This is the first time in a generation that they have not been united against someone else."
 eir.0451.a:0 "Back the larger, and take a share of the spoils."
 eir.0451.b:0 "Back the smaller, and make a friend."
 eir.0451.c:0 "Back neither, and sell them both arms."
 eir.0451.d:0 "Let them fight, and strike the winner while he is weak."
 eir.0452.t:0 "The Tribute of the Ostmen"
 eir.0452.desc:0 "#bold The Norse townsmen of your harbour have refused to pay the king's share.#!\n\nThey say the old agreement was with your father, and your father is dead. They say they are free traders and that the harbour belongs to nobody. They have sent a delegation with an offer: a smaller sum, paid in silver, with no questions asked. It is quite a decent offer."
 eir.0452.a:0 "Accept the smaller sum."
 eir.0452.b:0 "Insist on the old agreement, with a company at your back."
 eir.0452.c:0 "Offer them a seat on your council in exchange."
 eir.0452.d:0 "Expel them from the harbour."
 eir.0453.t:0 "The Bell That Rang Too Late"
 eir.0453.desc:0 "#bold The bell of a coastal monastery was cracked a year ago, and nobody has had the money to cast a new one.#!\n\nOn the day the Norse came, the monks rang what they had. The note carried a hundred yards and then died. Nobody heard it. They have been trying to explain to you for months that a bell is not decoration: it is the only warning a coastal village has."
 eir.0453.a:0 "Pay for a new bell, and a better tower."
 eir.0453.b:0 "Melt down the old plate of three churches to cast one."
 eir.0453.c:0 "Order a beacon on every headland instead."
 eir.0453.d:0 "Pray over the cracked bell and hope."
 eir.0456.t:0 "The Cattle Raid Across the Boundary"
 eir.0456.desc:0 "#bold A band of young men from a neighbouring kingdom has driven off three hundred head of your cattle.#!\n\nIt is, strictly speaking, not a raid: it is a custom. A young man proves himself by taking cattle from the next kingdom, and the next kingdom proves itself by taking them back. The trouble is that three hundred head is more than a custom. The trouble is also that your cousins are in the herd."
 eir.0456.a:0 "Ride after them with your household."
 eir.0456.b:0 "Send a poet to the other king with a verse of complaint."
 eir.0456.c:0 "Raid back, bigger."
 eir.0456.d:0 "Pay the cattle-price in law, and take it to the brehon."
 eir.0457.t:0 "A Blinded Cousin"
 eir.0457.desc:0 "#bold Your cousin has come to your hall with his eyes bound, and he does not want to say who did it.#!\n\nIn the old law, a man who is blind or maimed cannot be king. Someone has made sure of that. He sits by the fire and holds a harp he cannot see. His claim to the line was as good as yours.\n\nHe has asked for nothing. That is what worries you."
 eir.0457.a:0 "Swear to find whoever did this."
 eir.0457.b:0 "Make him your poet and keep him close."
 eir.0457.c:0 "Question him quietly, and learn who benefits."
 eir.0457.d:0 "Send him to a monastery, where he will be safe."
 eir.0458.t:0 "The Poet's Satire"
 eir.0458.desc:0 "#bold A famous poet has composed a satire on you, and it is already being recited in every hall.#!\n\nIt begins well, with an invocation, and ends in a list of your failings that rhymes in four ways. The worst of it is that it is accurate. The Irish believe a satire raises blisters on the face of its target. Yours has not yet, but your steward has started to look at you strangely."
 eir.0458.a:0 "Pay the poet well, and ask for a better verse."
 eir.0458.b:0 "Answer him with a satire of your own."
 eir.0458.c:0 "Laugh it off in front of the court."
 eir.0458.d:0 "Banish the poet from your kingdom."
 eir.0459.t:0 "The Quarrel of the Two Septs"
 eir.0459.desc:0 "#bold Two branches of the same dynasty are at each other's throats over a hill, and each says you promised it to them.#!\n\nYou did, in fact, promise it to both. It had seemed a convenient thing to say at the time. Now they are standing on opposite sides of the hall with their hands on their knives, and the brehon is quietly looking for the door."
 eir.0459.a:0 "Judge the case on the law and the genealogy."
 eir.0459.b:0 "Split the hill between them."
 eir.0459.c:0 "Give it to the stronger branch, and watch the weaker."
 eir.0459.d:0 "Give it to the Church to settle."
 eir.0460.t:0 "A King Without a Hall"
 eir.0460.desc:0 "#bold An exiled king has come to your gate with forty men and no cattle.#!\n\nHe is the rightful king of a province two days' ride away, he says, and his cousin took the hall while he was at the funeral of their grandfather. He asks nothing but a bed. A guest is sacred. But he is also a claim, and a claim is a weapon, and weapons have owners."
 eir.0460.a:0 "Shelter him as a guest, and ask nothing in return."
 eir.0460.b:0 "Shelter him, and make him swear fealty."
 eir.0460.c:0 "Back his claim with your spears."
 eir.0460.d:0 "Send him on to the next king."
 eir.0461.t:0 "Fosterage Betrayed"
 eir.0461.desc:0 "#bold Your foster-son has joined your enemies, and he took your best horse.#!\n\nYou raised him as your own. You taught him to ride, to throw a spear, to compose a verse and to keep his word. He kept three of the four. He says he is sorry and he says his father's claim is just. He says you will understand some day."
 eir.0461.a:0 "Forgive him in public and ask him to return."
 eir.0461.b:0 "Hunt him down and bring him back in chains."
 eir.0461.c:0 "Write him out of the poems and the genealogy."
 eir.0461.d:0 "Let him go. Love is not a hostage."
 eir.0462.t:0 "The Moved Boundary Stone"
 eir.0462.desc:0 "#bold An ogham stone on the border has been moved forty paces to the east.#!\n\nThe notches on the stone name the boundary of your kingdom, and the farmers have farmed to it for a century. Now the stone stands in a field that used to be yours. Nobody saw it moved. A neighbour's herdsman says he heard thunder, and a stone is a heavy thing for thunder to carry."
 eir.0462.a:0 "Order the stone returned, with a company to guard it."
 eir.0462.b:0 "Summon the brehons to walk the boundary."
 eir.0462.c:0 "Move one of his stones forty paces west in return."
 eir.0462.d:0 "Let it be. A stone is only a stone."
 eir.0463.t:0 "The Contest for the Kingship"
 eir.0463.desc:0 "#bold Two cousins are contesting the kingship of a neighbouring province, and both want your blessing.#!\n\nOne is old and popular and has been disliked by his own sons. The other is young and competent and has been disliked by everyone else. The poets have composed a verse for each. The verse for the young one is better. A king's blessing is worth three hundred spears."
 eir.0463.a:0 "Back the old king."
 eir.0463.b:0 "Back the young claimant."
 eir.0463.c:0 "Arrange a single combat to decide it."
 eir.0463.d:0 "Stay out of it, and sell both of them arms."
 eir.0464.t:0 "The Feast That Ended in Blood"
 eir.0464.desc:0 "#bold At a wedding feast in a neighbouring hall, the host's brother drew his knife.#!\n\nIt was a great feast and everyone was there. The ale was strong, the poets were good, and the old grievance was bound to come up. When it did, it came up with a knife. Six men are dead and the king's sister is a widow. The survivors have sent for you as a neutral party. This is the first time anyone has called you neutral."
 eir.0464.a:0 "Preside over the funeral and the settlement."
 eir.0464.b:0 "Take the widow under your protection."
 eir.0464.c:0 "Demand the knife-bearer for justice."
 eir.0464.d:0 "Stay away. Blood feuds are catching."
 eir.0465.t:0 "A Cadet Branch Demands Land"
 eir.0465.desc:0 "#bold A younger branch of your dynasty wants a county of its own, and says the law is on its side.#!\n\nThe Irish dynastic law is generous and exact: any man whose great-grandfather was a king may call himself a prince. Whether he gets a county is another matter. The branch has a genealogist, a poet and a lawyer, in that order. They have also, quietly, a hundred armed men."
 eir.0465.a:0 "Grant them a county, and bind them to you."
 eir.0465.b:0 "Offer them a place in the line of succession instead."
 eir.0465.c:0 "Deny them, and cite the law."
 eir.0465.d:0 "Send them to win land abroad."
 eir.0466.t:0 "A Challenge at the Ford"
 eir.0466.desc:0 "#bold A famous champion of a rival king has ridden to the ford and shouted your name.#!\n\nThe old style: one man on each bank, shouting insults across the water until one of them cannot bear it. He has a reputation. He has killed nine men at fords and he claims that the tenth will be you. Your household has gone very quiet. The ford is wide and the water is cold."
 eir.0466.a:0 "Ride out and meet him."
 eir.0466.b:0 "Send your best champion in your place."
 eir.0466.c:0 "Answer in verse and let the poets decide."
 eir.0466.d:0 "Ignore him. A man is not obliged to fight on demand."
 eir.0467.t:0 "The Abbot Who Wanted a Kingdom"
 eir.0467.desc:0 "#bold The coarb of a great monastery has begun to raise tolls and call out spears, and the monks are carrying swords.#!\n\nIn Ireland a monastery is a city, and the abbot is a lord. This one has a hundred monks, a thousand tenants, three high crosses and an ambition. He has also, without asking, begun to collect the king's share. His letters are written in perfect Latin and end with a blessing that sounds suspiciously like a threat."
 eir.0467.a:0 "Negotiate a partition: the abbot takes the church lands, you take the rest."
 eir.0467.b:0 "Excommunicate the abbot by appealing to the bishop."
 eir.0467.c:0 "March on the monastery and take the tolls by force."
 eir.0467.d:0 "Make the abbot your chancellor and give him a say in the realm."
 eir.0468.t:0 "A Marriage Between Rivals"
 eir.0468.desc:0 "#bold Your daughter and the heir of your worst enemy have been seen walking together, more than once.#!\n\nShe says it is entirely innocent. The heir says it is entirely innocent. The harper says that the song they are both humming is not an innocent song. The two kingdoms have been at each other's throats for sixty years. Someone, at some point, will have to marry someone."
 eir.0468.a:0 "Bless the match, and call a peace feast."
 eir.0468.b:0 "Allow it, but insist on large concessions."
 eir.0468.c:0 "Forbid it, and send her to the nuns."
 eir.0468.d:0 "Use the romance as a lever for a better deal."
 eir.0469.t:0 "The Winter Hosting"
 eir.0469.desc:0 "#bold A hosting of the young men of the province has gone out in the snow, and it is not going well.#!\n\nIt was meant to be a short raid, a few cattle, a bit of glory before the thaw. Instead it has become a long march through a snowstorm with no supplies and a growing suspicion that the guide was bribed. The men are cold, the horses are dying, and your cousin the captain has not been seen for a day."
 eir.0469.a:0 "Ride out yourself and bring them home."
 eir.0469.b:0 "Send supplies and a sledge party under your steward."
 eir.0469.c:0 "Pray, and hold a vigil in the hall."
 eir.0469.d:0 "Do nothing. They were fools to go."
 eir.0470.t:0 "The Hostage Escapes"
 eir.0470.desc:0 "#bold A hostage you were keeping has slipped his guards and fled across the border.#!\n\nHe was a boy of twelve, the son of a vassal you did not trust. He went through the privy and over the wall in the dark, and the dogs lost him at the river. He will be home by morning. His father will not be pleased with how he was kept, and the boy has a good memory."
 eir.0470.a:0 "Send riders after him at once."
 eir.0470.b:0 "Let him go, and send a message of goodwill."
 eir.0470.c:0 "Punish the guards, and double the watch."
 eir.0470.d:0 "Admit the failure openly."
 eir.0471.t:0 "A Treaty Sworn on the Relics"
 eir.0471.desc:0 "#bold A rival king proposes a peace sworn on the relics of a saint, and he wants it witnessed by the bishops of three provinces.#!\n\nIt is the oldest of Irish diplomacy: the oath on the bones. A king who breaks it is damned in this world and the next, and every poet in Ireland writes verses about him. A king who keeps it is remembered. The rival king is not sentimental. He just does not want to fight you this year."
 eir.0471.a:0 "Swear the peace and mean it."
 eir.0471.b:0 "Swear it, but keep the right to break it in a pinch."
 eir.0471.c:0 "Refuse to swear on a saint's bones for a king's convenience."
 eir.0471.d:0 "Offer an alliance instead of a peace."
