l_english:

 # ---------- struggle ----------
 eir_irish_struggle:0 "The Fragmentation of Ireland"
 eir_irish_struggle_desc:0 "Ireland has a hundred kings and a title for one. The High Kingship of Tara is a seat for the strongest of the great houses, and between each strong king and the next there is a generation of cattle raids, burned halls and quarrels over precedence. The island could be one, or it could remain a hundred; and the Church, the poets and the Norse each have their own opinion."
 game_concept_eir_irish_struggle:0 "$eir_irish_struggle$"
 game_concept_eir_irish_struggle_desc:0 "$eir_irish_struggle_desc$"
 eir_struggle_phase_kin_strife:0 "Kin-Strife"
 eir_struggle_phase_kin_strife_desc:0 "The kings fight over cattle, tribute and precedence, and every victory only makes the loser angrier. Armies are cheap, vassals are sour and no peace lasts through a harvest."
 game_concept_eir_struggle_phase_kin_strife:0 "Kin-Strife"
 game_concept_eir_struggle_phase_kin_strife_desc:0 "The kings fight over cattle, tribute and precedence, and every victory only makes the loser angrier. Armies are cheap, vassals are sour and no peace lasts through a harvest."
 eir_struggle_phase_over_kings:0 "Rise of the Overkings"
 eir_struggle_phase_over_kings_desc:0 "One house after another reaches for the High Kingship, and the weaker kings must decide which of them to follow. Armies are better led, vassals more loyal and the cattle-raids rarer, until the next king dies."
 game_concept_eir_struggle_phase_over_kings:0 "Rise of the Overkings"
 game_concept_eir_struggle_phase_over_kings_desc:0 "One house after another reaches for the High Kingship, and the weaker kings must decide which of them to follow. Armies are better led, vassals more loyal and the cattle-raids rarer, until the next king dies."
 eir_struggle_phase_truce_of_saints:0 "Truce of the Saints"
 eir_struggle_phase_truce_of_saints_desc:0 "The abbots and the poets have brokered a truce that the kings have sworn on the relics. For a few seasons the roads are safe, the fairs full and the churches rich."
 game_concept_eir_struggle_phase_truce_of_saints:0 "Truce of the Saints"
 game_concept_eir_struggle_phase_truce_of_saints_desc:0 "The abbots and the poets have brokered a truce that the kings have sworn on the relics. For a few seasons the roads are safe, the fairs full and the churches rich."
 eir_struggle_ending_involved_tt:0 "You are #V involved#! in the Fragmentation of Ireland"
 eir_struggle_end_high_kingship:0 "The High Kingship"
 eir_struggle_end_high_kingship_decision_desc:0 "One house has the strength to hold the kingship of Tara. Sit in the old hall, count the kings who bring their cattle to the Hill, and end the Fragmentation of Ireland by force of name and army."
 eir_struggle_end_high_kingship_tooltip:0 "Make yourself High King and end the strife by holding the island."
 eir_struggle_end_high_kingship_decision_confirm:0 "Take the High Kingship"
 eir_struggle_end_high_kingship_region_tt:0 "You hold at least #V 70%#! of the counties of Ireland"
 eir_struggle_end_concord:0 "The Concord of the Saints"
 eir_struggle_end_concord_decision_desc:0 "The kings are tired and the abbots are patient. Gather them at a holy place, put the relics on the table and have each of them swear that he will hold no more land than his fathers held. A king at peace is not a High King, but he keeps his head."
 eir_struggle_end_concord_tooltip:0 "Swear a lasting peace on the relics and end the strife without conquering the island."
 eir_struggle_end_concord_decision_confirm:0 "Swear the Concord"
 eir_struggle_end_concord_region_tt:0 "You hold at least #V 30%#! of the counties of Ireland"
 eir.0995.t:0 "The Hill of Tara Is Full"
 eir.0995.desc:0 "#bold The strife has ended.#!\n\nThe kings came to the Hill with their cattle and their poets and sat in the order of their fathers. Nobody drew a knife. In the evening the chief poet recited the line of the High Kings, and at the end of it there was your name."
 eir.0995.a:0 "Let the harpers play."
 eir.0996.t:0 "The Relics on the Table"
 eir.0996.desc:0 "#bold The strife has ended.#!\n\nThey swore on the bell of Patrick and on the bones of Brigid and on the cross of Columba, and the abbot of each of the three churches put his hand over the hand of the nearest king. Nobody is High King. Everybody is at peace."
 eir.0996.a:0 "Let the bells be rung."
