 # ---------- Óenach ----------
 activity_eir_oenach:0 "Óenach"
 activity_eir_oenach_name:0 "[ACTIVITY.GetHost.GetNamePossessiveOrMy|U] Óenach"
 activity_eir_oenach_owner:0 "Host"
 activity_eir_oenach_desc:0 "The great assembly of a kingdom: a fair, a court, a race-course and a marriage market on one field. Kings preside, brehons judge, poets recite, and everyone, everywhere, trades something."
 activity_eir_oenach_selection_tooltip:0 "Hold an assembly of the whole province on a hill.\n\nAnticipated Rewards:\n$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$Vassal and guest [opinion|E]\n$BULLET_WITH_TAB$Settled quarrels"
 activity_eir_oenach_destination_selection:0 "Choose where the Óenach will be held."
 activity_eir_oenach_province_desc:0 "Select Barony"
 activity_eir_oenach_host_desc:0 "$BULLET_WITH_TAB$Gain [prestige_i][prestige|E]\n$BULLET_WITH_TAB$Guests may gain [opinion|E] of you\n$BULLET_WITH_TAB$A brawl or a rivalry may break out"
 activity_eir_oenach_guest_desc:0 "$BULLET_WITH_TAB$You may gain [prestige_i][prestige|E] or lose [stress_i][stress|E]\n$BULLET_WITH_TAB$You may take part in a lawsuit, a race or a courtship"
 activity_eir_oenach_guest_help_text:0 "Every lord of the province may come with his household. The assembly is at once a court, a fair and a festival, and nobody leaves without a grievance, a bargain or a husband."
 activity_eir_oenach_conclusion_desc:0 "The [GetActivityType( 'activity_eir_oenach' ).GetName] has concluded"
