 # ---------- Quarter-Day Festival ----------
 activity_eir_festival:0 "Quarter-Day Festival"
 activity_eir_festival_name:0 "[ACTIVITY.GetHost.GetNamePossessiveOrMy|U] Quarter-Day Festival"
 activity_eir_festival_owner:0 "Host"
 activity_eir_festival_desc:0 "The Celtic year turns on four fires: Samhain, Imbolc, Beltane and Lughnasa. A ruler who holds the fire holds the people: the feast is hers to give, the omens are hers to read."
 activity_eir_festival_selection_tooltip:0 "Light the fire of the season with your whole household.\n\nAnticipated Rewards:\n$BULLET_WITH_TAB$[stress_loss_i][stress|E] loss\n$BULLET_WITH_TAB$[piety_i][piety|E] or [prestige_i][prestige|E]\n$BULLET_WITH_TAB$Omens that colour the year"
 activity_eir_festival_destination_selection:0 "Choose where the Quarter-Day Festival will be held."
 activity_eir_festival_province_desc:0 "Select Barony"
 activity_eir_festival_host_desc:0 "$BULLET_WITH_TAB$Gain [piety_i][piety|E] and [prestige_i][prestige|E]\n$BULLET_WITH_TAB$Guests lose [stress_i][stress|E]\n$BULLET_WITH_TAB$An omen may help or hinder"
 activity_eir_festival_guest_desc:0 "$BULLET_WITH_TAB$You may lose [stress_i][stress|E]\n$BULLET_WITH_TAB$You may see a vision, or a bad omen"
 activity_eir_festival_guest_help_text:0 "The fires are lit on the hills at dusk, and every household that can walk to them does. A ruler of the Celtic stock can host in any faith, but the monks and the druids will each say what they think."
 activity_eir_festival_conclusion_desc:0 "The [GetActivityType( 'activity_eir_festival' ).GetName] has concluded"
 activity_eir_festival_predicted_cost:0 "The cost of a [GetActivityType( 'activity_eir_festival' ).GetNameNoTooltip] depends on how many you invite and how well you feed them"
