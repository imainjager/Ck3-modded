 # ---------- Feis of Tara ----------
 activity_eir_feis:0 "Feis of Tara"
 activity_eir_feis_name:0 "[ACTIVITY.GetHost.GetNamePossessiveOrMy|U] Feis of Tara"
 activity_eir_feis_owner:0 "Host"
 activity_eir_feis_desc:0 "The oldest feast in Ireland: held at Tara, in the hall of the High Kings, by a king who means to be believed. The provincial kings come, or they do not, and the whole island knows which."
 activity_eir_feis_selection_tooltip:0 "Hold the great feast of the High Kingship.\n\nAnticipated Rewards:\n$BULLET_WITH_TAB$[legitimacy_i][legitimacy|E] and [prestige_i][prestige|E]\n$BULLET_WITH_TAB$Provincial kings sworn in\n$BULLET_WITH_TAB$Risk of an insult in the hall"
 activity_eir_feis_destination_selection:0 "Choose where the Feis of Tara will be held."
 activity_eir_feis_province_desc:0 "Select Barony"
 activity_eir_feis_host_desc:0 "$BULLET_WITH_TAB$Gain [legitimacy_i][legitimacy|E] and [prestige_i][prestige|E]\n$BULLET_WITH_TAB$Guests gain [opinion|E] of you\n$BULLET_WITH_TAB$A rival may defy you at the board"
 activity_eir_feis_guest_desc:0 "$BULLET_WITH_TAB$You may gain [prestige_i][prestige|E]\n$BULLET_WITH_TAB$You may be seated above or below your station"
 activity_eir_feis_guest_help_text:0 "The kings of Ireland sit in order, each in the place his ancestors held. Whoever the host seats where is a statement, and whoever refuses a seat is making one."
 activity_eir_feis_conclusion_desc:0 "The [GetActivityType( 'activity_eir_feis' ).GetName] has concluded"
 activity_eir_feis_predicted_cost:0 "The cost of a [GetActivityType( 'activity_eir_feis' ).GetNameNoTooltip] depends on how many you invite and how well you feed them"
 activity_eir_feis_cooldown:0 "You must wait 10 years before holding another Feis of Tara."
