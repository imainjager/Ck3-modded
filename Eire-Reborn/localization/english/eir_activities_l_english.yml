 activity_eir_bardic_owner:0 "Host"
 activity_eir_bardic_desc:0 "Ireland pays its poets more than its priests, and a poet knows it. The contest is held in the king's hall: the satirists compete for the king's favour and the audience's silence, and the chief poet's chair goes to whoever is left standing."
