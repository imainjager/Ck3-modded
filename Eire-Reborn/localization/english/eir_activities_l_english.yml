 # ---------- Irish Pilgrimage ----------
 activity_eir_pilgrimage:0 "Irish Pilgrimage"
 activity_eir_pilgrimage_name:0 "[ACTIVITY.GetHost.GetNamePossessiveOrMy|U] Irish Pilgrimage"
 activity_eir_pilgrimage_owner:0 "Host"
 activity_eir_pilgrimage_desc:0 "The Irish saints made the sea their desert and the mountain their cell. The pilgrim climbs Croagh Patrick on bare feet, rows to Skellig Michael, or spends three days in the cave of Lough Derg, and comes back changed."
 activity_eir_pilgrimage_selection_tooltip:0 "Take the road of the saints, barefoot.\n\nAnticipated Rewards:\n$BULLET_WITH_TAB$[piety_i][piety|E]\n$BULLET_WITH_TAB$[stress_loss_i][stress|E] loss\n$BULLET_WITH_TAB$A vision, a miracle or a hard road"
 activity_eir_pilgrimage_destination_selection:0 "Choose where the Irish Pilgrimage will be held."
 activity_eir_pilgrimage_province_desc:0 "Select Barony"
 activity_eir_pilgrimage_host_desc:0 "$BULLET_WITH_TAB$Gain [piety_i][piety|E]\n$BULLET_WITH_TAB$May lose [stress_i][stress|E]\n$BULLET_WITH_TAB$The road is hard, and a pilgrim may be hurt"
 activity_eir_pilgrimage_guest_desc:0 "$BULLET_WITH_TAB$You may gain [piety_i][piety|E]\n$BULLET_WITH_TAB$You may help, or be helped, along the way"
 activity_eir_pilgrimage_guest_help_text:0 "Pilgrims go in small companies and ask no questions. Friends, confessors, penitents and those who have simply nothing better to do are all welcome on the road."
 activity_eir_pilgrimage_conclusion_desc:0 "The [GetActivityType( 'activity_eir_pilgrimage' ).GetName] has concluded"
