 # ---------- Great Hosting ----------
 activity_eir_hosting:0 "Great Hosting"
 activity_eir_hosting_name:0 "[ACTIVITY.GetHost.GetNamePossessiveOrMy|U] Great Hosting"
 activity_eir_hosting_owner:0 "Host"
 activity_eir_hosting_desc:0 "A king in Ireland who calls the slógad calls a whole country to the hill. The lords bring their men, the poets their curses, and the host sits for a fortnight in a field making up its mind: to march, to raid or to go home."
 activity_eir_hosting_selection_tooltip:0 "Call the slógad to a hill.\n\nAnticipated Rewards:\n$BULLET_WITH_TAB$[prestige_i][prestige|E] and [dread_i][dread|E]\n$BULLET_WITH_TAB$A taste of the plunder, if the host marches\n$BULLET_WITH_TAB$The risk of a quarrel in the camp"
