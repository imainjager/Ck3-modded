 activity_eir_hosting_guest_desc:0 "$BULLET_WITH_TAB$You may gain [prestige_i][prestige|E] or gold\n$BULLET_WITH_TAB$You may be wounded in the raid"
 activity_eir_hosting_guest_help_text:0 "Every lord with a spear is expected to answer the call. Those who do not have a reason ready for the host."
