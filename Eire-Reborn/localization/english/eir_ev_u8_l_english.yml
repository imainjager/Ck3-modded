l_english:
 eir.0990.t:0 "Where Stands the Road?"
 eir.0990.desc:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nThe road is walked in four acts: Ireland, the Celtic world, Britain and the mainland. Every step on it is shown in purple in your list of decisions. The poet's finger rests on the next one.\n\nThe whole road is walked. The poets have run out of lines, and are looking for a new patron."
 eir.0990.v1:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct I: Ireland, step 1 of 30: Hold the Great Óenach.\n\nNeeds a duchy, 10 counties, an Irish building, three vassals. Opinion with every vassal, a county festival site, legitimacy-style prestige, and the way to Tara opens."
 eir.0990.v2:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct I: Ireland, step 2 of 30: Rebuild the Hall of Tara.\n\nNeeds the Duchy of Meath, the Óenach held and three Irish buildings. Unlocks the Hall of Tara special building and the road to the High Kingship. Happens only once per game."
 eir.0990.v3:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct I: Ireland, step 3 of 30: Be Crowned at Tara.\n\nNeeds Meath and another duchy, the Hall of Tara, the Óenach and 20 counties. Creates the Kingdom of Ireland, the Ard Rí trait, the stone's blessing and a legend."
 eir.0990.v4:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct I: Ireland, step 4 of 30: Ride the Circuit of Ireland.\n\nNeeds a kingdom, the Óenach and peace. Every county gets a royal-visit bonus, vassals warm to you, chance of the Peacemaker of Tara trait. Starts the 'Circuit' incident."
 eir.0990.v5:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct I: Ireland, step 5 of 30: Take the Oath of the Provincial Kings.\n\nNeeds a kingdom and the Óenach. Dukes and above swear to you; legitimacy and levies grow. Required for ending the Fragmentation."
 eir.0990.v6:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct I: Ireland, step 6 of 30: Hosting of the Four Provinces.\n\nNeeds a kingdom, the Óenach, the Muster and two duchies. Two hosts, a Great Hosting modifier and a legend."
 eir.0990.v7:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct I: Ireland, step 7 of 30: End the Tanistic Fragmentation.\n\nNeeds the High Kingship, the Circuit, the Provincial Oath, a feudal government and 10 counties of Ireland. Abolishes the death of top titles, adds Stable High Kingship, unlocks the Guard of Tara. Happens only once per game."
 eir.0990.v8:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct II: The Celtic World, step 8 of 30: Found a Monastery.\n\nNeeds 4 counties and 200 piety. A county monastery for 40 years, piety and clergy opinion, and the road to scriptoria and high crosses. Happens only once per game."
 eir.0990.v9:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct II: The Celtic World, step 9 of 30: Compile the Brehon Laws.\n\nNeeds the Schools of the Filí, 4 Irish buildings and a learned ruler. Unlocks the Brehon Court building, legitimacy and court opinion for 20 years, a chance of the Brehon trait. Happens only once per game."
 eir.0990.v10:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct II: The Celtic World, step 10 of 30: The Gaelic Renaissance.\n\nNeeds all four upgraded traditions, the Brehon Laws, a kingdom and 2500 prestige. A thirty-year golden-age modifier, prestige, a legend, and the way to the Empire. Happens only once per game."
 eir.0990.v11:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct II: The Celtic World, step 11 of 30: Call the Celtic Brotherhood.\n\nNeeds a kingdom, the Oath of the Provincial Kings and 3 ports. Brythonic rulers warm to you; unlocks every Celtic decision. Happens only once per game."
 eir.0990.v12:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct II: The Celtic World, step 12 of 30: Proclaim the Insular Union.\n\nNeeds a kingdom, the Celtic Brotherhood, three reclaimed counties in Britain, six Celtic counties and little resentment. Adds the Union of the Insular Celts tradition to your culture, an Insular Union modifier for 30 years, the Insular Spearmen (a new men-at-arms), welcome of Welsh and Alban rulers, and a ceremony."
 eir.0990.v13:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct II: The Celtic World, step 13 of 30: Crown the King of the Island of the Mighty.\n\nNeeds the Insular Union, a kingdom, six Celtic counties in Britain and the Isle of Man. Creates the Kingdom of the Island of the Mighty, a 40-year Island Crown modifier, the nickname 'Island-King', a legend and a coronation ceremony."
 eir.0990.v14:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct II: The Celtic World, step 14 of 30: Proclaim the Empire of Gaeldom.\n\nNeeds the High Kingship, the Brotherhood, the Gaelic Renaissance, 30 counties and a fortune. Creates the Empire of Gaeldom, a thirty-year emperor modifier, a vast prestige reward and a legend. Happens only once per game."
 eir.0990.v15:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct III: Britain, step 15 of 30: A Third of the Island.\n\nNeeds to be an Irish king who holds 28 of the 93 counties of the Empire of Britannia (30%). Gives the Gaelic Ascendancy modifier for 50 years: foreign counties of Britannia in your realm take your culture at five times the pace (1% a year, up to 6%). Every conversion raises the Saxon unrest chain and the county takes -50 opinion for 20 years. Also prestige, piety, opinion and a Pride of the Island modifier in every Britannic county you hold."
 eir.0990.v16:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct III: Britain, step 16 of 30: The Gaelic Kingdoms United.\n\nNeeds the first decision, a Gaelic culture and both the Kingdom of Ireland and the Kingdom of Scotland. Stacks the Ascendancy (another +5, up to 11% a year), converts half of the non-Gaelic counties of Ireland and Scotland you hold to your culture right away (each takes -50 opinion for 20 years and feeds the unrest chain), gives you a claim on the Empire of Britannia, and a United Kingdoms modifier for 50 years."
 eir.0990.v17:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct III: Britain, step 17 of 30: Revive the Arthurian Legend.\n\nNeeds the Gaelic Kingdoms United, a kingdom, prestige level 4 and 1000 piety. Creates a mythical heroic legend, the unique sword Caliburn (a super-powered artifact), the Arthur Reborn modifier for 40 years, and opens five hard paths that each win one more item of the king's regalia."
 eir.0990.v18:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct III: Britain, step 18 of 30: The Last Revenge of the Celts.\n\nNeeds the Arthurian legend, a Gaelic king and 95% of the counties of Britannia (89 of 93). Gives the Lord of the Whole Island modifier for 50 years, a third and final Ascendancy (up to 17% a year, every conversion with the -50 opinion Saxon uprising), the nickname 'the Last Hope of the Celts', prestige and legitimacy, Pride of the Island in every county, and a super-powered special building (about 2.5 times a wonder) that you place yourself at Winchester, York, Edinburgh, Caernarfon or Bath."
 eir.0990.v19:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 19 of 30: Mystical Celtic Warriors.\n\nNeeds an Irish emperor who holds every one of the 93 counties of the Empire of Britannia, 5000 prestige and peace. Adds the tradition Mystical Celtic Warriors to your culture: your people find it easier to hybridise and to diverge culture, faith conversion costs 40% less, +10 advantage in counties of your heritage, -20 opinion from those of other cultures. Unlocks the unique men-at-arms Forest Warriors (skirmishers: 35 damage, 20 toughness, 15 pursuit, 20 screen; +20 damage in forest and jungle, -20 in desert, +5 in plains, +10 in hills) and the Sacred Grove (Nemeton), a regional building worth +25% development growth. Every county of Britannia you hold gains +25% development growth and the forest penalty is lifted."
 eir.0990.v20:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 20 of 30: The Return of the Celts to the Mainland.\n\nAppears after Mystical Celtic Warriors. Needs an Irish emperor, 3000 prestige, 1000 piety and peace. Gives the Celts Look to the Mainland modifier for 50 years and opens five decisions: the Return of the Celts to France, Germany, Spain (Iberia), Italy and Galatia."
 eir.0990.v21:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 21 of 30: The Return of the Celts to France.\n\nNeeds the Return of the Celts to the Mainland, an Irish emperor, 14 counties of the Empire of France (14 of 109), peace and prestige at least 6000, martial at least 22. Gives you a claim on the Empire of France, and the modifier The Return of the Celts to France for 50 years: every foreign county of the Empire of France in your realm has a 6% chance a year to take your culture (five times the normal pace), and each one resists with -30 opinion for 15 years."
 eir.0990.v22:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 22 of 30: The Celts Return to France.\n\nAppears after the Return of the Celts to France. Needs 30 counties of the Empire of France (30 of 109), peace and piety at least 1500. Half of the counties of the Empire of France in your realm that are not of your culture take your culture at once (each resists with -30 opinion for 15 years), plus The Celts Return to France modifier for 50 years and a great deal of prestige."
 eir.0990.v23:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 23 of 30: The Return of the Celts to Germany.\n\nNeeds the Return of the Celts to the Mainland, an Irish emperor, 12 counties of the Empire of Germany (12 of 147), peace and prestige level at least 4, martial at least 26. Gives you a claim on the Empire of Germany, and the modifier The Return of the Celts to Germany for 50 years: every foreign county of the Empire of Germany in your realm has a 6% chance a year to take your culture (five times the normal pace), and each one resists with -30 opinion for 15 years."
 eir.0990.v24:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 24 of 30: The Celts Return to Germany.\n\nAppears after the Return of the Celts to Germany. Needs 36 counties of the Empire of Germany (36 of 147), peace and prestige at least 4000. Half of the counties of the Empire of Germany in your realm that are not of your culture take your culture at once (each resists with -30 opinion for 15 years), plus The Celts Return to Germany modifier for 50 years and a great deal of prestige."
 eir.0990.v25:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 25 of 30: The Return of the Celts to Spain and Iberia.\n\nNeeds the Return of the Celts to the Mainland, an Irish emperor, 11 counties of the Empire of Spain (Iberia) (11 of 87), peace and piety at least 2500, has global variable = eir done monastery. Gives you a claim on the Empire of Spain (Iberia), and the modifier The Return of the Celts to Spain and Iberia for 50 years: every foreign county of the Empire of Spain (Iberia) in your realm has a 6% chance a year to take your culture (five times the normal pace), and each one resists with -30 opinion for 15 years."
 eir.0990.v26:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 26 of 30: The Celts Return to Spain and Iberia.\n\nAppears after the Return of the Celts to Spain and Iberia. Needs 27 counties of the Empire of Spain (Iberia) (27 of 87), peace and stewardship at least 20. Half of the counties of the Empire of Spain (Iberia) in your realm that are not of your culture take your culture at once (each resists with -30 opinion for 15 years), plus The Celts Return to Spain and Iberia modifier for 50 years and a great deal of prestige."
 eir.0990.v27:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 27 of 30: The Return of the Celts to Italy.\n\nNeeds the Return of the Celts to the Mainland, an Irish emperor, 8 counties of the Empire of Italy (8 of 53), peace and diplomacy at least 24, prestige at least 5000. Gives you a claim on the Empire of Italy, and the modifier The Return of the Celts to Italy for 50 years: every foreign county of the Empire of Italy in your realm has a 6% chance a year to take your culture (five times the normal pace), and each one resists with -30 opinion for 15 years."
 eir.0990.v28:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 28 of 30: The Celts Return to Italy.\n\nAppears after the Return of the Celts to Italy. Needs 21 counties of the Empire of Italy (21 of 53), peace and prestige at least 3000. Half of the counties of the Empire of Italy in your realm that are not of your culture take your culture at once (each resists with -30 opinion for 15 years), plus The Celts Return to Italy modifier for 50 years and a great deal of prestige."
 eir.0990.v29:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 29 of 30: The Return of the Celts to Galatia.\n\nNeeds the Return of the Celts to the Mainland, an Irish emperor, 6 counties of the Kingdom of Anatolia (Galatia) (6 of 19), peace and learning at least 20, prestige at least 5000. Gives you a claim on the Kingdom of Anatolia (Galatia), and the modifier The Return of the Celts to Galatia for 50 years: every foreign county of the Kingdom of Anatolia (Galatia) in your realm has a 6% chance a year to take your culture (five times the normal pace), and each one resists with -30 opinion for 15 years."
 eir.0990.v30:0 "#bold The chief poet unrolls the long tale of your reign and points to the line where it breaks off.#!\n\nAct IV: The Mainland, step 30 of 30: The Celts Return to Galatia.\n\nAppears after the Return of the Celts to Galatia. Needs 12 counties of the Kingdom of Anatolia (Galatia) (12 of 19), peace and martial at least 24. Half of the counties of the Kingdom of Anatolia (Galatia) in your realm that are not of your culture take your culture at once (each resists with -30 opinion for 15 years), plus The Celts Return to Galatia modifier for 50 years and a great deal of prestige."
 eir.0990.a:0 "Thank him, and press on."
 eir.0990.b:0 "Pay the poet for his trouble."
 eir.0991.t:0 "The Fires on the Hill"
 eir.0991.desc:0 "#bold You have lit the quarter-day fire in public, and the oaks on the hill are full of watchers.#!\n\nThe smoke rose straight as a spear. Behind you the poets recited the old genealogies in the voice of men who had not been allowed to for four hundred years. Below, at the edge of the clearing, a dozen monks with tonsures stood very still, not quite praying, not quite leaving.\n\nSomeone has sent for the abbot of the nearest house. He is walking up the hill now, slowly, with a stick and an extremely long face."
 eir.0991.a:0 "Light the great fire and let every household take a brand home."
 eir.0991.b:0 "Meet the abbot on the path and tell him the fires are only fires."
 eir.0991.c:0 "Close the monastery schools for a year to make a point."
 eir.0991.d:0 "Put out half of the fires, quietly, before dawn."
 eir.0992.t:0 "Ashes in the Porch"
 eir.0992.desc:0 "#bold You have knelt in the porch of the old church, and the abbot has not decided what to do with you.#!\n\nHe made you wait the length of a psalm. Then he came out with a bowl of ashes and a small, unreadable face, and asked you how many of the fires you had personally lit. You counted. It took a while.\n\nThe monks inside have gone quiet. Outside the poets, who followed you from the court out of curiosity, are writing it all down."
 eir.0992.a:0 "Give the monastery the lands it asks for."
 eir.0992.b:0 "Walk barefoot to the saint's grave and back."
 eir.0992.c:0 "Say it was a political decision and leave."
 eir.0993.t:0 "The Poor Houses"
 eir.0993.desc:0 "#bold The first Culdee houses have opened, and the great abbots have taken it badly.#!\n\nThey are small things: a wattle chapel, a vegetable garden, a well, and six men who call each other Brother and mean it. There is no gold on the altar. There is a very good copy of the Gospels, made by a monk who has had no wine in nine years.\n\nThe abbot of the great house down the valley has sent a long letter on very good vellum. It begins courteously and ends otherwise."
 eir.0993.a:0 "Answer the abbot with a gift of cattle and a promise to leave his lands alone."
 eir.0993.b:0 "Send the best of the Culdee scribes to the abbot's school."
 eir.0993.c:0 "Ignore the letter and found ten more houses."
