 eir_bell_shrine_modifier_desc:0 "A bronze and silver shrine for the bell of a saint."
 eir_lunula_modifier:0 "Gold Lunula"
 eir_lunula_modifier_desc:0 "A thin crescent of beaten gold, older than the kings."
 eir_ogham_blade_modifier:0 "Ogham-Marked Blade"
 eir_ogham_blade_modifier_desc:0 "A blade with a line of ogham letters on the spine."
 eir_chieftain_torc_modifier:0 "Chieftain's Torc"
 eir_chieftain_torc_modifier_desc:0 "A twisted gold collar worn by a lesser king."
 eir_dimma_book_modifier:0 "Little Gospel Book"
 eir_dimma_book_modifier_desc:0 "A small gospel book, small enough to put in a satchel."
 eir_iona_reliquary_modifier:0 "Reliquary of Iona"
 eir_iona_reliquary_modifier_desc:0 "A bronze and silver shrine with a scrap of Colmcille's cloak."
 eir_poets_chain_modifier:0 "The Poet's Chain"
 eir_poets_chain_modifier_desc:0 "A silver chain given by a high poet to a king he thought worthy."
 eir_moot_horn_modifier:0 "The Moot Horn"
 eir_moot_horn_modifier_desc:0 "A carved horn blown to call the thanes to their open-air assembly."
 eir_black_jarl_sword_modifier:0 "The Black Jarl's Sword"
 eir_black_jarl_sword_modifier_desc:0 "A heavy Norse sword with a silver-inlaid hilt, taken from the hand of a warlord who thought Ireland was a poor country."
 eir_david_staff_modifier:0 "Chalice of Saint David"
 eir_david_staff_modifier_desc:0 "A silver chalice with a fragment of the saint's staff in its stem."
 eir_hill_king_sword_modifier:0 "Caliburn of the Gael"
 eir_hill_king_sword_modifier_desc:0 "A sword made to match a story that every people on the island tells about itself."
 eir_hoard_cup_modifier:0 "The Raiders' Cup"
 eir_hoard_cup_modifier_desc:0 "A cup melted from a pot of Norse hacksilver."
 eir_norse_blade_modifier:0 "Pattern-Welded Blade"
 eir_norse_blade_modifier_desc:0 "A sword whose steel flexes like a green branch."
 eir_union_banner_modifier:0 "Banner of the Three Crowns"
 eir_union_banner_modifier_desc:0 "Harp, dragon and chough in a ring."

