 # ---------- culture traditions ----------
 tradition_eir_tanistic_fragmentation_name:0 "Tanistic Fragmentation"
 tradition_eir_tanistic_fragmentation_desc:0 "In Ireland a kingdom was a man, not a throne. When the king died his realm fell apart, and the next strong claimant had to put it together again. Rulers of this culture lose their highest title on death (duchy or above), but their warbands are fierce and their pride is great."
 tradition_eir_high_kingship_name:0 "Stable High Kingship"
 tradition_eir_high_kingship_desc:0 "The Irish have finally learned to keep a throne after the king who holds it is dead. The high kingship passes to the heir intact, and the lords of Ireland have grown used to bowing to it."
 tradition_eir_bardic_schools_name:0 "Schools of the Filí"
 tradition_eir_bardic_schools_desc:0 "Poets train twelve years in the schools of the Filí, learning genealogy, law and satire, and the heroic tales give young nobles a pattern to follow. Replaces Poetry. Unlocks the Fianna warbands and Kern javelineers."
 tradition_eir_cattle_wealth_name:0 "Bó-aire: The Cattle Lords"
 tradition_eir_cattle_wealth_desc:0 "A man's worth is counted in cows. Cattle are wealth, tribute, dowry and the cause of half the island's wars, and the lords who keep the biggest herds keep the biggest warbands. Replaces Pastoralists."
 tradition_eir_culdee_christianity_name:0 "Insular Monasticism"
 tradition_eir_culdee_christianity_desc:0 "Irish monasteries, scriptoria and wandering saints give the Christianity of this culture a flavour all its own: the abbot is as powerful as the bishop, and the monastery is a city. Replaces Monastic Communities."
 tradition_eir_sea_kings_name:0 "Kings of the Irish Sea"
 tradition_eir_sea_kings_desc:0 "The Irish Sea belongs to everyone who dares sail it. Irish ports trade with Chester, Bristol and Bordeaux, galleys carry gallowglass between Skye and Kerry, and merchant-kings grow rich. Replaces Maritime Mercantilism. Unlocks gallowglass, the Irish Sea Quay and the Longship Yard."
 tradition_eir_insular_union_name:0 "Union of the Insular Celts"
 tradition_eir_insular_union_desc:0 "Gael, Briton and Pict swore that they would hold the island together. The oath does not make them one people, but it makes their rulers kin. Unlocks the Insular Spearmen."
 tradition_eir_kinship_law_name:0 "Law of Kinship"
 tradition_eir_kinship_law_desc:0 "A man is his kindred. The elders have written down who owes what, who pays for a death and who may speak for the house. Replaces Strong Kinship; keeps all its effects and softens its worst."
 tradition_eir_clan_war_law_name:0 "Law of the Sword and the Clan"
 tradition_eir_clan_war_law_desc:0 "The war-leaders of the Highlands wrote down their customs: how a clan musters, who leads, how spoil is divided. Replaces Highland Warriors; keeps all its effects."

