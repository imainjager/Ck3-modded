l_english:

 # ---------- character modifiers ----------
 eir_ard_ri_modifier:0 "High King of Ireland"
 eir_ard_ri_modifier_desc:0 "You were crowned at Tara, and the whole island knows it."
 eir_lia_fail_blessing_modifier:0 "The Stone Cried Out"
 eir_lia_fail_blessing_modifier_desc:0 "The Lia Fáil roared beneath you, as it is said to for a rightful king."
 eir_oenach_afterglow_modifier:0 "Afterglow of the Óenach"
 eir_oenach_afterglow_modifier_desc:0 "The great assembly was a success, and people still speak warmly of it."
 eir_boramha_collected_modifier:0 "The Cow Tribute"
 eir_boramha_collected_modifier_desc:0 "You collect the old Bóramha tribute. The gold is welcome, and the vassals are not."
 eir_brehon_laws_modifier:0 "Judge of the Brehon Laws"
 eir_brehon_laws_modifier_desc:0 "Your courts follow the ancient laws, and your subjects trust them."
 eir_fili_patron_modifier:0 "Patron of the Filí"
 eir_fili_patron_modifier_desc:0 "The poets of Ireland sing your praises from Tara to Kerry."
 eir_satirised_modifier:0 "Satirised in Verse"
 eir_satirised_modifier_desc:0 "A poet's satire has made you a laughing stock. Satire can wither a king."
 eir_foster_ties_modifier:0 "Bound by Fosterage"
 eir_foster_ties_modifier_desc:0 "Your vassals' sons were raised in your hall, and they remember it."
 eir_cattle_rich_modifier:0 "Cattle-Rich"
 eir_cattle_rich_modifier_desc:0 "Your herds are great, and so is your wealth."
 eir_raider_infamy_modifier:0 "Infamous Cattle-Raider"
 eir_raider_infamy_modifier_desc:0 "Your raids are famous. Your neighbours do not find it as amusing as you do."
 eir_norse_scourge_modifier:0 "Scourge of the Norse"
 eir_norse_scourge_modifier_desc:0 "You drove the Norsemen back into the sea, and the songs have already started."
 eir_danegeld_modifier:0 "Paying Danegeld"
 eir_danegeld_modifier_desc:0 "You pay the Norse to stay away. They do not stay away for long."
 eir_gallowglass_paymaster_modifier:0 "Gallowglass Paymaster"
 eir_gallowglass_paymaster_modifier_desc:0 "You have learned how to keep the island's most feared axemen in your pay."
 eir_fianna_spirit_modifier:0 "Spirit of the Fianna"
 eir_fianna_spirit_modifier_desc:0 "The old warrior-hunters of the tales ride again in your hall."
 eir_celtic_brotherhood_modifier:0 "Celtic Brotherhood"
 eir_celtic_brotherhood_modifier_desc:0 "The Celtic peoples of the isles see you as a friend and a leader."
 eir_gaeldom_emperor_modifier:0 "Emperor of the Gael"
 eir_gaeldom_emperor_modifier_desc:0 "The Gaelic world has its emperor at last."
 eir_saints_blessing_modifier:0 "Blessing of the Saints"
 eir_saints_blessing_modifier_desc:0 "The saints of Ireland smile on your reign."
 eir_synod_reform_modifier:0 "Reformed Dioceses"
 eir_synod_reform_modifier_desc:0 "You reorganised the Irish Church, and the clergy are grateful."
 eir_culdee_strife_modifier:0 "Culdee Strife"
 eir_culdee_strife_modifier_desc:0 "The old Irish monks and the Roman reformers quarrel in your realm."
 eir_kin_strife_modifier:0 "Kin-Strife"
 eir_kin_strife_modifier_desc:0 "Your own kin plot over the succession, and the court takes sides."
 eir_throne_turmoil_modifier:0 "Throne in Turmoil"
 eir_throne_turmoil_modifier_desc:0 "The old king's titles lie in pieces, and every kinsman has a claim."
 eir_peace_of_tara_modifier:0 "Peace of Tara"
 eir_peace_of_tara_modifier_desc:0 "The kin of the old king have sworn to you at Tara."
 eir_gaelic_revival_modifier:0 "Gaelic Revival"
 eir_gaelic_revival_modifier_desc:0 "A new pride in the Gaelic name stirs in Ireland."
 eir_dun_builder_modifier:0 "Builder of Dúns"
 eir_dun_builder_modifier_desc:0 "You raise ringforts and halls faster and cheaper than other kings."
 eir_sea_king_modifier:0 "Sea-King"
 eir_sea_king_modifier_desc:0 "Your fleets ply the Irish Sea as the Norse once did."
 eir_tailteann_modifier:0 "Games of Tailtiu"
 eir_tailteann_modifier_desc:0 "You held the old funeral games, and the island feasted for a fortnight."
 eir_samhain_dread_modifier:0 "Samhain Dread"
 eir_samhain_dread_modifier_desc:0 "The veil was thin on Samhain night, and something followed you home."
 eir_beltane_vigor_modifier:0 "Beltane Vigor"
 eir_beltane_vigor_modifier_desc:0 "The Beltane fires have left you hale and hopeful."
 eir_wolfhound_bond_modifier:0 "Bond of the Wolfhound"
 eir_wolfhound_bond_modifier_desc:0 "A great Irish wolfhound never leaves your side."
 eir_hospitality_modifier:0 "Famed Hospitality"
 eir_hospitality_modifier_desc:0 "No guest ever left your hall hungry or sober."
 eir_lean_years_modifier:0 "Lean Years"
 eir_lean_years_modifier_desc:0 "A string of bad harvests has emptied the granaries."
 eir_pilgrim_modifier:0 "Pilgrim of Skellig"
 eir_pilgrim_modifier_desc:0 "You climbed the Skellig steps, and the climb changed you."
 eir_relic_keeper_modifier:0 "Keeper of the Bell"
 eir_relic_keeper_modifier_desc:0 "You hold an ancient saint's bell, and pilgrims come to see it."
 eir_sidhe_favour_modifier:0 "Favour of the Sídhe"
 eir_sidhe_favour_modifier_desc:0 "You left the good people their due, and they remember."
 eir_sidhe_anger_modifier:0 "Anger of the Sídhe"
 eir_sidhe_anger_modifier_desc:0 "You disturbed a fairy mound, and ill luck has followed."
 eir_foreign_lords_modifier:0 "Foreign Lords on Irish Soil"
 eir_foreign_lords_modifier_desc:0 "Strangers with castles have landed, and your name suffers for every county they take."
 eir_hearth_of_the_gael_modifier:0 "Hearth of the Gael"
 eir_hearth_of_the_gael_modifier_desc:0 "Your hall is where the Irish come to be Irish."
 eir_tara_vigil_modifier:0 "Vigil at Tara"
 eir_tara_vigil_modifier_desc:0 "You kept the old vigil on the Hill of Tara."
 eir_royal_circuit_modifier:0 "Royal Circuit"
 eir_royal_circuit_modifier_desc:0 "You have ridden through your lands, eaten at every lord's table, and been seen."
 eir_hostages_modifier:0 "Hostages of Tara"
 eir_hostages_modifier_desc:0 "The sons of your vassals sit at your table. They keep your vassals quiet, and bitter."
 eir_cain_law_modifier:0 "Cain Law"
 eir_cain_law_modifier_desc:0 "A law of sanctuary and protection, sworn by the bishops and the kings."
 eir_provincial_oath_modifier:0 "Sworn Provincial Kings"
 eir_provincial_oath_modifier_desc:0 "The provincial kings have sworn on the relics, and the oath still holds."
 eir_feis_modifier:0 "Feis of Tara"
 eir_feis_modifier_desc:0 "The great feast is remembered in song."
 eir_tanaiste_modifier:0 "Named Tánaiste"
 eir_tanaiste_modifier_desc:0 "An heir-apparent has been named, and the succession is a little clearer than usual."
 eir_cain_tribute_modifier:0 "The Cáin Tribute"
 eir_cain_tribute_modifier_desc:0 "The levy is collected. The cattle-owners are not pleased."
 eir_wergild_peace_modifier:0 "Wergild Paid"
 eir_wergild_peace_modifier_desc:0 "A feud was settled with cattle instead of blood."
 eir_gaelic_court_modifier:0 "A Court in the Old Style"
 eir_gaelic_court_modifier_desc:0 "Harpers, poets and judges fill your hall."
 eir_royal_ollamh_modifier:0 "Ollamh of the King"
 eir_royal_ollamh_modifier_desc:0 "A chief poet sits at your right hand and remembers everything."
 eir_hosting_modifier:0 "A Great Hosting"
 eir_hosting_modifier_desc:0 "The tribes are gathered, and every man knows his place."
 eir_sanctuary_modifier:0 "Right of Sanctuary"
 eir_sanctuary_modifier_desc:0 "Churches shelter those who flee, and the clergy bless you for it."
 eir_tanistry_dispute_modifier:0 "A Claim Revoked"
 eir_tanistry_dispute_modifier_desc:0 "You struck a name from the list of heirs, and the family has not forgotten."
 eir_naming_customs_modifier:0 "Gaelic Names"
 eir_naming_customs_modifier_desc:0 "Your children are named for saints and heroes, as the ancestors were."
 eir_bardic_circuit_modifier:0 "Bardic Circuit"
 eir_bardic_circuit_modifier_desc:0 "Poets walk from hall to hall, carrying your name."
 eir_harper_modifier:0 "A Harper at Court"
 eir_harper_modifier_desc:0 "A master harper plays in your hall every evening."
 eir_brigid_cult_modifier:0 "Flame of Brigid"
 eir_brigid_cult_modifier_desc:0 "A perpetual flame burns for Brigid, goddess and saint."
 eir_colmcille_cult_modifier:0 "Heir of Colmcille"
 eir_colmcille_cult_modifier_desc:0 "The saint of Iona is honoured in your court."
 eir_patrick_cult_modifier:0 "Patrick's Faithful"
 eir_patrick_cult_modifier_desc:0 "The apostle of Ireland is honoured above every other saint."
 eir_yew_bows_modifier:0 "Yew Bows"
 eir_yew_bows_modifier_desc:0 "Your levies carry bows of Irish yew."
 eir_champions_portion_modifier:0 "Champion's Portion"
 eir_champions_portion_modifier_desc:0 "The best cut of the meat goes to your champion, and his arm is the stronger for it."
 eir_dun_drill_modifier:0 "Dún Drill"
 eir_dun_drill_modifier_desc:0 "The garrison trains behind the earthen walls every spring."
 eir_watchtowers_modifier:0 "Coastal Watch"
 eir_watchtowers_modifier_desc:0 "Watchmen stand on every headland."
 eir_island_fleet_modifier:0 "Fleet of the Isles"
 eir_island_fleet_modifier_desc:0 "Your galleys sail the western seas."
 eir_monastery_founder_modifier:0 "Founder of a Monastery"
 eir_monastery_founder_modifier_desc:0 "You have given the Church a new house of prayer."
 eir_scriptorium_patron_modifier:0 "Patron of the Scriptorium"
 eir_scriptorium_patron_modifier_desc:0 "Your monks copy gospel books by candlelight."
 eir_hermit_blessing_modifier:0 "A Hermit's Blessing"
 eir_hermit_blessing_modifier_desc:0 "A holy man gave you his blessing, and a silence."
 eir_relic_procession_modifier:0 "Relic Procession"
 eir_relic_procession_modifier_desc:0 "A relic was carried through your lands, and the people were comforted."
 eir_penance_done_modifier:0 "Penance Done"
 eir_penance_done_modifier_desc:0 "You stood barefoot in the snow. You feel lighter."
 eir_rome_pilgrim_modifier:0 "Pilgrim to Rome"
 eir_rome_pilgrim_modifier_desc:0 "You walked to Rome and back."
 eir_gwynedd_alliance_modifier:0 "Friend of Gwynedd"
 eir_gwynedd_alliance_modifier_desc:0 "The princes of Gwynedd count you a friend."
 eir_strathclyde_bond_modifier:0 "Brother of Strathclyde"
 eir_strathclyde_bond_modifier_desc:0 "The northern Britons call you kin."
 eir_pictish_memory_modifier:0 "Pictish Memory"
 eir_pictish_memory_modifier_desc:0 "You honour the old peoples of the north."
 eir_breton_refuge_modifier:0 "Refuge of Brittany"
 eir_breton_refuge_modifier_desc:0 "Breton exiles bless your name."
 eir_armorica_voyage_modifier:0 "Voyage to Armorica"
 eir_armorica_voyage_modifier_desc:0 "A ship returned from Brittany, with news and silver."
 eir_gaulish_heritage_modifier:0 "Gaulish Heritage"
 eir_gaulish_heritage_modifier_desc:0 "The Celts once ruled from the Danube to the Atlantic."
 eir_tale_salmon_modifier:0 "Tale of the Salmon of Knowledge"
 eir_tale_salmon_modifier_desc:0 "Your court tells the story of the salmon, and learns from it."
 eir_tale_cuchulainn_modifier:0 "Tale of Cú Chulainn"
 eir_tale_cuchulainn_modifier_desc:0 "Your warriors want to be the Hound of Ulster."
 eir_tale_finn_modifier:0 "Tale of Finn and the Fianna"
 eir_tale_finn_modifier_desc:0 "The hunter-warriors of the old stories inspire your knights."
 eir_tale_medb_modifier:0 "Tale of Queen Medb"
 eir_tale_medb_modifier_desc:0 "A formidable queen of the old tales is on everyone's mind."
 eir_tale_lir_modifier:0 "Tale of the Children of Lir"
 eir_tale_lir_modifier_desc:0 "A song of grief that makes people kinder."
 eir_tale_brendan_modifier:0 "Tale of Saint Brendan"
 eir_tale_brendan_modifier_desc:0 "A voyage story that makes the western sea seem close."
 eir_harp_of_brian_modifier:0 "Harp of the High King"
 eir_harp_of_brian_modifier_desc:0 "A harp said to have belonged to Brian himself."
 eir_crozier_modifier:0 "Crozier of the Abbot"
 eir_crozier_modifier_desc:0 "A bishop's staff of bronze and enamel."
 eir_kingmaker_modifier:0 "Kingmaker"
 eir_kingmaker_modifier_desc:0 "You placed a king on a throne, and everyone remembers."
 eir_exile_modifier:0 "In Exile"
 eir_exile_modifier_desc:0 "You lost a kingdom, and you remember it daily."
 eir_blinded_modifier:0 "Struck from the List"
 eir_blinded_modifier_desc:0 "A rival was blinded to bar him from the throne. The act is not forgiven."
 eir_champion_victor_modifier:0 "Victor in Single Combat"
 eir_champion_victor_modifier_desc:0 "You beat a champion in front of two armies."
 eir_irish_sea_trade_modifier:0 "Master of the Sea Lanes"
 eir_irish_sea_trade_modifier_desc:0 "Your captains know every harbour from Chester to Bordeaux, and your name is known there too."
 eir_thalassocracy_modifier:0 "Sea-King of the West"
 eir_thalassocracy_modifier_desc:0 "Every harbour on the Irish Sea pays you in one coin or another."
 eir_honour_restored_modifier:0 "Honour Restored"
 eir_honour_restored_modifier_desc:0 "You paid what you owed, and more. The poets now say you are a man who settles his debts."
 eir_fair_lord_modifier:0 "A Fair Lord"
 eir_fair_lord_modifier_desc:0 "You gave up what the law allowed you, and your people remember it fondly."
 eir_peace_with_church_modifier:0 "Peace with the Church"
 eir_peace_with_church_modifier_desc:0 "The monks and the reformers sit at one table because you paid for the meal."
 eir_hebridean_ties_modifier:0 "Hebridean Kinship"
 eir_hebridean_ties_modifier_desc:0 "The galley-lords of the Isles are bound to you by marriage."
 eir_tongue_restorer_modifier:0 "Restorer of the Tongue"
 eir_tongue_restorer_modifier_desc:0 "Poets in three countries sing that you gave the old speech back to its children."
 eir_two_peoples_modifier:0 "Lord of Two Peoples"
 eir_two_peoples_modifier_desc:0 "Gael and Saxon alike say you were fair, and each is a little surprised to say it."
 eir_britain_restored_modifier:0 "The Britons Return"
 eir_britain_restored_modifier_desc:0 "The old island speaks again in the old languages, and you stood at the door when it did."
 eir_hard_hand_modifier:0 "A Hard Hand"
 eir_hard_hand_modifier_desc:0 "You crushed the marches quickly. Nobody there will forget how."
 eir_derbfine_counsel_modifier:0 "Counsel of the Derbfine"
 eir_derbfine_counsel_modifier_desc:0 "The adult men of the royal kindred sat down together and agreed, and the realm is steadier for it."
 eir_kin_distrust_modifier:0 "Distrust of Kin"
 eir_kin_distrust_modifier_desc:0 "You now look at every cousin as a possible knife."
 eir_foster_bond_modifier:0 "Foster-Brother's Bond"
 eir_foster_bond_modifier_desc:0 "A man raised in your hall at your table would walk into fire for you."
 eir_false_pedigree_modifier:0 "Exposed Pedigree"
 eir_false_pedigree_modifier_desc:0 "Everyone knows the genealogy was improved. Nobody says so to your face."
 eir_norse_wife_modifier:0 "Norse Kin by Marriage"
 eir_norse_wife_modifier_desc:0 "A Norse-Gael bride tied two peoples together at the high table."
 eir_storm_survivor_modifier:0 "Survivor of the Storm"
 eir_storm_survivor_modifier_desc:0 "You came back from the open sea alive, and the sailors drink to it."
 eir_iona_relic_modifier:0 "Relic of Iona"
 eir_iona_relic_modifier_desc:0 "A fragment of Colmcille's cloak rests in your chapel."
 eir_missionary_glory_modifier:0 "Patron of the Pilgrims"
 eir_missionary_glory_modifier_desc:0 "Your monks carried the faith to Alba and came back with stories."
 eir_easter_rift_modifier:0 "The Easter Rift"
 eir_easter_rift_modifier_desc:0 "You sided in the Easter quarrel, and half the monasteries now think you wrong."
 eir_heresy_hunter_modifier:0 "Defender of the Rule"
 eir_heresy_hunter_modifier_desc:0 "You put down a heretical monk, and the bishops thank you in church."
 eir_fasting_justice_modifier:0 "Heeded the Fast"
 eir_fasting_justice_modifier_desc:0 "You paid a debt rather than let a man starve at your door, and the law was glad."
 eir_booley_modifier:0 "Summer on the Hills"
 eir_booley_modifier_desc:0 "You spent the season in the hill pastures, and it did you good."
 eir_war_poem_modifier:0 "War-Poem Sung"
 eir_war_poem_modifier_desc:0 "The army marched to a poem, and it fought like one."
 eir_welsh_archers_modifier:0 "Welsh Longbows"
 eir_welsh_archers_modifier_desc:0 "Archers from the Welsh marches stand behind the shield wall."
 eir_ford_champion_modifier:0 "Champion of the Ford"
 eir_ford_champion_modifier_desc:0 "You held a river crossing alone against a champion, and it is still being told."
 eir_gallowglass_lands_modifier:0 "Land for Gallowglass"
 eir_gallowglass_lands_modifier_desc:0 "You settled hard Hebridean captains on good ground. They are loyal, and the neighbours are not happy."
 eir_mediator_of_wales_modifier:0 "Mediator of the Welsh"
 eir_mediator_of_wales_modifier_desc:0 "Two Welsh princes accepted your judgement."
 eir_pictish_stone_modifier:0 "The Stone with Beasts"
 eir_pictish_stone_modifier_desc:0 "A carved stone of the northern peoples stands in your court."
 eir_galloway_allies_modifier:0 "Friends of Galloway"
 eir_galloway_allies_modifier_desc:0 "The Gaels of Galloway fight on your side."
 eir_college_of_bangor_modifier:0 "Patron of the College of Bangor"
 eir_college_of_bangor_modifier_desc:0 "The monastery school at Bangor teaches half of Europe under your name."
 eir_child_prodigy_modifier:0 "Patron of a Prodigy"
 eir_child_prodigy_modifier_desc:0 "A child of astonishing talent grows up in your hall."
 eir_isles_wedding_modifier:0 "Wedding of the Isles"
 eir_isles_wedding_modifier_desc:0 "Half the Hebrides came to the feast, and drank to your health for a week."
 eir_hounds_ghost_modifier:0 "Touched by the Hound's Ghost"
 eir_hounds_ghost_modifier_desc:0 "At Samhain you saw the Hound of Ulster, and he nodded."
 eir_omen_comet_modifier:0 "Under the Comet"
 eir_omen_comet_modifier_desc:0 "A bright star with a tail crossed the sky, and nobody can agree what it meant."
 eir_harpers_curse_modifier:0 "The Harper's Curse"
 eir_harpers_curse_modifier_desc:0 "A wronged harper cursed you in your own hall, and the court is uneasy."
 eir_bardic_house_modifier:0 "A Bardic House"
 eir_bardic_house_modifier_desc:0 "Your house keeps its own poets, harpers and genealogists."
 eir_port_charter_modifier:0 "Chartered Harbour"
 eir_port_charter_modifier_desc:0 "A new market-town on the shore pays dues to your treasury."
 eir_tain_retold_modifier:0 "The Táin Retold"
 eir_tain_retold_modifier_desc:0 "Your poets told the Cattle-Raid of Cooley in a new version, and it spread across the Irish Sea."
 eir_black_host_modifier:0 "The Black Host"
 eir_black_host_modifier_desc:0 "A king's whole war-fleet is behind him, and every man in it has sworn to take the silver of Ireland."
 eir_host_demoralised_modifier:0 "Host Demoralised"
 eir_host_demoralised_modifier_desc:0 "The army has seen its leader humbled, and the tarred sails look a little less black than they did."
 eir_beacons_modifier:0 "Beacon Coast"
 eir_beacons_modifier_desc:0 "A fire on every headland, and the whole coast awake by midnight."
 eir_shield_wall_modifier:0 "The Shield Wall"
 eir_shield_wall_modifier_desc:0 "Irish spears, in a line, and the line holds."
 eir_hill_war_modifier:0 "War of the Hills"
 eir_hill_war_modifier_desc:0 "Strike and fall back, strike and fall back: the hills are on your side."
 eir_split_command_modifier:0 "Divided Command"
 eir_split_command_modifier_desc:0 "Two armies, two fords, and the enemy unsure which one is the real one."
 eir_foreknowledge_modifier:0 "Foreknowledge"
 eir_foreknowledge_modifier_desc:0 "You know where they will land, how many there are and who is paying them."
 eir_allied_kings_modifier:0 "The Kings Stand Together"
 eir_allied_kings_modifier_desc:0 "For once, the kings of Ireland are looking in the same direction."
 eir_hostile_envoys_modifier:0 "Rattled Kings"
 eir_hostile_envoys_modifier_desc:0 "You threatened them with the Norse. They have not forgotten who said it."
 eir_humble_service_modifier:0 "Willing to Serve"
 eir_humble_service_modifier_desc:0 "You offered to stand beneath a stronger king, and the poets will not forget."
 eir_black_host_broken_modifier:0 "Breaker of the Black Host"
 eir_black_host_broken_modifier_desc:0 "You met the greatest Norse fleet in a generation and sent it home in pieces."
 eir_norse_bane_oath_modifier:0 "Oath of the Norse-Bane"
 eir_norse_bane_oath_modifier_desc:0 "You swore on the strand that no raider would land and live to boast of it."
 eir_longphort_burner_modifier:0 "Longphort-Burner"
 eir_longphort_burner_modifier_desc:0 "You burned the camp on the river, and the Norse have a long memory too."
 eir_longphort_peace_modifier:0 "Peace of the Longphort"
 eir_longphort_peace_modifier_desc:0 "The Norse pay the harbour dues, and your kings grumble about the foreigners on the strand."
 eir_yoke_broken_modifier:0 "The Yoke Broken"
 eir_yoke_broken_modifier_desc:0 "You owed the Norse nothing in the end, and the kingdom knows it."
 eir_norse_fleet_modifier:0 "Norse Fleet in Your Pay"
 eir_norse_fleet_modifier_desc:0 "Forty Norse ships fly your banner, and the Irish Sea is a little smaller."
 eir_norse_kin_modifier:0 "Norse Kinsman"
 eir_norse_kin_modifier_desc:0 "A Norse-Gael of your household speaks for you in the harbour towns."
 eir_norse_spoils_modifier:0 "Norse Spoils"
 eir_norse_spoils_modifier_desc:0 "Silver, slaves and good swords, taken from the dead on the strand."
 eir_norse_steel_modifier:0 "Pattern-Welded Steel"
 eir_norse_steel_modifier_desc:0 "Your smiths have learned a Norse trick, and the swords flex like green branches."
 eir_hostage_peace_modifier:0 "Hostages in Your Hall"
 eir_hostage_peace_modifier_desc:0 "Their children eat at your table, so their fathers behave."
 eir_hunting_hounds_modifier:0 "Wolfhounds of the Gael"
 eir_hunting_hounds_modifier_desc:0 "Three of them, each taller than a pony, and each as brave as a knight."
 eir_kin_defended_modifier:0 "Defender of Kin"
 eir_kin_defended_modifier_desc:0 "A cousin in need came to you, and you took his part."
 eir_poet_slighted_modifier:0 "Poet Slighted"
 eir_poet_slighted_modifier_desc:0 "You put a poet in the byre, and he has a long memory and a good rhyme for your name."
 eir_dun_well_modifier:0 "A Deep Well"
 eir_dun_well_modifier_desc:0 "The well in the dún has never failed, and the garrison sleeps easier for it."
 eir_ancestors_blessing_modifier:0 "Blessing of the Ancestors"
 eir_ancestors_blessing_modifier_desc:0 "A place was set for the dead at the table, and the living slept well."
 eir_samhain_modifier:0 "Samhain Night"
 eir_samhain_modifier_desc:0 "Stories, bonfires and a good deal of ale on the last night of the year."
 eir_clan_oath_modifier:0 "Sworn Clan"
 eir_clan_oath_modifier_desc:0 "The kindred swore on the sword, and the oath still holds."
 eir_clan_war_law_modifier:0 "Law of the Warband"
 eir_clan_war_law_modifier_desc:0 "The war-leaders wrote down their customs, and the army is steadier for it."
 eir_defensive_compact_modifier:0 "Defensive Compact"
 eir_defensive_compact_modifier_desc:0 "The kings of Ireland swore on six saints' relics to stand together against the foreigner."
 eir_royal_stud_modifier:0 "The Royal Stud"
 eir_royal_stud_modifier_desc:0 "Small grey horses that run all day, and the grooms who love them."
 eir_kinship_law_modifier:0 "Law of Kinship"
 eir_kinship_law_modifier_desc:0 "A man is his kindred, and the law now says so in writing."
 eir_pedigree_proclaimed_modifier:0 "Pedigree Proclaimed"
 eir_pedigree_proclaimed_modifier_desc:0 "Twelve generations in perfect order, read aloud in your own hall."
 eir_welsh_ties_modifier:0 "Welsh Ties"
 eir_welsh_ties_modifier_desc:0 "A Welsh prince eats at your table and sends you his best poems."
 eir_welsh_tongue_modifier:0 "Speaker of Welsh"
 eir_welsh_tongue_modifier_desc:0 "Your children have learned the tongue of the Britons, and are quietly insufferable about it."
 eir_welsh_resentment_modifier:0 "Welsh Resentment"
 eir_welsh_resentment_modifier_desc:0 "You made them speak your language, and they remember."
 eir_insular_song_modifier:0 "Song of the Island"
 eir_insular_song_modifier_desc:0 "Poets of three peoples sing one song about you, in three accents."
 eir_book_of_conquests_modifier:0 "The Book of Conquests"
 eir_book_of_conquests_modifier_desc:0 "Your line is traced back to Míl Espáine, and the poets are still arguing about the dates."
 eir_conqueror_crowned_modifier:0 "Acclaimed in the Cathedral"
 eir_conqueror_crowned_modifier_desc:0 "A foreign city sang the Te Deum for you."
 eir_insular_union_modifier:0 "The Insular Union"
 eir_insular_union_modifier_desc:0 "Gael, Briton and Pict have sworn a union, and every one of them knows how fragile it is."
 eir_island_crown_modifier:0 "The Island Crown"
 eir_island_crown_modifier_desc:0 "A crown of plain gold with three stones: green for Ireland, red for Britain, blue for the sea."
 eir_sea_road_modifier:0 "The Sea-Road to Alba"
 eir_sea_road_modifier_desc:0 "A day's sailing from Antrim to Kintyre, with a quay at each end."

 # ---------- county modifiers ----------
 eir_tara_hill_modifier:0 "Hill of Tara"
 eir_tara_hill_modifier_desc:0 "The seat of the High Kings draws pilgrims and petitioners alike."
 eir_cashel_rock_modifier:0 "Rock of Cashel"
 eir_cashel_rock_modifier_desc:0 "A fortress and a cathedral on a single limestone crag."
 eir_armagh_see_modifier:0 "Primatial See of Armagh"
 eir_armagh_see_modifier_desc:0 "The seat of Saint Patrick, and the Church's pride in Ireland."
 eir_monastic_city_modifier:0 "Monastic City"
 eir_monastic_city_modifier_desc:0 "A great monastery has grown into a city of scholars, scribes and traders."
 eir_dublin_reclaimed_modifier:0 "Dublin Reclaimed"
 eir_dublin_reclaimed_modifier_desc:0 "The Norse longphort is Irish again, and the harbour is busy."
 eir_norse_garrison_modifier:0 "Norse Garrison"
 eir_norse_garrison_modifier_desc:0 "Foreign soldiers sit in the hall, and the locals do not love them."
 eir_raided_county_modifier:0 "Viking-Raided"
 eir_raided_county_modifier_desc:0 "Longships came, and the fires burned for days."
 eir_high_cross_modifier:0 "High Crosses"
 eir_high_cross_modifier_desc:0 "Carved stone crosses watch over the roads and the market."
 eir_cattle_raided_modifier:0 "Cattle Raided"
 eir_cattle_raided_modifier_desc:0 "Raiders have driven off the herds. The county's wealth walked away."
 eir_oenach_ground_modifier:0 "Site of the Óenach"
 eir_oenach_ground_modifier_desc:0 "The great assembly was held here, and the county profits from the memory."
 eir_famine_modifier:0 "Bad Harvest"
 eir_famine_modifier_desc:0 "The fields failed, and the people are hungry."
 eir_holy_well_modifier:0 "Holy Well"
 eir_holy_well_modifier_desc:0 "A well said to heal the sick draws visitors from far away."
 eir_sidhe_blessing_modifier:0 "Sídhe-Blessed"
 eir_sidhe_blessing_modifier_desc:0 "The fields here are green, and the people say the good folk are to thank."
 eir_sidhe_curse_modifier:0 "Sídhe-Cursed"
 eir_sidhe_curse_modifier_desc:0 "Ill luck clings to this land since the mound was disturbed."
 eir_peat_wealth_modifier:0 "Peat Wealth"
 eir_peat_wealth_modifier_desc:0 "The bogs give fuel, and now and then something older."
 eir_gallowglass_garrison_modifier:0 "Gallowglass Garrison"
 eir_gallowglass_garrison_modifier_desc:0 "Hard Hebridean axemen guard this land."
 eir_tailteann_county_modifier:0 "Tailtiu Fair"
 eir_tailteann_county_modifier_desc:0 "The old funeral games are held here, and the whole county profits."
 eir_glendalough_modifier:0 "Valley of Two Lakes"
 eir_glendalough_modifier_desc:0 "Pilgrims follow Saint Kevin's footsteps to a remote monastic valley."
 eir_ringfort_country_modifier:0 "Ringfort Country"
 eir_ringfort_country_modifier_desc:0 "Ringforts dot the hills, and every farm has a refuge within reach."
 eir_foreign_lords_county_modifier:0 "Foreign Lords"
 eir_foreign_lords_county_modifier_desc:0 "Strangers rule here, and speak no Irish."
 eir_loyal_county_modifier:0 "Grateful County"
 eir_loyal_county_modifier_desc:0 "The people remember who fed them in the hungry year."
 eir_punitive_levy_modifier:0 "Punitive Levy"
 eir_punitive_levy_modifier_desc:0 "The king took grain from hungry people, and they have not forgotten."
 eir_native_resistance_modifier:0 "Irish Resistance"
 eir_native_resistance_modifier_desc:0 "The Gael have never loved a foreign lord, and they remember every wrong."
 eir_native_resistance_lite_modifier:0 "Celtic Resistance"
 eir_native_resistance_lite_modifier_desc:0 "The old tongue is spoken in secret here, and the old stories are not forgotten."
 eir_pacified_modifier:0 "Pacified"
 eir_pacified_modifier_desc:0 "A hard-won peace holds here, for now."
 eir_ogham_stones_modifier:0 "Ogham Stones"
 eir_ogham_stones_modifier_desc:0 "Old stones carved with letters of strokes mark the boundaries of the old kindreds."
 eir_gaelic_schooling_modifier:0 "Gaelic Schooling"
 eir_gaelic_schooling_modifier_desc:0 "Children are taught to read, write and recite in the old tongue."
 eir_salmon_fisheries_modifier:0 "Salmon Fisheries"
 eir_salmon_fisheries_modifier_desc:0 "The weirs fill each autumn."
 eir_hurling_fields_modifier:0 "Hurling Fields"
 eir_hurling_fields_modifier_desc:0 "Whole parishes play against one another, and are friends after."
 eir_tara_hall_modifier:0 "Rebuilt Hall of Tara"
 eir_tara_hall_modifier_desc:0 "The great hall stands again on the hill of the kings."
 eir_uisneach_modifier:0 "Hill of Uisneach"
 eir_uisneach_modifier_desc:0 "The navel of Ireland, where the fires were lit at Beltane."
 eir_newgrange_modifier:0 "Newgrange"
 eir_newgrange_modifier_desc:0 "A passage tomb older than the pyramids, lit by the midwinter sun."
 eir_rathcroghan_modifier:0 "Rathcroghan"
 eir_rathcroghan_modifier_desc:0 "The ancient ritual centre of Connacht."
 eir_navan_fort_modifier:0 "Emain Macha"
 eir_navan_fort_modifier_desc:0 "The old capital of the Ulaid, ditch and mound."
 eir_dunadd_modifier:0 "Dunadd"
 eir_dunadd_modifier_desc:0 "The rock-fort where the kings of Dál Riata were crowned."
 eir_kildare_flame_modifier:0 "Flame of Kildare"
 eir_kildare_flame_modifier_desc:0 "The nuns of Brigid keep the fire burning."
 eir_monasterboice_modifier:0 "Monasterboice"
 eir_monasterboice_modifier_desc:0 "A monastery of high crosses and a pilgrim's road."
 eir_armagh_library_modifier:0 "Armagh's Library"
 eir_armagh_library_modifier_desc:0 "Scholars from across Europe come to read in Armagh."
 eir_wooden_harbour_modifier:0 "Wooden Harbours"
 eir_wooden_harbour_modifier_desc:0 "Quays of oak timber, and trading ships at anchor."
 eir_monastery_county_modifier:0 "A New Monastery"
 eir_monastery_county_modifier_desc:0 "A monastery has been founded here, and pilgrims already come."
 eir_relic_procession_county_modifier:0 "Relic Passed Through"
 eir_relic_procession_county_modifier_desc:0 "A relic was carried through the county."
 eir_circuit_visit_modifier:0 "Visited by the King"
 eir_circuit_visit_modifier_desc:0 "The king came here, ate here, and slept here."
 eir_bog_butter_modifier:0 "Bog Butter"
 eir_bog_butter_modifier_desc:0 "Butter buried in the bog in wooden kegs for a hungry winter."
 eir_coast_watch_county_modifier:0 "Coastal Watchtowers"
 eir_coast_watch_county_modifier_desc:0 "Beacons and watchmen guard the shore."
 eir_cattle_rich_county_modifier:0 "Bó-aire Country"
 eir_cattle_rich_county_modifier_desc:0 "The cow-freemen of this county keep large herds and larger grudges."
 eir_hedge_schools_modifier:0 "Hedge Schools"
 eir_hedge_schools_modifier_desc:0 "Under hawthorn hedges, in the open air, children learn the old tongue from wandering masters."
 eir_cultural_resentment_modifier:0 "Cultural Resentment"
 eir_cultural_resentment_modifier_desc:0 "The people here watch their neighbours' language and customs change by royal decree, and they do not like it."
 eir_saxon_moot_modifier:0 "A Moot of Their Own"
 eir_saxon_moot_modifier_desc:0 "The thanes meet under their own oak by the king's leave, and are calmer for it."
 eir_rebel_march_modifier:0 "Burned Marches"
 eir_rebel_march_modifier_desc:0 "A revolt left the fields blackened and the beacons cold."
 eir_settlers_county_modifier:0 "Longship Settlers"
 eir_settlers_county_modifier_desc:0 "Norse families have begun farming here. The fields are better, and the neighbours are wary."
 eir_hospice_modifier:0 "Hospice of Brigid"
 eir_hospice_modifier_desc:0 "The nuns of Brigid tend the sick here, and the poor come from far away."
 eir_murrain_modifier:0 "Murrain in the Herds"
 eir_murrain_modifier_desc:0 "The cattle sicken, die and rot in the byre."
 eir_cattle_drive_modifier:0 "The Great Drive"
 eir_cattle_drive_modifier_desc:0 "The herds went to market together and came back with silver."
 eir_booley_county_modifier:0 "Booleying"
 eir_booley_county_modifier_desc:0 "The herds follow the grass up the mountains each summer, and the dairies prosper."
 eir_tin_market_modifier:0 "Cornish Tin Market"
 eir_tin_market_modifier_desc:0 "Tin from Cornwall is traded here under your seal."
 eir_exile_quarter_modifier:0 "Breton Quarter"
 eir_exile_quarter_modifier_desc:0 "Breton craftsmen and priests settled here and brought new customs."
 eir_college_county_modifier:0 "College of Bangor"
 eir_college_county_modifier_desc:0 "Students from three kingdoms crowd the town."
 eir_chartered_town_modifier:0 "Chartered Port"
 eir_chartered_town_modifier_desc:0 "A grant of liberties made a market out of a fishing village."
 eir_beacon_county_modifier:0 "Beacon Headland"
 eir_beacon_county_modifier_desc:0 "A stack of tarred wood on the headland, and a watcher who is paid to look at the sea."
 eir_bounds_beaten_modifier:0 "Bounds Beaten"
 eir_bounds_beaten_modifier_desc:0 "Every stone on the boundary has been named, and every boy knows where the ditch is."
 eir_bridgehead_modifier:0 "A Foothold on the Coast"
 eir_bridgehead_modifier_desc:0 "A palisade, a harbour and a party of men with orders to dig in."
 eir_cairn_county_modifier:0 "Cairn of the Fallen"
 eir_cairn_county_modifier_desc:0 "A hill of stones raised by the families of the dead."
 eir_first_dun_modifier:0 "The First Dún"
 eir_first_dun_modifier_desc:0 "A great bank and ditch round a timber hall, built by every pair of hands in the district."
 eir_gaelic_settlers_modifier:0 "Gaelic Settlers"
 eir_gaelic_settlers_modifier_desc:0 "Three hundred families from the crowded septs of Ireland have taken up land, and the neighbours are watching."
 eir_norse_bane_country_modifier:0 "Norse-Bane Country"
 eir_norse_bane_country_modifier_desc:0 "The coast where the Black Host died, and where nobody will sleep soundly again."
 eir_ogham_boundary_modifier:0 "Ogham Boundary"
 eir_ogham_boundary_modifier_desc:0 "Carved stones at the corners, and an inscription that nobody can argue with."
 eir_ostmen_quarter_modifier:0 "Ostmen Quarter"
 eir_ostmen_quarter_modifier_desc:0 "A district of Norse-Gaelic merchants with their own market, their own saints and their own accent."
 eir_redeemed_county_modifier:0 "Redeemed Families"
 eir_redeemed_county_modifier_desc:0 "Freed captives have settled here, and give thanks for it every Sunday."
 eir_roman_road_modifier:0 "The Old Roman Road"
 eir_roman_road_modifier_desc:0 "Four hundred years old, still straight, and still the best road in the county."
 eir_samhain_county_modifier:0 "Samhain Bonfires"
 eir_samhain_county_modifier_desc:0 "Every hill is alight on the last night of October, and nobody has gone home early."
 eir_scorched_earth_modifier:0 "Scorched Earth"
 eir_scorched_earth_modifier_desc:0 "The crops are burned, the wells are fouled and nothing remains for an invader to eat."
 eir_triumph_county_modifier:0 "A Triumph Remembered"
 eir_triumph_county_modifier_desc:0 "The Gaelic host marched through the gate, and the town has not quite got over it."
 eir_walled_town_modifier:0 "Walled Town"
 eir_walled_town_modifier_desc:0 "A bank, a gate, a church and a market: the first Irish town built by the Irish."

 # ---------- province modifiers ----------
 eir_ringfort_province_modifier:0 "Ringfort"
 eir_ringfort_province_modifier_desc:0 "An earthen ringfort on the hill."
 eir_crannog_province_modifier:0 "Crannóg"
 eir_crannog_province_modifier_desc:0 "A fortified island in the lake, reachable only by boat or hidden causeway."
 eir_round_tower_province_modifier:0 "Round Tower"
 eir_round_tower_province_modifier_desc:0 "A tall belfry that doubles as a refuge when raiders come."
 eir_beacon_province_modifier:0 "Warning Beacon"
 eir_beacon_province_modifier_desc:0 "A beacon on the headland warns of ships on the horizon."
 eir_standing_stone_province_modifier:0 "Standing Stone"
 eir_standing_stone_province_modifier_desc:0 "An old standing stone draws small offerings and curious travellers."

 # ---------- dynasty / house modifiers ----------
 eir_house_high_kings_modifier:0 "House of the High Kings"
 eir_house_high_kings_modifier_desc:0 "Your house gave Ireland a high king."
 eir_house_kinslayers_modifier:0 "House of Kinslayers"
 eir_house_kinslayers_modifier_desc:0 "Your house took a crown by killing kin, and the island remembers."
 eir_house_poets_modifier:0 "House of Poets"
 eir_house_poets_modifier_desc:0 "Your house is known for its bards and scholars."
 eir_house_exiles_modifier:0 "House of Exiles"
 eir_house_exiles_modifier_desc:0 "Your house lost a kingdom, and its sons wander foreign courts."
 eir_house_norse_bane_modifier:0 "House of the Norse-Bane"
 eir_house_norse_bane_modifier_desc:0 "Your house swore the oath on the strand, and your descendants say it as grace before meals."

 # ---------- artifact modifiers ----------
 eir_book_of_kells_modifier:0 "Illuminated Gospel"
 eir_book_of_kells_modifier_desc:0 "A gospel book of astonishing beauty."
 eir_ardagh_chalice_modifier:0 "Silver Chalice"
 eir_ardagh_chalice_modifier_desc:0 "A chalice of silver and gold, blessed by many bishops."
