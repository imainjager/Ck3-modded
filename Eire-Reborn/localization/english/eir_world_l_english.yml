 eir_cross_of_cong_modifier_desc:0 "A reliquary cross of oak and bronze, carried to bless the high kings."
 eir_caladbolg_modifier:0 "Hero's Sword"
 eir_caladbolg_modifier_desc:0 "A sword that the bards say belonged to a hero of the Red Branch."
