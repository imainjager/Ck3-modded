 # ---------- culture traditions ----------
 tradition_eir_tanistic_fragmentation_name:0 "Tanistic Fragmentation"
 tradition_eir_tanistic_fragmentation_desc:0 "In Ireland a kingdom was a man, not a throne. When the king died his realm fell apart, and the next strong claimant had to put it together again. Rulers of this culture lose their highest title on death (duchy or above), but their warbands are fierce and their pride is great."
 tradition_eir_high_kingship_name:0 "Stable High Kingship"
 tradition_eir_high_kingship_desc:0 "The Irish have finally learned to keep a throne after the king who holds it is dead. The high kingship passes to the heir intact, and the lords of Ireland have grown used to bowing to it."
 tradition_eir_bardic_schools_name:0 "Bardic Schools"
 tradition_eir_bardic_schools_desc:0 "Poets train for years in the schools of the Filí, learning genealogy, law and satire. A king without a poet is a king who will be forgotten, or mocked."
 tradition_eir_brehon_law_name:0 "Brehon Law"
 tradition_eir_brehon_law_desc:0 "Disputes are settled by learned judges according to laws older than the Church, with honour-prices for every crime and kin responsible for kin."
 tradition_eir_fosterage_bonds_name:0 "Bonds of Fosterage"
 tradition_eir_fosterage_bonds_desc:0 "Noble children are raised in other lords' halls, and the bond between foster-brothers is sometimes stronger than blood."
 tradition_eir_cattle_wealth_name:0 "Cattle Wealth"
 tradition_eir_cattle_wealth_desc:0 "A man's worth is counted in cows. Cattle are wealth, tribute, dowry and the cause of half the island's wars."
 tradition_eir_gallowglass_heritage_name:0 "Gallowglass Heritage"
 tradition_eir_gallowglass_heritage_desc:0 "Irish lords hire the hard axemen of the Hebrides and the Isles to serve as the core of their armies, and in time the warriors settle."
 tradition_eir_fianna_heritage_name:0 "Fianna Heritage"
 tradition_eir_fianna_heritage_desc:0 "The tales of Fionn mac Cumhaill and his band of hunter-warriors shape how young nobles fight. A warband that lives by the hunt is hard to catch and hard to beat."
 tradition_eir_culdee_christianity_name:0 "Celtic Christianity"
 tradition_eir_culdee_christianity_desc:0 "Irish monasteries, scriptoria and wandering saints give the Christianity of this culture a flavour all its own."
 tradition_eir_sea_kings_name:0 "Kings of the Irish Sea"
 tradition_eir_sea_kings_desc:0 "The Irish Sea belongs to everyone who dares sail it, and Irish kings have decided it is time to dare."

