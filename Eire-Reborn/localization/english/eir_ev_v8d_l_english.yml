l_english:
 eir.0530.t:0 "A Wandering Poet Asks for a Bed"
 eir.0530.desc:0 "#bold A poet with a small harp and a large reputation has knocked at your door in the rain.#!\n\nHe says he has composed for kings and been thrown out of three halls for it. He says he has a verse about you already, which he will not recite until he has eaten. Hospitality is a law, not a courtesy, and the Irish do not refuse a poet a bed.\n\nHe is also, you suspect, a spy for the king next door."
 eir.0530.a:0 "Feed him, house him and let him sing."
 eir.0530.b:0 "Feed him, and ask for news of the other halls."
 eir.0530.c:0 "Let him sleep in the byre."
 eir.0530.d:0 "Challenge him to a verse-contest for his supper."
 eir.0531.t:0 "The Sacred Yew"
 eir.0531.desc:0 "#bold A monk has felled the old yew by the crossroads, and the farmers have laid down their tools.#!\n\nIt was older than the church, older than the hill-fort and, some say, older than the language. The monk says it was a pagan idol. The farmers say it was a tree. Nobody can agree on which of them is right, but everybody can agree that the monk has an axe and the farmers have scythes."
 eir.0531.a:0 "Defend the monk, and reprimand the farmers."
 eir.0531.b:0 "Plant a new yew beside the church, and bless it."
 eir.0531.c:0 "Fine the monk, and return the wood to the farmers."
 eir.0531.d:0 "Make the farmers carve a cross from the stump."
 eir.0532.t:0 "A Quarrelsome Neighbour"
 eir.0532.desc:0 "#bold The chieftain next door has built a fence across the cattle-track that has been used since before either of your fathers.#!\n\nHe says it's his land. You say it's the track. The cattle, who have a view, are standing at the fence and lowing in two voices. His men are on one side with spears. Yours are on the other with spears. Someone is going to have to say something."
 eir.0532.a:0 "Pull down the fence and dare him to rebuild it."
 eir.0532.b:0 "Offer to share the track and split the toll."
 eir.0532.c:0 "Take the dispute to a brehon."
 eir.0532.d:0 "Pay him off, and move the cattle round."
 eir.0533.t:0 "The Wolf Pack"
 eir.0533.desc:0 "#bold Wolves have taken three calves from the byre, and the herdsmen are afraid to go out at dusk.#!\n\nThey come down from the bog in winter, silent and thin. The herdsmen say there are nine of them, led by a grey bitch with one ear. The old women say she is a woman in wolf-shape, and that you must give her a calf a year, or she will take a child. Your huntsmen say that is ridiculous, and they are not going near the bog."
 eir.0533.a:0 "Lead the hunt yourself."
 eir.0533.b:0 "Offer the old women a calf and wait."
 eir.0533.c:0 "Set a bounty on every wolf-skin."
 eir.0533.d:0 "Let the herdsmen deal with it."
 eir.0534.t:0 "A Foster-Child Arrives"
 eir.0534.desc:0 "#bold A small boy, with his belongings in a satchel, has been left at your gate by a neighbouring chief.#!\n\nHe is seven years old and very quiet. His father has sent no letter, only a cow, a cloak and a message that he is to be raised as one of your own. In Ireland, this is a great honour and a great responsibility. In a decade, the boy will be the man who decides whether your neighbour is your friend."
 eir.0534.a:0 "Raise him as your own son."
 eir.0534.b:0 "Hand him to your best warrior to be trained."
 eir.0534.c:0 "Send him to the monastery for his letters."
 eir.0534.d:0 "Send him home with a polite refusal."
 eir.0535.t:0 "The Lughnasa Games"
 eir.0535.desc:0 "#bold The harvest festival has come, and the young men want to wrestle for a prize.#!\n\nIt is the oldest of the summer festivals. The hill is cleared, the stalls are put up, the horses are paraded and the hurling teams take the field. The prize is a bull-calf, a gold arm-ring and the right to say, for a year, that your family is the best on the hill. Your cousin has entered. So has your steward. So, loudly, has your wife."
 eir.0535.a:0 "Compete yourself."
 eir.0535.b:0 "Preside from the high seat and hand out the prizes."
 eir.0535.c:0 "Bet heavily on your cousin."
 eir.0535.d:0 "Ban the games for the sake of the harvest."
 eir.0536.t:0 "The Bog Body"
 eir.0536.desc:0 "#bold A turf-cutter has found a man in the bog, whole, with his hair in a knot and a rope round his neck.#!\n\nHe is very old. The turf-cutter thinks he is a sacrifice, or a king, or a criminal. The priest says he must be buried properly. The farmers say he should be put back, because they do not like to disturb a man who was put there for a reason. The man's face is peaceful."
 eir.0536.a:0 "Have him buried in the churchyard with full rites."
 eir.0536.b:0 "Put him back in the bog, with a prayer."
 eir.0536.c:0 "Display him in the hall, as a wonder."
 eir.0536.d:0 "Ask the poets who he might have been."
 eir.0537.t:0 "The Brigand Band"
 eir.0537.desc:0 "#bold A band of masterless men has taken up residence in the forest, and the traders are going round.#!\n\nThere are about thirty of them, and half of them are somebody's younger son. They live by taking from whoever passes, and they have a rough code: no killing, no women, no churches. They have sent you a polite message, asking whether you would like to hire them."
 eir.0537.a:0 "Hire them as your own warband."
 eir.0537.b:0 "Ride out and clear the forest."
 eir.0537.c:0 "Pardon them in return for a year's service."
 eir.0537.d:0 "Pay them to go bother the next kingdom."
 eir.0538.t:0 "A Monk Asks for Land"
 eir.0538.desc:0 "#bold A holy man with a bundle and a bell has asked for a hilltop to build a church.#!\n\nHe says the saint told him to look for a green hill with a spring, and he thinks yours is it. He is eighty, and has founded four churches already. He promises no trouble. His disciples promise a great deal of trouble, none of it for you."
 eir.0538.a:0 "Give him the hill and a grant of grain."
 eir.0538.b:0 "Give him the hill, but not the grain."
 eir.0538.c:0 "Give him a worse hill, and keep the good one for the dún."
 eir.0538.d:0 "Refuse. The land is already spoken for."
 eir.0539.t:0 "The Poor Harvest"
 eir.0539.desc:0 "#bold The grain has failed in three fields, and the herds are thin.#!\n\nIt is a hungry spring. The stored oats are low, the first lambs are weak and the milk is poor. Three families have been seen on the road with their goods in carts. The old people say the summer was too wet. The young people say the old people always say that."
 eir.0539.a:0 "Open the granary and feed the hungry."
 eir.0539.b:0 "Buy grain from the next kingdom."
 eir.0539.c:0 "Move the herds to the hill pastures early."
 eir.0539.d:0 "Do nothing. The poor always survive."
 eir.0540.t:0 "The Bride's Price"
 eir.0540.desc:0 "#bold A neighbouring chief has offered his daughter to your son, and named a price in cattle.#!\n\nThe old law fixes the bride-price by rank and by the girl's accomplishments. She is a harper, a rider and a hard bargainer, which the chief mentions with a mix of pride and apprehension. He has asked for forty cows. You were hoping for twenty. The negotiation will go on until midnight."
 eir.0540.a:0 "Pay what he asks and call it an honour."
 eir.0540.b:0 "Bargain him down to thirty."
 eir.0540.c:0 "Offer your own horse and a poem instead."
 eir.0540.d:0 "Withdraw. The match was never a good one."
 eir.0541.t:0 "A Travelling Smith"
 eir.0541.desc:0 "#bold A wandering smith has set up his anvil by your gate, and the children are watching.#!\n\nHe has a brass-bound hammer, a stack of charcoal and a patter that would sell a sword to a swan. He says he can mend a ploughshare, forge a spear or make a brooch that will keep off the evil eye. Your own smith is looking uneasy."
 eir.0541.a:0 "Commission a good spear for the household guard."
 eir.0541.b:0 "Hire him to teach your smith his tricks."
 eir.0541.c:0 "Buy the evil-eye brooch."
 eir.0541.d:0 "Send him on. Your smith is quite enough."
 eir.0542.t:0 "The Dún's Well Runs Dry"
 eir.0542.desc:0 "#bold The well at the heart of the dún has gone dry in the drought, and the women are carrying water from the river.#!\n\nIt was dug in your grandfather's day and never failed. The old people say the spring is angry about something. The young people say it is the weather. The priest says the saint of the well has been offended. You say you would like some water."
 eir.0542.a:0 "Dig deeper, and pay the diggers well."
 eir.0542.b:0 "Offer a ribbon and a prayer to the saint of the well."
 eir.0542.c:0 "Move the household to the river for the summer."
 eir.0542.d:0 "Ask the Welsh monk who is visiting to dowse for a new spring."
 eir.0543.t:0 "A Hostage Tests the Gate"
 eir.0543.desc:0 "#bold The child you hold hostage has been seen walking the walls at night, counting the guards.#!\n\nHe is ten. He is very patient. He has noticed the changing of the watch, the weak stretch of the palisade and the way the dogs are fed. He has not tried to escape. He is simply, thoughtfully, storing it all up for when he goes home to his father."
 eir.0543.a:0 "Tell him you know, and ask what he thinks of the defences."
 eir.0543.b:0 "Move him to a better-guarded place."
 eir.0543.c:0 "Let him see only what you want him to see."
 eir.0543.d:0 "Praise the boy to his father, and send him home early."
 eir.0544.t:0 "The Oath of the Clan"
 eir.0544.desc:0 "#bold Your kinsmen have gathered in the dún to swear to you, and they are not all pleased about it.#!\n\nFour generations of the family, from a white-haired great-uncle to a toddler on his mother's hip. They stand in a ring on the hill and one by one they touch the sword and say the words: loyal to the head of the kindred, until death or exile. Some mean it. Some are already looking at their neighbours to see who is looking."
 eir.0544.a:0 "Accept each oath with a gift."
 eir.0544.b:0 "Take hostages from the doubtful, and trust the rest."
 eir.0544.c:0 "Make the oath a feast, and the feast a legend."
 eir.0544.d:0 "Add a verse to the oath that binds the kindred to defend the church."
 eir.0545.t:0 "The Samhain Feast"
 eir.0545.desc:0 "#bold On the last night of October, the veil is thin, the fires are lit and every house in the hall is full.#!\n\nIt is the oldest of the festivals: the end of the summer and the beginning of the winter, the night when the dead come back to be fed. The monks call it All Hallows. The farmers call it Samhain. The children call it the night they are allowed to stay up. The ghost-stories begin at midnight."
 eir.0545.a:0 "Preside over the feast, and tell the oldest story yourself."
 eir.0545.b:0 "Light the bonfire on the hill, and lead the procession."
 eir.0545.c:0 "Set a place at the table for the ancestors."
 eir.0545.d:0 "Keep it a church feast only: mass, then bed."
 eir.0546.t:0 "Beating the Bounds"
 eir.0546.desc:0 "#bold The whole community walks the boundary of your lands, carrying staves and singing.#!\n\nEvery landmark is named: the ash by the ford, the stone with the notches, the pool where the salmon leap. The boys are pushed over a ditch to remember where it is. The old men dispute a boundary-mark that moved three years ago. The priest is blessing the corners. It takes all day."
 eir.0546.a:0 "Lead the walk yourself, from the first stone to the last."
 eir.0546.b:0 "Let your steward do it, and arrive for the feast."
 eir.0546.c:0 "Place a new ogham pillar at each corner."
 eir.0546.d:0 "Carry the relics round the bounds, and bless the land."
 eir.0547.t:0 "Land for the Saint"
 eir.0547.desc:0 "#bold A saint's disciple has come to claim the land you gave, and he is already marking out a church.#!\n\nHe is young and thin and impossibly cheerful. He has three disciples, a goat and a bell. He says the saint appeared to him on the way here and told him exactly where the altar should go. The spot he has chosen is in the middle of your best field. He asks you very politely to move the field."
 eir.0547.a:0 "Move the field."
 eir.0547.b:0 "Suggest an alternative spot, with a spring."
 eir.0547.c:0 "Offer a share of the harvest in exchange for the field."
 eir.0547.d:0 "Ask the disciple to build the church somewhere else entirely."
 eir.0548.t:0 "A Pact with a Neighbouring Sept"
 eir.0548.desc:0 "#bold The chief of the next valley has come to seal a pact of friendship, and he has brought his best horse.#!\n\nYou have been quarrelling about the same hill for a generation. His grandfather and yours fought a battle over it. Now both of you have grown tired. He has brought a horse, a poet and a very good wine. He says the horse is a gift and the poet is a witness and the wine is for drinking."
 eir.0548.a:0 "Swear the pact on the relics and exchange fosterlings."
 eir.0548.b:0 "Swear the pact and have the poet record it."
 eir.0548.c:0 "Accept the horse and promise nothing."
 eir.0548.d:0 "Swear it, then plan to break it when you are stronger."
 eir.0549.t:0 "The First Dún"
 eir.0549.desc:0 "#bold The great bank is rising round the new hall, and every farmer within ten miles has come to carry earth.#!\n\nIt is the traditional way. A dún is a community's work, not a lord's. The bank grows by baskets: a thousand baskets a day, carried by every man, woman and child. The timber hall rises on the high ground. The ditch fills with rainwater. When it is finished, nobody will be able to say who built it, and everybody will say they did."
 eir.0549.a:0 "Work alongside them with a basket."
 eir.0549.b:0 "Pay the workers in cattle, and have the poets sing as they dig."
 eir.0549.c:0 "Add a second bank and a palisade."
 eir.0549.d:0 "Bury a hoard under the gatepost for luck."
 eir.0550.t:0 "The Beacon Chain Is Lit"
 eir.0550.desc:0 "#bold On a still night, the first beacon fire flares on the northern headland, and the next answers it, and the next.#!\n\nIt is a test. The coast has been strung with fire-baskets for forty miles. The watchers have been drilled in the order: a smoke for a single ship, a fire for ten, three fires for a fleet. The first beacon is lit, and the second takes it up, and the third. In seven minutes, the whole coast is bright, and the monks on the hill are watching, bemused."
 eir.0550.a:0 "Congratulate the watchers, and double the pay."
 eir.0550.b:0 "Use the beacons for the shipping trade as well."
 eir.0550.c:0 "Add watchtowers at every second beacon."
 eir.0550.d:0 "Ask the monks to bless the fires."
 eir.0551.t:0 "The Defensive Compact"
 eir.0551.desc:0 "#bold The kings of Ireland have sealed a compact against the foreigner, and each has brought his hostage.#!\n\nIt is not an alliance, not exactly. It is a promise that if the Norse land in one kingdom, the others will send men, and that no king will make a separate peace. The oath is sworn on the relics of six saints. The hostages sit at the end of the table, looking pale. The poets are writing down the names, because the poets do not trust anybody to remember."
 eir.0551.a:0 "Take the chair, and lead the compact."
 eir.0551.b:0 "Offer the chair to the oldest king, and sit beside him."
 eir.0551.c:0 "Add a clause for shared spoils."
 eir.0551.d:0 "Have the bishops add a curse for oath-breakers."
 eir.0552.t:0 "The Norse Fleet Sails Under Your Banner"
 eir.0552.desc:0 "#bold Forty Norse ships have hoisted your flag, and their captain has asked what you want burned.#!\n\nHe is a Norse-Gael, a man with two names and no particular loyalty. His crews are the best sailors on the coast and the worst guests. They have been paid in silver, in advance, and in promises, later. He has asked you for a target. He has asked it in the tone of a man hoping you will name a rich one."
 eir.0552.a:0 "Send them against your enemy's coast."
 eir.0552.b:0 "Station them off your own coast as a screen."
 eir.0552.c:0 "Keep a close hold on their captain's family."
 eir.0552.d:0 "Pay them off and send them away. They are not worth the trouble."
 eir.0553.t:0 "The Redemption of the Captives"
 eir.0553.desc:0 "#bold A long line of freed prisoners walks up the road to your hall, thin and blinking.#!\n\nThey were taken in the last raid and held in the Norse slave pens. You paid for them, every one, in silver and in cattle. They are mostly women and children, with a few monks. They have never seen an Irish hall from the front before. The youngest is clinging to a monk's sleeve. Her face is blank."
 eir.0553.a:0 "Feed them and shelter them as guests of the house."
 eir.0553.b:0 "Give them land in the settlements near your coast."
 eir.0553.c:0 "Have the monks teach them letters and send them out as missionaries."
 eir.0553.d:0 "Ask them for what they learned in the pens."
 eir.0554.t:0 "The Yoke Is Broken"
 eir.0554.desc:0 "#bold The last Norse tax-collector has gone home, and the bells rang for an hour.#!\n\nYou owed them nothing, in the end. The tribute was a bluff, the hostages were a pretext, and the garrison was a fraction of what they claimed. What kept you paying was fear. What ended it was a single afternoon on a hillside when an Irish army stood and did not run. The tax-collector took his ledger and his guards and left, and the crowd did not even jeer."
 eir.0554.a:0 "Take the name the people are shouting."
 eir.0554.b:0 "Hold a feast for every man who stood on the hill."
 eir.0554.c:0 "Burn the ledgers and scatter the ashes."
 eir.0554.d:0 "Offer the Norse a trade treaty. They are not all enemies."
 eir.0555.t:0 "The Longphort Burns"
 eir.0555.desc:0 "#bold Smoke rises from the Norse camp on the river, and the riverbank is lined with cheering men.#!\n\nIt took six weeks and a good many small boats. You came at night, from three directions, and the first the Norse knew of it was a fire in the ship-sheds. They fought well, in the dark. They did not fight well enough. The longphort, which was supposed to stand for a hundred years, burned in a single night."
 eir.0555.a:0 "Take the ships, and burn the rest."
 eir.0555.b:0 "Take the ships and the surviving Norse as hostages."
 eir.0555.c:0 "Bless the ruins, and build a church on the site."
 eir.0555.d:0 "Offer the survivors a place in your army."
 eir.0556.t:0 "The Ostmen Become Gaels"
 eir.0556.desc:0 "#bold A Norse-Gael village has held its first Irish assembly, and the speeches were in the old tongue.#!\n\nIt took a generation. The grandfathers spoke Norse, the fathers spoke both, and the children speak Irish with a faint accent that the Irish find charming and the Norse find hilarious. The village headman has taken an Irish name and kept his sword. He says he is a Gael now. He says it a little too loudly."
 eir.0556.v1:0 "#bold A Norse-Gael village has held its first Irish assembly, and the speeches were in the old tongue.#!\n\nIt took a generation, and the generation was yours. The Norse-Gael boys you fostered in your own hall are the village elders now, and they remember whose table they ate at. The headman has taken an Irish name and kept his sword, and he stands a little straighter when your banner passes."
 eir.0556.a:0 "Receive their oaths in the hall, as you would any Gael's."
 eir.0556.b:0 "Take their sons for fosterage, to seal it."
 eir.0556.c:0 "Have the poets compose a verse for the new Gaels."
 eir.0556.d:0 "Keep a close watch. A Norse Gael is still a Norse."
 eir.0557.t:0 "The Oath of the Norse-Bane"
 eir.0557.desc:0 "#bold On the strand where the Black Host fell, you stand before the cairn and swear an oath.#!\n\nThe tide is out. The bones of the burned ships stick up from the sand like a ribcage. The cairn at the top of the beach has a stone for every man who stood. You have a drawn sword, a relic of Colmcille and a vow to make. The vow is simple: that no raider will land on this coast and live to boast of it. The wind takes the words away."
 eir.0557.a:0 "Swear the oath for yourself and your heirs."
 eir.0557.b:0 "Swear it on the relic, and add a vow of hospitality to the monks."
 eir.0557.c:0 "Swear it quietly, and let the deed speak."
 eir.0557.d:0 "Have the poets sing the oath, and every king hear it."
 eir.0558.t:0 "The Walled Town"
 eir.0558.desc:0 "#bold A walled town rises where the longphort stood, and it has a market, a church and a gate.#!\n\nIt is the first walled town in Ireland that was not built by foreigners. The walls are earth and timber, with a stone gatehouse and a harbour boom. A bishop has blessed the cornerstone. A merchant from Chester has taken a stall. The poet who is composing the dedication has been told not to mention the Norse. He has composed it anyway."
 eir.0558.a:0 "Charter the town with its own laws and its own market."
 eir.0558.b:0 "Fill it with a royal garrison."
 eir.0558.c:0 "Invite the Norse merchants to settle, under Irish law."
 eir.0558.d:0 "Name it for a saint, and dedicate the first church to her."
 eir.0559.t:0 "The Cairn of the Fallen"
 eir.0559.desc:0 "#bold Every family that lost a son in the war has brought a stone, and the cairn has grown to the height of a man.#!\n\nThe names are cut into a flat slab at the foot, in ogham and in Latin. There are three hundred and eleven. The mothers walk up one at a time and lay their stones without speaking. A harper plays a single note and holds it. The wind off the sea takes it up the hill and over the crest, and the whole mourning crowd turns to listen."
 eir.0559.a:0 "Place the last stone yourself, with the name of your own dead."
 eir.0559.b:0 "Endow a chantry to pray for them forever."
 eir.0559.c:0 "Pay a pension to every widow."
 eir.0559.d:0 "Make the cairn a rallying place for the next war."
 eir.0560.t:0 "The Victory Song"
 eir.0560.desc:0 "#bold The poets of five provinces have gathered to sing the song of the war, and they have agreed on almost nothing.#!\n\nOne says the battle was won at the ford. Another says it was won on the hill. A third says it was won in a dream, and a fourth says it was won on the strand by a single man with a stick. They have been arguing since noon. A harper has played the same chord eighteen times to get their attention."
 eir.0560.a:0 "Let the best poet compose it, and the others witness."
 eir.0560.b:0 "Have it composed in four versions, one for each province."
 eir.0560.c:0 "Insist that your own deeds take the centre of the song."
 eir.0560.d:0 "Ask them to sing it without any names, so all may claim it."
 eir.0561.t:0 "The Genealogy Is Read"
 eir.0561.desc:0 "#bold The chief poet unrolls the new genealogy of your house, and the hall goes very quiet.#!\n\nIt is a beautiful work, with twelve generations in perfect order, a descent from a high king of the seventh century, and an unusually good claim to a kingdom you do not currently hold. The poet has been paid well. The poet has also, in several places, improved the facts. Whether anybody will notice depends on how many other poets are in the room."
 eir.0561.a:0 "Accept it and put it on display."
 eir.0561.b:0 "Have the monks check the dates and correct the worst of it."
 eir.0561.c:0 "Show it only to your friends."
 eir.0561.d:0 "Stake a claim on it before a rival's poets do the same."
 eir.0562.t:0 "Hostages from the Rival"
 eir.0562.desc:0 "#bold A rival king's sons have been brought to your hall, and they refuse to speak to you.#!\n\nThey are fourteen and twelve. They have been told that this is an honour, and that it is temporary, and that their father will be back with an army in a year. They have been told many things. They sit in the corner with their arms folded and watch your servants carry in the food. The younger one is clearly hoping you will make a mistake."
 eir.0562.a:0 "Treat them as guests of honour."
 eir.0562.b:0 "Keep them in a tower, and keep the key."
 eir.0562.c:0 "Foster them with your own children."
 eir.0562.d:0 "Return the elder to his father as a sign of goodwill."
 eir.0563.t:0 "The Judgement of the King"
 eir.0563.desc:0 "#bold Two septs have laid their quarrel before you, and the brehons are waiting to hear your reasoning.#!\n\nIt is a very old right: the high king hears the quarrels the lesser kings cannot settle. The case is a hill, a well, a boundary-stone and a woman who is married to the sons of both. The brehons have taken their seats on either side of you and are watching you closely. A king who gets this wrong is never forgotten."
 eir.0563.a:0 "Cite the law, case by case, and make the judgement binding."
 eir.0563.b:0 "Split the difference and send them home friends."
 eir.0563.c:0 "Take a fee from both sides and judge for the higher bidder."
 eir.0563.d:0 "Hand the case to the Church."
 eir.0564.t:0 "The Blood Feud Ends"
 eir.0564.desc:0 "#bold The two families have sat down at one table for the first time in forty years.#!\n\nIt began over a cow. By the time anyone remembered what, there were seventeen graves. The matriarchs of both houses have come to the hall and said, very quietly, that they would like it to stop. Nobody has argued. The two heads of house are shaking hands over a bowl of milk and honey, and they are not looking at each other."
 eir.0564.a:0 "Pay the eric yourself, to both houses."
 eir.0564.b:0 "Seal it with a marriage and a fosterage."
 eir.0564.c:0 "Have the poets compose the peace."
 eir.0564.d:0 "Swear the peace on the relics and fine the first to break it."
 eir.0565.t:0 "The Royal Stud"
 eir.0565.desc:0 "#bold The first foals of the royal stud are on their feet, and the grooms are looking at them with the expression of men who know what they have.#!\n\nIrish hobbies are small and fast and as sure-footed as goats. The best of them have been bred for centuries on the hill pastures of Meath and Munster. You have bought a stallion from a famous line, mares from three provinces and the full-time services of a man who talks to horses. The foals are small, grey and ridiculous. They will be magnificent."
 eir.0565.a:0 "Keep the best for your own household."
 eir.0565.b:0 "Give a foal to each vassal who rode with you."
 eir.0565.c:0 "Sell the surplus to the English at a great price."
 eir.0565.d:0 "Race them at the next Aonach and let the prizes decide."
 eir.0566.t:0 "The Law of Kinship"
 eir.0566.desc:0 "#bold The elders of the clan have met under the old oak to write down the law of kin, and they have taken three days to agree on the first line.#!\n\nIt has been carried by memory for a thousand years. Who is a kinsman, who owes what, who pays for a death, who inherits a debt: the poets know, the brehons know, and the old women know, and none of them agree. The kinsmen have gathered in a ring. The scribe is sharpening his quills. The first line is: 'A man is his kindred.'"
 eir.0566.a:0 "Proclaim the law, with the king's seal on the first page."
 eir.0566.b:0 "Leave the law as an oral tradition, and bless the memory."
 eir.0566.c:0 "Add a clause that protects the fostered."
 eir.0566.d:0 "Add a clause that lets the strongest branch lead the clan."
 eir.0567.t:0 "The Law of the Sword and the Clan"
 eir.0567.desc:0 "#bold The war-leaders of the clans have met in the great hall to write the law of the warband, and nobody is armed.#!\n\nIt is the oldest document in Gaelic Scotland, and it has never been written down. How a clan raises its men. How a war-leader earns his place. How booty is divided. What happens to the man who runs. The captains sit in a circle on the floor. The scribe has been warned that if he changes a word he will be fed to the dogs."
 eir.0567.a:0 "Write the law as the captains dictate."
 eir.0567.b:0 "Add a clause for the protection of non-combatants and churches."
 eir.0567.c:0 "Add a clause that gives the king a fifth of all spoil."
 eir.0567.d:0 "Burn the first draft and write it again from memory."
