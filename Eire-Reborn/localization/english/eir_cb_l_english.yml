l_english:

 # ---------- casus belli ----------
 eir_cattle_raid_cb:0 "Cattle Raid"
 eir_cattle_raid_cb_desc:0 "A raid on the herds of a neighbouring county: a few weeks of driving, burning and boasting, and the cattle go home with the raider. No land changes hands."
 EIR_CATTLE_RAID_CB_NAME:0 "Cattle Raid on [DEFENDER.GetPrimaryTitle.GetNameNoTier]"
 EIR_CATTLE_RAID_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Cattle Raid on [TITLE.GetBaseNameNoTier]"
 EIR_CATTLE_RAID_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 eir_cattle_raid_cb_victory_desc_attacker:0 "You drive off the herds of the target [county|E]: gold in proportion to its wealth, and a strike at its development."
 eir_cattle_raid_cb_victory_desc:0 "[attacker.GetShortUIName|U] drives off the herds of the target [county|E]."
 eir_cattle_raid_cb_white_peace_desc:0 "The raid is called off. The herds stay where they are, and the poets make jokes."
 eir_cattle_raid_cb_defeat_desc:0 "The raiders are caught on the way home and beaten. You lose [prestige|E] and pay for the cattle you tried to take."
 eir_cattle_raid_cb_invalidated_desc:0 "The [war.GetName] has ended: [defender.GetShortUIName] no longer [Select_CString( defender.IsLocalPlayer, 'control', 'controls' )] the County."
 eir_cain_demand_cb:0 "Demand the Cáin"
 eir_cain_demand_cb_desc:0 "A king who is strong enough can demand the cáin: a yearly tribute in cattle and silver from the lords nearby who do not answer to him. The lords can refuse, once."
 EIR_CAIN_DEMAND_CB_NAME:0 "Demand the Cáin of [DEFENDER.GetShortUIName]"
 EIR_CAIN_DEMAND_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Demand of the Cáin from [DEFENDER.GetPrimaryTitle.GetName]"
 EIR_CAIN_DEMAND_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 eir_cain_demand_cb_victory_desc_attacker:0 "[defender.GetShortUIName|U] must pay a tribute in gold now and owes the cáin for ten years (a hook on the defender and a modifier on both)."
 eir_cain_demand_cb_victory_desc:0 "[attacker.GetShortUIName|U] imposes the cáin on [defender.GetShortUIName|U]."
 eir_cain_demand_cb_white_peace_desc:0 "The demand is dropped. [defender.GetShortUIName|U] pays nothing."
 eir_cain_demand_cb_defeat_desc:0 "The demand is refused and the army beaten. You lose [prestige|E] and pay compensation."
 eir_cain_demand_cb_invalidated_desc:0 "The [war.GetName] has ended: [defender.GetShortUIName] is no longer a neighbouring ruler."
 eir_tanist_claim_cb:0 "Claim of the Kindred"
 eir_tanist_claim_cb_desc:0 "A claim to the land of a kinsman: under the old law the heir is the best man of the royal kindred, and any member of it may press his right by the sword if the king will not recognise it."
 EIR_TANIST_CLAIM_CB_NAME:0 "Claim of the Kindred on [TITLE.GetBaseNameNoTier]"
 EIR_TANIST_CLAIM_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Claim of the Kindred on [TITLE.GetBaseName]"
 EIR_TANIST_CLAIM_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 eir_tanist_claim_cb_victory_desc_attacker:0 "You gain the contested [titles|E] from your kinsman."
 eir_tanist_claim_cb_victory_desc:0 "[attacker.GetShortUIName|U] gains the contested [title|E] from [defender.GetShortUIName|U]."
 eir_tanist_claim_cb_white_peace_desc:0 "[defender.GetShortUIName|U] keeps the contested [title|E]. The kindred is not reconciled."
 eir_tanist_claim_cb_defeat_desc:0 "[defender.GetShortUIName|U] keeps the contested [title|E]. The kindred remembers who lost."
 eir_tanist_claim_cb_invalidated_desc:0 "The [war.GetName] has ended: [defender.GetShortUIName] no longer [Select_CString( defender.IsLocalPlayer, 'control', 'controls' )] the County."
