l_english:
 eir.0610.t:0 "The English King Marches North"
 eir.0610.desc:0 "#bold [eir_conqueror.GetShortUIName] has sent a herald across the border: Scotland is to be an English shire, and its language an English one.#!\n\nThe herald is polite and exact. He reads the king's letter in two languages and a third, for the monks. The English have taken York and Chester; the old Northumbrian earldom is theirs; the Danes of the Danelaw have been shouldered aside. The king has a new idea, which is that the island should have one law, one tongue and one crown, and that it should be his. He has nine thousand men on the road already, and he would prefer, with all courtesy, that you did not make him use them."
 eir.0610.a:0 "Send the herald home with a refusal and call out every vassal."
 eir.0610.b:0 "Receive the herald at the high table and try to talk the king out of it."
 eir.0610.c:0 "Pay the king's price: a great tribute, and a bended knee in writing."
 eir.0610.d:0 "Send to every Gaelic and Brittonic king for men and promises."
 eir.0610.e:0 "Raid his border towns before his host is ready."
 eir.0611.t:0 "The English Host Breaks"
 eir.0611.desc:0 "#bold The great English army has been broken on Scottish ground, and the king's writ now stops at the Tweed.#!\n\nThey were very sure of themselves. They had not expected the Gaelic army to hold the ford, and they had not expected the Gaelic cavalry to come round by the hill. By nightfall the English standard was in the mud and the clerks were running for the border with their parchment under their arms. In Winchester the chroniclers are using the word 'unfortunate'. In Scotland the poets are using a different word."
 eir.0611.a:0 "Take the name the army is shouting."
 eir.0611.b:0 "Ransom the captured English lords for a king's price."
 eir.0611.c:0 "Free the counties, and feed them from the English baggage-train."
 eir.0611.d:0 "Commission the poets and have the sword hung in your hall."
 eir.0612.t:0 "Scotland Is Made English"
 eir.0612.desc:0 "#bold The English have won the war, and they are making a shire of Scotland, one county at a time.#!\n\nIt does not look like a conquest. That is the cleverest part. The writs arrive in English, and the sheriffs pay for what they take, and the new thane at the old hall is polite. But the meadows are overgrazed by the baggage-train's cattle, the monasteries have been taxed, the mills have been burned for fuel, and the new English priests say the Mass in a way that makes the old women flinch. A third of the people are being taught to answer in English, and the rest have noticed which third."
 eir.0612.a:0 "Swear to rebuild every burned mill, and hold to it."
 eir.0612.b:0 "Take to the hills and swear vengeance on the English crown."
 eir.0612.c:0 "Send the people and the relics west to the islands."
 eir.0612.d:0 "Beg the English king for mercy."
 eir.0613.t:0 "The English Reeves at Your Border"
 eir.0613.desc:0 "#bold The English host is in your kingdom, and its reeves are already posting writs in English.#!\n\nThey come with clerks. That is the strange thing about this army: it marches with scribes, who draw up the boundaries of the new shires as it goes. The farmers of the border counties have been told that their lord is now the king of England, and that they will pay their tithe to a bishop they have never heard of. A few of them have started to believe it."
 eir.0613.a:0 "Burn the harvest in front of the host."
 eir.0613.b:0 "Hire a company of mercenaries from the Isles."
 eir.0613.c:0 "Carry the relics to the front and bless the army."
 eir.0613.d:0 "Offer single combat to their marshal."
 eir.0620.t:0 "The Sea-King's Great Fleet"
 eir.0620.desc:0 "#bold [eir_conqueror.GetShortUIName], the greatest sea-king of the age, has sworn to take Ireland, and a hundred and fifty ships are on the horizon.#!\n\nThey were seen first by a shepherd, and then by the monks, and then by every beacon on the east coast. The king is not a man who raids: he is a man who rules the sea, and who has decided to rule the land beside it. He has the Orkneys and the Isles, the Danes of the Danelaw send him ships, and he has a way with a shield wall that the poets will not enjoy describing. A boat has come ashore under a white shield. He offers terms. They are not good terms."
 eir.0620.a:0 "Send the herald away with an Irish refusal, and call out the hosting."
 eir.0620.b:0 "Meet the herald at the harbour and try to bargain."
 eir.0620.c:0 "Pay the king's tribute: silver by the shipload and a hostage."
 eir.0620.d:0 "Send to every Gaelic king for the old defensive compact."
 eir.0620.e:0 "Burn his anchorage at night before the fleet can gather."
 eir.0621.t:0 "The Sea-King Falls"
 eir.0621.desc:0 "#bold The greatest Norse fleet in a generation has been broken on the strand, and the sea-king's banner is in the sand.#!\n\nIt was the worst day of his life. He had never lost a battle on land, and he lost this one in an afternoon, because the Irish waited for the tide, and because someone had cut the cables on half his ships. The king left by the last boat, with a wound in his shoulder. The poets are saying that the sea gave him back to the Gael. The Norse are saying nothing, and burying their dead."
 eir.0621.a:0 "Take the name the host has given you."
 eir.0621.b:0 "Hold the king's heir for ransom."
 eir.0621.c:0 "Divide the plunder among the clans and the monasteries."
 eir.0621.d:0 "Commission the poets, and hang the axe in your hall."
 eir.0622.t:0 "The Norse Take the Coast"
 eir.0622.desc:0 "#bold The sea-king has won the war, and the coast of Ireland is his from the Liffey to the Shannon.#!\n\nThe kings who did not come to your aid are making their peace with him. The monasteries are paying a ransom, and the churches are being taxed. The longphorts are rising where the abbeys stood. In the evenings the Norse sit in the ruins of the cloister and sing in their own tongue, and the monks who stayed behind take down the words. The harvest is thin. The cattle are thin. A third of the coast has been signed over to Norse thanes with Irish wives."
 eir.0622.a:0 "Swear to rebuild the burned churches and hold to it."
 eir.0622.b:0 "Take to the bogs and swear vengeance on the sea-king."
 eir.0622.c:0 "Send the books and the relics west to the islands."
 eir.0622.d:0 "Beg the sea-king for terms."
 eir.0623.t:0 "The Longphorts of the Sea-King"
 eir.0623.desc:0 "#bold The Norse have fortified the beach, and the sea-king himself has set up his tent.#!\n\nThey did it in a week. The ships were drawn up on the sand in a ring and a stockade rose in front of them. There is a hall of turf and timber, a smithy and a market, and a great flag with a raven on it. The king is said to be sitting in it with his jarls, eating beef and drinking Irish ale. The local farmers are selling him cattle. They are not being altruistic: they are afraid."
 eir.0623.a:0 "Burn the fields between the longphort and the hills."
 eir.0623.b:0 "Hire a company of gallowglass out of the Isles."
 eir.0623.c:0 "March the relics and the monks round the stockade at dawn."
 eir.0623.d:0 "Challenge the sea-king's best axeman to single combat."
 eir.0630.t:0 "The King of the Old North Rides"
 eir.0630.desc:0 "#bold [eir_conqueror.GetShortUIName] has called out the Britons of the North and sworn to take back what the poems say was always theirs.#!\n\nThe Britons of the North have been losing for six hundred years, and they have had a great deal of time to compose their grievance. It is in the old poems: the lands from the Forth to the Humber were once the kingdom of the Old North, and they were taken from the Britons by the Angles, the Picts and the Gaels, in that order. The king has decided that the order should be reversed. He is not a fool. He has Cumbrians, Strathclyders and Welsh volunteers, and he is a hundred miles from the nearest English patrol."
 eir.0630.a:0 "Refuse, and call out the hosting of the Gael."
 eir.0630.b:0 "Receive the king's envoy as a cousin and try to reason."
 eir.0630.c:0 "Pay the king's price: a great tribute and a hostage."
 eir.0630.d:0 "Call every Gaelic and Brittonic king to a council of the island."
 eir.0630.e:0 "Strike his marches before his hosting can assemble."
 eir.0631.t:0 "The Old North Is Broken"
 eir.0631.desc:0 "#bold The Britons of the North have been beaten on the field, and their dream of a restored kingdom has died again.#!\n\nThe battle took place at an old Roman fort, which the king had chosen for the sentiment. He lost because the ground favoured the Gaelic spear, and because the Pictish levy would not fight. The king was carried from the field with his banner wrapped round him. The Britons are going home in small groups, singing the oldest of their laments. It is a sad song, and the Gaels are quiet as they listen to it."
 eir.0631.a:0 "Take the name the army gives you."
 eir.0631.b:0 "Take the king's heir as a hostage and a guest."
 eir.0631.c:0 "Free the glens and let the old speech be used in the churches."
 eir.0631.d:0 "Commission the poets, and take the dragon-sword for your hall."
 eir.0632.t:0 "The Old North Rises"
 eir.0632.desc:0 "#bold The Britons have won the war, and they are taking back their ancient lands one glen at a time.#!\n\nThey come with their crosses and their genealogies and a very good memory. The Gaelic place-names have been struck off the charters and the old British ones written in. The mills have been burned for fuel, the monasteries have been taxed, the herds have been driven south. A third of the people are being taught to answer in Brittonic, and the rest are not sure whether to laugh or weep. The kings of the Old North are crowned on the hill at last."
 eir.0632.a:0 "Swear to rebuild and hold to it."
 eir.0632.b:0 "Take to the hills and swear vengeance on the Britons."
 eir.0632.c:0 "Send the relics and the books west to the islands."
 eir.0632.d:0 "Beg the Briton king for terms."
 eir.0633.t:0 "The Old North Is Rising"
 eir.0633.desc:0 "#bold The Britons are in your kingdom, and the old Brittonic place-names are coming back on their lips.#!\n\nThey are being greeted as liberators in some of the glens. That is the worst thing about them: they are not entirely wrong. There are people in the Lowlands who still speak the old tongue at home, and who kept a stone with a Latin inscription for six hundred years. The king has been putting up crosses with the old British names carved on them. The poets of the North are composing their finest work in a generation."
 eir.0633.a:0 "Burn the harvest between the host and the hills."
 eir.0633.b:0 "Hire a company of Irish mercenaries."
 eir.0633.c:0 "Carry the relics to the front and bless the army."
 eir.0633.d:0 "Offer the Briton king single combat at the old ford."
 eir.0640.t:0 "The Earl of the Isles Sails"
 eir.0640.desc:0 "#bold [eir_conqueror.GetShortUIName], the Earl of the Isles, has gathered the longships of the Northern Isles and set course for your coast.#!\n\nHe is an earl, not a king, and he has made it a point of pride. He holds Orkney, Shetland, and a good part of Caithness, and he has spent forty years winning wars no one thought he could win. His longships have been seen off Skye and Mull. His skalds say he has been promised a kingdom by an ancestor in a dream. His men say it is a better dream than most."
 eir.0640.a:0 "Refuse the earl's terms and call out the hosting."
 eir.0640.b:0 "Meet the earl's envoy at a feast and try to talk him down."
 eir.0640.c:0 "Pay his tribute: silver by the chestful and a hostage."
 eir.0640.d:0 "Send to every Gaelic king for the defensive compact."
 eir.0640.e:0 "Burn his ships at anchor before the fleet is ready."
 eir.0641.t:0 "The Earl Is Broken"
 eir.0641.desc:0 "#bold The Earl of the Isles has been beaten on the Scottish shore and has gone back to his islands with half his fleet.#!\n\nHe was too sure. He thought the Gaels would not stand against the Norse, and they did. He thought the Isles would hold, and they did not, because half the galley-lords decided in the middle of the battle that the Scottish king was the better bet. The earl sailed away with a spear in his shoulder. The Norse do not like to lose. The Isles have made a note of this."
 eir.0641.a:0 "Take the name the host has given you."
 eir.0641.b:0 "Hold the earl's son for ransom."
 eir.0641.c:0 "Divide the plunder among the clans and the monasteries."
 eir.0641.d:0 "Commission the poets and hang the axe in your hall."
 eir.0642.t:0 "The Earl Takes the Coast"
 eir.0642.desc:0 "#bold The Earl of the Isles has won the war, and the western coast of the kingdom is his.#!\n\nThe galley-lords who stayed neutral are now very loud in their support. The earl's thanes sit in the old halls, the earl's skalds sing in the new ones, and the churches are being taxed for the privilege. The meadows are overgrazed by the baggage-train's cattle. The mills have been burned for fuel. A third of the coast has been signed over to Norse thanes with Gaelic wives, who say they have always been Norse."
 eir.0642.a:0 "Swear to rebuild and hold to it."
 eir.0642.b:0 "Take to the hills and swear vengeance on the earl."
 eir.0642.c:0 "Send the relics and the books west to the islands."
 eir.0642.d:0 "Beg the earl for terms."
 eir.0643.t:0 "The Earl in the Glens"
 eir.0643.desc:0 "#bold The earl's army has landed on the western shore, and the Isles are on his side.#!\n\nThe galley-lords of the Isles are the ones who make it dangerous. They are of Norse and Gaelic blood, and they change sides when it suits them. For the moment, it suits them to sail with the earl. They have brought three hundred ships and a great many axes. The glens are full of fires. The old men say they have not seen the sea so full of oars since their grandfathers' time."
 eir.0643.a:0 "Burn the glens between the shore and the hills."
 eir.0643.b:0 "Hire a company of gallowglass from the southern Isles."
 eir.0643.c:0 "March the relics and the monks to the front."
 eir.0643.d:0 "Challenge the earl's champion to a duel on the shore."
 eir.0650.t:0 "The King's Marshal Lands"
 eir.0650.desc:0 "#bold [eir_conqueror.GetShortUIName], the king's marshal, has crossed the sea with an army of knights to bring Ireland to heel.#!\n\nThey come with a charter and a grant of the whole island. They also come with armour and horses of a size no Irishman has seen, and with clerks who write down the names of the villages. The marshal has been given the right to everything he can hold, and he intends to hold it all. He has nine thousand men, a dozen siege engines on carts, and a Pope's blessing. He is not in the least discouraged by the weather."
 eir.0650.a:0 "Refuse the marshal's terms and call out the hosting."
 eir.0650.b:0 "Receive the marshal at the high table and try to bargain."
 eir.0650.c:0 "Pay the marshal's price: a great tribute and a hostage."
 eir.0650.d:0 "Call every Gaelic king to the old compact of the island."
 eir.0650.e:0 "Strike his camp before his horses are landed."
 eir.0651.t:0 "The Marshal's Host Falls"
 eir.0651.desc:0 "#bold The knightly army of England has been broken on Irish ground, and the marshal's banner is in the bog.#!\n\nThey learned what the Irish bog is for. The horses sank, the knights flailed, and the kern came out of the reeds with their javelins. By nightfall the marshal's army was a rabble, and the marshal himself was begging his captors to take his sword instead of his horse. The English crown will be asking questions. The Irish are laughing."
 eir.0651.a:0 "Take the name the host has given you."
 eir.0651.b:0 "Hold the marshal for a king's ransom."
 eir.0651.c:0 "Divide the plunder among the clans and the monasteries."
 eir.0651.d:0 "Commission the poets, and hang the sword in your hall."
 eir.0652.t:0 "The Marshal Takes the East"
 eir.0652.desc:0 "#bold The King's Marshal has won the war, and the castles of the English now stand across the east of the island.#!\n\nThey are being very thorough. Every castle comes with a charter, a bailiff and a court that sits in French. The Irish farmers pay rent to a lord they have never seen. The monasteries are paying a fine. The hall of the old king has been given to a knight, and the old king's hounds have been given to his hunting-dogs. The harvest is thin, the mills are burnt, and a third of the people are being taught to answer in English."
 eir.0652.a:0 "Swear to rebuild and hold to it."
 eir.0652.b:0 "Take to the bogs and swear vengeance on the English crown."
 eir.0652.c:0 "Send the relics and the books west to the islands."
 eir.0652.d:0 "Beg the marshal for terms."
 eir.0653.t:0 "The Marshal's Castles"
 eir.0653.desc:0 "#bold The marshal's knights are building castles of earth and timber on every ford.#!\n\nThey are very good at it. A mound, a ditch and a palisade can be raised in a week, and a keep of oak in a month. They call them motte and bailey. The Irish call them something else. Every ford in the east is guarded by one, and every one is held by a knight with a dozen men-at-arms and a horse bigger than his cow. The marshal has not lost a skirmish yet. He plans to keep it that way."
 eir.0653.a:0 "Burn the fields between the castles and the hills."
 eir.0653.b:0 "Hire a company of gallowglass."
 eir.0653.c:0 "Carry the relics to the front and bless the army."
 eir.0653.d:0 "Offer the marshal single combat before his castles."
