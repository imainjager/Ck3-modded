l_english:
 eir.0480.t:0 "A Saxon Thegn Kneels"
 eir.0480.desc:0 "#bold A thegn of the conquered county has come to your hall, unarmed, and asked to speak.#!\n\nHe is sixty, with a limp and a good hall and a daughter he is clearly worried about. He says the English of his county are tired of being fought over. He says that if the Gael will keep the law and protect the churches, he will answer for his neighbours. He asks nothing in return except that nobody burns the mill."
 eir.0480.a:0 "Accept his oath and let him keep his land."
 eir.0480.b:0 "Take his daughter as a hostage, and his oath too."
 eir.0480.c:0 "Tell him the Gael do not make oaths with their conquered."
 eir.0480.d:0 "Invite him to teach your poets the English law."
 eir.0481.t:0 "The Welsh Bard Comes to Court"
 eir.0481.desc:0 "#bold A bard out of Gwynedd has arrived with a harp, a satchel of manuscripts and a poem in three languages.#!\n\nHe says he has walked from Anglesey, and that he has heard there are Irish poets who can recite the Táin from memory. He would like to hear it. He would, in exchange, recite the whole of Taliesin. The two traditions have been separated by a sea and a thousand years. They seem to understand each other perfectly."
 eir.0481.a:0 "Host a night of poets, Irish and Welsh together."
 eir.0481.b:0 "Commission a poem that joins the two peoples."
 eir.0481.c:0 "Ask him to teach your children Welsh."
 eir.0481.d:0 "Pay him, thank him, and send him on."
 eir.0482.t:0 "The Tale of Arthur"
 eir.0482.desc:0 "#bold A British poet recites the story of a king who sleeps under a hill and will return when Britain needs him.#!\n\nThe poem is unfamiliar and also not. It has a king, a sword, a round table that is really a hall, and a betrayal on a field the poet will not name. He says it is a Welsh story, and a Cornish one, and a Breton one, and an English one, and that every people on the island will claim him.\n\nHe looks at you meaningfully."
 eir.0482.a:0 "Say that the king was a Gael on his mother's side."
 eir.0482.b:0 "Ask him to teach the poem to your own poets."
 eir.0482.c:0 "Commission a sword for the Gael to match the story."
 eir.0482.d:0 "Enjoy the story, and say nothing of your own."
 eir.0483.t:0 "The Cornish Tin Merchant"
 eir.0483.desc:0 "#bold A Cornish merchant has come with a cargo of tin and an unusual question.#!\n\nHe is not asking to sell tin. He is asking where he can buy hides, wool and wolfhound pups at a fair price, and he is prepared to pay in the same tin you would otherwise buy from the Franks. He is Cornish; he has no love for the Saxons. He has noticed that the Irish do not have one either."
 eir.0483.a:0 "Strike a trade agreement for the whole coast."
 eir.0483.b:0 "Give him a safe-conduct and a letter to the Welsh princes."
 eir.0483.c:0 "Charge a tin-toll at every Irish port."
 eir.0483.d:0 "Invest in a ship to Cornwall."
 eir.0484.t:0 "The Saint Crosses the Sea"
 eir.0484.desc:0 "#bold Monks from Saint David's have come with a gift: a fragment of the saint's staff, and a request.#!\n\nThey want a copy of the Irish Rule, a loan of the Irish scribes and an introduction to the abbot of Clonmacnoise. They offer the staff, a relic with a long history, and an admission, in a murmur, that the Irish monks are better scribes. Wales and Ireland have been exchanging saints since the days of Patrick, and nobody is counting."
 eir.0484.a:0 "Accept the staff and send them scribes."
 eir.0484.b:0 "Accept the staff and keep the scribes at home."
 eir.0484.c:0 "Offer a joint pilgrimage to Rome."
 eir.0484.d:0 "Thank them, and send them home with a fine book."
 eir.0485.t:0 "The English Bishop Refuses"
 eir.0485.desc:0 "#bold An English bishop has locked his cathedral to the Irish monks you sent.#!\n\nHe is not entirely unreasonable. The Irish monks keep their own Easter, wear their own tonsure and say Mass in a Latin the bishop describes as colourful. He does not want them preaching in his diocese. He has not, so far, said that he does not want you."
 eir.0485.a:0 "Appeal to the Archbishop and the Pope."
 eir.0485.b:0 "Have the monks adopt the Roman tonsure for the sake of peace."
 eir.0485.c:0 "Build your own church next door."
 eir.0485.d:0 "Take the cathedral by force and install your own abbot."
 eir.0486.t:0 "A British Prince in Exile"
 eir.0486.desc:0 "#bold A prince of the Britons has landed with thirty men and a carved gaming-board, asking for refuge.#!\n\nHis uncle took the hall and the herds. He took the board, the one thing no one could take from him: an ivory board his grandfather played on, and that grandfather's grandfather before him. He says it is the last thing in Britain that still belongs to the old kings. He would like a roof, a sword and the loan of an army."
 eir.0486.a:0 "Shelter him as a guest, and ask for nothing."
 eir.0486.b:0 "Shelter him, and press his claim through your own army."
 eir.0486.c:0 "Marry him to a daughter of your house."
 eir.0486.d:0 "Turn him away. It is not your quarrel."
 eir.0487.t:0 "The Pictish Stone"
 eir.0487.desc:0 "#bold A farmer has dug up a carved stone with a symbol no living man can read.#!\n\nIt shows a double disc and a Z-rod, a mirror and a comb, and a beast that might be a wolf or a salmon. The old men of the glen say the Picts put such stones up and nobody knows why. The Picts spoke a language that is not quite Welsh and not quite Irish. Nobody has written a word of it down."
 eir.0487.a:0 "Set up the stone in your hall, as a memorial."
 eir.0487.b:0 "Send the stone to the scholars at Armagh to decode."
 eir.0487.c:0 "Sell it to a passing Frankish collector."
 eir.0487.d:0 "Break it up for the road."
 eir.0488.t:0 "Hengist's Heirs"
 eir.0488.desc:0 "#bold An English thane in the conquered county has been quietly gathering his neighbours at night.#!\n\nThey meet in a barn and drink to the old kings of Wessex. They are not planning a revolt, exactly. They are planning a funeral for a dead tongue and the burial of a tradition. But funerals are dangerous. Funerals have crowds. Crowds have knives."
 eir.0488.a:0 "Attend the meeting in disguise."
 eir.0488.b:0 "Send a priest to preach at the funeral."
 eir.0488.c:0 "Seize the thane and make an example."
 eir.0488.d:0 "Invite the thane to your table and ask what he wants."
 eir.0489.t:0 "The Settlers' Ship"
 eir.0489.desc:0 "#bold A ship has come in from Antrim carrying forty families with their cattle, asking for land.#!\n\nThey are the younger sons and daughters of the Irish septs: the ones who will inherit nothing because they are third or fourth or tenth in line. They have heard that Britain is wide and the land is rich. They have not heard that Britain's farmers have views about this. They are brave, hungry and not terribly well informed."
 eir.0489.a:0 "Settle them in the conquered county as free tenants."
 eir.0489.b:0 "Settle them near the monasteries, to learn the language."
 eir.0489.c:0 "Charge them a rent and keep them under watch."
 eir.0489.d:0 "Send them home. Britain is not ready."
 eir.0490.t:0 "A Charter in Two Tongues"
 eir.0490.desc:0 "#bold A scribe has drawn up the first charter of your reign in Latin, Irish and the local English.#!\n\nIt is a good charter, short and clear. It is also, in the English version, about a third longer than the Irish, because the English scribe keeps adding clauses that protect the thanes. The Irish scribe is complaining. The Latin scribe has taken no side, which is how he has survived this long."
 eir.0490.a:0 "Seal the three versions as equal."
 eir.0490.b:0 "Seal only the Irish, and let the others follow."
 eir.0490.c:0 "Have the poets add a verse to the preamble."
 eir.0490.d:0 "Order the scribes to keep their quarrels to themselves."
 eir.0491.t:0 "The Wedding of Two Peoples"
 eir.0491.desc:0 "#bold A young Gael and a young Saxon girl have asked permission to be married in the same church.#!\n\nThey are the son of your steward and the daughter of the reeve of the conquered county. They met at the market. They have been told by everyone that it is impossible. They would like your permission, mainly to prove everyone wrong. The wedding will be conducted in Irish and English, in alternate verses."
 eir.0491.a:0 "Host the wedding in your own hall."
 eir.0491.b:0 "Give them a cottage and your blessing."
 eir.0491.c:0 "Forbid it. The peoples should stay apart."
 eir.0491.d:0 "Marry your own heir to the girl's sister."
 eir.0492.t:0 "The Pilgrim Road to St Davids"
 eir.0492.desc:0 "#bold A caravan of Irish pilgrims has gone to Saint David's and not come back.#!\n\nThere were sixty of them, with a monk and a guide. They left in April and they should have returned in June. A peddler says they were detained at a border. A fisherman says they were taken by Saxons. The monks of the pilgrimage say they should not have gone without an escort, and that they told you so."
 eir.0492.a:0 "Send an escort to find them."
 eir.0492.b:0 "Pray for them and write to the Welsh bishop."
 eir.0492.c:0 "Blame the Saxons and demand a blood-price."
 eir.0492.d:0 "Do nothing. They went at their own risk."
 eir.0493.t:0 "A Cumbrian Envoy"
 eir.0493.desc:0 "#bold An envoy of the Britons of the Clyde has arrived with an offer you did not expect.#!\n\nHis king sits on a rock above the river, with a hall of Welsh-speaking Britons and a coast full of Norse. He is not unfriendly. He wants an alliance, a joint stand against whoever comes next, and a shared poet. He is also asking, with careful politeness, whether you intend to take his kingdom."
 eir.0493.a:0 "Swear a pact of mutual defence."
 eir.0493.b:0 "Ask for a marriage instead."
 eir.0493.c:0 "Give an ambiguous answer and watch."
 eir.0493.d:0 "Tell him the Gael intend to take everything."
 eir.0494.t:0 "The Sea-Road to Alba"
 eir.0494.desc:0 "#bold A shipmaster says the sea between Antrim and Kintyre can be crossed in a day, if the right harbours are kept.#!\n\nThe crossing has been made for a thousand years by monks, raiders and cattle drovers, and no one has ever organised it. The shipmaster proposes two quays, a chain of beacons, a tax on every passenger and a licence for his friends. He has done the sums. They are quite good."
 eir.0494.a:0 "Back the scheme with silver and a royal charter."
 eir.0494.b:0 "Take a share of the tolls and nothing else."
 eir.0494.c:0 "Insist the monks run it as a charity."
 eir.0494.d:0 "Decline. The Norse would raid the quays."
 eir.0495.t:0 "The Hedge-School Master"
 eir.0495.desc:0 "#bold A weary old schoolmaster has come to the conquered county with a sack of books and a boy.#!\n\nHe teaches under hawthorns, in the open, because the Church does not pay him and the thane does not like him. His pupils learn the old tongue by repeating the same ten stories until they cry. He wants a roof for winter, a copy of the Táin and a promise that nobody will burn the hedge."
 eir.0495.a:0 "Build him a schoolhouse and pay his wage."
 eir.0495.b:0 "Give him a roof and let him teach as he likes."
 eir.0495.c:0 "Ask him to write down the local legends in both languages."
 eir.0495.d:0 "Send him on. The county is not ready for schools."
 eir.0496.t:0 "Names on the Land"
 eir.0496.desc:0 "#bold A surveyor has found three names for the same river: one Gaelic, one Welsh and one English.#!\n\nThe English call it the Lea, the Welsh call it Lug, and the Irish call it Lugh after the god. All three are correct and none is the original. The surveyor wants to know which to write on the map. The reeve wants to know what you plan to do about the English one."
 eir.0496.a:0 "Write all three, in order of age."
 eir.0496.b:0 "Write only the Irish."
 eir.0496.c:0 "Ask a local Welsh bard to decide."
 eir.0496.d:0 "Tell the surveyor to stop wasting your time."
 eir.0497.t:0 "A Saxon Poet Learns Irish"
 eir.0497.desc:0 "#bold A young English poet has begun writing verse in Irish, and the old women of the county are not sure whether to laugh or weep.#!\n\nHe is clumsy and charming and he is wrong about half the grammar. But he has heard the old songs and decided the English ones are worse. He has asked to join your poets. His father has asked you to stop him. The conquered county is watching to see which of you wins."
 eir.0497.a:0 "Take him as an apprentice and be proud of it."
 eir.0497.b:0 "Offer him a place at court and a good teacher."
 eir.0497.c:0 "Let his father have his way."
 eir.0497.d:0 "Make him write a poem about the conquest."
 eir.0498.t:0 "The Old Roman Road"
 eir.0498.desc:0 "#bold Your engineers have found the paving of a Roman road under the turf, and it runs straight toward the next kingdom.#!\n\nIt was built by men who thought the island would be theirs forever, and it has outlasted them by four hundred years. It would need only a little repair to carry a cart, a column of soldiers and a poet's circuit from one end of the county to the other. The Britons say it is theirs. The Saxons say it is theirs. The Irish say that a road is a road."
 eir.0498.a:0 "Repair it and put a toll-house at the end."
 eir.0498.b:0 "Repair it, and make it free to every pilgrim."
 eir.0498.c:0 "Tear it up for building stone."
 eir.0498.d:0 "March an army along it as a demonstration."
 eir.0499.t:0 "The Bishop's Choice"
 eir.0499.desc:0 "#bold The bishop of the conquered diocese must decide whether to say Mass in Latin, Irish or English.#!\n\nIt is a small thing, and it is not small. A priest who says Mass in Irish is a Gael. A priest who says it in English is an Englishman. A priest who says it in Latin is a bishop, and he wishes to remain one. He has asked you to choose, which is cowardly, and which you cannot decline."
 eir.0499.a:0 "Let the Mass be said in Latin, with a sermon in each tongue."
 eir.0499.b:0 "Insist the sermon be in Irish."
 eir.0499.c:0 "Let each parish choose."
 eir.0499.d:0 "Refuse to decide."
 eir.0500.t:0 "A Triumph in the Conquered Capital"
 eir.0500.desc:0 "#bold The Gaelic host marches through the gates of a captured city while the conquered watch.#!\n\nYou have not done this before, and neither has anyone else in Ireland. The old kings took cattle and went home. You have taken a city, and you intend to stay. The poets have composed three songs for the procession. The captured townsmen stand along the road, silent. Some are weeping. A few are, unwillingly, impressed."
 eir.0500.a:0 "Ride in on a white horse, crowned with gold."
 eir.0500.b:0 "Walk bareheaded behind the relics of the saints."
 eir.0500.c:0 "Feed the whole city at your own expense."
 eir.0500.d:0 "Let the poets sing it, and the city listen."
 eir.0500.e:0 "Make the captured lords kneel in the market-place."
 eir.0501.t:0 "The Victory Cairn"
 eir.0501.desc:0 "#bold Your soldiers are piling stones on a hill above the conquered town, each man bringing one.#!\n\nIt is the oldest custom there is: a cairn marks where a battle was won, and each man who fought adds a stone. In a hundred years the pile will be a hill, and no one will remember which stone was whose. The poets say that is the point."
 eir.0501.a:0 "Place the first stone yourself and speak the names of the fallen."
 eir.0501.b:0 "Carve an ogham inscription on the capstone."
 eir.0501.c:0 "Have the monks bless the stones and raise a cross."
 eir.0501.d:0 "Bury the enemy's captured banners under it."
 eir.0502.t:0 "The Colonists Arrive"
 eir.0502.desc:0 "#bold A long line of carts, cattle and children comes up the road to the conquered county.#!\n\nGaelic families, three hundred of them, led by a grey-bearded priest who has promised to say Mass for them in the open until there is a church. They have chosen their land by lot. They have been told that it will not be easy and that the natives will not welcome them. They have come anyway, because there is no land left at home."
 eir.0502.a:0 "Receive them yourself, and share the first meal."
 eir.0502.b:0 "Give them land taken from the unfriendly thanes."
 eir.0502.c:0 "Set them in a ring of new villages along the road."
 eir.0502.d:0 "Ask the priest to bless the land and the natives together."
 eir.0503.t:0 "The Colony Takes Root"
 eir.0503.desc:0 "#bold The children of the Gaelic settlers are playing with the local children, and the language of the game is Irish.#!\n\nIt took eight years. The first winter was hard, the second was lean, and the third was the year the English reeve's son married the settlers' daughter. Now there is a church with a bell, a market on Fridays and an alehouse where both languages are spoken and neither is spoken well. The county has changed, and nobody can say quite when."
 eir.0503.a:0 "Declare the county Gaelic in law and custom."
 eir.0503.b:0 "Let the two peoples keep their own customs, side by side."
 eir.0503.c:0 "Reward the settlers' priest with a church of his own."
 eir.0503.d:0 "Tax the colony more heavily. It can afford it."
 eir.0504.t:0 "The Feast of the Three Peoples"
 eir.0504.desc:0 "#bold Gaels, Britons and English have all been invited to the same hall, and for one night, none of them is armed.#!\n\nThe seating plan has taken four months. The cooks have been told which dishes may not be served next to which. The poets have been warned that no song may mention anyone's grandfather. The Welsh bard and the Irish harper have been given the same table. It will either be a triumph or a diplomatic incident."
 eir.0504.a:0 "Open with a toast to the old island, and all its people."
 eir.0504.b:0 "Let the poets sing in all three tongues."
 eir.0504.c:0 "Settle the three oldest quarrels at the table."
 eir.0504.d:0 "Keep the feast short, and the wine watered."
 eir.0505.t:0 "The Book of Conquests"
 eir.0505.desc:0 "#bold A poet reads the first chapter of a book that traces your line to the first Gaels who came out of Spain.#!\n\nIt starts with Míl Espáine and his eight sons, and passes through the Fir Bolg, the Tuatha Dé Danann and the Cruthin. It ends with you. It has taken three years and a good many genealogies were improved. The poet reads it in the long voice and does not look up. At the end, there is silence, and then the poets begin to argue about the dates."
 eir.0505.a:0 "Accept the book as the history of the Gael."
 eir.0505.b:0 "Insist on corrections from the monasteries."
 eir.0505.c:0 "Order a gilded copy made for each of your allies."
 eir.0505.d:0 "Keep it for yourself, and use it as a weapon of claim."
 eir.0506.t:0 "The Union Proclaimed"
 eir.0506.desc:0 "#bold The kings of the Gaels, Britons and Picts have met at a place that belongs to none of them.#!\n\nA flat green field in the Irish Sea, they say, if there were such a thing. In practice, it is a hall on the border of Man, loaned for the occasion. The hall is full of banners. The conversation is in three languages, the minutes are in Latin, and the oath is in all four. Everyone knows that this will not last. Everyone is swearing it anyway."
 eir.0506.a:0 "Proclaim the Union in your own name."
 eir.0506.b:0 "Proclaim it in the names of all the kings together."
 eir.0506.c:0 "Have the poets write the Union into the genealogies."
 eir.0506.d:0 "Bind each king with a different oath."
 eir.0507.t:0 "The Princes Answer"
 eir.0507.desc:0 "#bold The Welsh and Cornish princes have sent their replies to the Union, and they are not all friendly.#!\n\nGwynedd has sent a poem. Dyfed has sent a bishop. Cornwall has sent a bill for the tin tolls. The sons of the dead king of Strathclyde have sent nothing, which in their tradition means a great deal. The Union is a fine idea. It is also a request that three proud peoples forget their separate pasts, and that is not a small ask."
 eir.0507.a:0 "Answer each in kind: a poem, a bishop, a bill and a silence."
 eir.0507.b:0 "Offer each prince a hostage and a seat on the Union's council."
 eir.0507.c:0 "Warn the silent ones that silence is not neutrality."
 eir.0507.d:0 "Let the Union speak for itself."
 eir.0509.t:0 "The Island Crown"
 eir.0509.desc:0 "#bold A crown has been made for a kingdom that never existed, and today it is placed on your head.#!\n\nIt is plain gold, a circlet with three stones: green for Ireland, red for Britain, blue for the sea between. The goldsmith has been working on it for a year. The archbishops are present. The old kings of the Gaels and the Britons are present, in the form of their descendants. Nobody has ever been crowned King of the Island of the Mighty before, because there has never been such a kingdom."
 eir.0509.a:0 "Wear the crown, and the title that goes with it."
 eir.0509.b:0 "Refuse the crown for yourself, and place it on the Hill of Tara."
 eir.0509.c:0 "Split the stones among the three crowns that supported you."
 eir.0509.d:0 "Have the poets compose a new genealogy for the line."
 eir.0510.t:0 "The Bridgehead"
 eir.0510.desc:0 "#bold Your ships have landed at a quiet cove on the British coast, and nobody has noticed yet.#!\n\nForty men, a priest, two carpenters and a very nervous interpreter. They have beached on a shelf of shingle below a ruined Roman signal-tower, which will do very well for a fort. In three days they will have a palisade. In a month they will have a harbour. In a year, a war, if you want one."
 eir.0510.a:0 "Fortify it, and bring the army across."
 eir.0510.b:0 "Open negotiations with the local Britons."
 eir.0510.c:0 "Use it as a base for a swift raid."
 eir.0510.d:0 "Hold it quietly, and tell nobody."
 eir.0511.t:0 "The Foster-Sons of the Princes Arrive"
 eir.0511.desc:0 "#bold The sons of three British princes have been brought to your court, and they do not look happy.#!\n\nThey are ten, eleven and thirteen, and they have been told it is an honour. They are also very sure it is a punishment. Fosterage is how the Irish make peace, and how the Britons used to, before the Romans taught them to take hostages instead. The three boys are not sure which they are. You will be their guardian for the next ten years."
 eir.0511.a:0 "Raise them with your own children."
 eir.0511.b:0 "Educate them at the monastery, in Irish and Latin."
 eir.0511.c:0 "Train them as warriors, in the Irish way."
 eir.0511.d:0 "Keep them under close guard. They are hostages, whatever you call them."
 eir.0513.t:0 "The Raid on the Saxon Coast"
 eir.0513.desc:0 "#bold Your longboats have come back from the English coast with plunder, prisoners and a story.#!\n\nIt was a fine raid, the sort the old kings would have been proud of. Twelve boats, a night landing, a monastery taken without a fight, and three hundred head of cattle driven off before the dogs woke. The prisoners are mostly boys. The cattle are mostly lame. The story is enormous."
 eir.0513.a:0 "Divide the spoils among the raiders, and keep a share."
 eir.0513.b:0 "Free the prisoners and send them home with a gift."
 eir.0513.c:0 "Ransom the best of them to their families."
 eir.0513.d:0 "Give the plunder to the Church and keep only the glory."
 eir.0514.t:0 "Acclaimed in the Conquered Capital"
 eir.0514.desc:0 "#bold The bells of a foreign cathedral ring out in your name.#!\n\nIt was not planned. The bishop came out to the steps, saw the army, saw you and made a small, complicated decision. He began the Te Deum. The choir came in on cue. The people of the city, who had been wondering whether to rebel, found themselves singing along. It is not a coronation. It is something more useful."
 eir.0514.a:0 "Take the title offered by the city."
 eir.0514.b:0 "Thank the bishop and keep the Gaelic titles."
 eir.0514.c:0 "Have the poets turn the acclamation into a hundred verses."
 eir.0514.d:0 "Quietly note which of the city's lords did not sing."
 eir.0515.t:0 "The Sea-Road Opens"
 eir.0515.desc:0 "#bold The first ferry has crossed from Ulster to Galloway in a single day, with cattle and a bishop.#!\n\nThe captain wept when the quay came into view. He had been told it could not be done, and then told it could be done by a better captain. He is now, he says, the better captain. He has a letter in his sleeve for you, from the abbot of Whithorn, who says the boat was an answer to prayer."
 eir.0515.a:0 "Declare a pilgrim's holiday and open the quays to all."
 eir.0515.b:0 "Tax each crossing and use the money for the beacons."
 eir.0515.c:0 "Send the first army across, to prove the road works."
 eir.0515.d:0 "Name the captain Master of the Narrow Sea."
 eir.0516.t:0 "The Quarrel of the Tongues"
 eir.0516.desc:0 "#bold The Gaels and the Britons of the Union have started a quarrel about which language should be used in the council.#!\n\nIt began with a Welsh poet who corrected an Irish judge's grammar. It continued when the Irish judge corrected the poet's. By the end of the week there were three factions, a book of grievances and a seating chart that was drawn up twice. The Union is meant to be a marriage of equals. The language is the first thing to go wrong."
 eir.0516.a:0 "Declare that every speech be made in the speaker's own tongue, with an interpreter."
 eir.0516.b:0 "Make Latin the common speech, and let each add a verse in their own."
 eir.0516.c:0 "Insist on Irish, since it is the language of the Union's founder."
 eir.0516.d:0 "Hold a poetry contest and let the winner's language preside."
 eir.0517.t:0 "A Welsh Prince Pays Homage"
 eir.0517.desc:0 "#bold A prince of Dyfed has come to your hall in person, with his harper and his hounds, to swear the Union.#!\n\nHe is not young and he is not poor. He has no need of a protector. He says he has simply decided that the Welsh have been alone too long. His harper plays a march that none of your people knows, and the prince's hounds bay at your wolfhounds, who bay back with dignity."
 eir.0517.a:0 "Receive him as an equal and a friend."
 eir.0517.b:0 "Let him swear fealty on the relics."
 eir.0517.c:0 "Ask for his son as a foster-child."
 eir.0517.d:0 "Accept his homage, but ask him to leave the hounds outside."
 eir.0518.t:0 "The Cornish Tin Revolt"
 eir.0518.desc:0 "#bold The Cornish tinners have downed tools and refuse to pay the Union's duty.#!\n\nThey say the duty was a promise made by kings, not by the Cornish. They say the Union is a fine idea and that it does not require them to be poorer. Eight hundred men have walked out of the stannaries and are sitting on the hill with their arms folded. The price of tin is rising by the hour."
 eir.0518.a:0 "Cut the duty by half, and ask the Cornish to keep the peace."
 eir.0518.b:0 "Send in the Irish garrison to compel the tinners."
 eir.0518.c:0 "Meet the Cornish leaders in a stannary court."
 eir.0518.d:0 "Pay the tinners in Irish cattle until the duty is settled."
 eir.0519.t:0 "The Last Pictish Family"
 eir.0519.desc:0 "#bold In a high glen in the north, one family still sings a song that no one else understands.#!\n\nThe grandmother says it is a lullaby. The monk says it is a hymn. The traveller says it is a spell. It has no Gaelic words in it and no Welsh ones either. It is, as far as anyone can tell, the last live sentence in the language of a people who ruled the north for a thousand years. They are not asking for anything."
 eir.0519.a:0 "Send a monk with ink to write it down."
 eir.0519.b:0 "Invite the family to your hall and give them a patron's pension."
 eir.0519.c:0 "Leave them to the glen and its quiet."
 eir.0519.d:0 "Have them taught Irish for their own good."
 eir.0520.t:0 "The Council of the Insular Kings"
 eir.0520.desc:0 "#bold The kings of the Union have gathered for their annual council, and the agenda has a hundred items.#!\n\nThere is the question of Easter, which will not die. There is the question of the border, which has not been settled since the Romans. There is the question of the tin duty, the cattle duty and a boy who was fostered in the wrong hall. There is a long list of minor offences. The chairman, who is you, has a headache."
 eir.0520.a:0 "Settle the most difficult dispute yourself, on the spot."
 eir.0520.b:0 "Appoint a committee of bishops and poets."
 eir.0520.c:0 "Turn the council into a feast and put the quarrels off."
 eir.0520.d:0 "Walk out. The Union will keep itself."
 eir.0521.t:0 "A Gaelic Monk in Northumbria"
 eir.0521.desc:0 "#bold An Irish monk has established a small monastery in the north of England, and the locals are coming in droves.#!\n\nHe has no land and no permission, just a hut, a bell and a very good singing voice. The Saxon farmers think he is a saint. The Saxon thane thinks he is a nuisance. The monk thinks everything is going quite well. He has sent a letter to ask whether you could send him a second bell."
 eir.0521.a:0 "Send the bell, and two more monks."
 eir.0521.b:0 "Send a letter to the thane, asking him to be patient."
 eir.0521.c:0 "Send a small garrison to protect him."
 eir.0521.d:0 "Ignore the letter. He will manage."
 eir.0522.t:0 "Your Name in Three Languages"
 eir.0522.desc:0 "#bold The poets of three nations have each composed a poem about you, and they have all asked to read it first.#!\n\nThe Irish poem is in the old style and rhymes in four ways. The Welsh poem is in strict metre and has no hero, only landscape. The Latin poem, by a monk of Whithorn, calls you the new Constantine. You are not sure how to respond to being compared to a man who built a city for himself."
 eir.0522.a:0 "Receive them all at the same feast."
 eir.0522.b:0 "Ask them to write a single poem together."
 eir.0522.c:0 "Ask the Latin poet to omit the Constantine comparison."
 eir.0522.d:0 "Keep the Latin poem. It is the best."
 eir.0523.t:0 "The Banner of the Three Crowns"
 eir.0523.desc:0 "#bold A seamstress has finished the banner of the Union, and the three emblems on it do not agree.#!\n\nThe Irish harp, the Welsh dragon, the Cornish chough: three emblems that have never shared a field. The seamstress has put them in a ring. They look like they are about to have a fight. She wants to know whether to separate them with a Celtic knot, a cross or a very small saint."
 eir.0523.a:0 "A Celtic knot, to bind them together."
 eir.0523.b:0 "A cross, to remind them of the Church."
 eir.0523.c:0 "A very small saint, and let the argument begin."
 eir.0523.d:0 "Choose the dragon. Welsh is the elder tongue."
