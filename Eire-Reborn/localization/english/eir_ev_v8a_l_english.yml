l_english:
 eir.0400.t:0 "Smoke on the Horizon"
 eir.0400.desc:0 "#bold Fishermen say a fleet is gathering in the north, and a warlord has sworn to take Ireland.#!\n\nThe word came down the coast from boat to boat: sixty ships at the Orkney anchorage, then eighty, and a king in the north who has promised his men the silver of every church in Ireland. They call his army the Black Host, for the tarred sails and for the colour of what it leaves behind.\n\nYou have a year, perhaps less. The question is what to do with it."
 eir.0400.v1:0 "#bold Fishermen say a fleet is gathering in the north, and a warlord has sworn to take Ireland.#!\n\nYou have fought the Norse before and you remember how they fight: in a wedge, silent, with the shields locked, as if the axe had grown from the arm. Brave men do not fear that wall. Brave men sometimes lose to it."
 eir.0400.a:0 "Send riders to every king in Ireland with the warning."
 eir.0400.b:0 "Raise beacons and watch-towers along the whole coast."
 eir.0400.c:0 "Ask the poets and the seers what the omens say."
 eir.0400.d:0 "Hire a company of Norse-Gaelic mercenaries to meet them at sea."
 eir.0400.e:0 "Pay for peace before the fleet sails. (Danegeld.)"
 eir.0400.f:0 "Trust in your swords and say nothing."
 eir.0401.t:0 "The Longships Land"
 eir.0401.desc:0 "#bold [eir_bh_lord.GetShortUIName]'s fleet has beached at [eir_target_county.GetName], and the Black Host is ashore.#!\n\nThey came at dawn, in silence, forty ships on the strand and the sound of shields being locked. The fishermen who live there have already fled inland with their children. The monks of the nearest church are carrying their books to the hills.\n\nThere are more of them than you have ever seen in one place."
 eir.0401.v1:0 "#bold [eir_bh_lord.GetShortUIName]'s fleet has beached at [eir_target_county.GetName], and the Black Host is ashore.#!\n\nThey came at dawn, forty ships on the strand, and this time you were not asleep. The beacons took the news from headland to headland in a night, and the riders were already waiting at the fords. [eir_bh_lord.GetShortUIName] had hoped for surprise. He will not have it.\n\nThere are still more of them than you have ever seen in one place."
 eir.0401.a:0 "Call out every man and meet them on the shore."
 eir.0401.b:0 "Fall back to the ringforts and bleed them in the hills."
 eir.0401.c:0 "Send a champion to challenge their jarl to single combat."
 eir.0401.d:0 "Hire a host of gallowglass out of the Isles."
 eir.0401.e:0 "Carry the relics and the books to a place of safety."
 eir.0401.f:0 "Pray with the monks and wait."
 eir.0403.t:0 "The Council of the Kings"
 eir.0403.desc:0 "#bold Every king in Ireland has been summoned to the hill, and they cannot agree on who goes first.#!\n\nThe Norse have shown the kings what they came for. The kings are not stupid: they have all counted the ships. But a king who sits at another king's council has admitted that the other is his better, and nobody will say the words aloud.\n\nThe poets suggest that the fire in the middle of the circle be set so that nobody sits at its head."
 eir.0403.v1:0 "#bold Every king in Ireland has been summoned to the hill, and they cannot agree on who goes first.#!\n\nYou have just lost a battle, which concentrates a king's mind wonderfully. They come to the hill in a quiet mood, and some of them have brought their sons. Nobody mentions precedence for nearly an hour."
 eir.0403.a:0 "Appeal to the common blood and the saints."
 eir.0403.b:0 "Pay each king's hosting with cattle and silver."
 eir.0403.c:0 "Remind each king what the Norse will do to his hall."
 eir.0403.d:0 "Offer to serve under the strongest king in the circle."
 eir.0403.e:0 "Go it alone, and keep your honour."
 eir.0404.t:0 "The Second Landing"
 eir.0404.desc:0 "#bold A second fleet has been sighted, and it is larger than the first.#!\n\nYou had begun to hope. The first landing had been beaten, or bled, or bought off, and the country was just starting to count its dead. Then the beacons on the southern headlands burst into flame one after another, and a rider came in with a face the colour of whey.\n\nThe Black Host has more ships than anyone knew."
 eir.0404.a:0 "Split your army and hold both fords."
 eir.0404.b:0 "Raise the country, every sept, every spear."
 eir.0404.c:0 "Send ships to raid their homeland and draw them back."
 eir.0404.d:0 "Burn the bridges and flood the bog-roads."
 eir.0404.e:0 "Fast on the hilltop, and ask the saints for a sign."
 eir.0405.t:0 "A Traitor in the Hall"
 eir.0405.desc:0 "#bold One of your own has been taking Norse silver.#!\n\nIt started as a rumour: a vassal who sold hides to the Dubliners and came back with Norse coins in his belt. Then a shepherd found a message in the hollow of a stone cross, in a hand your steward recognised. The Norse have been told which fords are guarded and which are not.\n\nThe man in question is at your table tonight, laughing."
 eir.0405.a:0 "Confront him in front of the whole hall."
 eir.0405.b:0 "Have his house watched, and let him dig his own grave."
 eir.0405.c:0 "Buy his loyalty back with a better price."
 eir.0405.d:0 "Hang him from the nearest oak."
 eir.0405.e:0 "Pardon him in public, and make him your friend."
 eir.0406.t:0 "The Burning of the Great Monastery"
 eir.0406.desc:0 "#bold The Black Host has found the greatest monastery on your coast.#!\n\nThe abbot had known for months that this day would come. The books were hidden in the round tower and the relics in a pit beneath the altar. But the Norse have been to a hundred monasteries and they know the shape of the pit. Smoke already rises from the scriptorium."
 eir.0406.v1:0 "#bold The Black Host has found the greatest monastery on your coast.#!\n\nThe Norse reached the monastery at noon. The abbot met them at the gate, and the pit under the altar was empty. They burned the thatch in rage and went away with a few cattle. The books are in the hills; the monks are praying for you."
 eir.0406.a:0 "Ride to its defence, whatever the cost."
 eir.0406.b:0 "Pay the raiders to spare the shrine."
 eir.0406.c:0 "Vow vengeance on the altar-stone."
 eir.0406.d:0 "Save the monks and leave the stones to burn."
 eir.0408.t:0 "The Captive Jarl"
 eir.0408.desc:0 "#bold Your men have taken a Norse captain alive, and he has asked for you by name.#!\n\nHe is not a king. He is the son of a king, and he has the cold courtesy of a man who has been told since childhood that he will be ransomed. He says his father will pay in silver, in slaves and in ships. He says it as a man who is making a statement of fact, not an offer.\n\nBehind him, your men are muttering about the monasteries."
 eir.0408.a:0 "Ransom him for a king's price."
 eir.0408.b:0 "Keep him as a hostage and a guest."
 eir.0408.c:0 "Let the monks decide what to do with him."
 eir.0408.d:0 "Hang him from the round tower."
 eir.0408.e:0 "Free him, with a message for his father."
 eir.0409.t:0 "The Black Host Is Broken"
 eir.0409.desc:0 "#bold The last longship has cleared the headland, and for the first time in a generation the bell can be rung for joy.#!\n\nThey are gone. Not all of them were killed, but enough, and enough of the ships were burned that the rest will have the stories told about them for a hundred years. The poets are already composing, and the monks are already writing, and every king in Ireland is deciding whether to claim a share of the credit.\n\nThey will not get it. You were there."
 eir.0409.v1:0 "#bold The last longship has cleared the headland, and for the first time in a generation the bell can be rung for joy.#!\n\nYou lost a battle, perhaps two, and the country has not forgotten. You also came back, and the Norse did not expect that. The silence on the strand is the sound of a host that has gone home to bury its dead, and the poets' favourite line will be that the Irish were beaten three times and won the war."
 eir.0409.a:0 "Take the name the people are already calling you."
 eir.0409.b:0 "Raise a cairn and a high cross on the battlefield."
 eir.0409.c:0 "Share the spoils among every king who stood with you."
 eir.0409.d:0 "Commission the poets to make a saga of it."
 eir.0409.e:0 "Follow them to sea, and take what they left."
 eir.0414.t:0 "The Black Host Triumphs"
 eir.0414.desc:0 "#bold The fighting is over, and the Norse are the lords of your coast.#!\n\nThe longships are drawn up on the strand beneath a fort that used to be yours. The Black Host has taken what it came for: land, silver, hostages, and the right to say who may sail into your harbours. The monks are saying prayers for the dead; the poets are saying nothing.\n\nThere is still a country behind the hills, and it is not at peace with this."
 eir.0414.a:0 "Accept the terms and pay the tribute."
 eir.0414.b:0 "Go into the hills and raise the country in secret."
 eir.0414.c:0 "Marry a daughter into the Norse royal house."
 eir.0414.d:0 "Write to Rome and the kings of Francia for help."
 eir.0414.e:0 "Take the long sea-road into exile and come back stronger."
 eir.0415.t:0 "The Settlers Come"
 eir.0415.desc:0 "#bold Norse families have begun to farm the land that the Black Host took.#!\n\nThey came for silver and they stayed for the grass. The widows sold their holdings, the sons married Irish girls, and a Norse-Gaelic people with two names for everything has begun to settle on the estuaries. The first winter was hard; the second was peaceful.\n\nNobody knows yet whether this is a conquest or a new people."
 eir.0415.a:0 "Let them stay, and tax them fairly."
 eir.0415.b:0 "Foster their sons in your hall, and make Gaels of them."
 eir.0415.c:0 "Drive them out before the roots take."
 eir.0415.d:0 "Set a tribute on every longhouse."
 eir.0416.t:0 "The Saga of the Black Host"
 eir.0416.desc:0 "#bold A poet has finished the great song of the war, and he has asked to sing it in your hall.#!\n\nHe has put in everything. The beacons, the broken ford, the traitor, the old abbot at the gate. He sings in the old style, with the long breath and the leap. The hall is silent.\n\nHe has also, as poets do, told some of it differently from how it happened."
 eir.0416.a:0 "Let it be sung as it is, and reward him richly."
 eir.0416.b:0 "Ask him to put your allies in the song."
 eir.0416.c:0 "Have him sing it truthfully, including the traitor."
 eir.0416.d:0 "Cut the verses that make you look foolish."
 eir.0417.t:0 "The Great Hosting of the North"
 eir.0417.desc:0 "#bold The Black Host has come again, and this time the king himself has sailed.#!\n\nA hundred and twenty ships, and the banner of a king in the lead. They have burned every beacon from the north coast to the south, and the poets say the sea was black from Skerries to Howth. The jarls who followed the first two waves are dead or ransomed, but the king has not forgotten, and he has no one left to send.\n\nHe is coming himself."
 eir.0417.a:0 "Summon every sept to the hill and fight to the last man."
 eir.0417.b:0 "Challenge the Norse king to single combat before the hosts."
 eir.0417.c:0 "Bring out the relics and march the monks before the army."
 eir.0417.d:0 "Bribe the jarls beneath the king to turn on him."
 eir.0417.e:0 "Hire every spear on the island."
 eir.0418.t:0 "The Treaty of the Longphort"
 eir.0418.desc:0 "#bold Neither side could break the other, and the jarls are asking for terms.#!\n\nYou beat them once. They beat you once. Both of you have counted the dead and the grain. The Norse have a fortified camp at the river-mouth that they call a longphort; you have a country that is slowly starving. A bishop has offered to carry the words."
 eir.0418.a:0 "Let them keep the longphort and trade through it."
 eir.0418.b:0 "Insist on hostages, and give hostages in return."
 eir.0418.c:0 "Swear on the relics that the peace will last, and mean it."
 eir.0418.d:0 "Refuse. This is not over."
 eir.0430.t:0 "The Fleet Passes"
 eir.0430.desc:0 "#bold The Black Host sailed south past your coast, and did not land.#!\n\nYou spent a year building beacons, counting spears and sleeping with your boots on. The fleet passed by in the autumn mist, forty miles out, and was gone. The fishermen say it turned towards the English coast; the monks say the saints did it; your steward says the Norse have a long list and Ireland is not at the top of it.\n\nNobody expected to be spared."
 eir.0430.a:0 "Give thanks to the saints and build a chapel."
 eir.0430.b:0 "Keep the beacons lit. They will come back."
 eir.0430.c:0 "Send raiders after them in the dark."
 eir.0420.t:0 "The Wave Breaks"
 eir.0420.desc:0 "#bold The Norse host has been beaten and the survivors are running for their ships.#!\n\nThe shield wall held. The Norse had never expected an Irish army to stand, and they discovered it in the same moment that their right flank collapsed. By evening the strand was littered with axes, and the tide was coming in."
 eir.0420.v1:0 "#bold The Norse host has been beaten and the survivors are running for their ships.#!\n\nThe first landing is over. The Norse had never expected an Irish army to stand, and they discovered it in the same moment that their right flank collapsed. By evening the strand was littered with axes, and the tide was coming in. It would have been a good place to stop. You suspect it is only the beginning."
 eir.0420.v2:0 "#bold The Norse host has been beaten and the survivors are running for their ships.#!\n\nThe second landing is beaten, and this time the Norse did not run. They fought to the last of their shield-wall and then began to sing. Your men will not forget the sound of it, nor the silence afterwards."
 eir.0420.v3:0 "#bold The Norse host has been beaten and the survivors are running for their ships.#!\n\nIt is finished. The last Norse standard has fallen in the sea-grass, and the king's ship is limping out to the open water. There is no singing on the strand tonight, only the sound of oars."
 eir.0420.a:0 "Hunt down their captains."
 eir.0420.b:0 "Strip the dead of their silver and their arms."
 eir.0420.c:0 "Bury every man, Norse and Irish, with the proper prayers."
 eir.0420.d:0 "March the captured standard through every village."
 eir.0421.t:0 "The Wave Overwhelms You"
 eir.0421.desc:0 "#bold The Norse have won the field, and the county is theirs.#!\n\nYou were outnumbered, and you knew it, and you stayed anyway. They came up the beach in a wedge, the way they do, and the line broke where they hit it. Now the survivors are in the hills, and the monks are counting what is left.\n\nIt is not over. Not yet."
 eir.0421.v1:0 "#bold The Norse have won the field, and the county is theirs.#!\n\nThe first wave has taken the field, and the county with it. You were outnumbered, and you knew it, and you stayed anyway. They came up the beach in a wedge, the way they do, and the line broke where they hit it."
 eir.0421.v2:0 "#bold The Norse have won the field, and the county is theirs.#!\n\nA second defeat. You are beginning to understand what the poets mean when they say the Norse come in waves, as the sea comes: each one a little further up the shore."
 eir.0421.v3:0 "#bold The Norse have won the field, and the county is theirs.#!\n\nThe Great Hosting has taken the field. The king's banner is planted in the dune, and the jarls are dividing the cattle. You are alive, which is more than many of your friends."
 eir.0421.a:0 "Rally the survivors in the hills."
 eir.0421.b:0 "Burn the harvest before it can be taken."
 eir.0421.c:0 "Pay for the hostages' return before they are sold."
 eir.0421.d:0 "Swear vengeance before the saints."
 eir.0410.t:0 "The Britons Land"
 eir.0410.desc:0 "#bold [eir_inv_lord.GetShortUIName] has landed a war-band from across the sea, claiming an old debt in cattle.#!\n\nHe says the debt is three hundred years old, from a king who raided his grandfather's coast, and that the Irish have never paid it. He says it very politely, in the tongue of the British Church, with an old monk at his elbow to record the claim. Behind him, a hundred men are drawing their boats up the shingle."
 eir.0410.a:0 "Meet them at the ford with every spear you have."
 eir.0410.b:0 "Pay the blood-price and send them home."
 eir.0410.c:0 "Send the hospitality of a king, and hear his claim out."
 eir.0410.d:0 "Ask the bishop to judge between you."
 eir.0411.t:0 "The Albannach Cattle-Raid"
 eir.0411.desc:0 "#bold A cousin from across the sea has landed with a war-band, and says the cattle of this coast were promised to his house.#!\n\nThe men of Alba and the men of Ireland share a language, a poet's school and, in the opinion of both, a proper claim to the same grass. The raiders come in at dawn, in a long line, and the first thing they do is take the herds."
 eir.0411.a:0 "Meet them at the ford with every spear you have."
 eir.0411.b:0 "Pay the blood-price and send them home."
 eir.0411.c:0 "Remind him that you are one people, and the cattle are his by right of guest."
 eir.0411.d:0 "Challenge him to a cattle-judgement before the brehons."
 eir.0412.t:0 "The Rival King's Claim"
 eir.0412.desc:0 "#bold [eir_inv_lord.GetShortUIName] has called out his spears and says a county of yours belongs to his kindred.#!\n\nIt is a very old quarrel, and a very Irish one. His grandfather's grandfather was driven from the hill by yours, and the genealogists on both sides have brought out their rolls. His is longer. Yours is more carefully written. The war will decide which is correct."
 eir.0412.a:0 "Meet them at the ford with every spear you have."
 eir.0412.b:0 "Pay the blood-price and send them home."
 eir.0412.c:0 "Offer fosterage for his son, and let the quarrel become a friendship."
 eir.0412.d:0 "Put the genealogy before a poet and let the poet judge."
 eir.0413.t:0 "Reavers from the Isles"
 eir.0413.desc:0 "#bold Galleys out of the Hebrides have come ashore, flying a banner you do not know.#!\n\nThey are smaller than a Black Host and meaner. A Norse-Gaelic jarl with a hundred men, hungry for cattle and slaves, has found a beach with no beacon on it. In the old days he would have taken what he wanted and sailed home. These days there is a king in the hills, and he does not know that yet."
 eir.0413.a:0 "Meet them at the ford with every spear you have."
 eir.0413.b:0 "Pay the blood-price and send them home."
 eir.0413.c:0 "Burn their galleys while they are ashore."
 eir.0422.t:0 "The Britons Withdraw"
 eir.0422.desc:0 "#bold The Britons have been driven back to their ships.#!\n\nTheir prince sailed for home with a third of his men and a lesson about the long memory of the Irish."
 eir.0422.a:0 "Take a share of the plunder."
 eir.0422.b:0 "Spare the prisoners and send them home with a message."
 eir.0422.c:0 "Have the poets sing it."
 eir.0422.d:0 "Hang the leaders as an example."
 eir.0423.t:0 "The Britons Hold the Coast"
 eir.0423.desc:0 "#bold The Britons have taken the county, and they intend to keep it.#!\n\nThey did not stay long, but they stayed long enough to build a hall and bring in a priest. When your army returned, the hall was a fort."
 eir.0423.a:0 "Rebuild, and keep a better watch."
 eir.0423.b:0 "Swear vengeance on the invader's house."
 eir.0423.c:0 "Pay the blood-price and keep the peace."
 eir.0423.d:0 "Send the monks to ask for mercy for the survivors."
 eir.0424.t:0 "The Albannach Retreat"
 eir.0424.desc:0 "#bold The Gaels of Alba have been driven back across the sea.#!\n\nTheir leader fought well, and everybody agrees on that. He lost, and everybody agrees on that too."
 eir.0424.a:0 "Take a share of the plunder."
 eir.0424.b:0 "Spare the prisoners and send them home with a message."
 eir.0424.c:0 "Have the poets sing it."
 eir.0424.d:0 "Hang the leaders as an example."
 eir.0425.t:0 "The Albans Keep the Herds"
 eir.0425.desc:0 "#bold The Albannach have taken the county's herds, and the county with them.#!\n\nThey did what cousins do: they took the cattle first and asked afterwards."
 eir.0425.a:0 "Rebuild, and keep a better watch."
 eir.0425.b:0 "Swear vengeance on the invader's house."
 eir.0425.c:0 "Pay the blood-price and keep the peace."
 eir.0425.d:0 "Send the monks to ask for mercy for the survivors."
 eir.0426.t:0 "The Rival King Yields"
 eir.0426.desc:0 "#bold The rival king's spears have been broken, and his claim with them.#!\n\nHis genealogists will find a reason, in time. For now, the hill is yours."
 eir.0426.a:0 "Take a share of the plunder."
 eir.0426.b:0 "Spare the prisoners and send them home with a message."
 eir.0426.c:0 "Have the poets sing it."
 eir.0426.d:0 "Hang the leaders as an example."
 eir.0427.t:0 "The Rival King Wins the Hill"
 eir.0427.desc:0 "#bold The rival king has taken the hill, and a county with it.#!\n\nThe claim was in the genealogy all along. Or so his poets say."
 eir.0427.a:0 "Rebuild, and keep a better watch."
 eir.0427.b:0 "Swear vengeance on the invader's house."
 eir.0427.c:0 "Pay the blood-price and keep the peace."
 eir.0427.d:0 "Send the monks to ask for mercy for the survivors."
 eir.0428.t:0 "The Reavers Are Broken"
 eir.0428.desc:0 "#bold The reavers from the Isles have been broken on the strand.#!\n\nThey had thought the country empty. They discovered otherwise."
 eir.0428.a:0 "Take a share of the plunder."
 eir.0428.b:0 "Spare the prisoners and send them home with a message."
 eir.0428.c:0 "Have the poets sing it."
 eir.0428.d:0 "Hang the leaders as an example."
 eir.0429.t:0 "The Reavers Sail Home Rich"
 eir.0429.desc:0 "#bold The reavers have taken what they came for and gone.#!\n\nTheir galleys rode low in the water, which is the best tribute to how well they did."
 eir.0429.a:0 "Rebuild, and keep a better watch."
 eir.0429.b:0 "Swear vengeance on the invader's house."
 eir.0429.c:0 "Pay the blood-price and keep the peace."
 eir.0429.d:0 "Send the monks to ask for mercy for the survivors."
