l_english:
 eir.0950.t:0 "The Groves Are Planted Again"
 eir.0950.desc:0 "#bold The druids' oak-groves have been replanted across the island, and the Forest Warriors have come out of them.#!\n\nThe first grove was planted by accident. A bard asked where the old gods had been worshipped, and a farmer pointed to a clearing. By midsummer there were forty. Men who have not worn paint since the Romans left are standing between the oaks with torcs on their necks and spears in their hands. They do not speak much. They do not need to.\n\nThe bishops are asking, politely, what you intend."
 eir.0950.a:0 "Lead the first Beltane in the grove yourself."
 eir.0950.b:0 "Let the monks bless every grove and call it a hermitage."
 eir.0950.c:0 "Give the warriors lands and a charter, and keep them away from the priests."
 eir.0950.d:0 "Say it is a hunting festival and say nothing more."
 eir.0951.t:0 "The Heralds Cross the Water"
 eir.0951.desc:0 "#bold Your heralds have gone to the mainland to find the descendants of the old tribes.#!\n\nThey took a ship, a harper and a list of names. The tribes' names are Latin: Aedui, Arverni, Boii, Galatae, Celtiberi. The heralds do not know how to pronounce them, and the people they find do not recognise them. A Gaulish monk is delighted. A Frankish count is not. A Bavarian peasant offers them cheese.\n\nIt is a start."
 eir.0951.a:0 "Send gifts to every court that remembers a Celtic ancestor."
 eir.0951.b:0 "Send soldiers with the heralds, to be on the safe side."
 eir.0951.c:0 "Have the poets compose a catalogue of the tribes."
 eir.0951.d:0 "Call the heralds home. It was a silly idea."
 eir.0952.t:0 "The Return of the Celts to France"
 eir.0952.desc:0 "#bold A druid's hill-fort in the Auvergne has sent a message: the Arverni have not forgotten Vercingetorix.#!\n\nThe message is in Latin, in the handwriting of a monk who pretends to be a Gaul. It names a hill, a river and a vow. The count of the next county over has already sent a letter of his own, and it is considerably less friendly.\n\nYour claim on the Empire of France has been spoken aloud. The country is listening."
 eir.0952.a:0 "Pay the Auvergne chiefs to rise at the appointed hour."
 eir.0952.b:0 "Send an envoy to the Breton Celts of the western tip."
 eir.0952.c:0 "Raise the Gaulish claim in front of the Pope."
 eir.0952.d:0 "Wait. The claim will keep."
 eir.0957.t:0 "The Celts Return to France"
 eir.0957.desc:0 "#bold Half of the counties of the Empire of France now speak the tongue of the Gael.#!\n\nIt happened one village at a time. A priest preached in the old language, a mayor stopped answering in the new, a child wrote its name in ogham on a barn. By harvest the officials had stopped asking which language the taxes were collected in. Half the counties of the Empire of France answer to you now, and in the other half the oaks are leafing.\n\nGaul is where the Celts were before they were Romans, and Franks, and French. The poets can recite the tribes in their order."
 eir.0957.a:0 "Hold a feast in the largest of the converted counties."
 eir.0957.b:0 "Plant a nemeton in every county you have converted."
 eir.0957.c:0 "March the Forest Warriors through the streets of the old capital."
 eir.0957.d:0 "Let the old officials stay, and say nothing about language."
 eir.0953.t:0 "The Return of the Celts to Germany"
 eir.0953.desc:0 "#bold In the Bavarian forest the old hill-forts have been unlocked.#!\n\nThey were never really locked. The forest simply grew round them. A Bohemian woodcutter has brought word that the Boii tombs are intact. A German duke has noticed the same woodcutter and is making enquiries.\n\nYour claim on the Empire of Germany has been spoken aloud. The country is listening."
 eir.0953.a:0 "Ride into the Hercynian Forest with a small, loud escort."
 eir.0953.b:0 "Offer the Bavarian highlanders a grove of their own."
 eir.0953.c:0 "Send a gift to the Archbishop of Salzburg."
 eir.0953.d:0 "Wait. The claim will keep."
 eir.0958.t:0 "The Celts Return to Germany"
 eir.0958.desc:0 "#bold Half of the counties of the Empire of Germany now speak the tongue of the Gael.#!\n\nIt happened one village at a time. A priest preached in the old language, a mayor stopped answering in the new, a child wrote its name in ogham on a barn. By harvest the officials had stopped asking which language the taxes were collected in. Half the counties of the Empire of Germany answer to you now, and in the other half the oaks are leafing.\n\nThe Hercynian Forest was Celtic before it was German. The mountain tribes remembered the old names when the Romans came."
 eir.0958.a:0 "Hold a feast in the largest of the converted counties."
 eir.0958.b:0 "Plant a nemeton in every county you have converted."
 eir.0958.c:0 "March the Forest Warriors through the streets of the old capital."
 eir.0958.d:0 "Let the old officials stay, and say nothing about language."
 eir.0954.t:0 "The Return of the Celts to Spain and Iberia"
 eir.0954.desc:0 "#bold A shepherd on the Meseta swears that the first Gaels left from a harbour in Galicia.#!\n\nHe can name the harbour, the ship and the sons of Míl, and the monks of Compostela corroborate everything but the ship. The Irish annals say it too. For once the poets and the monks agree.\n\nYour claim on the Empire of Spain (Iberia) has been spoken aloud. The country is listening."
 eir.0954.a:0 "Send a pilgrimage to Santiago in the colours of Ireland."
 eir.0954.b:0 "Claim kinship with the Celtiberian lords on the plateau."
 eir.0954.c:0 "Pay the Galician fishermen to carry the message."
 eir.0954.d:0 "Wait. The claim will keep."
 eir.0959.t:0 "The Celts Return to Spain and Iberia"
 eir.0959.desc:0 "#bold Half of the counties of the Empire of Spain (Iberia) now speak the tongue of the Gael.#!\n\nIt happened one village at a time. A priest preached in the old language, a mayor stopped answering in the new, a child wrote its name in ogham on a barn. By harvest the officials had stopped asking which language the taxes were collected in. Half the counties of the Empire of Spain (Iberia) answer to you now, and in the other half the oaks are leafing.\n\nThe Celtiberians held the high plateau of Iberia, and the Irish chroniclers say that the first Gaels sailed from there."
 eir.0959.a:0 "Hold a feast in the largest of the converted counties."
 eir.0959.b:0 "Plant a nemeton in every county you have converted."
 eir.0959.c:0 "March the Forest Warriors through the streets of the old capital."
 eir.0959.d:0 "Let the old officials stay, and say nothing about language."
 eir.0955.t:0 "The Return of the Celts to Italy"
 eir.0955.desc:0 "#bold In Milan an old man has found a stone with a name on it that sounds distinctly Irish.#!\n\nIt is Insubrian, which is Celtic, which is close enough. The lords of Lombardy are annoyed, the cathedral chapter is intrigued and a Venetian merchant is selling copies. Nobody has asked what the stone says.\n\nYour claim on the Empire of Italy has been spoken aloud. The country is listening."
 eir.0955.a:0 "Buy the stone and put it in the Hall of Tara."
 eir.0955.b:0 "Invite the Lombard nobility to a feast of the old Gaulish dishes."
 eir.0955.c:0 "Remind the Pope who sacked Rome, once."
 eir.0955.d:0 "Wait. The claim will keep."
 eir.0960.t:0 "The Celts Return to Italy"
 eir.0960.desc:0 "#bold Half of the counties of the Empire of Italy now speak the tongue of the Gael.#!\n\nIt happened one village at a time. A priest preached in the old language, a mayor stopped answering in the new, a child wrote its name in ogham on a barn. By harvest the officials had stopped asking which language the taxes were collected in. Half the counties of the Empire of Italy answer to you now, and in the other half the oaks are leafing.\n\nCisalpine Gaul was Celtic from the Alps to the Po, and Rome burned for it once. The Gael remembers who sacked the city."
 eir.0960.a:0 "Hold a feast in the largest of the converted counties."
 eir.0960.b:0 "Plant a nemeton in every county you have converted."
 eir.0960.c:0 "March the Forest Warriors through the streets of the old capital."
 eir.0960.d:0 "Let the old officials stay, and say nothing about language."
 eir.0956.t:0 "The Return of the Celts to Galatia"
 eir.0956.desc:0 "#bold A priest in Ancyra writes that the Galatians still keep three words of the old tongue.#!\n\nOne means river, one means oak, and one has been forgotten by everyone but a Greek grandmother. The Byzantine governor is nervous. Saint Paul, as always, is cited by both sides.\n\nYour claim on the Kingdom of Anatolia (Galatia) has been spoken aloud. The country is listening."
 eir.0956.a:0 "Send a delegation of monks with a Gaelic gospel book."
 eir.0956.b:0 "Pay the Galatian hill-lords to hold their passes."
 eir.0956.c:0 "Offer the Emperor a treaty and mean none of it."
 eir.0956.d:0 "Wait. The claim will keep."
 eir.0961.t:0 "The Celts Return to Galatia"
 eir.0961.desc:0 "#bold Half of the counties of the Kingdom of Anatolia (Galatia) now speak the tongue of the Gael.#!\n\nIt happened one village at a time. A priest preached in the old language, a mayor stopped answering in the new, a child wrote its name in ogham on a barn. By harvest the officials had stopped asking which language the taxes were collected in. Half the counties of the Kingdom of Anatolia (Galatia) answer to you now, and in the other half the oaks are leafing.\n\nA Celtic people crossed the Bosphorus and held the heart of Anatolia for four hundred years. Saint Paul wrote to them."
 eir.0961.a:0 "Hold a feast in the largest of the converted counties."
 eir.0961.b:0 "Plant a nemeton in every county you have converted."
 eir.0961.c:0 "March the Forest Warriors through the streets of the old capital."
 eir.0961.d:0 "Let the old officials stay, and say nothing about language."
