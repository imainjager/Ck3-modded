l_english:
 eir.0330.t:0 "A Relic Comes from Iona"
 eir.0330.desc:0 "#bold A monk from Iona has crossed the sea with a scrap of Colmcille's cloak in a silver box.#!\n\nThe island has been raided three times in his lifetime, and the community has decided that the saint's belongings are no longer safe in the one place the Norse know to look. He asks only that you keep it in a church where the bell is rung at the right hours, and that the cloak never be sold."
 eir.0330.a:0 "Receive it with honour and keep it in your chapel."
 eir.0330.b:0 "Give it to the largest monastery in your lands."
 eir.0330.c:0 "Parade it around the realm to bless the harvest."
 eir.0330.d:0 "Keep it safe, but say nothing."
 eir.0331.t:0 "The Monk Who Disagreed"
 eir.0331.desc:0 "#bold A learned monk has been preaching that the Easter reckoning of the Roman Church is a heresy, and that the Irish dating is the true one.#!\n\nHe is not wrong about the dates, which have been argued for two hundred years. He is, however, very loud about it, and the new bishops want him silenced. Half the abbots in your lands quietly agree with him."
 eir.0331.a:0 "Silence him, and protect the unity of the Church."
 eir.0331.b:0 "Hold a synod where both sides may argue."
 eir.0331.c:0 "Side with the monk, and defend the old ways."
 eir.0331.d:0 "Send him on pilgrimage to Rome to settle it himself."
 eir.0332.t:0 "The Pilgrims Arrive"
 eir.0332.desc:0 "#bold A hundred pilgrims have walked into your capital, singing, and the monastery cannot feed them.#!\n\nThey are from Britain and Gaul, in grey cloaks, with staves. They want to walk the pilgrim's road to Croagh Patrick and Skellig. They say the Irish roads are the safest in the world, and they are asking whether it is still true."
 eir.0332.a:0 "Feed them from your own table."
 eir.0332.b:0 "Give them an escort and a safe-conduct."
 eir.0332.c:0 "Charge a toll at the ford."
 eir.0332.d:0 "Ask them to carry your name to the churches of Britain."
 eir.0340.t:0 "A Man Fasts at the Door"
 eir.0340.desc:0 "#bold A freeman is sitting on your threshold, refusing food, until you pay a debt you owe him.#!\n\nIt is the ancient remedy called distraint by fasting, and the law is clear: a lord who lets a man starve at his door, over a debt, loses his honour-price. The man is quiet and does not beg. The debt, you find, is real, and is eleven years old."
 eir.0340.a:0 "Pay the debt in full and give him a feast."
 eir.0340.b:0 "Fast beside him until the Brehon decides."
 eir.0340.c:0 "Haggle: pay half, and swear the rest to be paid by Easter."
 eir.0340.d:0 "Have him carried off the threshold."
 eir.0341.t:0 "The Murrain Comes"
 eir.0341.desc:0 "#bold A sickness is going through the herds, and the cattle are dying in the byres.#!\n\nThe first cows died in the west and the disease went east along the cattle roads. Farmers are burning carcasses and praying. A Welsh dealer has come across the sea with healthy beasts and a high price. The poorest freemen have already begun to sell their land."
 eir.0341.a:0 "Buy cattle for the poorest from the Welsh dealer."
 eir.0341.b:0 "Order the herds burned and the infected fields left fallow."
 eir.0341.c:0 "Ask the saints, and carry the relics through the fields."
 eir.0341.d:0 "Close the borders and let the sickness burn itself out."
 eir.0342.t:0 "The Great Cattle Drive"
 eir.0342.desc:0 "#bold Every herd in your lands is going to the autumn market together, and your reeve asks whether the king will ride with them.#!\n\nIt is the biggest drive in a generation: eleven thousand head, forty drovers, a priest to bless the ford and a poet to compose a verse about each. The roads are narrow and the Welsh raiders are rumoured. The market at the end is worth a fortune."
 eir.0342.a:0 "Ride at the head of the drive."
 eir.0342.b:0 "Send an armed escort and stay home."
 eir.0342.c:0 "Sell the cattle where they stand and spare the risk."
 eir.0342.d:0 "Hold a feast at the market and invite the Welsh dealers."
 eir.0343.t:0 "A Quarrel in the Summer Pastures"
 eir.0343.desc:0 "#bold Two clans have met on the same hill pasture, and neither will leave first.#!\n\nThe booleys have gone up the mountains for the summer with the herds and the dairymaids. The pasture is common land by law and nobody can remember which clan came first. There are ten boys on each side, a bad-tempered bull and a brehon three days away."
 eir.0343.a:0 "Ride up and judge it yourself."
 eir.0343.b:0 "Divide the pasture and put a stone marker between them."
 eir.0343.c:0 "Make both clans pay a fine for the trouble."
 eir.0343.d:0 "Join the herdsmen for the summer yourself."
 eir.0344.t:0 "The Harper Who Was Not Paid"
 eir.0344.desc:0 "#bold A harper played all night at your feast, and your steward gave him a cup of ale and a thin coin.#!\n\nHarpers are protected by law, and the law is old. A poet or musician unpaid or insulted may cast a curse or compose a satire that follows a king to his grave. This one is looking at the door, and at you, and has not yet put the harp away."
 eir.0344.a:0 "Call him back and pay him in front of the hall."
 eir.0344.b:0 "Give him a ring from your own hand."
 eir.0344.c:0 "Order the steward to explain himself."
 eir.0344.d:0 "Let him go. A coin is a coin."
 eir.0350.t:0 "The War-Poet Sings the Host Out"
 eir.0350.desc:0 "#bold On the eve of a march, the war-poet asks to sing a verse before the whole army.#!\n\nHe is old, bald, and has served three kings. The verse is about the ancestors who held this ford, and each line ends with a name. The men are listening. He only wants the king's leave, and perhaps an answering verse, and a cup of the good mead."
 eir.0350.a:0 "Answer him in verse of your own."
 eir.0350.b:0 "Let him sing, and ride at the head of the column."
 eir.0350.c:0 "Cut him short: the army has a march to make."
 eir.0350.d:0 "Give the poet a share of the spoil in advance."
 eir.0351.t:0 "The Gallowglass Captain Wants Land"
 eir.0351.desc:0 "#bold The captain of your gallowglass has asked for a place in the hills, a wife and a hall.#!\n\nHe is called by a name that means 'foreign-warrior' in your language, and his axe has two hundred notches. He says his men are tired of being hired. They would like to be useful in a different way, and their sons would like not to be killed."
 eir.0351.a:0 "Grant him lands on the border."
 eir.0351.b:0 "Marry him to a noblewoman of your court."
 eir.0351.c:0 "Refuse. A warrior is not a lord."
 eir.0351.d:0 "Give him gold instead and send his men home."
 eir.0352.t:0 "The Hostage Exchange"
 eir.0352.desc:0 "#bold Two hostages are to be exchanged on a bridge, and someone has brought a knife.#!\n\nYou and your rival have agreed to swap sons at the midpoint of the ford. The boys are walking toward each other in the sunshine. A nervous guardsman on your side has put a hand to his sword, and across the water a man has done the same."
 eir.0352.a:0 "Walk onto the bridge yourself, unarmed."
 eir.0352.b:0 "Order your men to stand down, loudly."
 eir.0352.c:0 "Strike first and settle it."
 eir.0353.t:0 "A Champion at the Ford"
 eir.0353.desc:0 "#bold An enemy champion has taken the ford and will not let your army cross unless you send a man to fight him.#!\n\nHe is enormous, has the shoulders of a smith and is eating an apple. He says he will sit there until sunset or until somebody beats him, and the army behind you is beginning to think that the first is cheaper. The poets are already finding rhymes for 'ford'."
 eir.0353.a:0 "Fight him yourself."
 eir.0353.b:0 "Send your champion."
 eir.0353.c:0 "Find another ford."
 eir.0353.d:0 "Offer him gold to step aside."
 eir.0360.t:0 "Two Welsh Princes Quarrel"
 eir.0360.desc:0 "#bold Two princes of the Welsh have come to you separately, each swearing the other cheated him of a cantref.#!\n\nThe border between them was drawn by a monk with a stick and a bad memory. Each has a lawyer, an army of sorts, and a cousin on the throne of England who might be asked for help. They would both rather have a Celtic arbiter, if the Celtic arbiter is fair."
 eir.0360.a:0 "Hear both and rule yourself."
 eir.0360.b:0 "Arrange a marriage between the two houses."
 eir.0360.c:0 "Back the stronger prince in return for a tribute of horses."
 eir.0360.d:0 "Stay out of it."
 eir.0361.t:0 "The Cornish Tinners Strike"
 eir.0361.desc:0 "#bold The tinners of Cornwall have stopped digging, and the smelters of three kingdoms are asking why.#!\n\nA new overlord has doubled their dues. They want a protector with a treasury and no particular grudge, and they have sent their best speaker across the sea to ask whether the Irish king might be that man."
 eir.0361.a:0 "Take the tinners under your protection and open a market."
 eir.0361.b:0 "Buy their tin at a fair price and say nothing else."
 eir.0361.c:0 "Press their overlord to ease the dues."
 eir.0361.d:0 "Decline. The tinners must fend for themselves."
 eir.0362.t:0 "Breton Exiles Settle"
 eir.0362.desc:0 "#bold Thirty Breton families, priests, weavers and a cider-maker among them, have asked for land.#!\n\nThey left a country that no longer wants their language and carry a few relics, an unusual breed of dog and a very convincing claim of descent from the kings of Armorica. They are courteous, hungry and clever, and one of them has a recipe for a bread that does not go stale."
 eir.0362.a:0 "Give them a quarter of a town."
 eir.0362.b:0 "Make the cider-maker a court brewer."
 eir.0362.c:0 "Ask what they know about the Frankish courts."
 eir.0362.d:0 "Settle them in the poorest land and say nothing."
 eir.0363.t:0 "A Stone with Beasts"
 eir.0363.desc:0 "#bold Workmen digging a drain in the north have found a carved stone with a serpent, a mirror and a crescent on it.#!\n\nThe Picts left them everywhere and nobody knew what they meant even then. The monks want to smash it as a pagan idol. The poets want to put it in the hall. The workmen would like to be paid."
 eir.0363.a:0 "Set it up in your hall."
 eir.0363.b:0 "Let the monks bury it under the chapel floor."
 eir.0363.c:0 "Have a scholar copy the symbols for study."
 eir.0363.d:0 "Sell it to a passing merchant."
 eir.0364.t:0 "Galloway Asks for Help"
 eir.0364.desc:0 "#bold The Gaels of Galloway, a long way across the water, have sent a boat with an urgent message.#!\n\nA foreign lord is building a castle on the headland and has begun to charge for the use of the beach. The men of Galloway speak your language, bury their dead in the way yours do and ask whether the High King of Ireland can be called an ally or only a poem."
 eir.0364.a:0 "Send a hundred warriors in ships."
 eir.0364.b:0 "Send gold and a letter to their overlord."
 eir.0364.c:0 "Invite their chief to your court as a guest."
 eir.0364.d:0 "Regretfully decline."
 eir.0370.t:0 "A Prodigy at the Harp"
 eir.0370.desc:0 "#bold A six-year-old in your household has just played a lament that made a hardened old warrior weep.#!\n\nShe learned it by listening through a wall. She cannot read, is unusually serious, and has asked, politely, whether she might have lessons. The harper of the court has gone quiet in a way that suggests he has just realised something."
 eir.0370.a:0 "Give her the best master in the land."
 eir.0370.b:0 "Send her to be fostered with the bardic school."
 eir.0370.c:0 "Keep the talent in your household as a secret weapon."
 eir.0370.d:0 "Say harp-playing is not for noble girls."
 eir.0371.t:0 "The Wedding Feast of the Isles"
 eir.0371.desc:0 "#bold A galley-lord from the Hebrides has invited you to his daughter's wedding, and he does not take refusal well.#!\n\nTen days of feasting, a fleet of galleys drawn up on the shore, and a bride who will inherit half an island. Everyone who matters in the western seas will be there. So will several people who would like to see you humiliated in the dancing."
 eir.0371.a:0 "Attend in your best cloak and bring a rich gift."
 eir.0371.b:0 "Send your heir as your representative."
 eir.0371.c:0 "Challenge the groom's brother to a drinking contest."
 eir.0371.d:0 "Decline with a courteous letter."
 eir.0372.t:0 "A Ghost at Samhain"
 eir.0372.desc:0 "#bold At Samhain, on the night the dead walk, a tall man in a green cloak is standing in your hall's doorway.#!\n\nHe has no shadow. He is tall, scarred and smiling a little. Nobody else seems to see him. He says nothing, but he is looking at your sword, and at you, and the dogs have gone silent. In the stories, the Hound of Ulster comes to those who must make a choice."
 eir.0372.a:0 "Salute him and offer him a cup."
 eir.0372.b:0 "Cross yourself, and call for the priest."
 eir.0372.c:0 "Draw your sword and challenge him."
 eir.0372.d:0 "Pretend you saw nothing, and drink more mead."
 eir.0373.t:0 "The Star with a Tail"
 eir.0373.desc:0 "#bold A bright star with a long pale tail hangs in the sky every night, and nobody can agree on what it means.#!\n\nThe monks say it is a warning. The poets say it is a sign that a king will fall, which is the usual thing to say. The old women say it is a sign that a baby will be born who will change the island. The reeves say that the harvest was good anyway."
 eir.0373.a:0 "Call it a sign of divine favour."
 eir.0373.b:0 "Call it a warning, and order a fast."
 eir.0373.c:0 "Ask the poets for a verse that fits any outcome."
 eir.0373.d:0 "Laugh at it and go hunting."
 eir.0374.t:0 "The Satire Against the Steward"
 eir.0374.desc:0 "#bold A court poet has composed a savage satire against your steward, and the steward is weeping in the hall.#!\n\nIt is witty, cruel, and entirely accurate. The poet is a favourite of the court and the steward is the man who keeps the realm solvent. Both of them are looking at you, and each has in mind a different ending."
 eir.0374.a:0 "Pay the poet to compose a second poem, a praise-poem of the steward."
 eir.0374.b:0 "Banish the poet from court for a year."
 eir.0374.c:0 "Laugh at the poem, and let the steward be laughed at too."
 eir.0374.d:0 "Raise the steward's pay and add a title."
 eir.0375.t:0 "The Tale of the Cattle-Raid Retold"
 eir.0375.desc:0 "#bold Your master-poet has asked leave to retell the Táin in the evenings of the winter court.#!\n\nIt has not been told in the great hall for a generation, because the old version is long, bloody and sympathetic to Queen Medb. The master-poet's plan is to alter some details, add a few of your ancestors, and finish with a stanza about the present king. It takes a month to recite."
 eir.0375.a:0 "Grant the winter, and attend every evening."
 eir.0375.b:0 "Grant the winter, but ask for a version more flattering to the High King."
 eir.0375.c:0 "Forbid it: the old tale glorifies cattle thieves."
