l_english:
 eir.0300.t:0 "The Old Tongue Returns"
 eir.0300.desc:0 "#bold A county in Britain that has spoken English for generations is learning Gaelic again, by your word.#!\n\nThe reeve reads your decree in the market square in two languages. The older women understand the first, the children understand the second, and the poets are delighted that anyone cares about either. What happens next, the county will be telling for a hundred years."
 eir.0300.v1:0 "#bold A county in Britain that has spoken English for generations is learning Gaelic again, by your word.#!\n\nWhatever the poets say, the reeve in the square is thinking about taxes. You are thinking about whether anyone will notice that the king has no authority over a word. The county, regardless, is tasting the old tongue again, and finds it has not forgotten the flavour."
 eir.0300.a:0 "Hold a feast in the new Gaelic county."
 eir.0300.b:0 "Let the poets compose the county's new name and story."
 eir.0300.c:0 "Send priests to say the Mass in the old tongue."
 eir.0300.d:0 "Make an example of the old landlords."
 eir.0300.e:0 "Say nothing, and let it settle quietly."
 eir.0301.t:0 "The Saxons Mutter"
 eir.0301.desc:0 "#bold The people of the Saxon counties have begun to say that you are changing the law, the speech and the Church to please the Gael.#!\n\nThe grumbling is in the alehouses first, then at the church door, then on the lips of the older thanes. A man whose grandfather held the same fields says that he asked for a king, not a schoolmaster. The reeves have started to count heads on market days."
 eir.0301.v1:0 "#bold The people of the Saxon counties have begun to say that you are changing the law, the speech and the Church to please the Gael.#!\n\nYou went out alone to listen, which your steward thought unwise. The people had not stopped being kind, they said. They were only worried that nobody would ever be kind to the next generation, who would have no word in the language their grandmothers taught them, and a lord who would not hear it."
 eir.0301.a:0 "Grant them a moot under their own oak."
 eir.0301.b:0 "March a company through the market towns."
 eir.0301.c:0 "Pay the thanes to keep their people quiet."
 eir.0301.d:0 "Take their sons as foster-children in your hall."
 eir.0301.e:0 "Tell the doubters they are free to leave."
 eir.0302.t:0 "A Thane Calls the Moot"
 eir.0302.desc:0 "#bold A grey-bearded thane has summoned the freemen of a county to an open-air moot, and he is not asking your leave.#!\n\nHe stands on the barrow by the old road with a sword across his knees, which is how his ancestors did it. Four hundred men have come. They are not armed, which is a courtesy, and they are not leaving, which is a statement. The thane has sent a boy to ask whether the king will hear them."
 eir.0302.a:0 "Ride out and sit on the barrow beside him."
 eir.0302.b:0 "Have the thane seized at night."
 eir.0302.c:0 "Offer him a seat on your council for the marches."
 eir.0302.d:0 "Send the poets to shame him in verse."
 eir.0303.t:0 "The Hedge-School Fills"
 eir.0303.desc:0 "#bold Two years after the old tongue returned to a British county, the hedge-school under the hawthorns has more pupils than the church school.#!\n\nThe masters are poor, and they teach from memory: tales, genealogy, the names of rivers. The children recite them at night to their parents, who begin to correct the words. In the corner, a Saxon boy who came for the free bread has learned three poems."
 eir.0303.a:0 "Fund the masters properly."
 eir.0303.b:0 "Send your heir to study there for a season."
 eir.0303.c:0 "Invite the Saxon children to learn beside the Gaelic ones."
 eir.0303.d:0 "Close it: the masters preach sedition."
 eir.0304.t:0 "Fire in the Marches"
 eir.0304.desc:0 "#bold A county of foreign-speaking freemen has risen, and the beacons are burning along the border.#!\n\nIt began with a tax-collector found in a ditch. By dawn the thanes had called out their men, by noon the hedge-school was ash, and by evening the border fort was sending to ask what the king wanted done. A boy rides in with soot on his face."
 eir.0304.a:0 "Ride out with the host and break them in the field."
 eir.0304.b:0 "Offer to hear their grievances under a flag of truce."
 eir.0304.c:0 "Burn the villages that rose."
 eir.0304.d:0 "Withdraw the garrison and let the county go its own way."
 eir.0305.t:0 "A Welsh Bard Hears the News"
 eir.0305.desc:0 "#bold A bard from Gwynedd has walked across Britain to hear the old tongue spoken in a county that lost it.#!\n\nHe has a harp with eleven strings, which is two more than is customary, and a voice that makes the dogs go quiet. He says the Welsh have been telling a story for four hundred years about a day when the island would speak again, and he would like to be told it is true."
 eir.0305.a:0 "Seat him at the high table and give him a gift."
 eir.0305.b:0 "Ask him to teach the county's children the Welsh songs."
 eir.0305.c:0 "Have him carry a letter to the Welsh princes."
 eir.0305.d:0 "Thank him, but keep your plans to yourself."
 eir.0306.t:0 "A Thane's Daughter"
 eir.0306.desc:0 "#bold The oldest Saxon thane in a conquered county has offered his granddaughter as a bride for your heir.#!\n\nHe says it is a fitting match. His own sons died in the old wars, his remaining land is poor, and he would like the child he cannot fight for to be queen of someone he cannot fight. The girl has a plain face, a great deal of land, and a reputation for reading."
 eir.0306.a:0 "Accept, and marry her to your heir."
 eir.0306.b:0 "Take her into your household as a ward."
 eir.0306.c:0 "Decline, and insult the thane's lineage."
