l_english:
 eir.0010.t:0 "Longships on the Horizon"
 eir.0010.desc:0 "#bold Longships under [eir_norse_lord.GetShortUIName]'s banner have been sighted off [eir_target_county.GetName].#!

The dragon-prows came out of the morning haze, a dozen of them, then a dozen more. The fishermen are already running inland, and the monks of the nearest church are hiding what they can.

[eir_norse_lord.GetShortUIName] has not sent envoys. [eir_norse_lord.GetSheHe|U] has sent men with axes."
 eir.0010.a:0 "Gather the levies and meet them on the shore."
 eir.0010.b:0 "Hire Norse-Irish mercenaries and meet them with a larger force."
 eir.0010.c:0 "Offer the jarl land and a share of the cattle."
 eir.0010.d:0 "Pay them to sail on. (Danegeld.)"
 eir.0011.t:0 "The Monastery in Flames"
 eir.0011.desc:0 "#bold Smoke rises from the great monastery on your coast.#!

Norse raiders have come ashore at the monastery, as they have come to a hundred before it. They will take the silver, the books and the monks, and burn what is left.

If riders go now, they may arrive in time."
 eir.0011.a:0 "Ride to its defence."
 eir.0011.b:0 "Pay the raiders to spare the relics."
 eir.0011.c:0 "Move the relics to the round tower."
 eir.0011.d:0 "Pray for the monks and do nothing else."
 eir.0012.t:0 "A Norse-Gael Lord's Bargain"
 eir.0012.desc:0 "#bold A Norse-Gael captain offers you his axes for a price.#!

He is half Norse and half Irish, and he speaks both languages with the same accent. He has a hundred men with axes the length of a man's leg, and he says they are looking for a lord with cattle to pay for them.

The Isles breed such men by the score. They are not always loyal, but they are always good."
 eir.0012.a:0 "Take his company into your pay."
 eir.0012.b:0 "Test his loyalty before you pay him."
 eir.0012.c:0 "Send him away. Irishmen will fight Ireland's wars."
 eir.0013.t:0 "Hostages for the Jarl"
 eir.0013.desc:0 "#bold [eir_norse_lord.GetShortUIName] demands hostages as the price of peace.#!

The jarl sits at your table as if it were his own and names his price: two sons of your best families, to be raised in his hall until your good behaviour is proved.

Hostages bind a treaty better than any oath. They are also children."
 eir.0013.a:0 "Send two noble children as hostages."
 eir.0013.b:0 "Send livestock and silver instead."
 eir.0013.c:0 "Send an insult, and prepare for war."
 eir.0015.t:0 "The Norse Break on Your Shield"
 eir.0015.desc:0 "#bold The Norse host is shattered, and its jarl is your prisoner.#!

They came out of the sea with axes and left it with rope around their necks. The bards are already composing, and the story improves with every singer.

[eir_norse_lord.GetShortUIName] kneels in your camp, waiting to learn what a victorious Irish king will do."
 eir.0015.a:0 "Hang him from the nearest oak."
 eir.0015.b:0 "Ransom him back to his people."
 eir.0015.c:0 "Raise a cross on the battlefield and make a pilgrimage site of it."
 eir.0015.d:0 "Offer him his freedom if his people swear to leave Ireland."
 eir.0016.t:0 "The Norse Hold Your Land"
 eir.0016.desc:0 "#bold [eir_norse_lord.GetShortUIName] has won, and [eir_target_county.GetName] is now a Norse county.#!

Your army was beaten, and the longships that brought the raiders have been dragged up the beach and turned into roofs. The jarl has taken the hall, the herds and the harbour, and he says he intends to stay.

The people of the county still speak Irish. For now."
 eir.0016.a:0 "Swear to take it back. (Unlocks a decision.)"
 eir.0016.b:0 "Pay tribute and hope he is satisfied."
 eir.0016.c:0 "Marry a kinswoman to the jarl and make him part of the family."
