l_english:
 eir_viking_fleet_name:0 "Viking Fleet"
 eir_foreign_host_name:0 "Foreign Host"
 eir_clan_muster_name:0 "Clan Muster"
 eir_mercenary_company_name:0 "Mercenary Company"
 eir_bandit_warband_name:0 "Warband"
 eir_gallowglass_company_name:0 "Gallowglass Company"
 eir_book_of_kells_name:0 "The Gospel of Kells"
 eir_book_of_kells_desc:0 "A gospel book of astonishing beauty, the work of years of patient monks."
 eir_ardagh_chalice_name:0 "The Silver Chalice"
 eir_ardagh_chalice_desc:0 "A silver and gold chalice, ornamented with interlace and set with amber."
 eir_torc_of_tara_name:0 "The Torc of Tara"
 eir_torc_of_tara_desc:0 "A great twisted gold collar, older than any king of Ireland."
 eir_caladbolg_name:0 "Caladbolg"
 eir_caladbolg_desc:0 "A sword the poets say struck three hills flat."
 eir_dimma_name:0 "The Little Gospel"
 eir_dimma_desc:0 "A pocket gospel book that can be carried in a satchel."
 eir_bell_shrine_name:0 "The Bell Shrine"
 eir_bell_shrine_desc:0 "A bronze and silver shrine for the iron bell of a saint."
 eir_lunula_name:0 "The Gold Lunula"
 eir_lunula_desc:0 "A crescent of beaten gold, older than any king."
 eir_ogham_blade_name:0 "The Ogham Blade"
 eir_ogham_blade_desc:0 "A sword with a line of ogham letters along the spine."
 eir_chieftain_torc_name:0 "The Chieftain's Torc"
 eir_chieftain_torc_desc:0 "A twisted gold collar worn by a line of lesser kings."
 eir_cathach_name:0 "The Cathach"
 eir_cathach_desc:0 "A battle psalter said to have been copied by a saint, carried around armies before they fought."
 eir_tara_brooch_name:0 "The Great Brooch"
 eir_tara_brooch_desc:0 "A vast silver-gilt brooch, too big to be practical and too beautiful to leave off."
 eir_cross_of_cong_name:0 "The Processional Cross"
 eir_cross_of_cong_desc:0 "An oak cross covered in bronze and silver, with a crystal at its heart."
 nick_eir_convener:0 "the Convener"
 nick_eir_convener_desc:0 "Called the great assembly of the Gael, and every king came."
 nick_eir_tara_builder:0 "the Builder of Tara"
 nick_eir_tara_builder_desc:0 "Raised the Hall of Tara on the hill of the kings."
 nick_eir_poet_king:0 "the Poet-King"
 nick_eir_poet_king_desc:0 "Gave the Filí their charter and made poetry a pillar of the state."
 nick_eir_cow_lord:0 "the Cow-Lord"
 nick_eir_cow_lord_desc:0 "Counted every herd in the kingdom and made the cattle the basis of a state."
 nick_eir_abbot_king:0 "the Abbot-King"
 nick_eir_abbot_king_desc:0 "Raised the monastic cities and ruled as friend of the saints."
 nick_eir_sea_king:0 "the Sea-King"
 nick_eir_sea_king_desc:0 "Claimed the Irish Sea for the Gael."
 nick_eir_sea_master:0 "Master of the Western Sea"
 nick_eir_sea_master_desc:0 "Holds every harbour from Dublin to the Hebrides."
 nick_eir_gael_father:0 "Father of the Gael"
 nick_eir_gael_father_desc:0 "Presided over the golden age of the Gaelic peoples."
 nick_eir_unifier:0 "the Unifier"
 nick_eir_unifier_desc:0 "Ended the age of broken kingdoms and made the high kingship a throne."
 nick_eir_celtic_brother:0 "Brother of the Celtic Peoples"
 nick_eir_celtic_brother_desc:0 "Called the Welsh, the Cornish, the Bretons and the Gaels of Alba brothers."
 nick_eir_high_king:0 "Ard Rí"
 nick_eir_high_king_desc:0 "Crowned High King at Tara."
 nick_eir_the_crowned:0 "the Crowned"
 nick_eir_the_crowned_desc:0 "Took a crown that Ireland had never seen."
 nick_eir_emperor_gael:0 "Emperor of the Gael"
 nick_eir_emperor_gael_desc:0 "Raised a throne over every Gaelic land."
 nick_eir_norse_bane:0 "Norse-Bane"
 nick_eir_norse_bane_desc:0 "Refused the Danegeld and sent the longships home."
