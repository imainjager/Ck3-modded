l_english:
 eir.1101.t:0 "The Field Fills"
 eir.1101.desc:0 "#bold The first carts have come over the hill, and the Óenach has begun.#!\n\nBy noon there are three thousand people on the field and four hundred tents. The brehons have set up their benches under the oak, the grooms are walking the horses down the race-course, and the traders are shouting the price of salt. Everyone looks to you to say what will happen first."
 eir.1101.a:0 "Open with the court: let the brehons sit before the games begin."
 eir.1101.b:0 "Open with the horse-race and give the day to the young."
 eir.1101.c:0 "Open with the cattle fair and take a toll on every beast."
 eir.1102.t:0 "Counting the Cattle"
 eir.1102.desc:0 "#bold The Óenach is over, the field is a bog and the accounts are on your table.#!\n\nThe steward reports that the beer ran out on the second night, that three tents were burned and one was married in, that a horse of unknown ownership won the great race and has not been claimed, and that the poets ate the king's portion twice."
 eir.1102.a:0 "Pay the costs and call it generosity."
 eir.1102.b:0 "Keep the unclaimed horse for the stud."
 eir.1102.c:0 "Send the bill to the lords who started the brawl."
 eir.1103.t:0 "Putting Out the Hearths"
 eir.1103.desc:0 "#bold On the eve of the quarter-day, every hearth in the land is put out, and you must light the first new one.#!\n\nA cold house is the strangest thing in the world. Even the dogs stand about with their ears down. The old men say that tonight is the night between, when the dead can walk and the living must be careful. In the dark, someone strikes a flint."
 eir.1103.a:0 "Strike the first spark yourself."
 eir.1103.b:0 "Hand the flint to the oldest woman in the hall."
 eir.1103.c:0 "Light it from a lamp and tell no one."
 eir.1104.t:0 "Dawn After the Fire"
 eir.1104.desc:0 "#bold The great fire has burned down to coals, the dancers have gone, and a thin light is coming up behind the hill.#!\n\nThe mead is gone, and so is half the harvest ale. Someone is asleep in the stable with a cow. The oldest priest in the district, who came to disapprove, is asleep against a wall with a smile on his face, and a mug."
 eir.1104.a:0 "Walk the hill alone and give thanks."
 eir.1104.b:0 "Wake the household and send them home with a brand each."
 eir.1104.c:0 "Leave quietly before anyone sees what you have been doing."
 eir.1105.t:0 "The Seating"
 eir.1105.desc:0 "#bold The kings are in the hall and the poets are looking at you for the order of the seats.#!\n\nEach king has a place his fathers held, and a hundred years of grievance about it. The hall has been laid out three times and rubbed out twice. The ollamh, who does not make suggestions, makes one with his eyebrows."
 eir.1105.a:0 "Seat each king where his fathers sat."
 eir.1105.b:0 "Seat your friends high and the rest by lot."
 eir.1105.c:0 "Seat nobody and have the feast in the open, on the grass."
 eir.1106.t:0 "The Kings Depart"
 eir.1106.desc:0 "#bold The Feis is over, and the kings are riding home.#!\n\nThey go in the order they came, with their poets behind them and their cattle ahead. Each rode in with a grievance and rides out with a promise. Whether the promises hold is a matter for the spring."
 eir.1106.a:0 "Send each king home with a gift."
 eir.1106.b:0 "Take a son of each king as a foster-child."
 eir.1106.c:0 "Let them go. The feast was the gift."
 eir.1107.t:0 "Barefoot at the Gate"
 eir.1107.desc:0 "#bold The company has reached the foot of the holy place, and the road ahead goes straight up.#!\n\nSomebody takes off his shoes. Somebody else is told by a monk that it would be better to keep them on. The stone is wet, the air is thin and above you, a small stone chapel hangs on the rock like a limpet."
 eir.1107.a:0 "Go on barefoot like the saints."
 eir.1107.b:0 "Keep your shoes and give the money saved to the poor."
 eir.1107.c:0 "Stop at the gate and send a monk up with your offering."
 eir.1108.t:0 "The Road Home"
 eir.1108.desc:0 "#bold The pilgrimage is over. The way back is the same road, but nobody seems to see it the same.#!\n\nThe company is quieter. Somebody has stopped swearing. Somebody else has promised to marry the girl he met at the hospice and written to his father about it. The hermit's blessing has not worn off, and nobody feels like arguing about anything."
 eir.1108.a:0 "Found a hospice at the foot of the hill."
 eir.1108.b:0 "Carry a relic stone home for your own chapel."
 eir.1108.c:0 "Walk home and say nothing to anyone of what you saw."
 eir.1109.t:0 "The Host Assembles"
 eir.1109.desc:0 "#bold The lords are in the field with their spears, and the camp stretches from the stream to the wood.#!\n\nEleven hundred men and a good many more cattle. The king's captain walks the lines with a face like a closed door. Someone has found a hill to stand on, and it is, for the moment, yours."
 eir.1109.a:0 "Review the host and give the captains a feast."
 eir.1109.b:0 "Name a champion to lead the van, and promise him the best portion."
 eir.1109.c:0 "March at dawn and tell nobody where."
 eir.1110.t:0 "Dividing the Plunder"
 eir.1110.desc:0 "#bold The host has come home, and there is a pile of cattle, silver and arguments in the middle of the camp.#!\n\nThe law gives the king a third and the captains a third and the rest to the host. The captains, who did the work, have views. The host, which did the dying, has more."
 eir.1110.a:0 "Follow the law to the letter."
 eir.1110.b:0 "Give the host more than the law says and keep the king's share small."
 eir.1110.c:0 "Keep the best cattle for yourself and call it the king's right."
 eir.1111.t:0 "The Poets Arrive"
 eir.1111.desc:0 "#bold The poets have come from all over the island, and they are not on speaking terms.#!\n\nA famous master from the south has refused to sit beside a young man from the north. A woman from Connacht has told the hall that her poems are better than the rest put together. In the corner, an old man with a harp is tuning, and everyone is quietly afraid of him."
 eir.1111.a:0 "Seat the old harper at the head."
 eir.1111.b:0 "Seat them by the number of verses they know."
 eir.1111.c:0 "Let them choose their own seats and watch the fight."
 eir.1112.t:0 "The Chair Awarded"
 eir.1112.desc:0 "#bold The contest is done and the king must name the poet who will sit in the chief's chair.#!\n\nThere is one candidate who was good, one who was clever and one who was very good indeed and made an enemy of half the room. The winners of the others' praise are hovering. The harp is still ringing."
 eir.1112.a:0 "Name the best poet, whatever the room thinks."
 eir.1112.b:0 "Name the clever one: he will be easier to manage."
 eir.1112.c:0 "Name nobody. Let them fight for it at the next contest."
 eir.1113.t:0 "The Young Men Ask for a Táin"
 eir.1113.desc:0 "#bold Your sons and the sons of your lords have asked for a táin of their own, and they are very polite about it.#!\n\nThey stand in a row with their spears and their best cloaks, and the eldest does the talking. They want a herd, a ford, a story and a poet to tell it. In return they promise not to start a war. They promise it with the faces of young men who plan to start one anyway."
 eir.1113.a:0 "Bless the raid and send your poet with them."
 eir.1113.b:0 "Give them a neighbour to raid, and a limit."
 eir.1113.c:0 "Let them go, and pay the damages later."
 eir.1114.t:0 "The Fleet Puts Out"
 eir.1114.desc:0 "#bold Forty curraghs and a dozen longer ships are leaving the harbour, and the whole town has come to watch.#!\n\nThe captains have drawn lots for the coasts. One is for Wales and another for the Isle of Man. One, a very young man, has announced he is going to Brittany and that he will bring back wine. The old sailors say nothing; they have seen the young captains go out and some of them come back."
 eir.1114.a:0 "Send the fleet with your blessing and a priest in every ship."
 eir.1114.b:0 "Take command of the greatest ship yourself."
 eir.1114.c:0 "Keep half the fleet at home against the Norse."
