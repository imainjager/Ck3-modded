l_english:
 eir.0180.t:0 "A Patron Saint for the Reign"
 eir.0180.desc:0 "#bold Three saints have a claim on your court, and you can honour only one properly.#!\n\nBrigid's nuns tend a fire that has not gone out since before the church. Colmcille's monks keep the psalters he copied by moonlight. Patrick's bishops carry his bell and his staff. Each will bless a king who honours them, and each notices if a king prefers another."
 eir.0180.a:0 "Brigid: tend the flame at Kildare."
 eir.0180.b:0 "Colmcille: endow the psalters and the island monasteries."
 eir.0180.c:0 "Patrick: raise a shrine at his bell and staff."
 eir.0180.d:0 "Honour all three equally, and satisfy none."
 eir.0190.t:0 "The Sea-Kings Come to Terms"
 eir.0190.desc:0 "#bold The Norse-Gael merchants of the Irish Sea have come to see what a sea-king of Ireland is worth.#!\n\nThey are traders from Dublin, Man and the Hebrides, men who speak three languages and carry silver in their boots. For generations they have taken Irish cattle and slaves at their own prices. A king who builds quays and ships may finally set the price himself."
 eir.0190.a:0 "Invite them to build quays in your harbours, on your terms."
 eir.0190.b:0 "Charter an Irish merchant guild to compete with them."
 eir.0190.c:0 "Levy a toll on every foreign ship that enters."
 eir.0190.d:0 "Buy longships from them and make your own fleet."
 eir.0190.e:0 "Send them away. The Gael have never needed the Norse."
 eir.0191.t:0 "The Coast Takes Notice"
 eir.0191.desc:0 "#bold A year after you proclaimed yourself master of the Irish Sea, the rival coasts have decided how to answer.#!\n\nChester has raised its harbour dues. The jarls of Man are courting the Welsh. A Bristol merchant has been caught smuggling hides past your customs. Your own captains are asking whether they may seize the next foreign ship that does not dip its flag."
 eir.0191.a:0 "Hold a naval review off Dublin, and let the world see the fleet."
 eir.0191.b:0 "Blockade a rival port until the dues are lowered."
 eir.0191.c:0 "Offer free passage to allies and hostages to the doubtful."
 eir.0191.d:0 "Seize the smuggler's cargo and hang the man."
