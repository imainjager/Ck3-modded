l_english:
 eir.out.arm_pirates:0 "Pirates took the rest"
 eir.out.arm_silver:0 "He returns with silver and news"
 eir.out.arm_storm:0 "A storm took half the cargo"
 eir.out.banshee_laugh_bad:0 "Ill luck follows. Someone close to you falls sick."
 eir.out.banshee_laugh_ok:0 "The omen passes, and your feast is remembered for its boldness."
 eir.out.bard_young_bad:0 "He writes an insulting verse"
 eir.out.bard_young_good:0 "He is as good as he boasts"
 eir.out.barrow_dread:0 "Something followed you home, and it has not left."
 eir.out.barrow_gift:0 "The dead speak to you kindly, and you wake at peace."
 eir.out.block_fail:0 "The blockade is broken"
 eir.out.block_win:0 "The port yields"
 eir.out.bog_empty:0 "Nothing else turns up, but the gold ring is real."
 eir.out.bog_more:0 "A hoard of butter kegs and a gold ring"
 eir.out.bog_mud:0 "Nothing but mud"
 eir.out.bog_rich:0 "The bog yields a hoard of old gold."
 eir.out.captain_leaves:0 "The captain takes offence and leaves, cursing your name."
 eir.out.captain_loyal:0 "The captain proves his word and joins you for less."
 eir.out.castle_burns:0 "The unfinished castle burns, and the masons flee."
 eir.out.castle_holds:0 "The garrison holds, and the clans scatter with losses."
 eir.out.cattle_lost:0 "The raiders vanish into the hills with the herd."
 eir.out.cattle_recovered:0 "You catch the raiders and bring the herd home."
 eir.out.challenge_lost:0 "You are bested, and the court whispers."
 eir.out.challenge_won:0 "[eir_rival.GetShortUIName] yields before the whole court."
 eir.out.church_condemns:0 "The bishops condemn the invasion, and the foreign lord withdraws."
 eir.out.church_silent:0 "The bishops mutter, and the foreign host marches."
 eir.out.circ_bitter:0 "One leaves in a rage"
 eir.out.circ_judged:0 "Both accept your ruling"
 eir.out.clontarf_costly:0 "Victory at a terrible price"
 eir.out.clontarf_victory:0 "The Norse are broken"
 eir.out.clontarf_wounded:0 "You fall in the shield-wall"
 eir.out.croz_settled:0 "The monks accept your ruling"
 eir.out.croz_unrest:0 "Two monasteries stop speaking to each other"
 eir.out.duel_draw:0 "You fight to a draw, and both walk away"
 eir.out.duel_loss:0 "He wounds you badly"
 eir.out.duel_proxy_loss:0 "Your champion falls"
 eir.out.duel_proxy_win:0 "Your champion wins"
 eir.out.duel_win:0 "You cut him down"
 eir.out.fost_loyal:0 "The child answers well"
 eir.out.fost_torn:0 "The child sides with the foster-father"
 eir.out.g101l:0 "Both sides learn you are a liar"
 eir.out.g101w:0 "You come out richer and unhurt"
 eir.out.g104l:0 "He is better than he looks"
 eir.out.g104w:0 "You cut him down"
 eir.out.g106l:0 "The bishops call it sacrilege"
 eir.out.g106w:0 "A fat store of silver and no one to stop you"
 eir.out.g122l:0 "He takes it as an insult and leaves"
 eir.out.g122w:0 "He swears, and means it"
 eir.out.g123l:0 "They walk out of the hall"
 eir.out.g123w:0 "The lords hand over their sons without complaint"
 eir.out.g153l:0 "It is lost in a river crossing"
 eir.out.g153w:0 "It is read aloud before every battle"
 eir.out.g156l:0 "He thinks you are greedy and says so"
 eir.out.g156w:0 "Twelve galleys arrive in spring"
 eir.out.g167l:0 "A blow knocks it off and it is lost in the mud"
 eir.out.g167w:0 "The old gold gleams, and your men follow it"
 eir.out.g22l:0 "They turn and ambush your riders"
 eir.out.g22w:0 "You run them to ground"
 eir.out.g32l:0 "A spark catches the thatch of the barn"
 eir.out.g32w:0 "The herds thrive for a year"
 eir.out.g34l:0 "You come home shaken, and quiet"
 eir.out.g34w:0 "You find what the banshee was warning of"
 eir.out.g38l:0 "The bank collapses on the diggers"
 eir.out.g38w:0 "A second hoard, deeper still"
 eir.out.g45l:0 "He names a year, and it is close"
 eir.out.g45w:0 "He sees a long and honoured life"
 eir.out.g50l:0 "It tears your best cloak and bites your hand"
 eir.out.g50w:0 "A hound who will follow you into any hall"
 eir.out.g60l:0 "The Uí Néill laugh in your face"
 eir.out.g60w:0 "The kings of the south cheer"
 eir.out.g72l:0 "A storm scatters the ships off the Mull"
 eir.out.g72w:0 "The Gaels of the north are overjoyed"
 eir.out.g80l:0 "Rain falls on the vellum"
 eir.out.g80w:0 "The people weep and pray"
 eir.out.jarl_accepts:0 "The jarl accepts your hospitality and sails on as a friend."
 eir.out.jarl_lies:0 "The jarl swears, then breaks his oath on the first fair wind."
 eir.out.jarl_marries:0 "The jarl accepts the match and becomes a cautious ally."
 eir.out.jarl_refuses:0 "The jarl takes your gifts and your land."
 eir.out.jarl_scoffs:0 "The jarl takes the bride and the county."
 eir.out.jarl_swears:0 "The jarl swears on his axe and sails away."
 eir.out.kin_refuse:0 "The kin quarrel, and the turmoil deepens."
 eir.out.kin_swear:0 "The kin swear to you at Tara."
 eir.out.king_brother_fails:0 "The cousins unite against him"
 eir.out.king_brother_ok:0 "The brother holds the throne"
 eir.out.law_clear:0 "The case is settled, and both sides accept the verdict."
