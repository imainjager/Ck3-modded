l_english:
 eir.out.banshee_laugh_bad:0 "Ill luck follows. Someone close to you falls sick."
 eir.out.banshee_laugh_ok:0 "The omen passes, and your feast is remembered for its boldness."
 eir.out.bard_young_bad:0 "He writes an insulting verse"
 eir.out.bard_young_good:0 "He is as good as he boasts"
 eir.out.barrow_dread:0 "Something followed you home, and it has not left."
 eir.out.barrow_gift:0 "The dead speak to you kindly, and you wake at peace."
 eir.out.bog_empty:0 "Nothing else turns up, but the gold ring is real."
 eir.out.bog_rich:0 "The bog yields a hoard of old gold."
 eir.out.captain_leaves:0 "The captain takes offence and leaves, cursing your name."
 eir.out.captain_loyal:0 "The captain proves his word and joins you for less."
 eir.out.castle_burns:0 "The unfinished castle burns, and the masons flee."
 eir.out.castle_holds:0 "The garrison holds, and the clans scatter with losses."
 eir.out.cattle_lost:0 "The raiders vanish into the hills with the herd."
 eir.out.cattle_recovered:0 "You catch the raiders and bring the herd home."
 eir.out.challenge_lost:0 "You are bested, and the court whispers."
 eir.out.challenge_won:0 "[eir_rival.GetShortUIName] yields before the whole court."
 eir.out.church_condemns:0 "The bishops condemn the invasion, and the foreign lord withdraws."
 eir.out.church_silent:0 "The bishops mutter, and the foreign host marches."
 eir.out.clontarf_costly:0 "Victory at a terrible price"
 eir.out.clontarf_victory:0 "The Norse are broken"
 eir.out.clontarf_wounded:0 "You fall in the shield-wall"
 eir.out.fost_loyal:0 "The child answers well"
 eir.out.fost_torn:0 "The child sides with the foster-father"
 eir.out.jarl_accepts:0 "The jarl accepts your hospitality and sails on as a friend."
 eir.out.jarl_lies:0 "The jarl swears, then breaks his oath on the first fair wind."
 eir.out.jarl_marries:0 "The jarl accepts the match and becomes a cautious ally."
 eir.out.jarl_refuses:0 "The jarl takes your gifts and your land."
 eir.out.jarl_scoffs:0 "The jarl takes the bride and the county."
 eir.out.jarl_swears:0 "The jarl swears on his axe and sails away."
 eir.out.kin_refuse:0 "The kin quarrel, and the turmoil deepens."
 eir.out.kin_swear:0 "The kin swear to you at Tara."
 eir.out.law_clear:0 "The case is settled, and both sides accept the verdict."
 eir.out.law_confused:0 "The law is older and more complicated than you remembered, and the verdict is mocked."
 eir.out.man_refuses:0 "The jarls laugh and sail away"
 eir.out.man_submits:0 "The jarls kneel"
 eir.out.monastery_lost:0 "You arrive too late. The monastery burns."
 eir.out.monastery_saved:0 "You arrive in time and the raiders flee."
 eir.out.plot_exposed:0 "The plot is exposed, and your kin turn on you."
 eir.out.price_agreed:0 "The two families agree, and the feud ends."
 eir.out.price_refused:0 "Neither side accepts, and each blames you."
 eir.out.rapp_betrayed:0 "He sells your name to the raiders"
 eir.out.rapp_calmed:0 "The raiders are calmed"
 eir.out.rapp_refused:0 "The chieftain only laughs"
 eir.out.reac_boast_bad:0 "A rival laughs openly"
 eir.out.reac_boast_good:0 "The court is impressed"
 eir.out.reply_falls:0 "Your reply is worse than the satire."
 eir.out.reply_lands:0 "Your reply is so good the poet withdraws his satire."
 eir.out.rival_removed:0 "[eir_rival.GetShortUIName] dies of a sudden fever."
 eir.out.salmon_burn:0 "You burn your thumb, and the story ends there."
 eir.out.salmon_wisdom:0 "The first bite is surprisingly good, and the fish's wisdom stays with you."
 eir.out.stag_escapes:0 "The stag leads you a merry chase and escapes."
 eir.out.stag_taken:0 "You take the great stag after a day's chase."
 eir.out.synod_fails:0 "The synod ends in a shouting match, and the strife deepens."
 eir.out.synod_peace:0 "The synod finds a compromise both sides can live with."
 eir.out.tara_costly:0 "A bloody victory"
 eir.out.tara_victory:0 "The Norse are broken"
 eir.out.tara_wounded:0 "You are badly hurt"
 eir.out.verse_falls:0 "Your verse is mocked, and the poet wins the crowd."
 eir.out.verse_lands:0 "The court roars its approval."
 eir.out.well_answers:0 "The rains stop, and the people credit the procession."
 eir.out.well_fraud:0 "The priest finds a local trickster at work, and you are saved the embarrassment."
 eir.out.well_real:0 "The priest reports a true wonder, and the pilgrims are right."
 eir.out.well_silent:0 "The sky stays grey, and the people grow restless."
 eir.out.wrestle_lost:0 "You are thrown in the mud, and the crowd goes wild for a different reason."
 eir.out.wrestle_won:0 "You throw every challenger, and the crowd goes wild."
