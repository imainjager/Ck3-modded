l_english:
 eir.0310.t:0 "The Derbfine Assembles"
 eir.0310.desc:0 "#bold The adult men of the royal kindred have come to your hall unasked, to talk about who comes after you.#!\n\nFour generations are in the room: uncles who remember the last king, cousins who remember nothing, and a pair of nephews who have not stopped looking at each other. The law says any of them might be named. The poets have started composing three different laments."
 eir.0310.a:0 "Name your heir openly before them all."
 eir.0310.b:0 "Ask the Brehon to rule on the law of the succession."
 eir.0310.c:0 "Play the cousins against each other."
 eir.0310.d:0 "Send the loudest cousin on pilgrimage."
 eir.0310.e:0 "Break up the meeting and tell them to go home."
 eir.0311.t:0 "The Blinded Cousin"
 eir.0311.desc:0 "#bold A cousin with a good claim has been found with his eyes put out, and the court is looking at you.#!\n\nIn the old law a blind man cannot be king, and everyone knows it. He was found in a barn two miles from your hall, and was carried in by a farmer who refuses to say who sent him. He says he knows who did it. He says he will say, if you promise something."
 eir.0311.a:0 "Swear to find the culprit and take him to justice."
 eir.0311.b:0 "Offer him honour-price and a place in your household."
 eir.0311.c:0 "Hush it up: the realm cannot afford this scandal."
 eir.0311.d:0 "Take the cousin's word and accuse your own rival."
 eir.0312.t:0 "The Foster-Brother Comes Calling"
 eir.0312.desc:0 "#bold A man you were raised beside has ridden half the island to ask a favour.#!\n\nHe is thinner than you remember and wears a better cloak than he can afford. At the table he calls you by the name you used when you were nine. The bond of fosterage is stronger than blood, the law says, and he has come to find out how much stronger."
 eir.0312.a:0 "Give him whatever he asks."
 eir.0312.b:0 "Give him a post at court, and watch him."
 eir.0312.c:0 "Refuse: a king has no foster-brothers."
 eir.0312.d:0 "Ask what he really wants."
 eir.0313.t:0 "A Pedigree Improved"
 eir.0313.desc:0 "#bold Your chief genealogist has found an ancestor you did not know you had.#!\n\nHe is nine generations back, a king of the north, and the connecting names are very clear in the book. They are, in fact, in the genealogist's own hand, and in ink slightly newer than the vellum. The ancestor would give you a claim that nobody else can match."
 eir.0313.a:0 "Accept the pedigree, and proclaim it."
 eir.0313.b:0 "Have the genealogist check the sources properly."
 eir.0313.c:0 "Pay the genealogist to say nothing and burn the page."
 eir.0313.d:0 "Use the pedigree in secret, only in private councils."
 eir.0314.t:0 "The Oath-Breaker"
 eir.0314.desc:0 "#bold A vassal who swore on the relics has gone over to your enemy.#!\n\nHe was at your table last winter, with his hand on a saint's bone. He has sent a message, politely worded and without apology, saying that the oath was to a different king than the one you have become. The bishops are watching to see whether an oath still means anything."
 eir.0314.a:0 "Demand the honour-price in front of the court."
 eir.0314.b:0 "Ride to his hall and take hostages."
 eir.0314.c:0 "Offer to forgive him if he returns to the fold."
 eir.0314.d:0 "Ask the Church to curse him."
 eir.0320.t:0 "Settlers from the Longships"
 eir.0320.desc:0 "#bold Forty Norse families have beached their ships and want to farm a stretch of your coast.#!\n\nThey are not raiders: there are children, goats and a priest in a cloak of dubious allegiance. They have been driven from somewhere by someone, and they have silver. A reeve says they would double the yield of a county's worst land and that nobody will sleep soundly."
 eir.0320.a:0 "Let them settle, and tax them."
 eir.0320.b:0 "Let them settle, in exchange for oaths and a hostage each."
 eir.0320.c:0 "Drive them off."
 eir.0320.d:0 "Have the priest baptise them and take them in."
 eir.0321.t:0 "Captives Brought Home"
 eir.0321.desc:0 "#bold A ship has landed with sixty Irish captives bought back from a Norse slave market.#!\n\nThey are thin and sunburned and some will never speak of what they saw. They were taken from your own coasts, from monasteries, from farms you remember burning. The captain who bought them back wants nothing but the cost of the trip, and the right to say that he did it."
 eir.0321.a:0 "Pay the captain and settle the captives on good land."
 eir.0321.b:0 "Take the strongest into your own household."
 eir.0321.c:0 "Have the priests hear their stories, and write them down."
 eir.0321.d:0 "Use the story to rally the lords against the Norse."
 eir.0322.t:0 "A Norse-Gael Bride"
 eir.0322.desc:0 "#bold A Norse-Gael lord of the coast wants to marry his sister into your house.#!\n\nShe is called Gormlaith or Gormflaith or something very like it depending on whose scribe you ask. She is clever, she reads, and she has been widowed twice. Her brother holds the best harbour on the coast and a hundred ships, and would like a friend who is not also a rival."
 eir.0322.a:0 "Take her as your own spouse."
 eir.0322.b:0 "Marry her to your heir."
 eir.0322.c:0 "Refuse, but offer a foster-son as a pledge of friendship."
 eir.0322.d:0 "Refuse flatly."
 eir.0323.t:0 "Storm off the Skerries"
 eir.0323.desc:0 "#bold Your ship has lost its mast in a gale, and the crew are drawing lots to see who will be thrown over first.#!\n\nThe coast is ten miles off and invisible. The helmsman is praying in Norse, the monk is praying in Latin, and a very young deckhand is praying in Irish, loudest of all. The water is the colour of lead. Somebody has to decide."
 eir.0323.a:0 "Pray aloud with the monk and set an example."
 eir.0323.b:0 "Take the steering oar yourself."
 eir.0323.c:0 "Throw the cargo over and save the people."
 eir.0323.d:0 "Cut the ropes and let the sea decide."
