l_english:
 eir.1201.t:0 "The Herds of the Border"
 eir.1201.desc:0 "#bold The raid has gathered more cattle than your men can drive, and the borderers are watching from the ridge.#!\n\nThey are good cattle: red-flecked, long-horned, fed on the lush grass of the river meadows. Your men have been gathering them since dawn and are now arguing about which of them to eat. The lord of the land has not answered the smoke, and nobody can say whether that is cowardice or patience."
 eir.1201.a:0 "Drive every beast home."
 eir.1201.b:0 "Slaughter half of them and feast on the spot."
 eir.1201.c:0 "Leave a tithe of the herd at the church door."
 eir.1202.t:0 "Burn the Fields"
 eir.1202.desc:0 "#bold The standing grain in the valley is ripe, and your captains are looking at it the way a smith looks at iron.#!\n\nA match, a wind from the south and an hour's patience would take a year of the valley's bread. Some of your men think it is good policy. Others have farms of their own."
 eir.1202.a:0 "Burn everything that will burn."
 eir.1202.b:0 "Burn the barns and spare the fields."
 eir.1202.c:0 "Spare the harvest and carry it home."
 eir.1203.t:0 "The Satire"
 eir.1203.desc:0 "#bold Your poet has composed a satire on the lord of the burned land, and he is asking whether he may sing it.#!\n\nIt is four verses, and the third rhymes the lord's name with something the lord's mother would not have liked. A Gaelic satire is a serious weapon: it can raise blisters on a man's face and take the shine off a name. The poet is looking at you with the fixed expression of an artist who knows he has done well."
 eir.1203.a:0 "Let him sing it at every fire between here and home."
 eir.1203.b:0 "Have it sung in the lord's own hall, by the lord's own poet."
 eir.1203.c:0 "Pay the poet to keep it to himself."
 eir.1204.t:0 "Hostages at the Ford"
 eir.1204.desc:0 "#bold Your raiders have taken a few of the lord's kin at the ford, and they are sitting in a row with their hands tied.#!\n\nThere is a girl of about twelve who has not stopped glaring at you. There is a boy of about six who has not stopped crying. There is an old nurse who has not stopped talking. The raiders are, it seems, as unsettled as the hostages."
 eir.1204.a:0 "Take the lord's youngest son as a foster-child and a hostage."
 eir.1204.b:0 "Take cattle in place of the hostages."
 eir.1204.c:0 "Free them and send them home with a gift."
 eir.1205.t:0 "Settle the Raided Land"
 eir.1205.desc:0 "#bold The raid has done more than anyone expected, and your captains are suggesting that the land might as well be yours.#!\n\nThe lord's levy has gone. The hall stands empty. The fields are fat and the villagers are, on the evidence, willing to be told what language they speak. A priest from your court points out, with a certain diffidence, that there is a church in the next valley that might be put to good use.\n\nThe raid could simply end here. Or it could become something else entirely."
 eir.1205.a:0 "Settle your own people here. The land is yours now."
 eir.1205.b:0 "Burn it to the ground and leave it empty."
 eir.1205.c:0 "Take the county's tribute for a year and go home."
 eir.1205.d:0 "Withdraw. A raid is a raid."
 eir.1206.t:0 "The Church Is Burning"
 eir.1206.desc:0 "#bold The raiders have broken into the church, and the monks are standing in front of the altar with their arms folded.#!\n\nThere is silver on the altar, a gospel book in a shrine and a very large abbot. The abbot is pointing out, in a clear voice, that the saint buried here was a king's son and a friend of Columba. A young raider is considering the silver with great attention."
 eir.1206.a:0 "Strip the altar and burn the roof."
 eir.1206.b:0 "Take the silver only and leave the saint alone."
 eir.1206.c:0 "Leave the church untouched and ask the abbot for a blessing."
 eir.1207.t:0 "The Slave Train"
 eir.1207.desc:0 "#bold Your men are bringing a line of captives down the road, tied at the neck, and they are expecting you to say what happens next.#!\n\nThere are two hundred of them: farmhands, a few craftsmen, a priest and a very angry woman who is the village's brewer. The slave-traders from Dublin and Bristol are already hovering at the edge of the camp."
 eir.1207.a:0 "Sell them to the merchants."
 eir.1207.b:0 "Settle them as workers on your own land."
 eir.1207.c:0 "Free the priest and the monks and ransom the rest."
 eir.1208.t:0 "The Ogham of the Raid"
 eir.1208.desc:0 "#bold Your poet suggests that the raid deserves a stone: the names of the fallen, and of the land that has been taken.#!\n\nIn Ireland and Wales a pillar stone is a legal document. An ogham stone that names a boundary names a claim, and a claim that is cut in stone is very hard to argue with. The stone-cutter, who has been standing very patiently with his chisel, says it will take three days."
 eir.1208.a:0 "Cut your name and the name of the land on the stone."
 eir.1208.b:0 "Cut only the names of the fallen."
 eir.1208.c:0 "Leave no stone: a raid is not a boundary."
 eir.1209.t:0 "The Champion at the Ford"
 eir.1209.desc:0 "#bold The lord's champion has come down to the ford alone and is calling you out by name.#!\n\nHe is large, he is unarmoured and he is whistling. Your men have gone quiet. By old custom, a champion who calls a king out at a ford cannot be refused without shame, and cannot be refused with honour either."
 eir.1209.a:0 "Fight him at the ford."
 eir.1209.b:0 "Offer to settle it by wrestling."
 eir.1209.c:0 "Order the archers to shoot him."
 eir.1210.t:0 "Poets at the Fire"
 eir.1210.desc:0 "#bold That night, in the camp, the poets want their share of the spoils, and a say in the story.#!\n\nThey have been with the host since the river. They have seen the cattle driven, the barns burned and the champion fall. A good poet will make a raid into a saga; a poor one, or a hurt one, will make it into a joke."
 eir.1210.a:0 "Give each poet a share of the spoils."
 eir.1210.b:0 "Give them a feast and a few cows."
 eir.1210.c:0 "Give them nothing: poets are paid in praise."
 eir.1211.t:0 "The Captain Wants More"
 eir.1211.desc:0 "#bold One of your captains has come to your tent in the evening and, politely, has asked about his share.#!\n\nHe led the van and took the ford. He lost his brother in the first charge. He does not raise his voice, which is how you know he has thought about this on the walk across the camp."
 eir.1211.a:0 "Give him a double share and the best of the herd."
 eir.1211.b:0 "Give him the share the law allows."
 eir.1211.c:0 "Tell him his brother's blood was part of the bargain."
 eir.1212.t:0 "Smoke on the Border"
 eir.1212.desc:0 "#bold Smoke is rising from your border county, and the horn has been sounded on the hill.#!\n\nThe shepherd who brought the news is out of breath and has lost a boot. The raiders came at dawn, took the herds, burned the barns and left. They did not come for land; they came to say they could. Your steward is looking at the ground and your captain is looking at you."
 eir.1212.a:0 "Swear on the relics to avenge it."
 eir.1212.b:0 "Call out the levy and ride to the ford."
 eir.1212.c:0 "Pay the raiders to go home."
 eir.1212.d:0 "Send a poet to the raider's court with a message."
 eir.1213.t:0 "A Burned Hall"
 eir.1213.desc:0 "#bold The hall at the border has been burned to the ground, and the lord of the hall has come to you with ash on his cloak.#!\n\nHe does not ask for justice. He asks for roofs. He has a wife, six children and sixty tenants, and the first frost is five weeks away. The Brehon who has come with him is pointing out that the old law provides for such a case, and that the price is called the blood-price."
 eir.1213.a:0 "Rebuild the hall and the farms at your own cost."
 eir.1213.b:0 "Demand the blood-price from the raider by right."
 eir.1213.c:0 "Tell him to rebuild it himself."
 eir.1214.t:0 "The Lament"
 eir.1214.desc:0 "#bold Your poet has composed a lament for the burned land, and every hall on the island is going to hear it.#!\n\nIt is not a satire: it names no names. It describes the smoke, the herds, the widows and the boy who stood at the gate. It is beautiful. By the end of the third verse the whole hall is silent and your steward has, unprofessionally, wiped his eyes."
 eir.1214.a:0 "Send it round the courts of Ireland."
 eir.1214.b:0 "Keep it for your own hall."
 eir.1214.c:0 "Have the poet add a curse on the raider's line."
 eir.1215.t:0 "The Stolen Herds"
 eir.1215.desc:0 "#bold Your men have found the trail of the stolen cattle: a broad churned track through the heather, leading west.#!\n\nIt will be at least two days' ride. The raiders will drive the herd slowly, since cattle are not fast, and they will stop to rest at the river. A small, quick force might catch them. A larger one will not be quick."
 eir.1215.a:0 "Send the best riders and hurry."
 eir.1215.b:0 "Send a heavy force and take the long road."
 eir.1215.c:0 "Let the herds go and rebuild your stock."
 eir.1216.t:0 "The Captive Kin"
 eir.1216.desc:0 "#bold Some of your relatives were taken in the raid, and the raiders' herald is waiting at the gate with a price.#!\n\nHe is courteous in the way of men who are about to be rude. He says the captives are well and have been fed. He says the price is thirty cows, a bronze cauldron and a pledge that you will not pursue. He has, he notes, a very long way to go home."
 eir.1216.a:0 "Pay the ransom in full."
 eir.1216.b:0 "Refuse, and ride to rescue them."
 eir.1216.c:0 "Abandon them: some debts are not worth paying."
 eir.1217.t:0 "The Raider Offers Terms"
 eir.1217.desc:0 "#bold A herald from the raider has arrived with an offer: a share of the plunder, in exchange for peace.#!\n\nIt is a good offer, as such offers go: a third of the herd, an apology in the old form, a vow not to return for seven years. The only thing that seems to be missing is any sign of remorse."
 eir.1217.a:0 "Accept the terms and the cattle."
 eir.1217.b:0 "Refuse the offer in front of the whole court."
 eir.1217.c:0 "Demand the full blood-price or nothing."
 eir.1218.t:0 "A Meeting at the Ford"
 eir.1218.desc:0 "#bold The raider has sent word that he is willing to meet you at the ford, alone, at dawn.#!\n\nA ford is neutral ground in Ireland and Wales: no weapons, no priests, one witness each. The raider arrives on a grey horse. He sits on a stone, takes off his hat, and says that he has come to say what happened."
 eir.1218.a:0 "Swear peace on the stone."
 eir.1218.b:0 "Demand a price and a hostage."
 eir.1218.c:0 "Spit on the stone and ride away."
 eir.1219.t:0 "Revenge Raid?"
 eir.1219.desc:0 "#bold Your captains have gathered in the hall, with their spears, to ask for leave to answer the raid.#!\n\nThey all speak at once, until the oldest of them clears his throat. He says that the law of the hawk allows a man to take back what was taken, and a little more for the trouble. He says the borderlands of the raider are lightly held. He says nothing about the poets, who are very quiet."
 eir.1219.a:0 "Give them leave and your blessing."
 eir.1219.b:0 "Tell them to wait for the spring."
 eir.1219.c:0 "Forbid it, in the name of the peace."
 eir.1220.t:0 "The Loot Comes Home"
 eir.1220.desc:0 "#bold The raiders have come home, with cattle, silver and an air of great achievement.#!\n\nThe whole household has turned out to see them. The cattle are driven into the pen. The silver is counted on the table. The captains are already telling the story, with improvements."
 eir.1220.a:0 "Divide it fairly by the old law."
 eir.1220.b:0 "Give the lion's share to the captains."
 eir.1220.c:0 "Keep the best for the treasury."
 eir.1221.t:0 "The Story Spreads"
 eir.1221.desc:0 "#bold The raid has become a story, and the story is changing in the telling.#!\n\nIn the first version, you took three hundred cattle. In the second, you took six hundred, killed a champion and burned a hall. In the third version you rode into the lord's own bedchamber and took the blanket from his bed. You are beginning to feel that you might have been there."
 eir.1221.a:0 "Let the story grow."
 eir.1221.b:0 "Correct the story, quietly, when asked."
 eir.1221.c:0 "Have a poet write the true version and keep it in the hall."
 eir.1222.t:0 "A Young Raider Distinguishes Himself"
 eir.1222.desc:0 "#bold One of the youngest in the raid, a boy of sixteen, took a banner from the lord's guard and rode home with it over his shoulder.#!\n\nHis mother is a seamstress, his father is a horse-thief and he has the kind of confidence that is either destined for greatness or for a rope. The captains are watching to see what you do."
 eir.1222.a:0 "Knight him in front of the host."
 eir.1222.b:0 "Give him a horse and a cloak and send him back to his mother."
 eir.1222.c:0 "Take the banner and tell him he was lucky."
 eir.1223.t:0 "The Abbot's Share"
 eir.1223.desc:0 "#bold The abbot of the nearest monastery has asked, courteously, for his tenth of the spoils.#!\n\nHe did not say what it was for. He did say that the raiders who went out carried the monastery's blessing, that the Church has a long memory and that the library roof needs mending."
 eir.1223.a:0 "Give him the tenth, and a little more."
 eir.1223.b:0 "Give him a tenth of what is left after the captains."
 eir.1223.c:0 "Refuse: the spoils are the host's."
 eir.1224.t:0 "The Raiders Are Beaten"
 eir.1224.desc:0 "#bold Your raiders were caught on the road home and scattered, and the lord they robbed has the cattle.#!\n\nA few of the captains are straggling back with their cloaks torn and their stories unprepared. The lord's messenger is already on his way, probably with a list. The poets, who had been composing something heroic, are reconsidering."
 eir.1224.a:0 "Send the blood-price at once, with an apology."
 eir.1224.b:0 "Swear never to raid that lord again."
 eir.1224.c:0 "Swear revenge on the lord who beat you."
 eir.1225.t:0 "The Raiders Are Caught"
 eir.1225.desc:0 "#bold Your levy has caught the raiders on the road and brought a number of them back in chains.#!\n\nThey are a sorry sight. Half of them are wounded, the rest are scared and one is wearing a dead man's hat. The captain, a tall man with a scar, stands very straight and says that he will answer for them all."
 eir.1225.a:0 "Hang them on the hill where everyone can see."
 eir.1225.b:0 "Ransom the captains and release the rest."
 eir.1225.c:0 "Send them all home with a warning and some bread."
 eir.1226.t:0 "The Vow Has Not Been Kept"
 eir.1226.desc:0 "#bold The relics on which you swore revenge have been taken out of the chest, and the poet has reminded you of the oath.#!\n\nYears have passed. The anger has cooled, a little, in some places. The poet recites the vow in full, as it was sworn, in the voice of someone reading a bill. Nobody in the hall is quite looking at you."
 eir.1226.a:0 "Renew the vow."
 eir.1226.b:0 "Forgive the raider and let the vow lapse."
 eir.1226.c:0 "Send the blood-price demand and leave the vow open."
