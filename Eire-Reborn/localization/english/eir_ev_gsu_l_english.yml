l_english:
 eir.0900.t:0 "The Great Saxon Uprising"
 eir.0900.desc:0 "#bold Every English duchy you hold has risen at once, each under a leader of its own, and the beacons are lit from the Tweed to the Channel.#!\n\nIt was planned for years. A thane in each duchy, a priest to bless it, a brother-in-law with a spare horse. They met at the old stone circles at midsummer and swore, in English, that the island would not be ruled in Gaelic. Each of them seized a county in the night. By the morning there were armies on the roads, and every one of them had the same flag.\n\nYour stewards have counted the leaders. There are a good many."
 eir.0900.v1:0 "#bold Every English duchy you hold has risen at once, each under a leader of its own, and the beacons are lit from the Tweed to the Channel.#!\n\nYou thought it was over. You had put the thanes down, hung the leaders and pardoned the sons, and the Church had called it a settled peace. The sons are grown. The old stone circles were visited again at midsummer, and again every duchy rose together, with better organisation and a longer memory.\n\nThey are calling it the Second Rising. They are not calling it a last one."
 eir.0900.a:0 "Call the hosting and meet them where they stand."
 eir.0900.b:0 "Send for the thanes and offer terms before the armies close."
 eir.0900.c:0 "Rally the loyal English lords and set them against the rebels."
 eir.0900.d:0 "Hire every spear in the Isles."
 eir.0900.e:0 "Order the bishops to preach against rebellion."
 eir.0901.t:0 "The Beacons of Wessex"
 eir.0901.desc:0 "#bold The first campaign is under way, and the English are lighting beacons to call every hamlet to the colours.#!\n\nFrom the hills above Winchester you can count nine. They burn in a line to the coast. Each has a priest and a reeve beside it who have promised, by a wooden cross, that when the fire is lit they will send their men. The fires are the leaders' best weapon. They are also the only thing that stops the English from being a hundred villages."
 eir.0901.a:0 "Proclaim a pardon for any man who lays down arms by Michaelmas."
 eir.0901.b:0 "Send agents to buy the reeves."
 eir.0901.c:0 "Hang the watchmen and burn the beacons."
 eir.0901.d:0 "Strengthen every garrison and sit tight."
 eir.0902.t:0 "Treachery in the Rebel Camp"
 eir.0902.desc:0 "#bold Not every English leader is quite as loyal to the English as he says.#!\n\nIt begins with a letter, as treachery does. A captain of one of the rebel hosts has written to say that his lord has been promised an earldom by the English crown if he wins, and nothing at all if he does not. A second captain has copied the letter. A third has asked for a safe-conduct. The camps are buzzing with rumour, and one of the rumours is true."
 eir.0902.a:0 "Bribe the captains and have them leave before the next battle."
 eir.0902.b:0 "Forge a letter that sets two leaders against each other."
 eir.0902.c:0 "Offer the strongest leader a county of his own to change sides."
 eir.0902.d:0 "Ignore the rumours. A man who wins does not need spies."
 eir.0903.t:0 "The Council at Winchester"
 eir.0903.desc:0 "#bold The rebel leaders have met at last, and they have chosen a single captain to speak for all of them.#!\n\nIt took them a year and a half to do what the Irish kings have never done. They sat in the old hall at Winchester, nine men and a woman who had brought her father's sword, and they agreed that if they hang separately they will hang together. They have chosen a marshal. They have chosen a day. The next battle will be a battle between two armies, not an army and a mob."
 eir.0903.a:0 "Strike the council before the marshal can organise it."
 eir.0903.b:0 "Parley with the marshal and offer a new charter of English rights."
 eir.0903.c:0 "Burn the shires the council is meeting in."
 eir.0903.d:0 "Hire a second company and call the Gaelic kings."
 eir.0904.t:0 "A Duchy Holds"
 eir.0904.desc:0 "#bold The rising in [eir_up_duchy.GetName] has been put down, and its leader is in your hands.#!\n\nHe was not a bad commander. He had a good position and a strong army, and he lost it by a day's march. He is thirty, with a broken nose and a family. The counties of the duchy are quiet again, and quiet in a way that suggests they have learned something."
 eir.0904.a:0 "Hang him from the nearest oak as an example."
 eir.0904.b:0 "Pardon him, take his sons as fosterlings and put him on your council."
 eir.0904.c:0 "Ransom him back to his family for a king's price."
 eir.0905.t:0 "A Duchy Falls to the Saxons"
 eir.0905.desc:0 "#bold [eir_up_duchy.GetName] has gone over to the rebels, and its counties are burning.#!\n\nIt is the sort of thing the English do very well, once they decide to. The hall has been taken, the mills burned for fuel, the churches stripped of their silver and the thane's household turned out into the lane. The people are being taught to answer in English. A good many are being taught it with a spear at their back."
 eir.0905.a:0 "Swear before the saints to take it back."
 eir.0905.b:0 "Ransom your captured vassals before they are sold."
 eir.0905.c:0 "Pull the garrisons back and hold what remains."
 eir.0910.t:0 "The Saxons Are Crushed"
 eir.0910.desc:0 "#bold Every rebel host in England has been broken, and the Great Saxon Uprising is over.#!\n\nThe last of them surrendered on a hill above the Thames at the end of a wet October. The marshal of the council gave up his sword himself. The thanes are in your hands, the rebel duchies have come home, and the English have discovered that a king who wins every war can afford to be generous. The question is how generous."
 eir.0910.a:0 "Take the name the army is calling you."
 eir.0910.b:0 "Hold a Moot of Reconciliation at Winchester and pardon the rest."
 eir.0910.c:0 "Grant the rebel lands to the thanes who stayed loyal."
 eir.0910.d:0 "Raise a minster at the hill, with an altar for the dead of both sides."
 eir.0912.t:0 "The Rising Is Put Down, At a Price"
 eir.0912.desc:0 "#bold The Great Saxon Uprising is over. Some duchies are yours again and some are not.#!\n\nIt will be called a draw in the English chronicles and a victory in the Irish. Neither is wrong. The strongest of the rebel leaders won his duchy and kept it. The weakest are dead. The country between is a patchwork of burned villages and brand-new castles. There is a peace, signed by tired men on both sides."
 eir.0912.a:0 "Consolidate what you hold and fortify the border."
 eir.0912.b:0 "Promise to come back for the lost duchies."
 eir.0912.c:0 "Offer the rebels a lasting treaty of English rights."
 eir.0912.d:0 "Rebuild, and say as little as possible."
 eir.0913.t:0 "The Saxons Shatter Your Hold"
 eir.0913.desc:0 "#bold Most of England has gone over to the rebels, and the throne is in danger.#!\n\nThe chroniclers call it the worst year of your reign. The duchies fell one after another, each to a leader nobody had heard of two years before. The English have not been so united since Alfred. They did it with ten thousand spears, a priest and a grievance, and the worst of it is that the grievance was a good one."
 eir.0913.a:0 "Rebuild from the ground up. Every mill, every church, every ford."
 eir.0913.b:0 "Withdraw to Ireland and Scotland and mass for the counter-stroke."
 eir.0913.c:0 "Pay the English what they ask and keep a corner of the island."
 eir.0913.d:0 "Send the relics and the books west and wait for a better day."
