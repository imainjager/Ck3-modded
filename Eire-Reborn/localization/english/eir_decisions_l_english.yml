l_english:
 eir_hold_oenach_decision:0 "Hold the Great Óenach"
 eir_hold_oenach_decision_desc:0 "Summon the lords, poets, judges and champions of your people to a great assembly, with games, feasting and the settling of old quarrels. Only a ruler with a real realm, a hall to feast them in and vassals worth inviting can pull it off."
 eir_hold_oenach_decision_tooltip:0 "Needs a duchy, 10 counties, an Irish building, three vassals. Opinion with every vassal, a county festival site, legitimacy-style prestige, and the way to Tara opens."
 eir_hold_oenach_decision_confirm:0 "Hold the Great Óenach"
 eir_rebuild_tara_hall_decision:0 "Rebuild the Hall of Tara"
 eir_rebuild_tara_hall_decision_desc:0 "The Hill of Tara has been empty for centuries, a ring of banks and a standing stone. Raise a new hall of oak and thatch there, big enough for the kings of Ireland to sit in rank. It will take years and every cow you can spare."
 eir_rebuild_tara_hall_decision_tooltip:0 "Needs the Duchy of Meath, the Óenach held and three Irish buildings. Unlocks the Hall of Tara special building and the road to the High Kingship. Happens only once per game."
 eir_rebuild_tara_hall_decision_confirm:0 "Rebuild the Hall of Tara"
 eir_crowned_at_tara_decision:0 "Be Crowned at Tara"
 eir_crowned_at_tara_decision_desc:0 "Ireland has had a thousand kings and a handful of High Kings. Only a ruler who holds the great duchies, sits in the rebuilt Hall, and can feed a hundred kings' retinues has a chance to be crowned on the Lia Fáil."
 eir_crowned_at_tara_decision_tooltip:0 "Needs Meath and another duchy, the Hall of Tara, the Óenach and 20 counties. Creates the Kingdom of Ireland, the Ard Rí trait, the stone's blessing and a legend."
 eir_crowned_at_tara_decision_confirm:0 "Be Crowned at Tara"
 eir_end_fragmentation_decision:0 "End the Tanistic Fragmentation"
 eir_end_fragmentation_decision_desc:0 "For centuries a king's realm died with him. The High King can end it: have the vassals swear that the high kingship passes to a single heir, as in the feudal courts overseas, and build a guard that will defend the heir against every cousin."
 eir_end_fragmentation_decision_tooltip:0 "Needs the High Kingship, the Circuit, the Provincial Oath, a feudal government and 25 counties. Abolishes the death of top titles, adds Stable High Kingship, unlocks the Guard of Tara. Happens only once per game."
 eir_end_fragmentation_decision_confirm:0 "End the Tanistic Fragmentation"
 eir_circuit_of_ireland_decision:0 "Ride the Circuit of Ireland"
 eir_circuit_of_ireland_decision_desc:0 "A king who is never seen is soon forgotten. Ride through your lands with your household for a season, eat at every lord's table, judge their quarrels in person and be seen."
 eir_circuit_of_ireland_decision_tooltip:0 "Needs a kingdom, the Óenach and peace. Every county gets a royal-visit bonus, vassals warm to you, chance of the Peacemaker of Tara trait. Starts the 'Circuit' incident."
 eir_circuit_of_ireland_decision_confirm:0 "Ride the Circuit of Ireland"
 eir_provincial_oath_decision:0 "Take the Oath of the Provincial Kings"
 eir_provincial_oath_decision_desc:0 "Gather the great lords at the old place and have them swear on the relics, one by one, that they will follow you."
 eir_provincial_oath_decision_tooltip:0 "Needs a kingdom and the Óenach. Dukes and above swear to you; legitimacy and levies grow. Required for ending the Fragmentation."
 eir_provincial_oath_decision_confirm:0 "Take the Oath of the Provincial Kings"
 eir_feis_of_tara_decision:0 "Hold the Feis of Tara"
 eir_feis_of_tara_decision_desc:0 "The Feis is the oldest festival of kingship: a week of feasting, law and marriage on the Hill of Tara, last held in the days before the Church."
 eir_feis_of_tara_decision_tooltip:0 "Needs the Hall of Tara, the Circuit and the Oath, and the High Kingship. Great prestige, a long glow, and a feast event."
 eir_feis_of_tara_decision_confirm:0 "Hold the Feis of Tara"
 eir_boramha_decision:0 "Demand the Bóramha Tribute"
 eir_boramha_decision_desc:0 "The High King's right to the cow-tribute of Leinster is ancient, and unpopular. Send the collectors."
 eir_boramha_decision_tooltip:0 "A great sum of gold now, vassal resentment for eight years. Remit it later."
 eir_boramha_decision_confirm:0 "Demand the Bóramha Tribute"
 eir_remit_tribute_decision:0 "Remit the Cow Tribute"
 eir_remit_tribute_decision_desc:0 "Forgive this year's cows. The vassals will remember, and the poets will say so."
 eir_remit_tribute_decision_tooltip:0 "Removes the Bóramha modifier and mends opinion. It leaves you better off than before."
 eir_remit_tribute_decision_confirm:0 "Remit the Cow Tribute"
 eir_take_hostages_decision:0 "Take the Hostages of Tara"
 eir_take_hostages_decision_desc:0 "Every Irish king knows that the surest oath is a son at the king's table. Ask each of your vassals for one."
 eir_take_hostages_decision_tooltip:0 "Needs a duchy and the Óenach. Prestige and a tight leash, but vassals resent you. Release them later with another decision."
 eir_take_hostages_decision_confirm:0 "Take the Hostages of Tara"
 eir_release_hostages_decision:0 "Release the Hostages"
 eir_release_hostages_decision_desc:0 "The sons have grown. Send them home with gifts and an oath."
 eir_release_hostages_decision_tooltip:0 "Removes the Hostages modifier and mends vassal opinion. A freed hostage may become a loyal Fosterling. It leaves you better off than before."
 eir_release_hostages_decision_confirm:0 "Release the Hostages"
 eir_foster_heir_decision:0 "Foster Your Children Among Your Vassals"
 eir_foster_heir_decision_desc:0 "A noble child raised in another lord's hall is bound to him by a tie stronger than blood. Send your children out, and take theirs in, and the great houses are knitted together."
 eir_foster_heir_decision_tooltip:0 "Needs 4 counties and three vassals. Vassals bond to you for 15 years; unlocks the Fosterage Hall building; a child may become a Foster-Brother."
 eir_foster_heir_decision_confirm:0 "Foster Your Children Among Your Vassals"
 eir_name_tanaiste_decision:0 "Name Your Tánaiste"
 eir_name_tanaiste_decision_desc:0 "Name your successor-in-waiting while you live, and the family will argue a little less when you are gone."
 eir_name_tanaiste_decision_tooltip:0 "Needs a living heir and a duchy. Legitimacy and vassal opinion; the heir is bound to you. It leaves you better off than before."
 eir_name_tanaiste_decision_confirm:0 "Name Your Tánaiste"
 eir_strike_claim_decision:0 "Strike a Claimant from the List"
 eir_strike_claim_decision_desc:0 "A tanistry list is a list of everyone who might be king. There is a quiet way to make it shorter."
 eir_strike_claim_decision_tooltip:0 "A vassal loses his claim and hates you for it. Mend it by naming a Tánaiste."
 eir_strike_claim_decision_confirm:0 "Strike a Claimant from the List"
 eir_cain_tribute_decision:0 "Levy the Cáin Tribute"
 eir_cain_tribute_decision_desc:0 "Every free man owes his king a calf from the herd. Send out the collectors."
 eir_cain_tribute_decision_tooltip:0 "Income now, vassal resentment for years. The Waive the Cáin decision undoes it."
 eir_cain_tribute_decision_confirm:0 "Levy the Cáin Tribute"
 eir_waive_cain_decision:0 "Waive the Cáin"
 eir_waive_cain_decision_desc:0 "Forgive this year's calves. The people will remember."
 eir_waive_cain_decision_tooltip:0 "Removes the Cáin Tribute modifier and mends opinion. It leaves you better off than before."
 eir_waive_cain_decision_confirm:0 "Waive the Cáin"
 eir_name_ollamh_decision:0 "Name an Ollamh Rígh"
 eir_name_ollamh_decision_desc:0 "The Ollamh Rígh is the royal chief poet, who remembers every king, every battle and every debt, and whose praise or satire can make or break a reign."
 eir_name_ollamh_decision_tooltip:0 "Needs a duchy, the Filí's patronage and a learned ruler or an Ollamh in court. Learning and prestige for twenty years; chance of the Poet-Prince trait."
 eir_name_ollamh_decision_confirm:0 "Name an Ollamh Rígh"
 eir_call_slogad_decision:0 "Call a Slógad"
 eir_call_slogad_decision_desc:0 "The sluagh-hosting is the oldest duty of free men: when the king calls, every farmer brings a spear and a week's meal. Call it too often and they stay home."
 eir_call_slogad_decision_tooltip:0 "Needs a duchy and peace. A free defensive army, a Great Hosting modifier; vassals grumble."
 eir_call_slogad_decision_confirm:0 "Call a Slógad"
 eir_patronise_fili_decision:0 "Patronise the Filí"
 eir_patronise_fili_decision_desc:0 "Poets are the memory and the conscience of Ireland. A king who feeds them is praised in every hall; one who does not is satirised. Open your hall, feed the schools and pay the master-poets."
 eir_patronise_fili_decision_tooltip:0 "Needs 4 counties and a learned ruler or poet at court. Prestige, an Ollamh at court, and the first step toward the Schools of the Filí."
 eir_patronise_fili_decision_confirm:0 "Patronise the Filí"
 eir_found_bardic_schools_decision:0 "Charter the Schools of the Filí"
 eir_found_bardic_schools_decision_desc:0 "The Filí teach twelve years in the great schools: law, genealogy, history, satire. Give them a charter, endow their schools in every province, and the old tradition of poetry becomes a national institution."
 eir_found_bardic_schools_decision_tooltip:0 "REPLACES the Poetry tradition with Schools of the Filí (keeps all its effects, adds more). Needs a duchy, learned ruler, the Filí's patronage and 3 Irish buildings. Unlocks Fianna warbands, Kern javelineers and the Bardic School building. Happens only once per game."
 eir_found_bardic_schools_decision_confirm:0 "Charter the Schools of the Filí"
 eir_compile_brehon_laws_decision:0 "Compile the Brehon Laws"
 eir_compile_brehon_laws_decision_desc:0 "The ancient laws are held in the heads of the judges. Gather them, write them down, and your courts will judge by a single code."
 eir_compile_brehon_laws_decision_tooltip:0 "Needs the Schools of the Filí, 4 Irish buildings and a learned ruler. Unlocks the Brehon Court building, legitimacy and court opinion for 20 years, a chance of the Brehon trait. Happens only once per game."
 eir_compile_brehon_laws_decision_confirm:0 "Compile the Brehon Laws"
 eir_revive_fianna_decision:0 "Raise the Fianna"
 eir_revive_fianna_decision_desc:0 "In the tales, Fionn's band lived by the hunt and fought like wolves. Gather the best of the young men, give them the forests of the marches and an oath of service, and they will be the best skirmishers in Ireland."
 eir_revive_fianna_decision_tooltip:0 "Needs the Schools of the Filí, 3 Irish buildings and a fighter. A free Fianna warband, the Fianna spirit modifier, and chance of the Champion of the Fianna trait. Happens only once per game."
 eir_revive_fianna_decision_confirm:0 "Raise the Fianna"
 eir_adopt_cattle_wealth_decision:0 "Codify the Bó-aire"
 eir_adopt_cattle_wealth_decision_desc:0 "A man's rank is his herd. The bó-aire, the 'cow-freemen', are the backbone of Irish society. Write down who owes whom how many cows, build the pastures and the enclosures, and the old herding tradition becomes the engine of a state."
 eir_adopt_cattle_wealth_decision_tooltip:0 "REPLACES the Pastoralists tradition with Bó-aire: The Cattle Lords. Needs 12 counties, 3 Irish buildings and a shrewd steward. Unlocks the Great Cattle Enclosure, big income, and a chance of the Cattle Lord trait. Happens only once per game."
 eir_adopt_cattle_wealth_decision_confirm:0 "Codify the Bó-aire"
 eir_adopt_culdee_decision:0 "Endow the Monastic Cities"
 eir_adopt_culdee_decision_desc:0 "In Ireland the monastery is a city: a thousand monks, a school, a market, a mint, and an abbot who sits among kings. Raise your abbeys to that rank, and the old tradition of monastic communities becomes the heart of the island."
 eir_adopt_culdee_decision_tooltip:0 "REPLACES the Monastic Communities tradition with Insular Monasticism. Needs 700 piety, a duchy, 3 Irish buildings (including a monastic one) and a monastery of your own. Piety, learning, clergy opinion and a saint's blessing. Happens only once per game."
 eir_adopt_culdee_decision_confirm:0 "Endow the Monastic Cities"
 eir_adopt_sea_kings_decision:0 "Claim the Irish Sea"
 eir_adopt_sea_kings_decision_desc:0 "The Irish Sea is a road to Chester, Bristol, Man, Wales and the Hebrides, and the Norse have held it too long. Build ports, take a great harbour, fill a fleet, and declare that the sea-kings of Ireland will carry the trade of the west."
 eir_adopt_sea_kings_decision_tooltip:0 "REPLACES Maritime Mercantilism with Kings of the Irish Sea. Needs a duchy, 3 ports, a great Irish harbour, 1000 prestige, and wealth (1000 gold) or a trade-wise ruler. Unlocks gallowglass, Irish Sea Quays and Longship Yards, and leads to the Thalassocracy. Happens only once per game."
 eir_adopt_sea_kings_decision_confirm:0 "Claim the Irish Sea"
 eir_thalassocracy_decision:0 "Proclaim the Sea-Kingdom"
 eir_thalassocracy_decision_desc:0 "Dublin, Man, the Isles, the Welsh coast: if one hand held all the harbours of the Irish Sea, it would hold the trade of the west. Build yards on every strand and let the sea-kings call you master."
 eir_thalassocracy_decision_tooltip:0 "Needs the Irish Sea tradition, a kingdom, 6 ports, Dublin and two Quays. A sea-empire modifier for 30 years, claims on Man and Norse-held coasts, a legend, and a vast prestige reward. Happens only once per game."
 eir_thalassocracy_decision_confirm:0 "Proclaim the Sea-Kingdom"
 eir_gaelic_revival_decision:0 "The Gaelic Renaissance"
 eir_gaelic_revival_decision_desc:0 "The poets, the abbots, the cattle lords and the sea-kings have each made a great thing of their craft. Now bind them together under one king and one language, and let a golden age of the Gael begin."
 eir_gaelic_revival_decision_tooltip:0 "Needs all four upgraded traditions, the Brehon Laws, a kingdom and 2500 prestige. A thirty-year golden-age modifier, prestige, a legend, and the way to the Empire. Happens only once per game."
 eir_gaelic_revival_decision_confirm:0 "The Gaelic Renaissance"
 eir_hold_tailteann_decision:0 "Hold the Tailteann Games"
 eir_hold_tailteann_decision_desc:0 "The funeral games of Tailtiu, held every year in Meath since before memory: races, wrestling, matchmaking, trade and the great peace of the fair."
 eir_hold_tailteann_decision_tooltip:0 "Needs a duchy and the Óenach. Capital county festival, vassal opinion, prestige."
 eir_hold_tailteann_decision_confirm:0 "Hold the Tailteann Games"
 eir_ancient_sites_decision:0 "Restore the Ancient Royal Sites"
 eir_ancient_sites_decision_desc:0 "Uisneach, Rathcroghan, Emain Macha and Newgrange were old when the Romans were young. Clear the brush, raise the banks and hold ceremonies, and the kings of the island will remember where kingship began."
 eir_ancient_sites_decision_tooltip:0 "Needs the Óenach, 15 counties and 4 Irish buildings. Four ancient-site county modifiers on your lands, prestige, and legend spread. Happens only once per game."
 eir_ancient_sites_decision_confirm:0 "Restore the Ancient Royal Sites"
 eir_raise_ringforts_decision:0 "Raise the Ringforts"
 eir_raise_ringforts_decision_desc:0 "Every farm in Ireland sits inside a ringfort: a bank, a ditch and a stockade. Order your lords to build them properly, and teach the people to retreat there when the longships come."
 eir_raise_ringforts_decision_tooltip:0 "Needs 4 counties. Unlocks Ringfort, Crannóg and Cattle Enclosure buildings, a dún-builder modifier and a hill-fort at your capital. Happens only once per game."
 eir_raise_ringforts_decision_confirm:0 "Raise the Ringforts"
 eir_commission_tale_decision:0 "Commission a Tale"
 eir_commission_tale_decision_desc:0 "Your poets know a hundred tales. Choose the one your court will hear all year."
 eir_commission_tale_decision_tooltip:0 "Needs a duchy and the Filí's patronage. Choose among six tales for a different bonus each."
 eir_commission_tale_decision_confirm:0 "Commission a Tale"
 eir_muster_the_gael_decision:0 "Muster the Gael"
 eir_muster_the_gael_decision_desc:0 "A foreign lord holds Irish soil. Send word to every Irish king: the land will not be theirs for long."
 eir_muster_the_gael_decision_tooltip:0 "Needs a duchy and peace while a Norse lord holds an Irish county. Pressed claims on up to three Norse-held counties, vassal pride, and a muster."
 eir_muster_the_gael_decision_confirm:0 "Muster the Gael"
 eir_reclaim_dublin_decision:0 "Reclaim Dublin"
 eir_reclaim_dublin_decision_desc:0 "The Norse longphort on the Black Pool has stood for generations. Declare that it belongs to the Gael, and prepare the host that will make it so."
 eir_reclaim_dublin_decision_tooltip:0 "Needs a duchy, 800 prestige and peace while Dublin is Norse. A pressed claim on Dublin."
 eir_reclaim_dublin_decision_confirm:0 "Reclaim Dublin"
 eir_dublin_reclaimed_decision:0 "Celebrate the Return of Dublin"
 eir_dublin_reclaimed_decision_desc:0 "The Black Pool is Irish again. Hold a feast on the quays, raise your banners from the old ramparts and let every sea-king know whose harbour this is."
 eir_dublin_reclaimed_decision_tooltip:0 "Needs Dublin. A county modifier for 25 years, Norse-scourge reputation, great prestige, chance of Slayer of Norsemen, and Dublin's Quays open. Happens only once per game."
 eir_dublin_reclaimed_decision_confirm:0 "Celebrate the Return of Dublin"
 eir_dublin_garrison_decision:0 "Garrison Dublin"
 eir_dublin_garrison_decision_desc:0 "A fortress on the Liffey is a gift and a burden. Fill it with men who know how to hold it."
 eir_dublin_garrison_decision_tooltip:0 "Needs Dublin. A gallowglass garrison for twenty years; a Norse champion may soon challenge you."
 eir_dublin_garrison_decision_confirm:0 "Garrison Dublin"
 eir_pay_danegeld_decision:0 "Pay the Danegeld"
 eir_pay_danegeld_decision_desc:0 "Silver is cheaper than blood. Offer the sea-kings a sum to go and raid someone else."
 eir_pay_danegeld_decision_tooltip:0 "Gold and prestige lost; the raiders leave you alone for eight years, then come back hungrier. End it with another decision."
 eir_pay_danegeld_decision_confirm:0 "Pay the Danegeld"
 eir_end_danegeld_decision:0 "Refuse the Danegeld"
 eir_end_danegeld_decision_desc:0 "The Norse come each spring for their silver. This spring, send them back with iron."
 eir_end_danegeld_decision_tooltip:0 "Needs 600 prestige. Ends the Danegeld, restores your name, chance of the Brave trait, and the longships come to test you. It leaves you better off than before."
 eir_end_danegeld_decision_confirm:0 "Refuse the Danegeld"
 eir_cattle_raid_decision:0 "Raid for Cattle"
 eir_cattle_raid_decision_desc:0 "The oldest sport in Ireland is stealing a neighbour's cows. Send the young men over the border and have a poem written about it."
 eir_cattle_raid_decision_tooltip:0 "A neighbour loses cattle and hates you; you gain gold, prestige and a raider's reputation. Pay the éraic to clear it."
 eir_cattle_raid_decision_confirm:0 "Raid for Cattle"
 eir_pay_eraic_decision:0 "Pay the Éraic"
 eir_pay_eraic_decision_desc:0 "Brehon law counts every wrong in cattle. Pay what you owe, and the feud is over before it starts."
 eir_pay_eraic_decision_tooltip:0 "Ends the Infamous Cattle-Raider reputation. It leaves you better off than before."
 eir_pay_eraic_decision_confirm:0 "Pay the Éraic"
 eir_appease_satirists_decision:0 "Appease the Satirists"
 eir_appease_satirists_decision_desc:0 "A satire cannot be unsung, but it can be answered. Pay the poets a fair price, and ask them to find another subject."
 eir_appease_satirists_decision_tooltip:0 "Removes the Satirised modifier by paying the poets. It leaves you better off than before."
 eir_appease_satirists_decision_confirm:0 "Appease the Satirists"
 eir_wergild_decision:0 "Settle the Wergild"
 eir_wergild_decision_desc:0 "Brehon law counts every killing in cows. Pay the honour-price, and the blood-feud is over."
 eir_wergild_decision_tooltip:0 "Removes Kin Strife and Infamous Cattle-Raider, and gives the Wergild Paid modifier. It leaves you better off than before."
 eir_wergild_decision_confirm:0 "Settle the Wergild"
 eir_norse_captain_decision:0 "Hire a Norse Sea-King"
 eir_norse_captain_decision_desc:0 "Some Norse lords will fight for any Irish king who pays. They are expensive, and loyalty to them is a currency."
 eir_norse_captain_decision_tooltip:0 "Needs a duchy and a coast. A mercenary host for four years and a Norse-Gael tie."
 eir_norse_captain_decision_confirm:0 "Hire a Norse Sea-King"
 eir_four_provinces_decision:0 "Hosting of the Four Provinces"
 eir_four_provinces_decision_desc:0 "Munster, Leinster, Connacht and Ulster, each under their king, behind a single banner."
 eir_four_provinces_decision_tooltip:0 "Needs a kingdom, the Óenach, the Muster and two duchies. Two hosts, a Great Hosting modifier and a legend."
 eir_four_provinces_decision_confirm:0 "Hosting of the Four Provinces"
 eir_single_combat_decision:0 "Issue a Challenge to Single Combat"
 eir_single_combat_decision_desc:0 "In the old days, two kings might settle a war between two champions. Send the challenge."
 eir_single_combat_decision_tooltip:0 "A duel with a Norse champion. Win, and gain prestige and the Champion of Ulster trait. Lose, and bleed."
 eir_single_combat_decision_confirm:0 "Issue a Challenge to Single Combat"
 eir_coastal_watch_decision:0 "Post Watchmen on the Headlands"
 eir_coastal_watch_decision_desc:0 "Beacon fires on every headland will warn of a fleet while it is still at sea."
 eir_coastal_watch_decision_tooltip:0 "Needs 3 ports. Coastal counties get the Coastal Watch modifier and a beacon in their province."
 eir_coastal_watch_decision_confirm:0 "Post Watchmen on the Headlands"
 eir_ceithern_decision:0 "Raise the Royal Ceithern"
 eir_ceithern_decision_desc:0 "A king's ceithern are the picked men of his household, who eat at his table and die at his door."
 eir_ceithern_decision_tooltip:0 "Needs a kingdom, the Oath of the Provincial Kings and four Irish buildings. Unlocks the Ceithern Retinue men-at-arms for all Gaelic rulers. Happens only once per game."
 eir_ceithern_decision_confirm:0 "Raise the Royal Ceithern"
 eir_pacify_natives_decision:0 "Make Peace with the Native Irish"
 eir_pacify_natives_decision_desc:0 "A lord who learns the names of the local families, and pays what he owes, will be hated a little less."
 eir_pacify_natives_decision_tooltip:0 "Every occupied Celtic county in your realm gets the Pacified modifier for ten years, which cancels native resistance there. It leaves you better off than before."
 eir_pacify_natives_decision_confirm:0 "Make Peace with the Native Irish"
 eir_burn_the_hills_decision:0 "Burn the Hills"
 eir_burn_the_hills_decision_desc:0 "Some men are not won with gifts. Send the army through the hills and let the people remember why they should fear you."
 eir_burn_the_hills_decision_tooltip:0 "Quick gold now, but every occupied county gets a lasting Punitive Levy. Make peace later with the other decision."
 eir_burn_the_hills_decision_confirm:0 "Burn the Hills"
 eir_found_monastery_decision:0 "Found a Monastery"
 eir_found_monastery_decision_desc:0 "A house of prayer, a scriptorium and a guest hall. The Church will bless your name, and the monks will bring the learning of the age."
 eir_found_monastery_decision_tooltip:0 "Needs 4 counties and 200 piety. A county monastery for 40 years, piety and clergy opinion, and the road to scriptoria and high crosses. Happens only once per game."
 eir_found_monastery_decision_confirm:0 "Found a Monastery"
 eir_found_scriptorium_decision:0 "Found a Great Scriptorium"
 eir_found_scriptorium_decision_desc:0 "A house of copyists, illuminators and binders, producing gospel books that will be treasured for a thousand years."
 eir_found_scriptorium_decision_tooltip:0 "Needs a monastery, 400 piety and a duchy. Unlocks the Great Scriptorium, a saint's blessing, and a gospel book finishes in five years. Happens only once per game."
 eir_found_scriptorium_decision_confirm:0 "Found a Great Scriptorium"
 eir_raise_high_crosses_decision:0 "Raise the High Crosses"
 eir_raise_high_crosses_decision_desc:0 "Stone crosses taller than three men, carved with scenes from the Bible. They preach to those who cannot read."
 eir_raise_high_crosses_decision_tooltip:0 "Needs a monastery and a duchy. Unlocks the High Cross building; three of your counties gain High Crosses. Happens only once per game."
 eir_raise_high_crosses_decision_confirm:0 "Raise the High Crosses"
 eir_found_round_towers_decision:0 "Raise the Round Towers"
 eir_found_round_towers_decision_desc:0 "A tall stone belfry that doubles as a treasury and a refuge. It rings the bell for prayer, and it rings the alarm when the longships are sighted."
 eir_found_round_towers_decision_tooltip:0 "Needs a monastery and a duchy. Unlocks the Round Tower building and a warning beacon at your capital. Happens only once per game."
 eir_found_round_towers_decision_confirm:0 "Raise the Round Towers"
 eir_scriptorium_patron_decision:0 "Patronise the Scriptorium"
 eir_scriptorium_patron_decision_desc:0 "The monks need vellum, ink, gold leaf and peace. You can provide all four."
 eir_scriptorium_patron_decision_tooltip:0 "Needs the Great Scriptorium. Learning and prestige. A small gospel book may be finished within three years."
 eir_scriptorium_patron_decision_confirm:0 "Patronise the Scriptorium"
 eir_endow_cashel_decision:0 "Endow the Rock of Cashel"
 eir_endow_cashel_decision_desc:0 "The limestone crag of Cashel was the seat of the kings of Munster. Give it to the Church, and the Church will remember."
 eir_endow_cashel_decision_tooltip:0 "Needs the Duchy of Munster, a monastery and 400 piety. A landmark county for 30 years, piety, and the saints' blessing. Happens only once per game."
 eir_endow_cashel_decision_confirm:0 "Endow the Rock of Cashel"
 eir_synod_rath_breasail_decision:0 "Call the Synod of Ráth Breasail"
 eir_synod_rath_breasail_decision_desc:0 "Bishops and abbots from all Ireland, deciding the island's church organisation. The reformers will be delighted. The monks of the old foundations will not."
 eir_synod_rath_breasail_decision_tooltip:0 "Needs a kingdom, Cashel's endowment and 800 piety. A reform modifier, but years of Culdee strife. Happens only once per game."
 eir_synod_rath_breasail_decision_confirm:0 "Call the Synod of Ráth Breasail"
 eir_reconcile_culdees_decision:0 "Reconcile the Culdees"
 eir_reconcile_culdees_decision_desc:0 "Bring the old monasteries and the reformers to the same table, and pay for the peace."
 eir_reconcile_culdees_decision_tooltip:0 "Removes Culdee strife. It leaves you better off than before."
 eir_reconcile_culdees_decision_confirm:0 "Reconcile the Culdees"
 eir_pilgrimage_skellig_decision:0 "Pilgrimage to Skellig Michael"
 eir_pilgrimage_skellig_decision_desc:0 "A tower of rock off the Kerry coast, a ladder of 600 steps, a cluster of beehive cells. Climb, pray and come back changed."
 eir_pilgrimage_skellig_decision_tooltip:0 "Needs a coast and 200 piety. Piety, a pilgrim's blessing for eight years."
 eir_pilgrimage_skellig_decision_confirm:0 "Pilgrimage to Skellig Michael"
 eir_armagh_primacy_decision:0 "Claim the Primacy for Armagh"
 eir_armagh_primacy_decision_desc:0 "Armagh holds the relics of Saint Patrick, and the bishops of Armagh say they are the successors of Ireland's apostle. Back them against Cashel and Dublin."
 eir_armagh_primacy_decision_tooltip:0 "Needs the Duchy of Ulster, Cashel and 500 piety. Armagh's landmark bonus for 30 years, piety, and Armagh's cathedral and library open. Happens only once per game."
 eir_armagh_primacy_decision_confirm:0 "Claim the Primacy for Armagh"
 eir_patronise_glendalough_decision:0 "Revive Glendalough"
 eir_patronise_glendalough_decision_desc:0 "The valley of two lakes, where Saint Kevin lived as a hermit, has grown into a great monastic city. Support it."
 eir_patronise_glendalough_decision_tooltip:0 "Needs the Duchy of Leinster and Cashel's endowment. Glendalough's bonus for 30 years, piety. Happens only once per game."
 eir_patronise_glendalough_decision_confirm:0 "Revive Glendalough"
 eir_restore_clonmacnoise_decision:0 "Restore Clonmacnoise"
 eir_restore_clonmacnoise_decision_desc:0 "The monastic city on the Shannon, with its crosses, its scriptorium, and the tombs of the kings of Connacht."
 eir_restore_clonmacnoise_decision_tooltip:0 "Needs the Duchy of Connacht and Cashel's endowment. A monastic city modifier for 30 years, piety. Happens only once per game."
 eir_restore_clonmacnoise_decision_confirm:0 "Restore Clonmacnoise"
 eir_cain_law_decision:0 "Proclaim a Cáin"
 eir_cain_law_decision_desc:0 "A cáin is a law sworn by king and bishop together. This one protects clerics, women and the poor, and grants sanctuary in every church."
 eir_cain_law_decision_tooltip:0 "Needs Cashel's endowment, a kingdom and 600 piety. Piety, clergy opinion, the Right of Sanctuary; the law will be tested. Happens only once per game."
 eir_cain_law_decision_confirm:0 "Proclaim a Cáin"
 eir_relic_procession_decision:0 "Carry the Relic Through the Land"
 eir_relic_procession_decision_desc:0 "The shrine of a saint is carried from county to county, and the people kneel as it passes."
 eir_relic_procession_decision_tooltip:0 "Needs Cashel. Every held county gets a short bonus, piety."
 eir_relic_procession_decision_confirm:0 "Carry the Relic Through the Land"
 eir_penance_decision:0 "Do Public Penance"
 eir_penance_decision_desc:0 "Barefoot, in a plain shirt, on the church steps. The people watch, and some of them weep."
 eir_penance_decision_tooltip:0 "Needs high stress. Lowers stress considerably; costs prestige."
 eir_penance_decision_confirm:0 "Do Public Penance"
 eir_rome_pilgrimage_decision:0 "Go on Pilgrimage to Rome"
 eir_rome_pilgrimage_decision_desc:0 "A year's walk and a year's walk back. It is a long way to go to be forgiven."
 eir_rome_pilgrimage_decision_tooltip:0 "Needs 800 piety, peace and a duchy. A risky journey with a chance of the Saint-King trait. Happens only once per game."
 eir_rome_pilgrimage_decision_confirm:0 "Go on Pilgrimage to Rome"
 eir_honour_saints_decision:0 "Honour the Saints of Ireland"
 eir_honour_saints_decision_desc:0 "Brigid, Colmcille, Patrick: three saints, three cults, three kinds of blessing. Choose which will be the patron of your reign."
 eir_honour_saints_decision_tooltip:0 "Needs a monastery, a duchy and 400 piety. Choose among three saints for different bonuses, county shrines and cult events."
 eir_honour_saints_decision_confirm:0 "Honour the Saints of Ireland"
 eir_crown_king_of_munster_decision:0 "Crown the King of Munster"
 eir_crown_king_of_munster_decision_desc:0 "Munster was a kingdom before there was a High King, and it gave Ireland Brian Boru. Take the crown of Cashel."
 eir_crown_king_of_munster_decision_tooltip:0 "Needs Munster, 15 counties, Cashel's endowment and 2 Irish buildings. Creates the Kingdom of Munster and unlocks the Great Ringfort. Happens only once per game."
 eir_crown_king_of_munster_decision_confirm:0 "Crown the King of Munster"
 eir_crown_king_of_ulster_decision:0 "Crown the King of Ulster"
 eir_crown_king_of_ulster_decision_desc:0 "The Ulaid of the Red Branch are older than Tara. Their heirs can still raise a king at Emain Macha."
 eir_crown_king_of_ulster_decision_tooltip:0 "Needs Ulster, 15 counties and Armagh's primacy. Creates the Kingdom of Ulster and unlocks the Crannóg Stronghold. Happens only once per game."
 eir_crown_king_of_ulster_decision_confirm:0 "Crown the King of Ulster"
 eir_crown_king_of_leinster_decision:0 "Crown the King of Leinster"
 eir_crown_king_of_leinster_decision_desc:0 "The kings of Leinster have ruled the rich east for as long as there has been a Leinster. Place the crown on a new head."
 eir_crown_king_of_leinster_decision_tooltip:0 "Needs Leinster, 15 counties and a revived Glendalough. Creates the Kingdom of Leinster and unlocks the Great Cattle Enclosure. Happens only once per game."
 eir_crown_king_of_leinster_decision_confirm:0 "Crown the King of Leinster"
 eir_crown_king_of_connacht_decision:0 "Crown the King of Connacht"
 eir_crown_king_of_connacht_decision_desc:0 "Connacht is a land of bogs, hills and fierce warriors, and its kings have raised many an Ard Rí."
 eir_crown_king_of_connacht_decision_tooltip:0 "Needs Connacht, 15 counties and a restored Clonmacnoise. Creates the Kingdom of Connacht and unlocks the High Cross. Happens only once per game."
 eir_crown_king_of_connacht_decision_confirm:0 "Crown the King of Connacht"
 eir_crown_king_of_meath_decision:0 "Crown the King of Meath"
 eir_crown_king_of_meath_decision_desc:0 "The kings of Meath hold the middle of Ireland and the Hill of Tara, and the high kingship has been theirs more often than anyone's."
 eir_crown_king_of_meath_decision_tooltip:0 "Needs Meath, 15 counties and the Hall of Tara. Creates the Kingdom of Meath and unlocks the Brehon Court. Happens only once per game."
 eir_crown_king_of_meath_decision_confirm:0 "Crown the King of Meath"
 eir_crown_king_of_dal_riata_decision:0 "Crown the King of Dál Riata"
 eir_crown_king_of_dal_riata_decision_desc:0 "Gaelic kings once ruled both sides of the North Channel. Gather the old counties and put a crown on the old kingdom."
 eir_crown_king_of_dal_riata_decision_tooltip:0 "Needs three counties in western Scotland and the Dál Riata reclaim. Creates the Kingdom of Dál Riata. Happens only once per game."
 eir_crown_king_of_dal_riata_decision_confirm:0 "Crown the King of Dál Riata"
 eir_celtic_brotherhood_decision:0 "Call the Celtic Brotherhood"
 eir_celtic_brotherhood_decision_desc:0 "The Welsh, the Cornish, the Bretons and the Gaels of Alba are one people with five tongues. Write to all of them, and offer the hand of a king."
 eir_celtic_brotherhood_decision_tooltip:0 "Needs a kingdom, the Oath of the Provincial Kings and 3 ports. Brythonic rulers warm to you; unlocks every Celtic decision. Happens only once per game."
 eir_celtic_brotherhood_decision_confirm:0 "Call the Celtic Brotherhood"
 eir_reclaim_dal_riata_decision:0 "Reclaim Dál Riata"
 eir_reclaim_dal_riata_decision_desc:0 "Before there was a Scotland there was a Gaelic kingdom that spanned the North Channel. Its old counties are now ruled by strangers."
 eir_reclaim_dal_riata_decision_tooltip:0 "Needs the Brotherhood, a kingdom and 2 ports. Pressed claims on up to nine counties across Albany, the Isles and the Western Isles held by non-Celtic rulers."
 eir_reclaim_dal_riata_decision_confirm:0 "Reclaim Dál Riata"
 eir_reclaim_man_isles_decision:0 "Reclaim the Isle of Man"
 eir_reclaim_man_isles_decision_desc:0 "Man sits in the middle of the Irish Sea, with a Norse-Gael king who answers to nobody. Declare it Irish."
 eir_reclaim_man_isles_decision_tooltip:0 "Needs the Brotherhood, a kingdom and 2 ports. Pressed claims on the Kingdom of Man and the Isles."
 eir_reclaim_man_isles_decision_confirm:0 "Reclaim the Isle of Man"
 eir_reclaim_cornwall_decision:0 "Reclaim Cornwall"
 eir_reclaim_cornwall_decision_desc:0 "The Cornish speak a Celtic tongue and trade tin with half of Europe. Their lords sit under foreign kings."
 eir_reclaim_cornwall_decision_tooltip:0 "Needs the Brotherhood, a kingdom and 2 ports. Pressed claims on up to three Cornish counties."
 eir_reclaim_cornwall_decision_confirm:0 "Reclaim Cornwall"
 eir_reclaim_armorica_decision:0 "Reclaim Armorica"
 eir_reclaim_armorica_decision_desc:0 "Brittany was settled by Britons fleeing the Saxons, and its tongue is cousin to Welsh. Its old nobility is under a foreign yoke."
 eir_reclaim_armorica_decision_tooltip:0 "Needs the Brotherhood, a kingdom and 2 ports. Pressed claims on up to three Breton counties."
 eir_reclaim_armorica_decision_confirm:0 "Reclaim Armorica"
 eir_reclaim_old_north_decision:0 "Reclaim the Old North"
 eir_reclaim_old_north_decision_desc:0 "The kingdoms of Rheged, Gododdin and Elmet fell to the English, but the Gaels remember them."
 eir_reclaim_old_north_decision_tooltip:0 "Needs the Brotherhood, a kingdom and 2 ports. Pressed claims across Northumberland and Lothian."
 eir_reclaim_old_north_decision_confirm:0 "Reclaim the Old North"
 eir_stand_with_wales_decision:0 "Stand with Wales"
 eir_stand_with_wales_decision_desc:0 "The Welsh are fighting for the same cause as the Irish. Declare that their wars are yours."
 eir_stand_with_wales_decision_tooltip:0 "Needs the Brotherhood, a kingdom and 2 ports. Pressed claims on up to six counties in Powys and Deheubarth."
 eir_stand_with_wales_decision_confirm:0 "Stand with Wales"
 eir_pictish_memory_decision:0 "Honour the Memory of the Picts"
 eir_pictish_memory_decision_desc:0 "The painted people were here before the Gael, and their stones still stand in Alba. Honour them."
 eir_pictish_memory_decision_tooltip:0 "Needs the Brotherhood, a kingdom and Dál Riata's reclaim. Prestige, and pressed claims on up to three Pictish-land counties."
 eir_pictish_memory_decision_confirm:0 "Honour the Memory of the Picts"
 eir_gaulish_heritage_decision:0 "Remember the Gauls"
 eir_gaulish_heritage_decision_desc:0 "Before Rome, the Celts ruled from the Danube to the Atlantic. Some of that land should be remembered."
 eir_gaulish_heritage_decision_tooltip:0 "Needs the Brotherhood, a kingdom and 3 ports. A prestige modifier and pressed claims on up to three counties of Anjou."
 eir_gaulish_heritage_decision_confirm:0 "Remember the Gauls"
 eir_embassy_gwynedd_decision:0 "Send an Embassy to Gwynedd"
 eir_embassy_gwynedd_decision_desc:0 "The princes of Gwynedd keep a hard, rocky land, and a fine tradition of poetry. Send them gifts and a proposal."
 eir_embassy_gwynedd_decision_tooltip:0 "Needs the Brotherhood, a duchy and a port. Fires the Gwynedd alliance event."
 eir_embassy_gwynedd_decision_confirm:0 "Send an Embassy to Gwynedd"
 eir_embassy_strathclyde_decision:0 "Send an Embassy to Strathclyde"
 eir_embassy_strathclyde_decision_desc:0 "The last of the northern Britons hold a rock-fort on the Clyde. Treat them as kin."
 eir_embassy_strathclyde_decision_tooltip:0 "Needs the Brotherhood, a duchy and a port. Fires the Strathclyde alliance event."
 eir_embassy_strathclyde_decision_confirm:0 "Send an Embassy to Strathclyde"
 eir_breton_refuge_decision:0 "Offer Refuge to Breton Exiles"
 eir_breton_refuge_decision_desc:0 "Brittany has fallen to foreign lords again, and its nobles are looking for a safe harbour."
 eir_breton_refuge_decision_tooltip:0 "Needs the Brotherhood and a port. A hospitality modifier. A Breton refugee will arrive in a year."
 eir_breton_refuge_decision_confirm:0 "Offer Refuge to Breton Exiles"
 eir_armorica_voyage_decision:0 "Send a Ship to Armorica"
 eir_armorica_voyage_decision_desc:0 "Ships can reach Brittany in four days with a fair wind and a stout hull."
 eir_armorica_voyage_decision_tooltip:0 "Needs the Brotherhood and 2 ports. A risky voyage; fires the Armorican Voyage event."
 eir_armorica_voyage_decision_confirm:0 "Send a Ship to Armorica"
 eir_hebridean_marriage_decision:0 "Arrange a Hebridean Marriage"
 eir_hebridean_marriage_decision_desc:0 "The galley-lords of the Isles will serve a king who marries into their families."
 eir_hebridean_marriage_decision_tooltip:0 "Needs a duchy and a port. Fires the Hebridean marriage event."
 eir_hebridean_marriage_decision_confirm:0 "Arrange a Hebridean Marriage"
 eir_proclaim_gaeldom_decision:0 "Proclaim the Empire of Gaeldom"
 eir_proclaim_gaeldom_decision_desc:0 "One High King of Ireland is a great thing. A king of kings over every Gaelic land from Cork to Caithness is greater still."
 eir_proclaim_gaeldom_decision_tooltip:0 "Needs the High Kingship, the Brotherhood, the Gaelic Renaissance, 30 counties and a fortune. Creates the Empire of Gaeldom, a thirty-year emperor modifier, a vast prestige reward and a legend. Happens only once per game."
 eir_proclaim_gaeldom_decision_confirm:0 "Proclaim the Empire of Gaeldom"
 eir_reclaim_tongue_decision:0 "Reclaim the Tongue"
 eir_reclaim_tongue_decision_desc:0 "A county in Britain that has spoken English for generations can be taught Gaelic or Welsh again: hedge-schools, new place-names, priests who say the Mass in the old speech. The old people remember. The young people are curious. The neighbours are watching."
 eir_reclaim_tongue_decision_tooltip:0 "Needs the Celtic Brotherhood and a duchy. Turns one foreign-culture county of Britain to your culture, founds hedge-schools there, and fires a ceremony. Every conversion raises resentment in the remaining foreign counties; unrest events, a moot and a possible revolt follow. Repeatable every five years."
 eir_reclaim_tongue_decision_confirm:0 "Reclaim the Tongue"
 eir_grant_saxon_moot_decision:0 "Grant the Saxon Moot"
 eir_grant_saxon_moot_decision_desc:0 "The thanes of the conquered counties ask for one thing: the right to meet under their own oak, in their own speech, and judge their own small quarrels. Give it, and the grumbling turns into a loyal complaint."
 eir_grant_saxon_moot_decision_tooltip:0 "Remedy for Re-Celticisation. Clears all cultural resentment, gives the foreign counties a Moot of Their Own, and leaves you Lord of Two Peoples, with a moot horn made by the thanes. It costs gold and a little pride."
 eir_grant_saxon_moot_decision_confirm:0 "Grant the Saxon Moot"
 eir_restore_old_names_decision:0 "Restore the Old Names"
 eir_restore_old_names_decision_desc:0 "Every hill, ford and village in Britain had a Celtic name before it had an English one. Send the poets with the surveyors, and write the old names back into the charters."
 eir_restore_old_names_decision_tooltip:0 "Needs the Filí's patronage and at least two conversions. Prestige, a modifier that lasts, a legend and (after three conversions) the nickname 'the Tongue-Giver'."
 eir_restore_old_names_decision_confirm:0 "Restore the Old Names"
 eir_britons_return_decision:0 "The Britons Return"
 eir_britons_return_decision_desc:0 "Five conversions, a peace made with the Saxon thanes, three Celtic counties in Britain and a hall full of poets: this is the day the poems have been promising since the Romans left."
 eir_britons_return_decision_tooltip:0 "Needs a kingdom, five Reclaimed counties, little unrest left and the Brotherhood. Costs piety and prestige. Gives the Britons Return modifier for 30 years, a dynasty modifier, the nickname 'Restorer of Britain', claims on England, a legend, and a ceremony. Happens once per game."
 eir_britons_return_decision_confirm:0 "The Britons Return"
 eir_call_derbfine_decision:0 "Call the Derbfine"
 eir_call_derbfine_decision_desc:0 "The derbfine is the council of every adult male in the royal kindred to four generations. In the old days it chose the next king. Summon it now, in daylight, and let it choose together instead of apart."
 eir_call_derbfine_decision_tooltip:0 "Needs peace and a heir. Removes Throne Turmoil, gives legitimacy and vassal opinion for ten years, and a chance of the Peacemaker of Tara trait. Cousins who attend are bound by the result."
 eir_call_derbfine_decision_confirm:0 "Call the Derbfine"
 eir_found_bardic_house_decision:0 "Found a Bardic House"
 eir_found_bardic_house_decision_desc:0 "A dynasty that keeps its own poets, harpers and genealogists need never rely on a foreign scribe to praise it. Endow the posts, house the masters and let the verses be handed down from father to son."
 eir_found_bardic_house_decision_tooltip:0 "Needs the Schools of the Filí, a duchy and the Ollamh Rígh. A dynasty modifier for 60 years, a High Poet's Chain in two years, and learning. Happens once per game."
 eir_found_bardic_house_decision_confirm:0 "Found a Bardic House"
 eir_winter_court_of_tales_decision:0 "Hold the Winter Court of Tales"
 eir_winter_court_of_tales_decision_desc:0 "In the long dark the poets tell the great stories in the hall, one a night. Decide which will be told, and which will be left to the bards of the next king."
 eir_winter_court_of_tales_decision_tooltip:0 "Needs the Filí and a duchy. The Táin Retold modifier, poet XP, a legend, and a chance at a nickname. Repeatable every fifteen years."
 eir_winter_court_of_tales_decision_confirm:0 "Hold the Winter Court of Tales"
 eir_found_hospice_decision:0 "Found the Hospice of Brigid"
 eir_found_hospice_decision_desc:0 "A house of nuns, herbalists and physicians for the sick and the dying, under the protection of the saint of cattle, healing and the hearth. The poor will walk for days to reach it."
 eir_found_hospice_decision_tooltip:0 "Needs a monastery and 300 piety. A county hospice modifier for twenty years, physician XP, a chance of the Compassionate trait, and a follow-up event in a year. Happens once per game."
 eir_found_hospice_decision_confirm:0 "Found the Hospice of Brigid"
 eir_send_missionaries_decision:0 "Send the Peregrini to Alba"
 eir_send_missionaries_decision_desc:0 "Irish monks have always walked into the sea for the love of God. Send twelve of them to Alba with a boat, a bell and a gospel, and see who comes back."
 eir_send_missionaries_decision_tooltip:0 "Needs the Brotherhood, a monastery and 250 piety. Piety now, a Missionaries Return event in two to three years, a Patron of the Pilgrims modifier. Repeatable every ten years."
 eir_send_missionaries_decision_confirm:0 "Send the Peregrini to Alba"
 eir_buy_welsh_cattle_decision:0 "Buy Cattle from the Welsh"
 eir_buy_welsh_cattle_decision_desc:0 "The murrain has taken the herds. Welsh dealers across the water have healthy beasts and a high price. Pay it, and the poor will not sell their land."
 eir_buy_welsh_cattle_decision_tooltip:0 "Remedy for the Murrain. Removes the Murrain from all counties, leaves you A Fair Lord, strengthens ties with Wales and leaves the herds richer than before."
 eir_buy_welsh_cattle_decision_confirm:0 "Buy Cattle from the Welsh"
 eir_summer_booleying_decision:0 "Go Up to the Summer Pastures"
 eir_summer_booleying_decision_desc:0 "Once the cattle are in the high pastures the whole household goes with them, to milk, make cheese and sing. A king who does this is remembered as a man of the people."
 eir_summer_booleying_decision_tooltip:0 "Only between May and August, and only in peace. Stress relief, health, a county dairy bonus for ten years and a chance of a hill-pasture quarrel. Repeatable every year."
 eir_summer_booleying_decision_confirm:0 "Go Up to the Summer Pastures"
 eir_charter_port_decision:0 "Charter a Harbour Town"
 eir_charter_port_decision_desc:0 "A fishing village with a good harbour and no walls can become a market town if the king grants it liberties: freedom from tolls, a market court, and a charter."
 eir_charter_port_decision_tooltip:0 "Needs the Irish Sea tradition, a duchy and a port. A chartered county for 25 years, income, diplomacy. Repeatable every ten years."
 eir_charter_port_decision_confirm:0 "Charter a Harbour Town"
 eir_hire_welsh_archers_decision:0 "Hire Welsh Archers"
 eir_hire_welsh_archers_decision_desc:0 "The longbowmen of the Welsh marches shoot twice as far as any Irish bow. Hire a company for a campaign and watch the English horse learn caution."
 eir_hire_welsh_archers_decision_tooltip:0 "Needs the Brotherhood and a duchy. A mercenary company of bowmen, a Welsh Longbows modifier for eight years, and a friendlier Wales. Repeatable every five years."
 eir_hire_welsh_archers_decision_confirm:0 "Hire Welsh Archers"
 eir_found_college_bangor_decision:0 "Found the College of Bangor"
 eir_found_college_bangor_decision_desc:0 "Bangor has taught Europe's scholars before. Endow it with a library, a refectory and a staff of foreign masters, and students from three kingdoms will walk across the sea to study in Irish."
 eir_found_college_bangor_decision_tooltip:0 "Needs a kingdom, the Filí, a monastery and a scriptorium. A county college for 40 years, learning and diplomacy, a Patron of the College modifier for 30 years, and the nickname 'the Scholar'. Happens once per game."
 eir_found_college_bangor_decision_confirm:0 "Found the College of Bangor"
