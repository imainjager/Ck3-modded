l_english:
 eir_hold_oenach_decision:0 "Hold the Great Óenach"
 eir_hold_oenach_decision_desc:0 "Summon the lords, poets, judges and champions of your people to a great assembly, with games, feasting and the settling of old quarrels."
 eir_hold_oenach_decision_tooltip:0 "Impress your vassals, ease any turmoil in your realm, and make a name as a unifier. Unlocks the path to being crowned at Tara."
 eir_hold_oenach_decision_confirm:0 "Hold the Great Óenach"
 eir_crowned_at_tara_decision:0 "Be Crowned at Tara"
 eir_crowned_at_tara_decision_desc:0 "Ride to the Hill of Tara, where the kings of Ireland have been made for a thousand years, and put your hand on the Lia Fáil."
 eir_crowned_at_tara_decision_tooltip:0 "Become High King of Ireland (Ard Rí), recreating the kingdom of Ireland if it was broken. Grants a trait, modifiers, and prestige."
 eir_crowned_at_tara_decision_confirm:0 "Be Crowned at Tara"
 eir_end_fragmentation_decision:0 "End the Tanistic Fragmentation"
 eir_end_fragmentation_decision_desc:0 "Ireland has always fallen apart when a great king died. You are in a position to change that. Proclaim that the high kingship will pass to your heir whole."
 eir_end_fragmentation_decision_tooltip:0 "Abolish the rule that destroys an Irish ruler's highest title on death. Replaces Tanistic Fragmentation with Stable High Kingship for the whole Irish culture."
 eir_end_fragmentation_decision_confirm:0 "End the Tanistic Fragmentation"
 eir_boramha_decision:0 "Demand the Bóramha Tribute"
 eir_boramha_decision_desc:0 "The old cow-tribute of the kings of Ireland has not been paid in generations. A High King can demand it, and see who is brave enough to refuse."
 eir_boramha_decision_tooltip:0 "Collect a great sum of gold from your realm, at the cost of your vassals' goodwill. Remit the tribute later to win them back."
 eir_boramha_decision_confirm:0 "Demand the Bóramha Tribute"
 eir_remit_tribute_decision:0 "Remit the Cow Tribute"
 eir_remit_tribute_decision_desc:0 "The tribute has made you rich and your vassals bitter. A generous High King can forgive it and be loved for it."
 eir_remit_tribute_decision_tooltip:0 "Remove the Cow Tribute modifier and win your vassals' goodwill."
 eir_remit_tribute_decision_confirm:0 "Remit the Cow Tribute"
 eir_foster_heir_decision:0 "Foster Your Children Among Your Vassals"
 eir_foster_heir_decision_desc:0 "In Ireland a lord who fosters your child becomes closer to you than a brother. A king who fosters wisely never lacks friends."
 eir_foster_heir_decision_tooltip:0 "Bind your vassals to you with fosterage, gaining lasting opinion with them."
 eir_foster_heir_decision_confirm:0 "Foster Your Children Among Your Vassals"
 eir_patronise_fili_decision:0 "Patronise the Filí"
 eir_patronise_fili_decision_desc:0 "Poets are the memory and the conscience of Ireland. A king who feeds them is praised. A king who does not is satirised."
 eir_patronise_fili_decision_tooltip:0 "Gain prestige and legend reach, and a court Ollamh. Unlocks the Bardic Schools and the Brehon Laws."
 eir_patronise_fili_decision_confirm:0 "Patronise the Filí"
 eir_found_bardic_schools_decision:0 "Found the Bardic Schools"
 eir_found_bardic_schools_decision_desc:0 "Twelve years of study make a poet. Build a school where the sons of the learned classes can train, and your court will never lack voices."
 eir_found_bardic_schools_decision_tooltip:0 "Add Bardic Schools to Irish culture, unlock the Bardic School building, and raise your house's standing."
 eir_found_bardic_schools_decision_confirm:0 "Found the Bardic Schools"
 eir_compile_brehon_laws_decision:0 "Compile the Brehon Laws"
 eir_compile_brehon_laws_decision_desc:0 "The ancient laws live in the memories of the judges. Set them down, so that every dispute in Ireland is judged by the same rule."
 eir_compile_brehon_laws_decision_tooltip:0 "Add Brehon Law to Irish culture, unlock the Brehon Court building, and gain legitimacy."
 eir_compile_brehon_laws_decision_confirm:0 "Compile the Brehon Laws"
 eir_revive_fianna_decision:0 "Revive the Fianna Tales"
 eir_revive_fianna_decision_desc:0 "Fionn and his hunter-warriors are not dead, say the bards, only sleeping. Raise a warband in their image and see how well the old tales fight."
 eir_revive_fianna_decision_tooltip:0 "Add Fianna Heritage to Irish culture. Unlocks Fianna Warbands and Kern Javelineers for Irish rulers, and gives a martial modifier."
 eir_revive_fianna_decision_confirm:0 "Revive the Fianna Tales"
 eir_found_scriptorium_decision:0 "Found the Great Scriptorium"
 eir_found_scriptorium_decision_desc:0 "The monks of Ireland copy the gospels better than anyone in Christendom. Give them the walls and the vellum to make a masterpiece."
 eir_found_scriptorium_decision_tooltip:0 "Unlock the Great Scriptorium building. In five years the monks complete a work of art, and a famous gospel book may find its way to you."
 eir_found_scriptorium_decision_confirm:0 "Found the Great Scriptorium"
 eir_raise_high_crosses_decision:0 "Raise the High Crosses"
 eir_raise_high_crosses_decision_desc:0 "Carve the gospel in stone and set it up where all may see it. Ireland's great crosses are sermons that never end."
 eir_raise_high_crosses_decision_tooltip:0 "Unlock the High Cross building and raise crosses in three of your counties."
 eir_raise_high_crosses_decision_confirm:0 "Raise the High Crosses"
 eir_found_round_towers_decision:0 "Build the Round Towers"
 eir_found_round_towers_decision_desc:0 "The Norse come by sea and burn the churches. A tall stone tower with a door set high above the ground can save the monks and the relics."
 eir_found_round_towers_decision_tooltip:0 "Unlock the Round Tower building and light a warning beacon at your capital."
 eir_found_round_towers_decision_confirm:0 "Build the Round Towers"
 eir_hold_tailteann_decision:0 "Hold the Games of Tailtiu"
 eir_hold_tailteann_decision_desc:0 "The funeral games of Tailtiu are the oldest festival in Ireland, with races, wrestling, matchmaking and a truce between every quarrelling clan."
 eir_hold_tailteann_decision_tooltip:0 "A fortnight of games gives prestige, relief from stress, and opinion with your vassals."
 eir_hold_tailteann_decision_confirm:0 "Hold the Games of Tailtiu"
 eir_gaelic_revival_decision:0 "Proclaim a Gaelic Revival"
 eir_gaelic_revival_decision_desc:0 "The Irish language, the Irish laws and the Irish way of war are old and good. Say so, loudly, in every court in the island."
 eir_gaelic_revival_decision_tooltip:0 "A lasting wave of Gaelic pride gives prestige and opinion among your own people. Requires patronage of the poets and the revival of the Fianna."
 eir_gaelic_revival_decision_confirm:0 "Proclaim a Gaelic Revival"
 eir_adopt_cattle_wealth_decision:0 "Embrace the Cattle Economy"
 eir_adopt_cattle_wealth_decision_desc:0 "A man's worth is counted in cows. Make that the official policy of your realm, and reform the tribute system around it."
 eir_adopt_cattle_wealth_decision_tooltip:0 "Add Cattle Wealth to Irish culture and grant a Cattle Lord reputation."
 eir_adopt_cattle_wealth_decision_confirm:0 "Embrace the Cattle Economy"
 eir_adopt_fosterage_decision:0 "Make Fosterage the Law of the Land"
 eir_adopt_fosterage_decision_desc:0 "Every noble child in Ireland should be raised in a hall not their own. Let the bond of fosterage be the bond that holds your kingdom together."
 eir_adopt_fosterage_decision_tooltip:0 "Add Bonds of Fosterage to Irish culture, lasting vassal opinion, and a fosterage modifier."
 eir_adopt_fosterage_decision_confirm:0 "Make Fosterage the Law of the Land"
 eir_adopt_culdee_decision:0 "Embrace the Celtic Church"
 eir_adopt_culdee_decision_desc:0 "The Church of Ireland has its own saints, its own monks and its own way of calculating Easter. Let it be proud of that."
 eir_adopt_culdee_decision_tooltip:0 "Add Celtic Christianity to Irish culture and gain piety."
 eir_adopt_culdee_decision_confirm:0 "Embrace the Celtic Church"
 eir_adopt_sea_kings_decision:0 "Claim the Irish Sea"
 eir_adopt_sea_kings_decision_desc:0 "The Norse made the sea a road. Irish kings can sail it too, with ships of oak and hide, from Dublin to Man to Anglesey."
 eir_adopt_sea_kings_decision_tooltip:0 "Add Kings of the Irish Sea to Irish culture and gain a Sea-King's reputation."
 eir_adopt_sea_kings_decision_confirm:0 "Claim the Irish Sea"
 eir_muster_the_gael_decision:0 "Muster the Gael Against the Norse"
 eir_muster_the_gael_decision_desc:0 "Foreign lords hold Irish land. Call every clan that has lost cattle, kin or churches to them, and march."
 eir_muster_the_gael_decision_tooltip:0 "Gain pressed claims on up to three Irish counties held by Norse rulers, and rally the Irish."
 eir_muster_the_gael_decision_confirm:0 "Muster the Gael Against the Norse"
 eir_reclaim_dublin_decision:0 "Reclaim Dyflinn"
 eir_reclaim_dublin_decision_desc:0 "The Norse longphort at Dublin has been Ireland's richest city for two centuries. Take it back, and Ireland has a capital again."
 eir_reclaim_dublin_decision_tooltip:0 "Gain a pressed claim on the county of Dublin. Taking it unlocks a further reward."
 eir_reclaim_dublin_decision_confirm:0 "Reclaim Dyflinn"
 eir_dublin_reclaimed_decision:0 "Celebrate the Return of Dublin"
 eir_dublin_reclaimed_decision_desc:0 "Dublin is Irish again. Declare a feast, rebuild the harbour, and let the world know what the Gael can do."
 eir_dublin_reclaimed_decision_tooltip:0 "Gain a Dublin Reclaimed county modifier, the Scourge of the Norse reputation, and prestige."
 eir_dublin_reclaimed_decision_confirm:0 "Celebrate the Return of Dublin"
 eir_hire_gallowglass_decision:0 "Hire the Gallowglass"
 eir_hire_gallowglass_decision_desc:0 "The axemen of the Isles and the Hebrides fight for whoever pays. Take a company into your pay and, in time, settle them on your land."
 eir_hire_gallowglass_decision_tooltip:0 "Add Gallowglass Heritage to Irish culture, unlock Gallowglass men-at-arms, and gain a free company."
 eir_hire_gallowglass_decision_confirm:0 "Hire the Gallowglass"
 eir_pay_danegeld_decision:0 "Pay the Danegeld"
 eir_pay_danegeld_decision_desc:0 "A great Norse fleet is on the way. Buy peace with silver, and hope that they spend the winter somewhere else."
 eir_pay_danegeld_decision_tooltip:0 "Suppress Viking invasions for eight years, at the cost of heavy gold and your vassals' pride. Refuse to pay later to end it."
 eir_pay_danegeld_decision_confirm:0 "Pay the Danegeld"
 eir_end_danegeld_decision:0 "Refuse to Pay the Norse"
 eir_end_danegeld_decision_desc:0 "No more silver for the men who burned the churches. If they want Irish gold, they can come and try to take it."
 eir_end_danegeld_decision_tooltip:0 "End the Danegeld, restore your pride, and invite a Norse retaliation."
 eir_end_danegeld_decision_confirm:0 "Refuse to Pay the Norse"
 eir_cattle_raid_decision:0 "Launch a Cattle Raid"
 eir_cattle_raid_decision_desc:0 "The Táin is the oldest story in Ireland, and every young warrior knows how it ends. Take your neighbour's herds."
 eir_cattle_raid_decision_tooltip:0 "Gain a great sum of gold, but make an enemy and a name as a raider. Pay the blood-price later to repair the damage."
 eir_cattle_raid_decision_confirm:0 "Launch a Cattle Raid"
 eir_pay_eraic_decision:0 "Pay the Éraic"
 eir_pay_eraic_decision_desc:0 "Brehon law counts every wrong in cattle. Pay what you owe, and the feud is over before it starts."
 eir_pay_eraic_decision_tooltip:0 "End the Infamous Cattle-Raider reputation by paying the honour-price."
 eir_pay_eraic_decision_confirm:0 "Pay the Éraic"
 eir_appease_satirists_decision:0 "Appease the Satirists"
 eir_appease_satirists_decision_desc:0 "A satire cannot be unsung, but it can be answered. Pay the poets a fair price, and ask them to find another subject."
 eir_appease_satirists_decision_tooltip:0 "Remove the Satirised modifier by paying the poets."
 eir_appease_satirists_decision_confirm:0 "Appease the Satirists"
 eir_pacify_natives_decision:0 "Make Peace with the Natives"
 eir_pacify_natives_decision_desc:0 "A lord who learns the names of the local families, and pays what he owes, will be hated a little less."
 eir_pacify_natives_decision_tooltip:0 "Every occupied Celtic county in your realm gets the Pacified modifier for ten years, which cancels native resistance there."
 eir_pacify_natives_decision_confirm:0 "Make Peace with the Natives"
 eir_harsh_pacification_decision:0 "Burn the Hills"
 eir_harsh_pacification_decision_desc:0 "Some men are not won with gifts. Send the army through the hills and let the people remember why they should fear you."
 eir_harsh_pacification_decision_tooltip:0 "Quick gold now, but every occupied county gets a lasting Punitive Levy. Make peace later with the other decision."
 eir_harsh_pacification_decision_confirm:0 "Burn the Hills"
 eir_celtic_brotherhood_decision:0 "Call the Celtic Brotherhood"
 eir_celtic_brotherhood_decision_desc:0 "The Welsh, the Cornish, the Bretons and the Gaels of Alba are one people with five tongues. Write to all of them, and offer the hand of a king."
 eir_celtic_brotherhood_decision_tooltip:0 "Brythonic rulers warm to you, and you gain the Celtic Brotherhood modifier. Unlocks the claims on Celtic lands."
 eir_celtic_brotherhood_decision_confirm:0 "Call the Celtic Brotherhood"
 eir_reclaim_dal_riata_decision:0 "Reclaim Dál Riata"
 eir_reclaim_dal_riata_decision_desc:0 "Before there was a Scotland there was a Gaelic kingdom that spanned the North Channel. Its old counties are now ruled by strangers."
 eir_reclaim_dal_riata_decision_tooltip:0 "Gain pressed claims on up to nine counties across Albany, the Isles and the Western Isles held by non-Celtic rulers."
 eir_reclaim_dal_riata_decision_confirm:0 "Reclaim Dál Riata"
 eir_reclaim_man_isles_decision:0 "Reclaim Mann and the Isles"
 eir_reclaim_man_isles_decision_desc:0 "The Isle of Man and the islands off the Scottish coast were Gaelic long before the Vikings came. They can be again."
 eir_reclaim_man_isles_decision_tooltip:0 "Gain pressed claims on up to three counties of Mann and the Isles held by non-Celtic rulers."
 eir_reclaim_man_isles_decision_confirm:0 "Reclaim Mann and the Isles"
 eir_reclaim_cornwall_decision:0 "Stand with Cornwall"
 eir_reclaim_cornwall_decision_desc:0 "The Cornish speak a Celtic tongue and remember a time when the whole west was Celtic. Help them take their land back from English lords."
 eir_reclaim_cornwall_decision_tooltip:0 "Gain pressed claims on up to three counties of Cornwall held by non-Celtic rulers."
 eir_reclaim_cornwall_decision_confirm:0 "Stand with Cornwall"
 eir_reclaim_armorica_decision:0 "Reclaim Armorica"
 eir_reclaim_armorica_decision_desc:0 "Brittany was settled by Britons fleeing the Saxons, and its tongue is cousin to Welsh and Cornish. Its lords look to Ireland for friendship."
 eir_reclaim_armorica_decision_tooltip:0 "Gain pressed claims on up to three counties of Brittany held by non-Celtic rulers."
 eir_reclaim_armorica_decision_confirm:0 "Reclaim Armorica"
 eir_reclaim_old_north_decision:0 "Reclaim the Old North"
 eir_reclaim_old_north_decision_desc:0 "Before the Angles came, the north of Britain spoke a Celtic tongue and had Celtic kings. Memory of the Hen Ogledd lives in every Welsh poem."
 eir_reclaim_old_north_decision_tooltip:0 "Gain pressed claims on up to six counties in Northumberland and Lothian held by non-Celtic rulers."
 eir_reclaim_old_north_decision_confirm:0 "Reclaim the Old North"
 eir_stand_with_wales_decision:0 "Stand with the Welsh"
 eir_stand_with_wales_decision_desc:0 "The Welsh princes are Celtic kin, and the English crown presses on them from the east. A Gaelic king can take their side."
 eir_stand_with_wales_decision_tooltip:0 "Gain pressed claims on up to six Welsh-march counties held by non-Celtic rulers."
 eir_stand_with_wales_decision_confirm:0 "Stand with the Welsh"
 eir_proclaim_gaeldom_decision:0 "Proclaim the Empire of Gaeldom"
 eir_proclaim_gaeldom_decision_desc:0 "One High King of Ireland is a great thing. A king of kings over every Gaelic land from Cork to Caithness is greater still."
 eir_proclaim_gaeldom_decision_tooltip:0 "Create the Empire of Gaeldom. Grants the Emperor of the Gael modifier, a huge prestige reward, and a dynasty modifier."
 eir_proclaim_gaeldom_decision_confirm:0 "Proclaim the Empire of Gaeldom"
 eir_endow_cashel_decision:0 "Endow the Rock of Cashel"
 eir_endow_cashel_decision_desc:0 "The limestone crag of Cashel was the seat of the kings of Munster. Give it to the Church, and the Church will remember."
 eir_endow_cashel_decision_tooltip:0 "Raise the Rock of Cashel in the capital county of Munster, and gain piety and the blessing of the saints."
 eir_endow_cashel_decision_confirm:0 "Endow the Rock of Cashel"
 eir_synod_rath_breasail_decision:0 "Convene the Synod of Ráth Breasail"
 eir_synod_rath_breasail_decision_desc:0 "The Irish Church has no clear dioceses and no clear authority. Bring the bishops together and give it both."
 eir_synod_rath_breasail_decision_tooltip:0 "Reorganise the Irish Church for lasting clergy opinion and piety. The old Culdee monks will resent it."
 eir_synod_rath_breasail_decision_confirm:0 "Convene the Synod of Ráth Breasail"
 eir_reconcile_culdees_decision:0 "Reconcile the Culdees and Rome"
 eir_reconcile_culdees_decision_desc:0 "The old monks and the Roman reformers have quarrelled for a generation. A generous gift to both might end it."
 eir_reconcile_culdees_decision_tooltip:0 "Remove the Culdee Strife modifier and regain piety."
 eir_reconcile_culdees_decision_confirm:0 "Reconcile the Culdees and Rome"
 eir_pilgrimage_skellig_decision:0 "Make the Pilgrimage to Skellig Michael"
 eir_pilgrimage_skellig_decision_desc:0 "Six hundred and fifty steps climb a sea-crag at the edge of the world. Monks have made the climb for centuries, and kings sometimes do."
 eir_pilgrimage_skellig_decision_tooltip:0 "Gain piety, relief from stress, and the Pilgrim of Skellig modifier."
 eir_pilgrimage_skellig_decision_confirm:0 "Make the Pilgrimage to Skellig Michael"
 eir_armagh_primacy_decision:0 "Confirm the Primacy of Armagh"
 eir_armagh_primacy_decision_desc:0 "Armagh is Saint Patrick's city, and the oldest see in Ireland. Declare its bishop first among all of them."
 eir_armagh_primacy_decision_tooltip:0 "Raise Armagh in the capital county of Ulster and gain piety."
 eir_armagh_primacy_decision_confirm:0 "Confirm the Primacy of Armagh"
 eir_patronise_glendalough_decision:0 "Patronise Glendalough"
 eir_patronise_glendalough_decision_desc:0 "Saint Kevin's valley is a place of pilgrimage and seclusion. A king's gift can make it a place of learning too."
 eir_patronise_glendalough_decision_tooltip:0 "Raise Glendalough in the capital county of Leinster."
 eir_patronise_glendalough_decision_confirm:0 "Patronise Glendalough"
 eir_restore_clonmacnoise_decision:0 "Restore Clonmacnoise"
 eir_restore_clonmacnoise_decision_desc:0 "On the banks of the Shannon, the greatest monastic city in Ireland has fallen into disrepair. Raise it again."
 eir_restore_clonmacnoise_decision_tooltip:0 "Make the capital county of Connacht a monastic city."
 eir_restore_clonmacnoise_decision_confirm:0 "Restore Clonmacnoise"
 eir_crown_king_of_munster_decision:0 "Crown the King of Munster"
 eir_crown_king_of_munster_decision_desc:0 "Munster was a kingdom before there was a High King, and it was a kingdom that gave Ireland Brian Boru. Take the crown of Cashel."
 eir_crown_king_of_munster_decision_tooltip:0 "Create the Kingdom of Munster. Unlocks the Great Ringfort building."
 eir_crown_king_of_munster_decision_confirm:0 "Crown the King of Munster"
 eir_crown_king_of_ulster_decision:0 "Crown the King of Ulster"
 eir_crown_king_of_ulster_decision_desc:0 "The Ulaid of the Red Branch are older than Tara. Their heirs can still raise a king at Emain Macha."
 eir_crown_king_of_ulster_decision_tooltip:0 "Create the Kingdom of Ulster. Unlocks the Crannóg Stronghold building."
 eir_crown_king_of_ulster_decision_confirm:0 "Crown the King of Ulster"
 eir_crown_king_of_leinster_decision:0 "Crown the King of Leinster"
 eir_crown_king_of_leinster_decision_desc:0 "The kings of Leinster have ruled the rich east for as long as there has been a Leinster. Place the crown on a new head."
 eir_crown_king_of_leinster_decision_tooltip:0 "Create the Kingdom of Leinster. Unlocks the Great Cattle Enclosure building."
 eir_crown_king_of_leinster_decision_confirm:0 "Crown the King of Leinster"
 eir_crown_king_of_connacht_decision:0 "Crown the King of Connacht"
 eir_crown_king_of_connacht_decision_desc:0 "Connacht is a land of bogs, hills and fierce warriors, and its kings have raised many an Ard Rí."
 eir_crown_king_of_connacht_decision_tooltip:0 "Create the Kingdom of Connacht. Unlocks the High Cross building."
 eir_crown_king_of_connacht_decision_confirm:0 "Crown the King of Connacht"
 eir_crown_king_of_meath_decision:0 "Crown the King of Meath"
 eir_crown_king_of_meath_decision_desc:0 "The kings of Meath hold the middle of Ireland and the Hill of Tara, and the high kingship has been theirs more often than anyone's."
 eir_crown_king_of_meath_decision_tooltip:0 "Create the Kingdom of Meath. Unlocks the Brehon Court building."
 eir_crown_king_of_meath_decision_confirm:0 "Crown the King of Meath"
 eir_crown_king_of_dal_riata_decision:0 "Crown the King of Dál Riata"
 eir_crown_king_of_dal_riata_decision_desc:0 "Gaelic kings once ruled both sides of the North Channel. Gather the old counties and put a crown on the old kingdom."
 eir_crown_king_of_dal_riata_decision_tooltip:0 "Create the Kingdom of Dál Riata, uniting your Irish and Scottish Gaelic lands."
 eir_crown_king_of_dal_riata_decision_confirm:0 "Crown the King of Dál Riata"
 eir_raise_ringforts_decision:0 "Raise Ringforts Across the Land"
 eir_raise_ringforts_decision_desc:0 "Every Irish lord lives in a ringfort, an earthen bank and ditch around a hall. Raise them in greater numbers, and in greater strength."
 eir_raise_ringforts_decision_tooltip:0 "Unlock the Great Ringfort, Crannóg Stronghold and Great Cattle Enclosure buildings, and gain the Builder of Dúns modifier."
 eir_raise_ringforts_decision_confirm:0 "Raise Ringforts Across the Land"
 eir_claim_tara_hill_decision:0 "Keep the Vigil at Tara"
 eir_claim_tara_hill_decision_desc:0 "Spend a night alone on the Hill of Tara, where the kings of Ireland were once made, and see what the old place has to tell you."
 eir_claim_tara_hill_decision_tooltip:0 "Raise the standing of Tara in your realm and gain the Vigil at Tara modifier."
 eir_claim_tara_hill_decision_confirm:0 "Keep the Vigil at Tara"
 eir_gallowglass_company_name:0 "Gallowglass Company"
