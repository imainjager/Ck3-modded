l_english:
 eir.0210.t:0 "The Gathering Departs"
 eir.0210.desc:0 "#bold The Óenach is over, and the kings are going home with full bellies and full memories.#!\n\nFor a week the hills rang with horns and the fields were thick with tents. Quarrels were judged, marriages arranged, horses raced. The poets are already composing the account, and they ask what the king would like it to say."
 eir.0210.a:0 "Take the name 'the Convener' and let the poets spread it."
 eir.0210.b:0 "Refuse the title and take the people's gratitude instead."
 eir.0210.c:0 "Share the glory with your vassals at a great feast."
 eir.0210.d:0 "Give thanks in the church, and let the bishops bless it."
 eir.0211.t:0 "The Hall Stands on Tara"
 eir.0211.desc:0 "#bold The roof-tree is raised, and the Hall of Tara stands on the hill again.#!\n\nCarpenters from three kingdoms worked on it for years. It is longer than any hall in Ireland, with a bench for every province and a carved door facing the stone of the kings. Nobody has sat under that roof for six hundred years."
 eir.0211.a:0 "Take the name 'the Builder of Tara' and let the poets spread it."
 eir.0211.b:0 "Refuse the title and take the people's gratitude instead."
 eir.0211.c:0 "Share the glory with your vassals at a great feast."
 eir.0211.d:0 "Give thanks in the church, and let the bishops bless it."
 eir.0211.e:0 "Take the lesson of it to heart."
 eir.0212.t:0 "The Charter of the Filí"
 eir.0212.desc:0 "#bold The schools of the poets now have a charter, and a king has put his seal to it.#!\n\nThe master-poets have walked to your hall in their coloured cloaks, one hue for each grade. They carry the oldest tales in their heads, and the charter means those tales can no longer be silenced by a petty king."
 eir.0212.a:0 "Take the name 'the Poet-King' and let the poets spread it."
 eir.0212.b:0 "Refuse the title and take the people's gratitude instead."
 eir.0212.c:0 "Share the glory with your vassals at a great feast."
 eir.0213.t:0 "The Cattle Are Counted"
 eir.0213.desc:0 "#bold Every herd in the kingdom has been counted, and every cow has an owner.#!\n\nThe bó-aire stand in a circle, each declaring the size of his herd to the judges. It takes three days. At the end, the lords of the cattle know exactly what they owe, and exactly what they are owed."
 eir.0213.a:0 "Take the name 'the Cow-Lord' and let the poets spread it."
 eir.0213.b:0 "Refuse the title and take the people's gratitude instead."
 eir.0213.c:0 "Share the glory with your vassals at a great feast."
 eir.0213.d:0 "Take the lesson of it to heart."
 eir.0214.t:0 "The Monastic Cities Rise"
 eir.0214.desc:0 "#bold Your great abbeys have become what the abbots always said they were: cities.#!\n\nUnder the round towers, monks, students, merchants and pilgrims crowd the lanes. The abbots, who hold more land than most kings, have asked to be received. They bring gifts, and a request for the king's protection."
 eir.0214.a:0 "Take the name 'the Abbot-King' and let the poets spread it."
 eir.0214.b:0 "Refuse the title and take the people's gratitude instead."
 eir.0214.c:0 "Share the glory with your vassals at a great feast."
 eir.0214.d:0 "Give thanks in the church, and let the bishops bless it."
 eir.0214.e:0 "Take the lesson of it to heart."
 eir.0215.t:0 "The Sea Belongs to You"
 eir.0215.desc:0 "#bold Your ships have taken the last of the Irish Sea, and the old sea-kings are asking what you will do with it.#!\n\nDublin, Man, the Isles and the Welsh coast now send their dues. A Norse jarl who once raided your coast has come to your hall as a guest, and he is wondering aloud what a king of the Gael needs with so many ships."
 eir.0215.a:0 "Take the name 'Master of the Western Sea' and let the poets spread it."
 eir.0215.b:0 "Refuse the title and take the people's gratitude instead."
 eir.0215.c:0 "Share the glory with your vassals at a great feast."
 eir.0216.t:0 "The Golden Age Begins"
 eir.0216.desc:0 "#bold Poets, abbots, cattle lords and sea-kings are all at your table, and for the first time they are speaking in the same tongue.#!\n\nThe years of fighting have left Ireland with a new confidence. Books are being copied, crosses carved, ships built, and young men are learning the old tales not as memory but as promise. The poets say the age will be called after you."
 eir.0216.a:0 "Take the name 'Father of the Gael' and let the poets spread it."
 eir.0216.b:0 "Refuse the title and take the people's gratitude instead."
 eir.0216.c:0 "Share the glory with your vassals at a great feast."
 eir.0216.d:0 "Give thanks in the church, and let the bishops bless it."
 eir.0216.e:0 "Take the lesson of it to heart."
 eir.0217.t:0 "The Kings Kneel"
 eir.0217.desc:0 "#bold For the first time in memory, the high kingship will pass from father to son without a war.#!\n\nThe provincial kings stand in a half circle on the Hill of Tara. They have sworn the oath on the relics. The old men look uneasy and the young ones look relieved, because nobody there has ever seen a king's death that did not break the kingdom."
 eir.0217.a:0 "Take the name 'the Unifier' and let the poets spread it."
 eir.0217.b:0 "Refuse the title and take the people's gratitude instead."
 eir.0217.c:0 "Share the glory with your vassals at a great feast."
 eir.0217.d:0 "Give thanks in the church, and let the bishops bless it."
 eir.0217.e:0 "Take the lesson of it to heart."
 eir.0218.t:0 "The Celtic Congress Sits"
 eir.0218.desc:0 "#bold Envoys from Wales, Cornwall, Brittany and Alba are seated on benches beside your own.#!\n\nNo one has seen the Celtic peoples around one table since the Romans. They argue about the date of Easter and the proper way to cut hair, and they agree on exactly one thing: the Gael and the Britons are brothers."
 eir.0218.a:0 "Take the name 'Brother of the Celtic Peoples' and let the poets spread it."
 eir.0218.b:0 "Refuse the title and take the people's gratitude instead."
 eir.0218.c:0 "Share the glory with your vassals at a great feast."
