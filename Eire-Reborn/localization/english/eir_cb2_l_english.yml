l_english:

 # ---------- casus belli that answer a raid ----------
 eir_raid_revenge_cb:0 "Avenge the Raid"
 eir_raid_revenge_cb_desc:0 "You swore on the relics to repay a raid. Now you may march into the raider's land and take a county from him, with a blood-price in gold, and he will lose development there."
 EIR_RAID_REVENGE_CB_NAME:0 "Avenge the Raid on [DEFENDER.GetShortUIName]"
 EIR_RAID_REVENGE_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Revenge on [TITLE.GetBaseNameNoTier]"
 EIR_RAID_REVENGE_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 eir_raid_revenge_cb_victory_desc_attacker:0 "You take the contested [titles|E], a blood-price in gold, and the county loses development."
 eir_raid_revenge_cb_victory_desc:0 "[attacker.GetShortUIName|U] avenges the raid and takes the contested [title|E]."
 eir_raid_revenge_cb_white_peace_desc:0 "The war ends in a truce and the vow is not repaid. The poets will remember."
 eir_raid_revenge_cb_defeat_desc:0 "[defender.GetShortUIName|U] keeps the contested [title|E]. The vow is not repaid."
 eir_raid_revenge_cb_invalidated_desc:0 "The [war.GetName] has ended: [defender.GetShortUIName] no longer [Select_CString( defender.IsLocalPlayer, 'control', 'controls' )] the County."
 eir_blood_price_cb:0 "Demand the Blood-Price"
 eir_blood_price_cb_desc:0 "The old law says that a raid is a debt. A king who was raided may demand the price in cattle and silver, and the raider cannot refuse without shame."
 EIR_BLOOD_PRICE_CB_NAME:0 "Demand the Blood-Price of [DEFENDER.GetShortUIName]"
 EIR_BLOOD_PRICE_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Blood-Price from [DEFENDER.GetPrimaryTitle.GetName]"
 EIR_BLOOD_PRICE_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 eir_blood_price_cb_victory_desc_attacker:0 "[defender.GetShortUIName|U] pays the blood-price in gold now, owes tribute for five years and gives you a hook."
 eir_blood_price_cb_victory_desc:0 "[attacker.GetShortUIName|U] collects the blood-price from [defender.GetShortUIName|U]."
 eir_blood_price_cb_white_peace_desc:0 "The demand is dropped and nothing is paid."
 eir_blood_price_cb_defeat_desc:0 "The demand is refused and the army beaten. You lose [prestige|E] and pay compensation."
 eir_blood_price_cb_invalidated_desc:0 "The [war.GetName] has ended: [defender.GetShortUIName] is no longer a landed ruler."
 eir_reclaim_settled_cb:0 "Drive Out the Settlers"
 eir_reclaim_settled_cb_desc:0 "Raiders have settled on land that was yours or your kin's, and given it their language and their gods. Drive them out and put the old names back."
 EIR_RECLAIM_SETTLED_CB_NAME:0 "Drive Out the Settlers of [TITLE.GetBaseNameNoTier]"
 EIR_RECLAIM_SETTLED_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Reclamation of [TITLE.GetBaseName]"
 EIR_RECLAIM_SETTLED_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 eir_reclaim_settled_cb_victory_desc_attacker:0 "You take back the settled county: the settlement ends, and its culture and faith return to yours."
 eir_reclaim_settled_cb_victory_desc:0 "[attacker.GetShortUIName|U] drives out the settlers and takes back the contested [title|E]."
 eir_reclaim_settled_cb_white_peace_desc:0 "The settlers keep the county for now."
 eir_reclaim_settled_cb_defeat_desc:0 "[defender.GetShortUIName|U] keeps the settled county. Its people do not forgive."
 eir_reclaim_settled_cb_invalidated_desc:0 "The [war.GetName] has ended: the county is no longer a raiders' settlement."
