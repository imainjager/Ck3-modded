l_english:
 eir.0307.t:0 "The Britons Return"
 eir.0307.desc:0 "#bold From the Clyde to the Tamar, the old island is speaking its old languages again, and you stand at the centre of it.#!\n\nThe ceremony is held at a stone circle that predates everyone in it. Envoys have come from Wales, Cornwall, Brittany and Alba, and a very old monk from Iona has walked in barefoot. A boy is asked to read the new proclamation. He reads it in Welsh, then Irish, then Cornish, and nobody in the circle can say which language they were listening to."
 eir.0307.a:0 "Take the name 'Restorer of Britain' and wear it."
 eir.0307.b:0 "Refuse the title and raise a stone for every people who came."
 eir.0307.c:0 "Hold a feast for every people on the island, Saxons included."
 eir.0307.d:0 "Ask the poets to record it for the next thousand years."
 eir.0333.t:0 "The Hospice of Brigid Opens Its Doors"
 eir.0333.desc:0 "#bold The first winter of the new hospice has passed, and the nuns are asking what the king would like to see done with it.#!\n\nThey have treated three hundred sick, buried forty and delivered eleven children. A herbalist has joined them, bringing a garden of remedies that are partly miracle and partly mint. Several noble families have been quietly sending their old women here to die in comfort."
 eir.0333.a:0 "Endow a physician's school in the hospice."
 eir.0333.b:0 "Visit the sick yourself, and wash feet on Maundy Thursday."
 eir.0333.c:0 "Use the hospice to reward loyal servants."
 eir.0333.d:0 "Reduce the funding: the realm has other needs."
 eir.0334.t:0 "The Missionaries Return"
 eir.0334.desc:0 "#bold The monks you sent across the sea to Alba have come home, and not all of them are the same men.#!\n\nTwo died of a fever. One stayed behind to found a cell on an island in the north. A fourth has returned with a copy of a gospel in an unknown script, a talking raven that nobody else believes in and a Pictish convert who wants to see the king."
 eir.0334.a:0 "Receive the Pictish convert at court and ask for his tale."
 eir.0334.b:0 "Pay for a new mission with twice as many monks."
 eir.0334.c:0 "Have the gospel copied for your scriptorium."
 eir.0334.d:0 "Doubt the raven, and say so."
 eir.0336.t:0 "The High Poet's Chain"
 eir.0336.desc:0 "#bold The ollamh of your bardic house comes to the hall with a silver chain over his arm and a very serious face.#!\n\nIn the old law the chain of silver was given by the chief poet of the island to a king he judged worthy of his verse. It is old and heavy, with small bells that ring when the wearer walks. He says he has judged. He has not told anyone his verdict, and nobody dares to ask."
 eir.0336.a:0 "Receive the chain with honour and wear it at every feast."
 eir.0336.b:0 "Ask him to explain the judgement first."
 eir.0336.c:0 "Give the chain to your heir."
 eir.0336.d:0 "Refuse it: a king should earn praise, not wear it."
 eir.0337.t:0 "The Moot Horn Is Blown"
 eir.0337.desc:0 "#bold A carved horn, taken from the oak at the moot-hill, is brought to your hall.#!\n\nThe thanes brought it in a cloth. It was blown to call the freemen together when your grandfathers' grandfathers were children, and it has been silent since the day you came. They want you to hold it. They want you to know that they know what it means."
 eir.0337.a:0 "Keep the horn in your hall and blow it at the moot."
 eir.0337.b:0 "Hand the horn back to the thanes and swear to keep the peace."
 eir.0337.c:0 "Hang the horn in a church where nobody can blow it."
