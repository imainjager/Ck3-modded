l_english:

 # ---------- culture innovations ----------
 innovation_eir_ringfort_craft:0 "Ringfort Craft"
 innovation_eir_ringfort_craft_desc:0 "The great circular banks of the Irish: ditch, bank and palisade, thrown up in a season and held for a century."
 innovation_eir_fosterage_networks:0 "Fosterage Networks"
 innovation_eir_fosterage_networks_desc:0 "Every noble child is raised in another house, and the bond between foster-brothers is stronger than blood."
 innovation_eir_ogham_script:0 "Ogham Script"
 innovation_eir_ogham_script_desc:0 "A notched alphabet, cut along the edge of a pillar stone: the first writing of the Irish, and still the best way to say whose land it is."
 eir_innov_unlock_eir_found_scriptorium_decision:0 "Helps unlock the decision Found a Great Scriptorium"
 innovation_eir_scriptoria:0 "Insular Scriptoria"
 innovation_eir_scriptoria_desc:0 "Irish monks copy gospel books by candlelight, and the Irish script goes with the monks to every monastery on the continent."
 innovation_eir_currach_craft:0 "Currach Craft"
 innovation_eir_currach_craft_desc:0 "A hide boat on a wicker frame, light enough to carry and sound enough to cross the Irish Sea."
 eir_innov_unlock_eir_compile_brehon_laws_decision:0 "Helps unlock the decision Compile the Brehon Laws"
 innovation_eir_brehon_law:0 "Brehon Law"
 innovation_eir_brehon_law_desc:0 "A body of law kept by hereditary judges, with a price for every injury and a surety for every promise."
 innovation_eir_round_towers:0 "Round Towers"
 innovation_eir_round_towers_desc:0 "A tall stone belfry that doubles as a refuge, treasury and watchtower when the raiders come."
 eir_innov_unlock_eir_found_bardic_schools_decision:0 "Helps unlock the decision Charter the Schools of the Filí"
 innovation_eir_bardic_colleges:0 "Bardic Colleges"
 innovation_eir_bardic_colleges_desc:0 "The hereditary schools of the poets, historians and genealogists: seven years of training and a salary for life."
 innovation_eir_gallowglass_hosting:0 "Gallowglass Hosting"
 innovation_eir_gallowglass_hosting_desc:0 "Hired axemen from the Hebrides, settled with their families on the land of the lord who pays them."
 innovation_eir_tanistry_law:0 "Tanistic Succession"
 innovation_eir_tanistry_law_desc:0 "The kingdom goes to the best man of the royal kindred, chosen in the lifetime of the king, and the other claimants are given land to stay quiet."
