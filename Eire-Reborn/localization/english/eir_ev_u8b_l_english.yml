l_english:
 eir.1001.t:0 "The Ollamh Recites Your Descent"
 eir.1001.desc:0 "#bold Your ollamh has been rehearsing the line from Míl to you, and tonight he does it in front of everyone.#!\n\nIt takes the better part of an hour. He names forty kings in the right order, four battles in the wrong, and one cow in a position of surprising importance. The hall is quiet. At the end he bows, and the whole room, which had not planned to, applauds."
 eir.1001.a:0 "Reward him with a gift of cattle."
 eir.1001.b:0 "Have the whole line carved on a pillar stone."
 eir.1001.c:0 "Ask him to cut the cow."
 eir.1002.t:0 "A Satire in the Hall"
 eir.1002.desc:0 "#bold Your ollamh has composed a satire on a vassal, and the vassal is in the room.#!\n\nIt is three verses long and the third is the cruel one. The vassal's face has gone the colour of tallow. The hall waits to see whether the king will allow it to be finished. By custom, a satire left half-recited leaves a blemish on the man it is about; a satire recited to the end leaves a blemish on both."
 eir.1002.a:0 "Let him finish."
 eir.1002.b:0 "Stop him after the second verse."
 eir.1002.c:0 "Pay the vassal compensation in cattle and tell the poet to apologise."
 eir.1003.t:0 "The Ollamh Asks for a Hall"
 eir.1003.desc:0 "#bold Your ollamh would like a house of his own, with a library, a school and a good fire.#!\n\nHe has asked politely, which is how you know it matters. His predecessor asked for the same and was given a chamber over the stables. The new ollamh points out, without raising his voice, that the old one is remembered chiefly for the smell."
 eir.1003.a:0 "Build him a proper hall."
 eir.1003.b:0 "Give him a small house and a promise."
 eir.1003.c:0 "Refuse: a poet's hall is the king's hall."
 eir.1004.t:0 "The Case of the Three Cows"
 eir.1004.desc:0 "#bold Two farmers have brought the same three cows before your brehon, and each swears they are his.#!\n\nThe brehon has heard the case for six hours. The cows have been looked at, patted, questioned and in one case sung to. He now turns to you, with the air of a man about to say something sensible and, if possible, unpopular."
 eir.1004.a:0 "Let him judge by the old tracts."
 eir.1004.b:0 "Have the cows driven between the two farms and see where they go."
 eir.1004.c:0 "Take the cows into your own herd and fine both farmers."
 eir.1005.t:0 "A Surety Not Paid"
 eir.1005.desc:0 "#bold A man who stood surety for a debt has refused to pay it.#!\n\nThe old law is plain: a surety is bound as the debtor is. The surety, however, is your cousin, and the creditor is a man you particularly dislike. The brehon waits, with the slightly bored politeness of a man who has never met a good reason to bend a law."
 eir.1005.a:0 "Enforce the law on your cousin."
 eir.1005.b:0 "Pay the debt yourself and say nothing."
 eir.1005.c:0 "Quietly lose the case."
 eir.1006.t:0 "The Law Tracts Copied"
 eir.1006.desc:0 "#bold Your brehon proposes to have the law tracts copied in a clear hand, so that the lesser judges need not guess.#!\n\nThere are four tracts of any importance and thirty of none. The brehon would copy the first four in a year and the rest in his lifetime. A scribe has been found who writes a clear hand and costs a good deal."
 eir.1006.a:0 "Fund the work in full."
 eir.1006.b:0 "Fund the four and ignore the thirty."
 eir.1006.c:0 "Say that the law should be remembered, not written."
 eir.1007.t:0 "The Druid Reads the Oak"
 eir.1007.desc:0 "#bold Your druid has walked into the wood at dawn and come back with a branch and an opinion.#!\n\nHe will not say what he saw. He will say that the oak was uneasy, that the crows were arguing, and that the king should perhaps not cross a certain ford this month. He says it carefully, as though he knows this is the kind of advice a king ignores."
 eir.1007.a:0 "Take the advice and avoid the ford."
 eir.1007.b:0 "Ask for the omen in writing."
 eir.1007.c:0 "Cross the ford at once, to prove him wrong."
 eir.1008.t:0 "A Herb for the Heir"
 eir.1008.desc:0 "#bold Your druid has brewed a draught for the heir's fever and wants you to try it.#!\n\nIt smells of the bog and tastes, he says, of a long time ago. The court physician, if there is one, has been looking at it with some alarm. The child is hot, wide-eyed and very clear on the subject of not wanting to drink it."
 eir.1008.a:0 "Give it to the child."
 eir.1008.b:0 "Take a swallow of it yourself first."
 eir.1008.c:0 "Send for the monks instead."
 eir.1009.t:0 "The Mistletoe Cut"
 eir.1009.desc:0 "#bold At the full moon your druid cuts the mistletoe from the oak, with a gold sickle and an audience.#!\n\nHe is not a young man and the branch is high. A white cloth is spread below to catch it, two white bulls are tethered at the foot, and you are told that the bulls are the important part. The priests of the Church have sent an observer, who is writing very fast."
 eir.1009.a:0 "Attend and take a sprig."
 eir.1009.b:0 "Send the bulls to the monastery afterwards."
 eir.1009.c:0 "Forbid it. The Church is watching."
 eir.1010.t:0 "The Foster-Son Comes Home"
 eir.1010.desc:0 "#bold A boy you sent to your foster-father has come back for the winter, taller, quieter and extremely good at throwing a spear.#!\n\nHe sits at your table and says very little. When he does speak it is in your foster-father's cadences, a touch of the west in the vowels. He will not say what he was taught, but he looks at the other children in the hall as though he is pricing their horses."
 eir.1010.a:0 "Praise the foster-father in front of the court."
 eir.1010.b:0 "Test the boy at the spear."
 eir.1010.c:0 "Quietly note that he sounds nothing like you."
 eir.1011.t:0 "The Foster-Brothers Quarrel"
 eir.1011.desc:0 "#bold Two foster-brothers raised in the same house have drawn on each other in your hall.#!\n\nOne is your son. One is the son of your foster-father. They were raised on the same milk, taught by the same masters and have never been able to agree on anything since. The dispute is over a hawk. The hawk has left."
 eir.1011.a:0 "Separate them and send both to the foster-father."
 eir.1011.b:0 "Make them swear to a truce on the relics."
 eir.1011.c:0 "Let them fight it out. It is the law of the hawk."
 eir.1012.t:0 "Gifts for the Foster-Father"
 eir.1012.desc:0 "#bold By custom a king gives his foster-father a gift each year, and this year your foster-father has expressed an opinion.#!\n\nLast year it was three cows and a bronze pin. He sent the pin back. This year he has been discreet about what he would like, but a chamberlain has overheard the word horse, and the word good, and a name that sounds like a stud in the west."
 eir.1012.a:0 "Send the horse."
 eir.1012.b:0 "Send three cows again, with a longer letter."
 eir.1012.c:0 "Send nothing; a foster-son owes nothing."
 eir.1013.t:0 "A Priest of the New Faith Visits the Fire"
 eir.1013.desc:0 "#bold A priest of the Church has come to your hearth-fire with a gentle smile and a long memory.#!\n\nHe is polite. He says he is not here to argue; he only wishes to see the fire, as a scholar might see a lost script. He asks, in passing, how many of your court go to Mass, and how many of them go because they are afraid of you."
 eir.1013.a:0 "Invite him to sit and eat."
 eir.1013.b:0 "Tell him the fire is older than his book."
 eir.1013.c:0 "Send him away with a gift and a warning."
 eir.1014.t:0 "The Oak That Was Cut"
 eir.1014.desc:0 "#bold Someone has felled the great oak at the edge of the sacred grove, in the night, with an axe from the monastery.#!\n\nThe stump is wet and the chips are still warm. The grove-keeper is weeping. The monks deny it and look at their feet. In the morning, two hundred armed men are standing in the clearing, waiting to be told what the king intends."
 eir.1014.a:0 "Punish the monastery."
 eir.1014.b:0 "Plant an acorn at the stump, publicly, with the abbot present."
 eir.1014.c:0 "Do nothing. Let the people be angry."
 eir.1015.t:0 "The Quarter-Day Fire Spreads"
 eir.1015.desc:0 "#bold Across your realm, every household has lit its own fire on the quarter-day, and nobody asked.#!\n\nThe beacon at Tara is answered by the one at Uisneach, and that by the ones in the hills beyond, until the whole island has a rim of small fires along every ridge. The bishops sent messengers and then thought better of it. Tonight is not the night for them."
 eir.1015.a:0 "Ride the circuit by firelight."
 eir.1015.b:0 "Hold a feast on the hill."
 eir.1015.c:0 "Order a few of the fires put out, to show you are still in charge."
 eir.1016.t:0 "A Hermit Asks for a Cell"
 eir.1016.desc:0 "#bold A hermit has walked a hundred miles to ask for a cell on your land, near a spring and out of sight of any road.#!\n\nHe is thin, shoeless and extraordinarily cheerful. He needs, he says, a stone to sleep on and a place to pray. In a year there will be three more hermits, in five years a school, and in twenty a monastery that will be rich enough to quarrel with your tax collector."
 eir.1016.a:0 "Give him the spring and the field beside it."
 eir.1016.b:0 "Give him a cell and no field."
 eir.1016.c:0 "Refuse; the spring is wanted for the cattle."
 eir.1017.t:0 "The Married Priest"
 eir.1017.desc:0 "#bold The Culdee priest at your door is married, has six children and is extremely good at his work.#!\n\nThe bishop has written to say that this is irregular. The priest has written to say that it is not irregular in Ireland. The villagers have written nothing, which is the most eloquent response of the three."
 eir.1017.a:0 "Support the priest and defend the Culdee custom."
 eir.1017.b:0 "Send the bishop a gift and a long letter of explanation."
 eir.1017.c:0 "Quietly bar him from the abbey."
 eir.1018.t:0 "A Pilgrim From the Continent"
 eir.1018.desc:0 "#bold A pilgrim from the Continent has arrived at the poor house and refuses to believe that the Church of the Irish is a real Church.#!\n\nHe has seen the great basilicas of Rome and the gilded altars of Aachen. He looks at the wattle chapel, the cold well and the little brown loaf and announces, with the pleasure of a man discovering a rare animal, that it is all rather splendid."
 eir.1018.a:0 "Show him the manuscripts."
 eir.1018.b:0 "Tell him the Culdees have no need of Rome's approval."
 eir.1018.c:0 "Let him leave with a hoard of silver and no impressions."
 eir.0997.t:0 "Kin-Strife"
 eir.0997.desc:0 "#bold The great houses of Ireland are at one another's throats again.#!\n\nA cattle-raid, an insult at the Óenach, a marriage that did not happen: nobody can say what began it. By the harvest, three kings have called out their men and one has called out his poets, which is worse.\n\nThe old men say it is the way of things. The old men are not the ones whose halls are burning."
 eir.0997.a:0 "Take a side early and keep it."
 eir.0997.b:0 "Stay out of it and watch."
 eir.0997.c:0 "Offer to mediate, for a fee."
 eir.0998.t:0 "The Rise of the Overkings"
 eir.0998.desc:0 "#bold One house after another is reaching for the kingship of Tara, and the smaller kings must choose whom to follow.#!\n\nThe messages arrive at dawn. A king in the north has taken the oath of three provinces. A king in the south has married the daughter of a fourth. The lesser lords wait, as they always do, to see which way the cattle will walk."
 eir.0998.a:0 "Declare your allegiance to the strongest house."
 eir.0998.b:0 "Put forward your own name at the next Óenach."
 eir.0998.c:0 "Keep your cattle at home and your spears sharp."
 eir.0999.t:0 "The Truce of the Saints"
 eir.0999.desc:0 "#bold The abbots and the poets have brokered a truce, and the kings have sworn to keep it on the relics.#!\n\nThree days of speeches, four of fasting and a final night in which the bell of Patrick was carried slowly round the hill. When it was over, the kings stood in a ring and shook hands, for the first time since anyone could remember, without a knife in the other.\n\nIt will not last. But it will last a season, and in Ireland a season is a long time."
 eir.0999.a:0 "Swear it on the relics."
 eir.0999.b:0 "Swear it, and keep your fingers crossed."
 eir.0999.c:0 "Refuse to swear and hope no one notices."
