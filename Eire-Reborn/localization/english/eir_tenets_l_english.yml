l_english:

 # ---------- tenets ----------
 tenet_eir_oak_rite_name:0 "The Oak and the Rite"
 tenet_eir_oak_rite_desc:0 "Rulers keep the old groves, the quarter-day fires and the oaths sworn beneath the oak. The bishops tolerate it because the harvest is good."
 tenet_eir_oak_rite_locked_tt:0 "Unlocked by the decision Mystical Celtic Warriors"
 doctrine_parameter_eir_tn_oak_rite:0 "Rulers of this faith can use the Sit Beneath the Oak decision"
 doctrine_parameter_eir_tn_oak_rite_p:0 "Can use the Sit Beneath the Oak decision"
 tenet_eir_wood_warden_name:0 "Warden of the Wood"
 tenet_eir_wood_warden_desc:0 "The forest is a temple and its guardians are warriors. Foes who enter it do so by leave of the wardens, who are not generous."
 tenet_eir_wood_warden_locked_tt:0 "Unlocked by the decision The Return of the Celts to Germany"
 doctrine_parameter_eir_tn_wood_warden:0 "Rulers of this faith can use the Call the Hunt decision"
 doctrine_parameter_eir_tn_wood_warden_p:0 "Can use the Call the Hunt decision"
 tenet_eir_high_circuit_name:0 "The High King's Circuit"
 tenet_eir_high_circuit_desc:0 "A king who is not seen is not king. The ruler rides the circuit of the realm, eats at every hall and hears every complaint, and is believed."
 tenet_eir_high_circuit_locked_tt:0 "Unlocked by the decision The Last Revenge of the Celts"
 doctrine_parameter_eir_tn_high_circuit:0 "Rulers of this faith can use the Ride the Circuit decision"
 doctrine_parameter_eir_tn_high_circuit_p:0 "Can use the Ride the Circuit decision"
 tenet_eir_brehon_peace_name:0 "Brehon's Peace"
 tenet_eir_brehon_peace_desc:0 "The quarrel is settled by the judge and not by the sword. A death costs a price in cattle, and a refuge cannot be violated."
 tenet_eir_brehon_peace_locked_tt:0 "Unlocked by the decision The Gaelic Kingdoms United"
 doctrine_parameter_eir_tn_brehon_peace:0 "Rulers of this faith can use the Pronounce a Judgement decision"
 doctrine_parameter_eir_tn_brehon_peace_p:0 "Can use the Pronounce a Judgement decision"
 tenet_eir_gael_voice_name:0 "Voice of the Gael"
 tenet_eir_gael_voice_desc:0 "The language is the nation. Poets, harpers and hospitality carry it from hall to hall, and no stranger leaves without learning a verse."
 tenet_eir_gael_voice_locked_tt:0 "Unlocked by the decision The Return of the Celts to the Mainland"
 doctrine_parameter_eir_tn_gael_voice:0 "Rulers of this faith can use the Send Out the Poets decision"
 doctrine_parameter_eir_tn_gael_voice_p:0 "Can use the Send Out the Poets decision"
 tenet_eir_gaul_vow_name:0 "Vow of Vercingetorix"
 tenet_eir_gaul_vow_desc:0 "Every free man swears on the hill that he will not yield the land. The oath is old, hard to keep and harder to break."
 tenet_eir_gaul_vow_locked_tt:0 "Unlocked by the decision The Return of the Celts to France"
 doctrine_parameter_eir_tn_gaul_vow:0 "Rulers of this faith can use the Swear the Vow on the Hill decision"
 doctrine_parameter_eir_tn_gaul_vow_p:0 "Can use the Swear the Vow on the Hill decision"
 tenet_eir_pilgrim_relic_name:0 "Pilgrim and Relic"
 tenet_eir_pilgrim_relic_desc:0 "The road to the saint is a sacrament. Monks cross the sea to carry the faith, and the relics they bring home make the home they came from holier."
 tenet_eir_pilgrim_relic_locked_tt:0 "Unlocked by the decision The Brooch of Avalon"
 doctrine_parameter_eir_tn_pilgrim_relic:0 "Rulers of this faith can use the Send a Monk Overseas decision"
 doctrine_parameter_eir_tn_pilgrim_relic_p:0 "Can use the Send a Monk Overseas decision"
 tenet_eir_brennus_name:0 "Brennus' Reckoning"
 tenet_eir_brennus_desc:0 "Rome was sacked once by Celts, and it paid in gold. Every city is a purse, every siege an invoice, and the rulers believe that nobody who can pay should be spared."
 tenet_eir_brennus_locked_tt:0 "Unlocked by the decision The Return of the Celts to Italy"
 doctrine_parameter_eir_tn_brennus:0 "Rulers of this faith can use the Name the Ransom decision"
 doctrine_parameter_eir_tn_brennus_p:0 "Can use the Name the Ransom decision"
 tenet_eir_galatian_name:0 "Galatian Syncretism"
 tenet_eir_galatian_desc:0 "The Galatians kept the old gods in the shadow of the new faith for four hundred years, and the saints wear their faces. The clergy find it useful."
 tenet_eir_galatian_locked_tt:0 "Unlocked by the decision The Return of the Celts to Galatia"
 doctrine_parameter_eir_tn_galatian:0 "Rulers of this faith can use the Write to the Galatians decision"
 doctrine_parameter_eir_tn_galatian_p:0 "Can use the Write to the Galatians decision"
 tenet_eir_salt_hearth_name:0 "Salt, Silver and Hearth"
 tenet_eir_salt_hearth_desc:0 "The wealth of the island is salt from the shore, silver from the hills and a fire that never goes out in the mead-hall. A ruler who keeps all three is rich."
 tenet_eir_salt_hearth_locked_tt:0 "Unlocked by the decision A Third of the Island"
 doctrine_parameter_eir_tn_salt_hearth:0 "Rulers of this faith can use the Open the Salt Roads decision"
 doctrine_parameter_eir_tn_salt_hearth_p:0 "Can use the Open the Salt Roads decision"
 tenet_eir_rage_name:0 "Hero's Fury"
 tenet_eir_rage_desc:0 "At the height of battle a hero turns into something else. The ruler's warriors believe it and fight as if they have seen it."
 tenet_eir_rage_locked_tt:0 "Unlocked by the decision The Mail of the Pendragon"
 doctrine_parameter_eir_tn_rage:0 "Rulers of this faith can use the Take the Hero's Portion decision"
 doctrine_parameter_eir_tn_rage_p:0 "Can use the Take the Hero's Portion decision"
 tenet_eir_fianna_name:0 "The Fianna Camp"
 tenet_eir_fianna_desc:0 "The young nobles live a winter in the forest, hunting, fasting and fighting. They return trained, and they remember who fed them."
 tenet_eir_fianna_locked_tt:0 "Unlocked by the decision Rhongomyniad, the Spear of Badon"
 doctrine_parameter_eir_tn_fianna:0 "Rulers of this faith can use the Raise the Fianna Camp decision"
 doctrine_parameter_eir_tn_fianna_p:0 "Can use the Raise the Fianna Camp decision"
 tenet_eir_grail_name:0 "The Grail Quest"
 tenet_eir_grail_desc:0 "Somewhere in the island is a vessel that heals the land. A ruler who sets out to find it is rarely rewarded, but never forgotten."
 tenet_eir_grail_locked_tt:0 "Unlocked by the decision Revive the Arthurian Legend"
 doctrine_parameter_eir_tn_grail:0 "Rulers of this faith can use the Set Out on the Quest decision"
 doctrine_parameter_eir_tn_grail_p:0 "Can use the Set Out on the Quest decision"
 tenet_eir_geis_name:0 "Geis and Omens"
 tenet_eir_geis_desc:0 "Every great ruler lives under a geis, a taboo that gives strength and carries a price. Omens warn of the day it will be broken."
 tenet_eir_geis_locked_tt:0 "Unlocked by the decision The Round Table"
 doctrine_parameter_eir_tn_geis:0 "Rulers of this faith can use the Take a Geis decision"
 doctrine_parameter_eir_tn_geis_p:0 "Can use the Take a Geis decision"
 tenet_eir_heavy_crown_name:0 "The Heavy Crown"
 tenet_eir_heavy_crown_desc:0 "The crown that is worn is the crown that is feared, and the one who wears it is never again at ease. Prestige is great and the heirs resent it."
 tenet_eir_heavy_crown_locked_tt:0 "Unlocked by the decision The Crown of Britain"
 doctrine_parameter_eir_tn_heavy_crown:0 "Rulers of this faith can use the Wear the Heavy Crown decision"
 doctrine_parameter_eir_tn_heavy_crown_p:0 "Can use the Wear the Heavy Crown decision"
