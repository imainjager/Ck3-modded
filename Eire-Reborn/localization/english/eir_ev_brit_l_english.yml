l_english:
 eir.0800.t:0 "The Saxons Rise"
 eir.0800.desc:0 "#bold A county that was made to speak Gaelic has risen, and the beacons along the border are burning.#!\n\nIt was always going to happen. The reeve was found in a ditch with a book of Gaelic grammar stuffed in his mouth. By dawn the thanes had called out their men, by noon the hedge-school was ash, and the border fort was sending to ask what the king wanted. Your steward is looking at the floor.\n\nThe county was not asked."
 eir.0800.a:0 "Ride out with the host and break them in the field."
 eir.0800.b:0 "Hear their grievances under a flag of truce."
 eir.0800.c:0 "Burn the villages that rose."
 eir.0800.d:0 "Pay the thanes to keep their people quiet."
 eir.0800.e:0 "Withdraw the garrison and let the county go its own way."
 eir.0801.t:0 "A Third of the Island"
 eir.0801.desc:0 "#bold A Gaelic king now holds a third of the counties of Britannia, and the poets are counting.#!\n\nTwenty-eight counties of ninety-three. It took you a lifetime, and your father's, and his. The poets have taken to saying that the island has three corners and that you hold one of them. The English are saying that you hold none. The map, which has no opinion, is on the table, and it is mostly the colour of your banner."
 eir.0801.a:0 "Proclaim it in Irish, in Welsh and in Latin."
 eir.0801.b:0 "Hold a feast at the highest hall in the conquered lands."
 eir.0801.c:0 "Endow a monastery in every conquered diocese."
 eir.0801.d:0 "Say nothing, and let the army speak."
 eir.0802.t:0 "The Gaelic Kingdoms United"
 eir.0802.desc:0 "#bold Ireland and Scotland answer to one crown for the first time since the poems began.#!\n\nThe harpers of Tara and the pipers of Dunadd played the same march at the same hour, a hundred miles of sea apart, and it took them four attempts to get it in time. The bishops have drafted a letter. The jarls of the Isles have sent a polite complaint. Nobody in the English court has taken it seriously yet."
 eir.0802.a:0 "Take the claim to Britannia aloud, and name the Saxon king in it."
 eir.0802.b:0 "Hold a joint Aonach at the Boyne and the Forth."
 eir.0802.c:0 "Have the poets sing the two crowns as one."
 eir.0802.d:0 "Send the relics of Colmcille across the North Channel."
 eir.0803.t:0 "Arthur Reborn"
 eir.0803.desc:0 "#bold The poets of three peoples say that the king who slept under the hill is awake, and has an Irish face.#!\n\nIt was a Welsh bard who said it first, in a hall in Gwynedd where somebody had put a sword on the table for a joke. The Cornish picked it up, and then a Breton monk, and then every singer on the roads of Britain. The sword is real. It has a dragon on the hilt and no name. By the time it reached you it had acquired one."
 eir.0803.a:0 "Take the sword, the name and the title."
 eir.0803.b:0 "Carry the sword to Tara and swear on it before the kings."
 eir.0803.c:0 "Have the Welsh bards carry the story across Britain."
 eir.0803.d:0 "Bury the title and keep the sword."
 eir.0804.t:0 "The English Court Answers"
 eir.0804.desc:0 "#bold The English king has read the Gaelic proclamation, and he is not laughing.#!\n\nHe had it read to him twice. The second reading was in front of the council, so that nobody could say afterwards that they had not been told. A tithe has been raised. The marshal has been sent for. The bishops have been asked whether the Irish are sound on the Easter question."
 eir.0804.a:0 "Send back a courteous letter naming the fords you hold."
 eir.0804.b:0 "Raise the border levies at once."
 eir.0804.c:0 "Send the English a gift of Irish wolfhounds."
 eir.0804.d:0 "Ignore it. Words are for the losing side."
 eir.0805.t:0 "The Welsh Hear the News"
 eir.0805.desc:0 "#bold A Welsh prince has crossed the sea to ask whether the Gaelic crown means to be kind to the Britons.#!\n\nHe has come in person, with a harper and a monk, because he does not trust letters. He has the stiff patience of a man who has lost land before. He would like to know whether the Gaelic king means to take Wales or to stand with it, and he would like the answer before the harp has been tuned."
 eir.0805.a:0 "Swear an alliance of the Celts, and mean it."
 eir.0805.b:0 "Offer him a place in the Gaelic army and a share of the plunder."
 eir.0805.c:0 "Tell him Wales will be spared if it speaks no English."
 eir.0805.d:0 "Receive him with honours and say nothing."
 eir.0806.t:0 "Merlin's Prophecy"
 eir.0806.desc:0 "#bold A blind prophet at the edge of your court is reciting a poem that nobody taught him.#!\n\nIt is in no language the monks recognise, and it has the rhythm of a Welsh englyn and the images of an Irish rann. It describes a king who will gather the island, a sword that will not be drawn but found, five gifts to be taken from five places, and a revenge. The court has gone silent. The prophet bows, and asks for ale."
 eir.0806.a:0 "Write every word down."
 eir.0806.b:0 "Make him your chief poet."
 eir.0806.c:0 "Have the monks check it for heresy."
 eir.0806.d:0 "Laugh, and send him away with a coin."
 eir.0811.t:0 "The Mail of the Pendragon"
 eir.0811.desc:0 "#bold A coat of ring-mail has come out of the rock at Tintagel as bright as the day it went in.#!\n\nYou went down into the cave at low tide with a torch and a priest. The sea was already coming in. At the back, behind a slab no man had moved in six hundred years, it lay on a stone shelf wrapped in sheepskin, and when the wool came off it did not smell of damp. The priest crossed himself. The mail fit."
 eir.0811.a:0 "Wear it into the hall that evening."
 eir.0811.b:0 "Display it at Tintagel and invite the Cornish to look."
 eir.0811.c:0 "Take it to the altar of the nearest church and have it blessed."
 eir.0811.d:0 "Tell nobody, and let the item speak for itself."
 eir.0812.t:0 "The Crown of Britain"
 eir.0812.desc:0 "#bold The red-gold circlet of the kings of Britain has been taken out of the hall at Caerleon, and a Gaelic king holds it.#!\n\nThe hall is a ruin of Roman brick with a Welsh roof on it. The crown was kept in a chest under the dais, by a family who had been told to keep it for the right person and had not been told who. They held a vote. It was unanimous, and they were visibly relieved. The dragon on the circlet has been polished by six hundred years of hands."
 eir.0812.a:0 "Be crowned with it at Caerleon."
 eir.0812.b:0 "Give the Welsh princes a share in the coronation."
 eir.0812.c:0 "Have the bishop of St David's bless the crown."
 eir.0812.d:0 "Tell nobody, and let the item speak for itself."
 eir.0813.t:0 "The Brooch of Avalon"
 eir.0813.desc:0 "#bold The nuns of the Isle of Apples have given you the brooch of the king who sleeps.#!\n\nThe mist on the Somerset levels is said to rise when the right person walks through it. It rose on the second morning. The abbess met you at the water's edge with the brooch wrapped in a grey cloth and no explanation. She said only that she had been told to wait, and that she was tired of it."
 eir.0813.a:0 "Wear it at the altar of the abbey and take the vows of a protector."
 eir.0813.b:0 "Give a gift of land to the nuns in return."
 eir.0813.c:0 "Pray at the chapel of Joseph for the night."
 eir.0813.d:0 "Tell nobody, and let the item speak for itself."
 eir.0814.t:0 "Rhongomyniad, the Spear of Badon"
 eir.0814.desc:0 "#bold A long ash spear has been put in your hand at a field near Bath, where a king once stopped the Saxons.#!\n\nYou held most of the island by the end. The English crown had sent its best captains and been beaten at every ford. On the last day a Welsh farmer walked into your camp with a long package wrapped in oilcloth. He said it had been in his barn for as long as his family had a barn. It was an ash spear with a bronze head, and it was warm to touch."
 eir.0814.a:0 "Ride at the head of the army with the spear."
 eir.0814.b:0 "Give the farmer a county."
 eir.0814.c:0 "Raise a cross on the field."
 eir.0814.d:0 "Tell nobody, and let the item speak for itself."
 eir.0815.t:0 "The Round Table"
 eir.0815.desc:0 "#bold A table with no head has been built at Tara, and ten knights who have never quarrelled have sat down at it.#!\n\nThe carpenter was Welsh, the oak was Irish and the design was the carpenter's, from a dream. It seats a hundred and fifty, and has no top or bottom. Ten knights sat down on the first night. Nothing was said for a long time, and then, to their considerable surprise, they began to laugh."
 eir.0815.a:0 "Sit at the table as an equal and open the first feast."
 eir.0815.b:0 "Invite every king on the island to take a seat."
 eir.0815.c:0 "Hold the first session in silence, as a vigil."
 eir.0815.d:0 "Tell nobody, and let the item speak for itself."
 eir.0820.t:0 "The Last Revenge of the Celts"
 eir.0820.desc:0 "#bold The island is yours, and the poets are asking where the great hall of the whole island should stand.#!\n\nIt has been seven hundred years. The Romans left, and the Saxons came, and the Britons were pushed into the west, and the Gaels were pushed into the sea, and the poems said that it would not last. It did not. You hold the island from the Orkneys to the Cornish tin. The builders have drawn five plans. Each is a wonder. Only one can be built.\n\nThey have asked you to choose."
 eir.0820.a:0 "At Winchester, where Alfred sat: the Hall of the Returned Kings."
 eir.0820.b:0 "At York, the capital of the north: the Minster of the Celtic Kings."
 eir.0820.c:0 "At Edinburgh, on the rock above the Forth: the Rock of the Gaelic Crown."
 eir.0820.d:0 "At Caernarfon, at the mouth of the Menai: the Citadel of the Pendragon."
 eir.0820.e:0 "At Bath, where the Britons stopped the Saxons: the Court of Badon."
 eir.0820.f:0 "Build no hall. Give the gold to the monasteries and the poets."
