l_english:
 ie.0001.t:0 "Interactive Events: Setup Check"
 ie.0001.desc:0 "If you can read this, the mod is loaded and events work."
 ie.0001.a:0 "Excellent"

 # ---------- Story tab, modifiers, war, relations ----------
 ie_story_theft:0 "Theft at Court"
 ie_story_theft_desc:0 "Someone has been robbing your treasury, and the matter is not yet settled."
 IE_STORY_THEFT_INFO:0 "A theft from your treasury is still unresolved. The way you handle the investigation, and the choices you make in later events, will shape what follows: who is punished, how the court sees you, and whether the matter reaches beyond your borders."
 ie_bandit_haven_modifier:0 "Bandit Haven"
 ie_bandit_haven_modifier_desc:0 "Brigands paid with stolen treasury gold have made this county their hunting ground."
 ie_lax_treasury_modifier:0 "Lax Treasury"
 ie_lax_treasury_modifier_desc:0 "Word has spread that the ruler does not punish thieves, and the coffers leak."
 ie_feared_justice_modifier:0 "Feared Justice"
 ie_feared_justice_modifier_desc:0 "The court remembers how harshly you dealt with a thief. People obey, but they do not love you."
 ie_respected_justice_modifier:0 "Respected Justice"
 ie_respected_justice_modifier_desc:0 "The court remembers that you dealt with a thief both firmly and fairly."
 ie_laughingstock_modifier:0 "Laughing Stock"
 ie_laughingstock_modifier_desc:0 "The court laughs at how you let a thief make a fool of you."
 ie_audited_treasury_modifier:0 "Audited Treasury"
 ie_audited_treasury_modifier_desc:0 "Your steward reformed how the treasury is kept, closing the gaps a thief once used."
 ie_court_informant_modifier:0 "Court Informant"
 ie_court_informant_modifier_desc:0 "A former thief now whispers court secrets into your spymaster's ear."
 IE_STOLEN_JUSTICE_WAR_NAME:0 "War of the Stolen Gold"
 ie_stolen_justice_cb:0 "War of the Stolen Gold"
 ie_stolen_justice_cb_victory_desc:0 "[defender.GetShortUIName|U] is forced to hand over the thief and pay reparations. [attacker.GetShortUIName|U] gains great prestige."
 ie_stolen_justice_cb_white_peace_desc:0 "The war ends without justice for either side."
 ie_stolen_justice_cb_defeat_desc:0 "[attacker.GetShortUIName|U] fails to obtain justice and is humiliated."
 ie_stolen_justice_cb_invalidated_desc:0 "The War of the Stolen Gold is no longer relevant."
 rival_ie_theft:0 "[CHARACTER.GetShortUIName|U] never forgave [TARGET_CHARACTER.GetShortUIName] for the theft from the treasury."
 rival_ie_theft_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] never forgave [CHARACTER.GetShortUIName] for the way the theft was handled."
 friend_ie_theft:0 "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] grew close after the matter of the stolen gold."
 friend_ie_theft_corresponding:0 "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName] grew close after the matter of the stolen gold."

 # ---------- Outcome labels (shown when you hover over a random choice) ----------
 ie_theft.out.identified:0 "The thief is identified."
 ie_theft.out.wrong_lead:0 "The evidence points to the wrong person."
 ie_theft.out.confession_true:0 "A confession is extracted, and it names the right person."
 ie_theft.out.false_confession:0 "An innocent person confesses to end the pain."
 ie_theft.out.tip_true:0 "A tip proves true and names the thief."
 ie_theft.out.tip_false:0 "A false tip points at an innocent person."
 ie_theft.out.thief_confesses:0 "The thief comes forward."
 ie_theft.out.nobody_comes:0 "Nobody steps forward, and the court sees your weakness."
 ie_theft.out.steward_resolves:0 "The steward finds the thief and recovers half the loot."
 ie_theft.out.thief_escapes:0 "The thief escapes with the gold."
 ie_theft.out.caught_in_act:0 "The thief is caught in the act."
 ie_theft.out.bait_wrong:0 "Someone innocent takes the bait."
 ie_theft.out.nothing_learned:0 "You learn nothing new."
 ie_theft.out.bluff_called:0 "The thief calls your bluff and flees."
 ie_theft.out.accused_hurt:0 "The accused is hurt by your suspicion, and the thief escapes."
 ie_theft.out.trail_cold:0 "The trail goes cold and the thief escapes."
 ie_theft.out.captured:0 "The thief is captured."
 ie_theft.out.incident:0 "The attempt is discovered and causes a diplomatic incident."
 ie_theft.out.thief_dead:0 "The thief is killed."
 ie_theft.out.exposed:0 "The plot is exposed, and your reputation suffers."
 ie_theft.out.surrender_deal:0 "The thief is handed over in exchange for a favour."
 ie_theft.out.refused:0 "The demand is refused."
 ie_theft.out.surrender_fear:0 "They give the thief up out of fear."
 ie_theft.out.surrender_church:0 "The Church pressures them into giving the thief up."
 ie_theft.out.church_ignored:0 "The appeal is ignored and relations sour."
 ie_theft.out.surrender:0 "The thief is handed over."
 ie_theft.out.bounty_hunter:0 "A bounty hunter takes the contract."
 ie_theft.out.nobody_takes:0 "Nobody takes the contract, and the thief is lost."
 ie_theft.out.long_pursuit:0 "Years later, your pursuit pays off."
 ie_theft.out.allies_prevail:0 "Your allies pressure them into giving in."
 ie_theft.out.allies_fail:0 "Your allies lack the weight to sway them."
 ie_theft.out.took_money:0 "They take the money and keep the thief."
 ie_theft.out.reparations:0 "They pay reparations."
 ie_theft.out.vassal_refuses:0 "The vassal refuses and resents the demand."
 ie_theft.out.vassal_defiant:0 "The vassal defies you in front of the court."
 ie_theft.out.bargain_struck:0 "A bargain is struck and the thief is handed over."
 ie_theft.out.blackmail_works:0 "The blackmail works."
 ie_theft.out.spying_discovered:0 "Your spying is discovered."
 ie_theft.out.ambushed:0 "Your party is ambushed and the brigands escape."
 ie_theft.out.warden_accepts:0 "The thief accepts your pardon and a post."
 ie_theft.out.warden_laughs:0 "The thief laughs at your offer."
 ie_theft.out.gang_alerted:0 "The gang is alerted and scatters."
 ie_theft.out.surrender_hostage:0 "The thief surrenders to save the family."
 ie_theft.out.hostage_fails:0 "The thief does not yield."
 ie_theft.out.brigands_crushed:0 "The brigands are crushed."
 ie_theft.out.brigands_settle:0 "The brigands accept terms and disperse."
 ie_theft.out.brigands_laugh:0 "The brigands laugh at your envoy."
 ie_theft.out.reconciled:0 "The two of you reconcile."
 ie_theft.out.talks_fail:0 "The talks go badly."
 ie_theft.out.duel_won:0 "You win the duel."
 ie_theft.out.duel_lost:0 "You lose the duel."
 ie_theft.out.informant_ok:0 "The thief becomes your informant."
 ie_theft.out.double_cross:0 "The thief agrees, then vanishes."
 ie_theft.out.repeat_later:0 "The thief may steal again, one day."
 ie_theft.out.never_again:0 "The thief never steals again."

 # ---------- 0001 A Hole in the Treasury ----------
 ie_theft.0001.t:0 "A Hole in the Treasury"
 ie_theft.0001.desc:0 "#bold Someone has been stealing from your treasury.#!\n\nA clerk found that the strongroom ledgers do not match the coin in the chests. A sizeable sum is gone, and only someone with access to the court could have taken it.\n\nAny courtier could be guilty, and any could be accused wrongly. Whom you trust to investigate, and how, will decide what happens next."
 ie_theft.0001.a:0 "I will question the court myself."
 ie_theft.0001.a.tt:0 "You choose how to question the court. Your skills, traits and training decide which approaches are open to you."
 ie_theft.0001.b:0 "[steward.GetShortUIName], audit the accounts."
 ie_theft.0001.c:0 "[spymaster.GetShortUIName], find out who did this."
 ie_theft.0001.d:0 "[chaplain.GetShortUIName], hear confessions and swear the court on relics."
 ie_theft.0001.e:0 "Trust no one. Lock the court down and search every room."
 ie_theft.0001.f:0 "Take the likeliest suspect down to the cellars."
 ie_theft.0001.g:0 "Offer a generous reward for information."
 ie_theft.0001.h:0 "Offer amnesty to whoever returns the gold."
 ie_theft.0001.i:0 "Let [steward.GetShortUIName] deal with it quietly."
 ie_theft.0001.j:0 "The treasury can bear it. Let it go."
 ie_theft.0001.i.success.t:0 "Quietly Resolved"
 ie_theft.0001.i.success.desc:0 "[steward.GetShortUIName] found the thief within days. [thief.GetShortUIName] repaid half of what was taken, on the promise that the matter would stay out of the court's ears."
 ie_theft.0001.i.fail.t:0 "The Culprit Slips Away"
 ie_theft.0001.i.fail.desc:0 "[steward.GetShortUIName] found nothing in time. The thief, sensing the net closing, left your court with the coin before anyone could act."

 # ---------- 0020 The Interrogation ----------
 ie_theft.0020.t:0 "The Interrogation"
 ie_theft.0020.desc:0 "#bold You summon your courtiers one by one to question them.#!\n\nNobody wants to be the first accused, and the guilty one is watching to see how you work. The way you ask matters as much as what you ask."
 ie_theft.0020.a:0 "Intimidate them."
 ie_theft.0020.b:0 "Charm a confession out of them."
 ie_theft.0020.c:0 "Catch them in a trap of logic."
 ie_theft.0020.d:0 "Leave a bait chest and wait."
 ie_theft.0020.e:0 "Appeal to their conscience."
 ie_theft.0020.f:0 "Bluff: claim you already have a witness."
 ie_theft.0020.g:0 "Question everyone, hard."

 # ---------- 0013 The Confession ----------
 ie_theft.0013.t:0 "The Confession"
 ie_theft.0013.sum:0 "#bold [thief.GetShortUIName] has come to you in the night and confessed.#!\n\n[thief.GetSheHe|U] has brought back the gold, or what is left of it."
 ie_theft.0013.motive_1:0 "\n\n'I wanted more than I had,' [thief.GetSheHe] admits. 'I am ashamed.'"
 ie_theft.0013.motive_2:0 "\n\n'My family was starving,' [thief.GetSheHe] says, weeping. 'I saw no other way.'"
 ie_theft.0013.motive_3:0 "\n\n'I was paid to take it,' [thief.GetSheHe] says. 'I will not tell you by whom. Not yet.'"
 ie_theft.0013.motive_4:0 "\n\n'I was paid by a foreign hand,' [thief.GetSheHe] says. 'I have come to regret it.'"
 ie_theft.0013.ending:0 "\n\nYou offered amnesty. Now the question is whether your word means anything."
 ie_theft.0013.a:0 "Keep your word. [thief.GetSheHe|U] is forgiven."
 ie_theft.0013.b:0 "Break your promise and punish [thief.GetHerHim] anyway."
 ie_theft.0013.c:0 "Put [thief.GetHerHis] talents to use."

 # ---------- 0002 The Culprit Revealed ----------
 ie_theft.0002.t:0 "The Culprit Revealed"
 ie_theft.0002.sum:0 "#bold [thief.GetShortUIName] has been caught stealing from your treasury.#!"
 ie_theft.0002.appr_1:0 "\n\nYou broke [thief.GetHerHim] with threats. [thief.GetSheHe|U] wept and confessed, begging for [thief.GetHerHis] life."
 ie_theft.0002.appr_2:0 "\n\nYou won [thief.GetHerHis] trust with warmth and patience, and [thief.GetHeShe] confessed freely."
 ie_theft.0002.appr_3:0 "\n\nYou pulled apart [thief.GetHerHis] story piece by piece until it could not stand."
 ie_theft.0002.appr_4:0 "\n\nYour bait chest was opened in the night, and your guards seized [thief.GetHerHim] with the coin in [thief.GetHerHis] hands."
 ie_theft.0002.appr_6:0 "\n\nYou claimed to have a witness, and [thief.GetHeShe] broke before you could name one."
 ie_theft.0002.appr_7:0 "\n\nAfter a hard day of questioning, the accusations of [thief.GetHerHis] fellow courtiers all pointed one way."
 ie_theft.0002.inv_2:0 "\n\n[steward.GetShortUIName]'s audit traced the missing coin through false entries to a single hand."
 ie_theft.0002.inv_3:0 "\n\n[spymaster.GetShortUIName]'s informants watched the strongroom and caught [thief.GetHerHim] at it."
 ie_theft.0002.inv_5:0 "\n\nUnder [chaplain.GetShortUIName]'s eye, [thief.GetShortUIName] could not swear on the relics and confessed."
 ie_theft.0002.inv_6:0 "\n\nSomeone who wanted the reward named [thief.GetShortUIName], and the proof held up."
 ie_theft.0002.inv_8:0 "\n\nYour lockdown turned up the thief at last, with the coin hidden beneath a floorboard. The court resents the search."
 ie_theft.0002.inv_9:0 "\n\nThe confession given in the cellars proved true, and the coin was found where it was said to be."
 ie_theft.0002.inv_default:0 "\n\nThe evidence left no room for doubt."
 ie_theft.0002.motive_1:0 "\n\nGreed was the whole of it. [thief.GetSheHe|U] wanted more than [thief.GetHeShe] had, and your treasury was within reach."
 ie_theft.0002.motive_2:0 "\n\n[thief.GetSheHe|U] pleads that [thief.GetHeShe] was desperate: a family member sick, a debt that could not be paid. The tears seem real."
 ie_theft.0002.motive_3:0 "\n\nThe coin was not for [thief.GetHerHim]. [thief.GetSheHe|U] was paid to take it by [harbor_vassal.GetShortUIName], one of your own vassals."
 ie_theft.0002.motive_4:0 "\n\nThe coin was not for [thief.GetHerHim]. [thief.GetSheHe|U] was paid to take it by [harbor_ruler.GetTitledFirstName], who wanted your treasury weakened."
 ie_theft.0002.ending:0 "\n\n[thief.GetShortUIName] kneels before you. The court waits to see what kind of ruler you are."
 ie_theft.0002.a:0 "Make an example of [thief.GetHerHim]: execute and seize the estate."
 ie_theft.0002.b:0 "Throw [thief.GetHerHim] in the dungeon."
 ie_theft.0002.c:0 "[thief.GetSheHe|U] will work off the debt in my service."
 ie_theft.0002.d:0 "Banish [thief.GetHerHim] from the realm."
 ie_theft.0002.e:0 "I forgive [thief.GetHerHim]. Once."
 ie_theft.0002.f:0 "Bury the matter. [thief.GetSheHe|U] is a friend."
 ie_theft.0002.g:0 "Prosecute under the law, and reform the treasury."
 ie_theft.0002.h:0 "Turn [thief.GetHerHim] into your informant."
 ie_theft.0002.i:0 "Order penance and a pilgrimage."
 ie_theft.0002.j:0 "Pay for the cure and forgive [thief.GetHerHim]."
 ie_theft.0002.k:0 "Make [thief.GetHerHim] name [thief.GetHerHis] patron."
 ie_theft.0002.l:0 "Hold [thief.GetHerHim] as proof and confront [harbor_ruler.GetTitledFirstName]."

 # ---------- 0003 A Convenient Culprit ----------
 ie_theft.0003.t:0 "A Convenient Culprit"
 ie_theft.0003.sum:0 "#bold The evidence points at [scapegoat.GetShortUIName], but it feels too neat.#!"
 ie_theft.0003.tortured:0 "\n\n[scapegoat.GetShortUIName] confessed in the cellars, but a confession given in pain proves little."
 ie_theft.0003.body:0 "\n\nThe trail has led to [scapegoat.GetShortUIName]. A key was found in the wrong place and a witness is a little too certain. It would be easy to close the case here with a guilty face.\n\nBut something feels off. The real thief may be laughing."
 ie_theft.0003.a:0 "Imprison [scapegoat.GetShortUIName]. The case is closed."
 ie_theft.0003.b:0 "Flog and banish [scapegoat.GetShortUIName] as a warning to the court."
 ie_theft.0003.c:0 "Fine [scapegoat.GetShortUIName] heavily and be done."
 ie_theft.0003.d:0 "I do not trust this. Keep digging."
 ie_theft.0003.e:0 "Speak to [scapegoat.GetShortUIName] in private."
 ie_theft.0003.f:0 "Trust your instincts. This was arranged."
 ie_theft.0003.g:0 "Ask for a second opinion."
 ie_theft.0003.h:0 "I cannot prove it. Write the loss off."

 # ---------- 0004 A Second Look ----------
 ie_theft.0004.t:0 "A Second Look"
 ie_theft.0004.desc:0 "#bold New evidence has surfaced, and the trail is cooling fast.#!\n\nA stranger was seen leaving the capital with a heavy load the night the gold vanished. If anything is to be done, it must be done soon."
 ie_theft.0004.a:0 "Dispatch riders after the trail."
 ie_theft.0004.b:0 "Set a trap with bait."
 ie_theft.0004.c:0 "Wait and watch."
 ie_theft.0004.d:0 "Call off the search."

 # ---------- 0005 The Truth Comes Out ----------
 ie_theft.0005.t:0 "The Truth Comes Out"
 ie_theft.0005.sum:0 "#bold [scapegoat.GetShortUIName] was innocent all along.#!"
 ie_theft.0005.blame:0 "\n\n[inv_char.GetShortUIName] gathered the evidence that condemned [scapegoat.GetHerHim], and the court is already whispering about it."
 ie_theft.0005.body:0 "\n\nA letter from a distant merchant proves [scapegoat.GetShortUIName] was elsewhere the night the treasury was robbed. You punished an innocent person while the real thief walked free.\n\nThe court has heard. [scapegoat.GetShortUIName]'s family has heard. Everyone is waiting to see what you will do."
 ie_theft.0005.a:0 "Free [scapegoat.GetShortUIName], compensate [scapegoat.GetHerHim], and admit the error publicly."
 ie_theft.0005.b:0 "Free [scapegoat.GetShortUIName] quietly and say nothing."
 ie_theft.0005.c:0 "Blame [inv_char.GetShortUIName] for the faulty evidence."
 ie_theft.0005.d:0 "I will not be made a fool. [scapegoat.GetShortUIName] stays where [scapegoat.GetSheHe] is."

 # ---------- 0006 The Thief Surfaces ----------
 ie_theft.0006.t:0 "The Thief Surfaces"
 ie_theft.0006.desc:0 "#bold [thief.GetShortUIName] has been found at the court of [harbor_ruler.GetTitledFirstName].#!\n\n[thief.GetSheHe|U] has been seen in new silks, spending freely. Your gold, by all accounts.\n\n[harbor_ruler.GetTitledFirstName] is under no obligation to give [thief.GetHerHim] up."
 ie_theft.0006.a:0 "Have [thief.GetHerHim] taken, or silenced."
 ie_theft.0006.b:0 "Hire an assassin."
 ie_theft.0006.c:0 "Negotiate with [harbor_ruler.GetShortUIName] for the thief."
 ie_theft.0006.d:0 "Make it clear that refusing would be unwise."
 ie_theft.0006.e:0 "Appeal to the Church."
 ie_theft.0006.f:0 "Formally demand extradition."
 ie_theft.0006.g:0 "Post a bounty on [thief.GetHerHis] head."
 ie_theft.0006.h:0 "Swear an oath of vengeance."
 ie_theft.0006.i:0 "Let [thief.GetHerHim] go. The gold is gone."

 # ---------- 0007 A Matter of Honor ----------
 ie_theft.0007.t:0 "A Matter of Honor"
 ie_theft.0007.desc.harbor:0 "#bold [harbor_ruler.GetTitledFirstName] has refused to hand over [thief.GetShortUIName].#!\n\n[harbor_ruler.GetSheHe|U] calls the matter a trifle and says the thief is now a guest under [harbor_ruler.GetHerHis] protection. Your envoy was laughed out of the hall.\n\nThe insult is public. Other rulers are watching to see whether you will answer it."
 ie_theft.0007.desc.sponsor:0 "#bold [harbor_ruler.GetTitledFirstName] denies paying for the theft.#!\n\nEven with [thief.GetShortUIName] chained in your dungeon and willing to talk, [harbor_ruler.GetSheHe] refuses to admit anything. Envoys on both sides trade bland words.\n\nBoth of you know the truth. The question is what you will do about it."
 ie_theft.0007.a:0 "This will be answered with steel."
 ie_theft.0007.b:0 "Call in your hold over [harbor_ruler.GetShortUIName]."
 ie_theft.0007.c:0 "Rally your allies to pressure [harbor_ruler.GetShortUIName]."
 ie_theft.0007.d:0 "Pay [harbor_ruler.GetShortUIName]'s price for the thief."
 ie_theft.0007.e:0 "Hire an assassin to settle it quietly."
 ie_theft.0007.f:0 "Spread the story to every court in the land."
 ie_theft.0007.g:0 "Swallow your pride."
 ie_theft.0007.h:0 "Demand reparations, using the thief's confession."
 ie_theft.0007.i:0 "Expose [harbor_ruler.GetShortUIName] to every court with the thief's confession."

 # ---------- 0030 The Protected Thief ----------
 ie_theft.0030.t:0 "The Protected Thief"
 ie_theft.0030.desc.shelter:0 "#bold [harbor_vassal.GetShortUIName] has taken [thief.GetShortUIName] into [harbor_vassal.GetHerHis] household.#!\n\n[harbor_vassal.GetSheHe|U] says the thief is under [harbor_vassal.GetHerHis] protection until proven guilty. Whether that is principle or something more is hard to say.\n\nA vassal who hides a thief is testing how far your authority really goes."
 ie_theft.0030.desc.patron:0 "#bold [thief.GetShortUIName] has named [harbor_vassal.GetShortUIName] as the patron who paid for the theft.#!\n\nYou hold the thief, but the one who paid is a vassal with land, knights, and a say in how your realm is run. Accusing [harbor_vassal.GetHerHim] openly could cost you."
 ie_theft.0030.a:0 "Demand [harbor_vassal.GetShortUIName] give the thief up."
 ie_theft.0030.b:0 "Call in your hold over [harbor_vassal.GetShortUIName]."
 ie_theft.0030.c:0 "Humiliate [harbor_vassal.GetShortUIName] before the court."
 ie_theft.0030.d:0 "Strike a bargain with [harbor_vassal.GetShortUIName]."
 ie_theft.0030.e:0 "Blackmail [harbor_vassal.GetShortUIName]."
 ie_theft.0030.f:0 "Imprison [harbor_vassal.GetShortUIName] for harbouring a thief."
 ie_theft.0030.g:0 "Let it lie. A quarrel with [harbor_vassal.GetShortUIName] is not worth it."

 # ---------- 0040 The Bandit Chief ----------
 ie_theft.0040.t:0 "The Bandit Chief"
 ie_theft.0040.desc:0 "#bold [thief.GetShortUIName] has surfaced as the leader of a band of brigands in [haven_county.GetName].#!\n\nStolen gold has bought swords. The roads are no longer safe, and the people of the county fear the brigands more than they fear you.\n\nA thief who turns outlaw is a problem that can be solved in many ways."
 ie_theft.0040.a:0 "Hunt [thief.GetHerHim] down."
 ie_theft.0040.b:0 "Send [marshal.GetShortUIName] and the knights."
 ie_theft.0040.c:0 "Offer a pardon and a post as warden of the marches."
 ie_theft.0040.d:0 "Send a knife in the night."
 ie_theft.0040.e:0 "Seize [thief.GetHerHis] family as leverage."
 ie_theft.0040.f:0 "Buy the gang off."
 ie_theft.0040.g:0 "Ignore them."

 # ---------- 0008 Justice Delivered ----------
 ie_theft.0008.t:0 "Justice Delivered"
 ie_theft.0008.sum:0 "#bold [thief.GetShortUIName] stands in chains before your throne.#!\n\nThe stolen gold has been returned to your treasury."
 ie_theft.0008.method_6:0 "\n\nYour spymaster's agents slipped across the border by night and returned with their prize and no questions answered."
 ie_theft.0008.method_7:0 "\n\nThe thief was handed over by those who sheltered [thief.GetHerHim], with a show of reluctance."
 ie_theft.0008.method_8:0 "\n\nYour armies won. The ruler who sheltered [thief.GetShortUIName] was forced to give [thief.GetHerHim] up and to pay for the insult."
 ie_theft.0008.method_9:0 "\n\nA bounty hunter dragged [thief.GetHerHim] home, to the delight of everyone who heard the story."
 ie_theft.0008.method_10:0 "\n\nYour hunt ran [thief.GetHerHim] down, and the brigands who followed [thief.GetHerHim] scattered."
 ie_theft.0008.method_11:0 "\n\nYears of patience and a long memory have paid off. [thief.GetShortUIName] thought the matter long forgotten."
 ie_theft.0008.method_12:0 "\n\nYour vassal gave the thief up, whether out of loyalty, fear, or a price."
 ie_theft.0008.method_13:0 "\n\nWith [thief.GetHerHis] family in your hands, [thief.GetShortUIName] had no choice but to surrender."
 ie_theft.0008.method_14:0 "\n\nThe message was clear enough, and [thief.GetShortUIName] was handed over without further argument."
 ie_theft.0008.ending:0 "\n\nThe court has gathered to watch. Your reputation will depend on what you do now."
 ie_theft.0008.a:0 "Execute [thief.GetHerHim] publicly."
 ie_theft.0008.b:0 "Imprison [thief.GetHerHim] for life."
 ie_theft.0008.c:0 "[thief.GetSheHe|U] will serve me to pay the debt."
 ie_theft.0008.d:0 "Banish [thief.GetHerHim]."
 ie_theft.0008.e:0 "Show mercy."

 # ---------- 0009 Stolen Gold, Spent Well ----------
 ie_theft.0009.t:0 "Stolen Gold, Spent Well"
 ie_theft.0009.desc:0 "#bold The gold taken from your treasury has turned up as brigands in [haven_county.GetName].#!\n\nThey are well armed and well fed, and the people there fear them more than they fear you.\n\nYou are paying the price of letting the thief go."
 ie_theft.0009.a:0 "Send in the soldiers at once."
 ie_theft.0009.d:0 "Lead the hunt yourself."
 ie_theft.0009.e:0 "Negotiate with their leader."
 ie_theft.0009.f:0 "Infiltrate the gang."
 ie_theft.0009.b:0 "Buy the brigands off."
 ie_theft.0009.c:0 "Ignore it. It will pass."

 # ---------- 0010 Old Habits ----------
 ie_theft.0010.t:0 "Old Habits"
 ie_theft.0010.desc:0 "#bold [thief.GetShortUIName], whom you spared, has stolen from you again.#!\n\nYour steward brings the news, and this time twice as much is gone. The court is watching to see whether you learn from this."
 ie_theft.0010.a:0 "Into the dungeon. For good."
 ie_theft.0010.b:0 "Execute [thief.GetHerHim]."
 ie_theft.0010.c:0 "Banish [thief.GetHerHim]."
 ie_theft.0010.d:0 "Forgive [thief.GetHerHim] again."

 # ---------- 0011 A Blood Debt ----------
 ie_theft.0011.t:0 "A Blood Debt"
 ie_theft.0011.desc:0 "#bold [avenger.GetShortUIName] has come to court, cold and calm, to speak of a reckoning.#!\n\n[avenger.GetSheHe|U] blames you for what happened to [avenger.GetHerHis] kin. The court goes quiet, and a hint of steel can be seen at the visitor's belt."
 ie_theft.0011.a:0 "Offer weregild to settle the debt."
 ie_theft.0011.b:0 "Offer [avenger.GetHerHim] a place at court."
 ie_theft.0011.d:0 "Speak to [avenger.GetHerHim] in private."
 ie_theft.0011.e:0 "Meet [avenger.GetHerHim] in a duel of honour."
 ie_theft.0011.c:0 "Throw [avenger.GetHerHim] out."

 # ---------- 0090 The Court Remembers ----------
 ie_theft.0090.t:0 "The Court Remembers"
 ie_theft.0090.fear:0 "#bold The court fears how you treated the thief.#!\n\nPeople speak of you in lowered voices. Nobody doubts your will, and nobody forgets it."
 ie_theft.0090.loyalty:0 "#bold The court respects how you handled the theft.#!\n\nYou showed that justice here has limits and a conscience. People trust that you will be fair."
 ie_theft.0090.both:0 "#bold The court both fears you and trusts you.#!\n\nYou showed you can be hard and fair in the same breath, and the court remembers both."
 ie_theft.0090.mockery:0 "#bold The court laughs at how you handled the theft.#!\n\nThe story is told with a smirk. A ruler who lets thieves walk free invites more of them."
 ie_theft.0090.neutral:0 "#bold The matter fades from memory.#!\n\nIt was a theft like any other, and nothing in how you handled it changed anyone's mind."
 ie_theft.0090.a:0 "So be it."
 # ---------- Added: court trial ----------
 ie_theft.0008.f:0 "Let your court sit in judgement."
 ie_theft.out.verdict_death:0 "The court condemns the thief to death."
 ie_theft.out.verdict_exile:0 "The court banishes the thief."
 ie_theft.out.verdict_acquitted:0 "The court acquits the thief, and the matter is laughed about."
