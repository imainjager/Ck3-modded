l_english:
 # ---------- modifiers ----------
 ie_vigilant_court_modifier:0 "Vigilant Court"
 ie_vigilant_court_modifier_desc:0 "After the theft, nothing happens at your court without someone noticing. Enemy schemes struggle, and your courtiers feel watched."
 ie_open_hand_modifier:0 "Open Hand"
 ie_open_hand_modifier_desc:0 "You are known for rewarding those who help you, and your court is fond of you for it. It costs a little."
 ie_harsh_hand_modifier:0 "Harsh Hand"
 ie_harsh_hand_modifier_desc:0 "You answered a theft with cruelty. Dread comes easier, and so do accusations of tyranny."
 ie_mans_word_modifier:0 "A Ruler's Word"
 ie_mans_word_modifier_desc:0 "You kept a promise even to a thief. People believe what you say."
 ie_oathbreaker_modifier:0 "Oathbreaker"
 ie_oathbreaker_modifier_desc:0 "You offered amnesty and then broke your word. Nobody will take your promises at face value again."
 ie_distrustful_court_modifier:0 "Distrustful Court"
 ie_distrustful_court_modifier_desc:0 "You locked your court down and searched every room. Plots are harder, and so are friendships."
 ie_spymasters_favour_modifier:0 "Spymaster's Favour"
 ie_spymasters_favour_modifier_desc:0 "Your spymaster's network proved its worth, and you now know how to use it better."
 ie_lenient_judge_modifier:0 "Lenient Judge"
 ie_lenient_judge_modifier_desc:0 "You prefer to forgive. People are fonder of you, and a little less afraid."
 ie_thief_takers_fame_modifier:0 "Thief-Taker's Fame"
 ie_thief_takers_fame_modifier_desc:0 "You rode down a thief yourself, and the songs are already spreading."
 ie_humbled_before_court_modifier:0 "Humbled Before the Court"
 ie_humbled_before_court_modifier_desc:0 "You admitted a wrong in public. It cost you pride and earned you trust."
 ie_stubborn_pride_modifier:0 "Stubborn Pride"
 ie_stubborn_pride_modifier_desc:0 "You refused to admit a mistake. Some admire the stubbornness, most resent it."
 ie_pious_patron_modifier:0 "Pious Patron"
 ie_pious_patron_modifier_desc:0 "You respected the Church's sanctuary, and the clergy remember it kindly."
 ie_sacrilege_modifier:0 "Sacrilege"
 ie_sacrilege_modifier_desc:0 "You dragged a man out of a holy house. The Church has not forgotten."
 ie_tyrant_of_the_marches_modifier:0 "Tyrant of the Marches"
 ie_tyrant_of_the_marches_modifier_desc:0 "You jailed a vassal for sheltering a thief. The other lords wonder who is next."
 ie_peoples_champion_modifier:0 "People's Champion"
 ie_peoples_champion_modifier_desc:0 "You dealt fairly with common outlaws, and the commons noticed."
 ie_court_of_law_modifier:0 "Court of Law"
 ie_court_of_law_modifier_desc:0 "Your court is known for hearing cases fairly and in public."
 ie_honest_ledgers_modifier:0 "Honest Ledgers"
 ie_honest_ledgers_modifier_desc:0 "Every coin in your treasury is accounted for, and your tax collectors know it."
 ie_foreign_reckoning_modifier:0 "Victor's Reputation"
 ie_foreign_reckoning_modifier_desc:0 "You made a foreign court pay for sheltering a thief. Other rulers respect you and watch you warily."
 ie_scar_on_realm_modifier:0 "Troubled Realm"
 ie_scar_on_realm_modifier_desc:0 "The affair left the countryside restless, and your vassals blame you for it."
 ie_innocent_blood_modifier:0 "Innocent Blood"
 ie_innocent_blood_modifier_desc:0 "You punished an innocent person and never set it right. Your court remembers."
 ie_reformed_court_modifier:0 "Reformed Court"
 ie_reformed_court_modifier_desc:0 "The theft led to reforms that your court now takes pride in."
 ie_legend_modifier:0 "Tale of the Thief"
 ie_legend_modifier_desc:0 "Bards tell the story of the thief and the ruler who dealt with him."
 ie_reformed_thief_modifier:0 "Reformed Thief at Court"
 ie_reformed_thief_modifier_desc:0 "A former thief now serves you, and his knowledge of the underworld is useful."
 ie_hanging_judge_modifier:0 "Hanging Judge"
 ie_hanging_judge_modifier_desc:0 "You made a public spectacle of justice, and the memory of it keeps the court in line."
 ie_generous_patron_modifier:0 "Generous Patron"
 ie_generous_patron_modifier_desc:0 "You paid for songs and feasts, and the court has not stopped praising you."
 ie_peasant_unrest_modifier:0 "Peasant Unrest"
 ie_peasant_unrest_modifier_desc:0 "The people here are angry and ready to rise. This will pass in time, or it will not."
 ie_county_watch_modifier:0 "The King's Watch"
 ie_county_watch_modifier_desc:0 "A standing watch keeps the roads and the market square quiet."
 ie_watchtowers_county_modifier:0 "Watchtowers"
 ie_watchtowers_county_modifier_desc:0 "New watchtowers line the roads. Raiders and brigands think twice."
 ie_reformed_county_modifier:0 "Reformed County"
 ie_reformed_county_modifier_desc:0 "Honest administration lets this county grow."
 ie_scarred_county_modifier:0 "Scarred County"
 ie_scarred_county_modifier_desc:0 "Violence and betrayal left their mark here, and the people have not forgotten."
 ie_loyal_county_modifier:0 "Loyal County"
 ie_loyal_county_modifier_desc:0 "The people here saw justice done and trust their lord."
 ie_thieves_market_modifier:0 "Thieves' Market"
 ie_thieves_market_modifier_desc:0 "A black market has grown up here. It brings coin, and trouble."
 ie_pilgrim_shrine_modifier:0 "Pilgrim Shrine"
 ie_pilgrim_shrine_modifier_desc:0 "The monastery that sheltered a thief is now a place of pilgrimage."
 ie_frontier_garrison_modifier:0 "Frontier Garrison"
 ie_frontier_garrison_modifier_desc:0 "A strong garrison guards the border here."
 ie_safe_roads_modifier:0 "Safe Roads"
 ie_safe_roads_modifier_desc:0 "Brigands have been driven out, and merchants are returning."
 ie_punitive_levy_modifier:0 "Punitive Levy"
 ie_punitive_levy_modifier_desc:0 "The county pays for the crimes done in it, and resents it."
 ie_amnesty_county_modifier:0 "Amnesty"
 ie_amnesty_county_modifier_desc:0 "A general pardon was proclaimed here, and the people are grateful."
 ie_rebuilt_marches_modifier:0 "Rebuilt Marches"
 ie_rebuilt_marches_modifier_desc:0 "The countryside is being repaired and resettled."
 ie_counts_gratitude_modifier:0 "A Popular Count"
 ie_counts_gratitude_modifier_desc:0 "The county's new lord rose from among them, and they back him."
 ie_famous_trial_modifier:0 "Famous Trial"
 ie_famous_trial_modifier_desc:0 "The trial held here is still talked about, and it draws visitors."
 ie_watchtower_province_modifier:0 "Watchtower"
 ie_watchtower_province_modifier_desc:0 "A tower overlooks the road."
 ie_bandit_camp_province_modifier:0 "Bandit Camp"
 ie_bandit_camp_province_modifier_desc:0 "Brigands have made a camp in the hills."
 ie_toll_house_province_modifier:0 "Toll House"
 ie_toll_house_province_modifier_desc:0 "An honest toll house collects the fees thieves used to steal."
 ie_hanging_tree_province_modifier:0 "The Hanging Tree"
 ie_hanging_tree_province_modifier_desc:0 "A warning to travellers and thieves alike."
 ie_house_disgraced_modifier:0 "Disgraced House"
 ie_house_disgraced_modifier_desc:0 "One of their own was caught stealing from a ruler's treasury."
 ie_house_avenging_modifier:0 "House Seeking Justice"
 ie_house_avenging_modifier_desc:0 "A member of the house was wrongly punished, and the house means to be heard."
 ie_dynasty_lawgivers_modifier:0 "Lawgivers"
 ie_dynasty_lawgivers_modifier_desc:0 "Your dynasty is known for justice."
 ie_dynasty_laughed_modifier:0 "Laughed At"
 ie_dynasty_laughed_modifier_desc:0 "Your dynasty is the butt of an old joke about a stolen treasury."

 # ---------- traits ----------
 trait_ie_lawgiver:0 "Lawgiver"
 trait_ie_lawgiver_desc:0 "Known across the realm for fair and public justice."
 trait_ie_lawgiver_character_desc:0 "Known across the realm for fair and public justice."
 trait_ie_notorious_thief:0 "Notorious Thief"
 trait_ie_notorious_thief_desc:0 "Everyone knows what this person did, and nobody has forgotten."
 trait_ie_notorious_thief_character_desc:0 "Everyone knows what this person did, and nobody has forgotten."
 trait_ie_wrongly_accused:0 "Wrongly Accused"
 trait_ie_wrongly_accused_desc:0 "Once punished for a crime this person did not commit."
 trait_ie_wrongly_accused_character_desc:0 "Once punished for a crime this person did not commit."
 trait_ie_thief_taker:0 "Thief-Taker"
 trait_ie_thief_taker_desc:0 "Knows how criminals think, and how to catch them."
 trait_ie_thief_taker_character_desc:0 "Knows how criminals think, and how to catch them."

 # ---------- opinion modifiers ----------
 ie_fears_justice_opinion:0 "Fears your justice"
 ie_trusts_justice_opinion:0 "Trusts your justice"
 ie_mocks_ruler_opinion:0 "Laughs at your handling of the theft"
 ie_wronged_opinion:0 "Punished for a theft they did not commit"
 ie_saved_by_ruler_opinion:0 "You showed them mercy"
 ie_betrayed_promise_opinion:0 "You broke your promise of amnesty"
 ie_sheltered_thief_opinion:0 "Quarrelled over the thief"
 ie_kin_executed_opinion:0 "You executed their kin for theft"
 ie_hunted_opinion:0 "You hunted them across the land"

 # ---------- decisions ----------
 ie_watch_decision:0 "Establish the King's Watch"
 ie_watch_decision_desc:0 "Raise a permanent watch to keep the roads and markets of your realm quiet."
 ie_watch_decision_tooltip:0 "Your counties gain a standing watch, and your court grows watchful."
 ie_watch_decision_confirm:0 "Establish the Watch"
 ie_amnesty_decision:0 "Proclaim a General Amnesty"
 ie_amnesty_decision_desc:0 "Pardon petty crimes across your realm and be remembered as a ruler of mercy."
 ie_amnesty_decision_tooltip:0 "Your courtiers and vassals think more kindly of you, and your counties gain a calm that lasts a few years."
 ie_amnesty_decision_confirm:0 "Proclaim the Amnesty"
 ie_restore_name_decision:0 "Restore Your Good Name"
 ie_restore_name_decision_desc:0 "Spend lavishly on feasts and gifts until the court stops laughing."
 ie_restore_name_decision_tooltip:0 "Remove the stigma of the theft, and win some respect back."
 ie_restore_name_decision_confirm:0 "Restore your name"
 ie_assizes_decision:0 "Found a Court of Assizes"
 ie_assizes_decision_desc:0 "Create a standing court where cases are heard fairly and in public."
 ie_assizes_decision_tooltip:0 "Your realm gains a reputation for justice, and you earn the Lawgiver trait."
 ie_assizes_decision_confirm:0 "Found the Court"
 ie_claim_decision:0 "Press the Old Claim"
 ie_claim_decision_desc:0 "Press the claim your scholars unearthed against the ruler who wronged you."
 ie_claim_decision_tooltip:0 "You gain a pressed claim on a title held by the ruler who sheltered the thief."
 ie_claim_decision_confirm:0 "Press the claim"
 ie_marches_decision:0 "Rebuild the Marches"
 ie_marches_decision_desc:0 "Repair and resettle the counties scarred by brigands and rebellion."
 ie_marches_decision_tooltip:0 "Scarred and bandit-ridden counties of yours recover and prosper."
 ie_marches_decision_confirm:0 "Rebuild"
 ie_abbey_decision:0 "Endow the Abbey"
 ie_abbey_decision_desc:0 "Make a generous gift to the abbey that sheltered a thief and was fair about it."
 ie_abbey_decision_tooltip:0 "Gain piety, clergy goodwill, and a new pilgrim shrine in one of your counties."
 ie_abbey_decision_confirm:0 "Endow the Abbey"
 ie_ballad_decision:0 "Commission a Ballad"
 ie_ballad_decision_desc:0 "Pay a bard to set the whole affair to music, as you would like it remembered."
 ie_ballad_decision_tooltip:0 "Gain prestige and a lasting reputation as the ruler in the ballad."
 ie_ballad_decision_confirm:0 "Commission it"
 ie_pardon_house_decision:0 "Reconcile with the Wronged House"
 ie_pardon_house_decision_desc:0 "Admit the wrong done to an innocent courtier and make amends."
 ie_pardon_house_decision_tooltip:0 "Wipe away the stain of the innocent blood, and win back those you wronged."
 ie_pardon_house_decision_confirm:0 "Make amends"
 ie_claim_decision_missing_target:0 "You have no unearthed claim to press."
